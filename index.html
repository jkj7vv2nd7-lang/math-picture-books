ト・フェルディナント・メビウスが、この不思議な帯について発表しました。メビウスは天文台で星を観測する天文学者でもありました。", "同じ1858年には、もう一人の数学者ヨハン・ベネディクト・リスティングも、独立に同じ帯を発見していたことが知られています。偉大な発見は、同時期に複数の人から生まれることがあるのです。", "メビウスの帯は、「位相幾何学（トポロジー）」という数学の入り口として有名です。トポロジーは、図形を伸ばしたり曲げたりしても変わらない性質――つながり方や、面と縁の数など――を調べる分野です。", "画家のエッシャーは版画『メビウスの輪』で、帯の上をアリが延々と歩き続ける姿を描きました。歩いても歩いても裏側へ出られない不思議さが、芸術家の心もつかんだのです。", "工場のベルトコンベヤーでは、帯全体が均等にすり減るように、わざと半回転ひねって（メビウスの帯のように）つなぐ工夫がされることもあります。小さなひねりが、数学と暮らしの両方を変えてきました。"], "en": ["In 1858, the German mathematician August Ferdinand Möbius published this curious strip. Möbius was also an astronomer who observed the stars at an observatory.", "In that same year, 1858, another mathematician, Johann Benedict Listing, is known to have discovered the same strip independently. Great discoveries are sometimes born from several people at the same time.", "The Möbius strip is famous as a doorway into the mathematics called topology. Topology studies the properties that do not change when a shape is stretched or bent — how things are connected, and how many sides and edges they have.", "The artist Escher, in his woodcut \"Möbius Strip,\" drew ants walking on the strip forever. The wonder of walking and walking without ever reaching a back side captured the hearts of artists, too.", "On factory conveyor belts, engineers sometimes join the belt with a half twist — like a Möbius strip — so that the whole surface wears down evenly. One small twist has changed both mathematics and daily life."]}, "quiz": {"ja": ["Q1. メビウスの帯の面はいくつ、ふち（縁）はいくつありますか。　答え：面は1つ、ふちは1本だけです", "Q2. メビウスの帯を真ん中の線で切ると、どうなりますか。　答え：2本に分かれず、長さ2倍の1本の大きな輪になります", "Q3. メビウスの帯を作るとき、端同士を貼る前に何をしますか。　答え：片方の端を半回転（180°）ひねります"], "en": ["Q1. How many sides does a Möbius strip have, and how many edges?　答え：One side, and only one edge", "Q2. What happens when you cut a Möbius strip along its middle line?　答え：It does not split in two — it becomes one big ring, twice as long", "Q3. When making a Möbius strip, what do you do before joining the ends?　答え：Give one end a half turn (180°)"]}, "corner": {"ja": ["用意するもの：細長い紙（新聞紙や包装紙を長さ1m・幅5cmくらいに切ったもの。短い紙を3枚つないでもよい）、のりかテープ、クレヨン、はさみ。", "1．まず、ひねらない「ふつうの輪」を作ります。面の数（表と裏で2つ）と、ふちの数（2本）を指でたどって確かめましょう。", "2．新しい帯は、貼る前に片方の端を半回転（180°）ひねってから、端同士を貼ります。", "3．帯の真ん中にクレヨンで線を引いていきます。手を離さずに、出発点に帰ってくるまで引き続けましょう。面はいくつありましたか。", "4．ふちを指でたどってみましょう。何周で元の場所に帰ってきましたか。", "5．どうなるか予想を言ってから、真ん中の線に沿ってはさみで切っていきます。はさみが1周しても終わらないときは、そのまま切り続けてください。結果は予想どおりでしたか。", "6．できた大きな輪も、真ん中を切ってみましょう。今度はどうなりましたか。", "もっと変わった帯（540°ひねりや、2枚重ねの帯）を試したい人は、アプリ「メビウスの帯 工作キット」に型紙と実験が用意してあります。"], "en": ["You will need: a long strip of paper (cut newspaper or wrapping paper to about 1 m long and 5 cm wide — or join three short strips), glue or tape, a crayon, and scissors.", "1. First, make an ordinary ring with no twist. Trace with your finger to check: how many sides (front and back make two), and how many edges (two)?", "2. For the new strip, give one end a half turn (180°) before you join the ends with glue.", "3. Draw a line along the middle with your crayon. Do not lift your hand until you return to the start. How many sides did the strip have?", "4. Trace the edge with your finger. How many trips around did it take to come back to the start?", "5. Say your prediction out loud, then cut along the middle line with scissors. If one trip around does not finish it, just keep cutting. Was the result what you predicted?", "6. Now cut the big new ring along its middle, too. What happened this time?", "If you want to try stranger strips (a 540° twist, or two strips twisted together), the app \"Möbius Strip Craft Kit\" has templates and experiments ready for you."]}}, {"id": "pythagoras", "title": {"ja": "弦の長さがつくる音階 ― ピタゴラスと分数のおはなし", "en": "Scales Built from String Lengths — Pythagoras and the Music of Fractions"}, "sub": {"ja": "小学校高学年〜中学生向け・音の高さと分数のふしぎ", "en": "For upper elementary to middle school — the wonder of pitch and fractions"}, "cover": "pyt1.jpg", "images": ["pyt1.jpg", "pyt2.jpg", "pyt3.jpg", "pyt4.jpg", "pyt5.jpg", "pyt5.jpg"], "pages": [{"ja": ["今から2500年ほど前、ギリシャの町に、ピタゴラスという先生がいました。「世界は、数でできている」。そう信じて、数と図形の不思議を仲間たちと研究した人です。", "弟子の少年テオは、先生のそばで学ぶのが大好きでした。先生は星の動きにも、図形にも、数の決まりが隠れていると教えてくれたからです。", "ピタゴラスには、こんな言い伝えがあります。ある日、鍛冶屋の前を通りかかると、大きさの違うハンマーが、美しく響き合う音を立てていた、というのです。", "「音の美しさにも、数の決まりがあるのではないか。」そう考えたピタゴラスは、弦を使った実験を始めたと言い伝えられています。"], "en": ["About 2,500 years ago, in a Greek town, there lived a teacher named Pythagoras. \"The world is made of numbers\" — so he believed, studying the wonders of numbers and shapes with his companions.", "A boy named Theo, his student, loved learning at his master's side, for Pythagoras taught that hidden rules of number lay within the motions of the stars and within shapes as well.", "There is a story told about Pythagoras. One day, passing a blacksmith's forge, he heard hammers of different sizes ringing together in beautiful harmony — so the tale goes.", "\"If beauty in sound also follows rules of number…\" Thinking this, Pythagoras is said to have begun experiments with strings."]}, {"ja": ["ピタゴラスが用意したのは、木の箱に1本の弦を張った楽器です（一弦琴（モノコード）と呼ばれます）。弦をはじくと、「ボーン」と低い音が鳴りました。", "「テオ、弦のちょうど真ん中を押さえて、半分の長さだけを鳴らしてごらん。」", "テオが半分の弦をはじくと、元の音より高い音が出ました。しかも、その音は元の音とぴったり重なって、気持ちよく響き合うのです。", "「長さが半分になると、音はちょうど1オクターブ上がる。弦の長さの比は2対1だ。」ピタゴラスの目が輝きました。"], "en": ["Pythagoras prepared an instrument with a single string stretched over a wooden box (it is called a monochord). When he plucked the string, it sounded a low \"boon.\"", "\"Theo, press the string at exactly its middle, and sound only half of its length.\"", "When Theo plucked the half string, out came a higher note — and it fitted the first note perfectly, ringing together with it in the most pleasing way.", "\"When the length is halved, the pitch rises by exactly one octave. The ratio of the lengths is 2 to 1.\" Pythagoras's eyes shone."]}, {"ja": ["今度は、弦の長さの3分の2だけを鳴らしてみました。すると、オクターブとは違う、力強く美しい響きが生まれました（この響きは、のちに「完全五度」と呼ばれます。長さの比は3対2です）。", "長さの4分の3では、また違う穏やかな響きになりました（「完全四度」。長さの比は4対3です）。", "ところが、半端な長さで鳴らすと、音同士がぶつかり合って、美しく響きません。", "「単純な整数の比のときだけ、音は調和する。分数の美しさが、耳に聞こえるんだ！」テオは思わず声を上げました。"], "en": ["Next, they sounded only two-thirds of the string's length. A new harmony was born — strong and beautiful, different from the octave (later, this interval came to be called the \"perfect fifth.\" The ratio of lengths is 3 to 2).", "At three-quarters of the length came yet another, gentler harmony (the \"perfect fourth.\" The ratio is 4 to 3).", "But sound the string at an in-between length, and the notes clash against each other and do not ring beautifully at all.", "\"Only with simple whole-number ratios do the sounds harmonize. You can hear the beauty of fractions!\" Theo cried out without thinking."]}, {"ja": ["ピタゴラスと弟子たちは、この発見から「音階」作りに挑戦しました。美しく響く比を組み合わせて、音の高さを順番に並べていったのです。", "弦の長さを分数で決めると、ド・レ・ミの並びが少しずつ姿を現しました。楽器の音の並びが、紙の上の計算で作れるのです。", "弟子たちがそれぞれ弦をはじくと、小さな合奏が生まれました。音と音が、まるで約束したように響き合います。", "「音楽は、分数でできていたんだね、先生！」テオの言葉に、ピタゴラスはうれしそうにうなずきました。"], "en": ["From this discovery, Pythagoras and his students took up the challenge of building a \"scale.\" They combined the ratios that rang beautifully, and lined up the pitches in order.", "Deciding string lengths by fractions, the pattern do-re-mi slowly took shape. The notes of an instrument could be built by calculation on paper.", "When each student plucked a string, a tiny concert was born. Note after note rang together, as if they had all promised to agree.", "\"Music was made of fractions, Master!\" At Theo's words, Pythagoras nodded with delight."]}, {"ja": ["ピタゴラスと仲間たち（ピタゴラス学派）は、この発見をとても大切にしました。「万物は、整数とその比（分数）で表すことができる」。それが学派の信念の中心になったのです。", "星の運行にも、きっと数の調和があるはずだ。仲間たちは、遠く離れた星々が奏でる音楽まで想像しました。", "音の実験は、ただの遊びではありませんでした。世界の仕組みを数で読み解くための、大事な手がかりだったのです。", "けれども、その信念を揺るがす大事件が、のちに学派を襲うことになります（くわしくはコラムで）。"], "en": ["Pythagoras and his companions (the Pythagorean school) treasured this discovery. \"Everything can be expressed by whole numbers and their ratios (fractions).\" This became the heart of the school's belief.", "Then the motions of the stars must have a harmony of number, too. The companions even imagined music played by the far-off stars.", "The sound experiments were not mere play. They were an important clue for reading the workings of the world through numbers.", "But in time, a great shock would strike that belief of the school (see the column for more)."]}, {"ja": ["2500年たった今も、弦の仕組みは変わっていません。ギターやバイオリンの弦は、押さえる場所で長さを変えて、音の高さを決めているのです。", "弦の半分の場所を押さえれば、1オクターブ高い音。ピタゴラスたちが耳で見つけた決まりは、今日の音楽の中に生き続けています。", "そして、音階の土台になったのは、2対1、3対2、4対3という、シンプルな分数の比でした。", "次は、あなたの番です。「やってみよう」で、輪ゴムの弦の音を聴き比べてみてください。"], "en": ["Even now, 2,500 years later, the way strings work has not changed. On guitars and violins, the place you press the string changes its length, and that decides the pitch.", "Press at exactly half the string, and you get a note one octave higher. The rule Pythagoras and his students found by ear lives on in today's music.", "And the foundation of the scale was a set of simple fractional ratios: 2 to 1, 3 to 2, and 4 to 3.", "Now it is your turn. In the activity below, compare the sounds of a rubber-band string."]}], "column": {"ja": ["ピタゴラス（紀元前570年ごろ〜紀元前495年ごろ）と、その仲間たち「ピタゴラス学派」は、「万物は整数とその比（分数）で表せる」と信じていました。音の比の発見は、その信念を支える自慢の成果でした。", "ところが、学派の弟子ヒッパソスが、分数では表せない数（正方形の対角線の長さ√2のような「無理数」）を見つけ、秘密を外に漏らしたため、海で溺れ死んだ――そんな言い伝えが残っています。", "ただし、この話の出典は、イアンブリコス（3世紀）やパッポス（4世紀）という、事件の時代から約800年も後の人たちの書物です。しかも版によって「漏らしたのは正十二面体の作り方だった」「溺死ではなく追放だった」と、内容が食い違っています。", "無理数の発見をヒッパソス本人の業績だと明記した古代の著述家は、いません。ピタゴラス本人が殺したという話にいたっては、二人の時代が重ならず、不可能に近いと考えられています。ですから、この話は「伝説」として楽しむのが正しい扱いです。", "ヒッパソスには、青銅の円盤を鳴らして音の比を調べた、という音楽実験の伝承もあります（プラトンの『パイドン』への古い注釈に残る話）。今回の音階のお話と響き合う伝承です。なお、鍛冶屋のハンマーの逸話も言い伝えで、実際にはハンマーの音の高さは重さの比だけでは決まらないことが分かっています。比が正確に成り立つのは、弦の実験のほうなのです。"], "en": ["Pythagoras (c. 570 – c. 495 BC) and his companions, the Pythagorean school, believed that \"everything can be expressed by whole numbers and their ratios (fractions).\" The discovery of the ratios in sound was a treasured proof of that belief.", "Yet a tale remains: a student of the school, Hippasus, found a number that no fraction can express (an \"irrational number,\" like √2, the diagonal of a square), leaked the secret outside, and drowned at sea for it.", "However, the sources of this story are the writings of Iamblichus (3rd century) and Pappus (4th century) — men who lived some 800 years after the supposed events. And the versions disagree: in some, what he leaked was how to construct a regular dodecahedron; in others, he was exiled, not drowned.", "No ancient writer clearly states that Hippasus himself discovered the irrational numbers. As for the story that Pythagoras personally had him killed, the two men's lifetimes do not even overlap, so it is considered all but impossible. The right way to treat this tale is to enjoy it as a legend.", "Hippasus also has a tradition of musical experiments, testing ratios of sound with bronze disks (a story kept in an ancient commentary on Plato's \"Phaedo\"). It resonates with this episode's story of scales. The blacksmith's-hammer tale is likewise a legend: in reality, a hammer's pitch is not decided by the ratio of weights alone. It is in the string experiments that the ratios hold exactly."]}, "quiz": {"ja": ["Q1. 弦の長さをちょうど半分にすると、音はどうなりますか。　答え：1オクターブ高い音になります（弦の長さの比は2：1）", "Q2. 完全五度を作る、弦の長さの比はいくつですか。　答え：3：2です", "Q3. ヒッパソスが海で溺れ死んだという話は、確かな事実ですか。　答え：いいえ。約800年後の書物に残る言い伝えで、内容も版によって食い違います"], "en": ["Q1. What happens to the sound when a string's length is made exactly half?　答え：It becomes a note one octave higher (the ratio of string lengths is 2:1)", "Q2. What ratio of string lengths makes a perfect fifth?　答え：3:2", "Q3. Is the story that Hippasus drowned at sea a certain fact?　答え：No. It is a tale kept in books written about 800 years later, and the versions disagree with each other"]}, "corner": {"ja": ["用意するもの：空のティッシュ箱（またはプラスチックの容器）、輪ゴム数本、定規、割り箸か鉛筆。", "1．輪ゴムを箱の口に渡して指ではじき、音を聞いてみましょう（輪ゴムを顔のほうに向けないこと）。", "2．鳴っている部分の長さを定規で測り、ちょうど半分の場所を指で押さえてはじいてみましょう。約1オクターブ高い音が聞こえます。", "3．長さの3分の2の場所を押さえてはじくと五度っぽい音、4分の3の場所では四度っぽい音になります。元の音と重ねて、響きを比べてみましょう。", "4．押さえる場所を少しずつずらしながらはじくと、音の高さがどう変わるか観察しましょう。短くなるほど、音は高くなります。", "5．きれいに響き合う場所が見つかったら、その長さの比を分数で書いてみましょう。ピタゴラスと同じ発見ができたかもしれません。"], "en": ["You will need: an empty tissue box (or a plastic container), several rubber bands, a ruler, and a pair of chopsticks or a pencil.", "1. Stretch a rubber band across the opening of the box and pluck it with your finger to hear its sound (never point a rubber band toward your face).", "2. Measure the length of the sounding part with the ruler, press at exactly the halfway point with a finger, and pluck. You will hear a note about one octave higher.", "3. Press at two-thirds of the length for a fifth-like sound, and at three-quarters for a fourth-like sound. Play them together with the original note and compare how they ring.", "4. Move the pressing point little by little and pluck each time. Watch how the pitch changes: the shorter the string, the higher the sound.", "5. When you find a spot that rings beautifully, write its length ratio as a fraction. You may have made the very same discovery as Pythagoras."]}}, {"id": "river", "title": {"ja": "川をわたるには ― 川渡り問題のおはなし", "en": "How to Cross the River — A River-Crossing Puzzle Story"}, "sub": {"ja": "小学校高学年〜中学生向け・もどる勇気と、数えて考える力", "en": "For upper elementary to middle school — the courage to go back, and the power of counting"}, "cover": "kawa1.jpg", "images": ["kawa1.jpg", "kawa2.jpg", "kawa3.jpg", "kawa4.jpg", "kawa5.jpg", "kawa5.jpg"], "pages": [{"ja": ["川のほとりの渡し場に、渡し守の見習いの少年、ソラが住んでいました。相棒は、首に赤い鈴をつけた、茶トラの猫トラです。", "ソラの小舟は小さくて、漕ぐ人のほかに乗せられるのは、1人（ひとつ）だけ。朝の光の中、今日もソラは櫂を手に、お客さんを待っていました。", "そこへ、農夫のおじさんがやって来ました。連れているのは、オオカミとヤギ、そして大きな大きなキャベツです。「みんなを、向こう岸へ渡してほしいんだ。」", "ところが、この渡しには困った約束がありました。ソラがいない岸でオオカミとヤギが残ると、ヤギが危ない目にあいます。ヤギとキャベツが残ると、キャベツが食べられてしまいます。1つずつしか運べないのに、どうすればよいのでしょう。"], "en": ["At a ferry landing by a river lived a boy named Sora, an apprentice ferryman. His partner was Tora, an orange tabby cat with a little red bell on his collar.", "Sora's boat was small: besides the one who rowed, it could carry only one more person (or one thing). In the morning light, Sora took up his oar and waited for the day's guests.", "Along came a farmer. With him were a wolf, a goat, and one enormous cabbage. \"Please take us all across to the far bank.\"", "But this crossing had a troublesome rule. If the wolf and the goat were left on a bank without Sora, the goat would be in danger. If the goat and the cabbage were left, the cabbage would be eaten. He could carry only one at a time — so what could he do?"]}, {"ja": ["ソラは腕を組みました。「まずオオカミを運ぼう……いや、だめだ。残ったヤギとキャベツが危ない。」", "「じゃあキャベツが先？ それもだめだ。オオカミとヤギが残ってしまう。」トラが、にゃあ、と鳴きました。", "「そうか。オオカミとキャベツなら、一緒に残っても大丈夫だ。最初はヤギだ！」ソラはヤギを船に乗せ、静かに川を渡りました。", "向こう岸にヤギを置き、ソラは一人で戻ります。つぎはオオカミを運びました。でも、舟が向こう岸に着いたとき、ソラは困ってしまいました。「このままキャベツを取りに戻ると、オオカミとヤギが二人きりになってしまう……。」"], "en": ["Sora folded his arms. \"First, the wolf… no, wait. That leaves the goat and the cabbage behind, and they are not safe together.\"", "\"Then the cabbage first? No good either. That leaves the wolf and the goat.\" Tora meowed, as if to say, think again.", "\"I see it now. The wolf and the cabbage can stay together safely. So the goat goes first!\" Sora put the goat in the boat and quietly rowed across.", "He left the goat on the far bank and rowed back alone. Next he carried the wolf. But when the boat reached the far bank, Sora was stuck again. \"If I go back for the cabbage now, the wolf and the goat will be left alone together…\""]}, {"ja": ["そのとき、トラが小舟のへりにちょこんと座って、こちらをじっと見ていました。行きも帰りも、トラはいつでもソラと一緒です。「……そうか、連れ戻せばいいんだ！」", "ソラは、向こう岸のヤギをもう一度船に乗せ、こちら岸へ連れ戻しました。一見、後もどりです。でも、これでどちらの岸も安全なまま、キャベツを取りに行けます。", "キャベツを向こう岸へ運び、ソラは一人で戻って、最後にヤギを乗せました。オオカミ、キャベツ、ヤギ、全員が無事に向こう岸へ渡れたのです。船は7回、川を行き来しました。", "「進むだけが答えじゃないんだね。戻る勇気が、答えへの近道になることもある。」農夫のおじさんは、大きくうなずいて手を振りました。"], "en": ["Just then, Tora sat on the edge of the boat and stared at him. Going and returning, Tora was always with Sora. \"…That's it. I can bring something back!\"", "Sora put the goat from the far bank back into the boat, and carried it back to the first bank. It looked like going backwards. But now, with both banks safe, he could go and fetch the cabbage.", "He carried the cabbage across, rowed back alone, and took the goat aboard one last time. The wolf, the cabbage, and the goat — everyone had crossed safely. The boat went back and forth seven times in all.", "\"Moving forward isn't the only answer. Sometimes the courage to go back is the shortcut to the solution.\" The farmer nodded deeply and waved goodbye."]}, {"ja": ["お昼を過ぎたころ、新しいお客さんが来ました。旅の人たち3人と、サルたちです。大きいサルが1匹と、小さいサルが2匹。サルたちは、着岸すると船からぴょんと飛び降ります。", "船は2人（2匹）まで。船を漕げるのは、人の3人と大きいサルだけです。そして大事な約束は、どちらの岸でも、人がいる岸では「人の数が、サルの数以上」でなければならないことでした。", "「今度は、組み合わせだけじゃなくて、両岸の数を数えるんだ。」ソラは地面に枝で絵を描き、両岸の様子を書き出して考えました。", "まず、先にサルたちを渡し始めることにしました。人が小さいサルを1匹連れて渡り、人は一人で戻ります。つぎに大きいサルが小さいサルを連れて渡り、大きいサルが戻ってきました。"], "en": ["In the afternoon, new guests arrived: three travelers, and some monkeys — one big monkey and two small ones. When the boat reached a bank, the monkeys would hop right out of it.", "The boat could hold two (people or monkeys). Only the three people and the big monkey could row. And the important rule was this: on either bank, wherever there were people, the number of people had to be at least the number of monkeys.", "\"This time it isn't just about combinations — I have to count both banks.\" Sora drew pictures in the dirt with a stick, writing down the state of each bank as he thought.", "First, he would start by sending the monkeys across. A person took one small monkey over and came back alone. Then the big monkey took the other small monkey over, and the big monkey came back."]}, {"ja": ["つぎに、人が2人で渡りました。ここで大事なのは、船を戻すときです。人が一人で戻ってしまうと、向こう岸に残るのは人1人とサル2匹。これでは約束が守れません。そこで、戻る人は小さいサルを1匹、船に乗せて連れ戻しました。", "「また“連れ戻す”だ！」古典編のひらめきが、ここでも役に立ちました。同じ理由で、もう1匹の小さいサルも、一度こちら岸へ連れ戻す場面がありました。", "そのあいだも、ソラは両岸の数を数え続けました。「こちらは人2・サル2。むこうは人3・サル1。大丈夫。」大きいサルは船を行ったり来たりさせて、みんなをつないでくれました。", "最後の船に、残りの小さいサルがぴょんと飛び乗りました。船は合わせて13回川を行き来して、3人と3匹、全員が向こう岸へ渡ることができました。サルたちは木の上で、うれしそうに手を振っていました。"], "en": ["Next, two people crossed together. The important part was the return trip: if a person rowed back alone, the far bank would be left with one person and two monkeys — the rule would break. So the returning person brought one small monkey back in the boat.", "\"The bring-back trick again!\" The flash of insight from the wolf-and-goat puzzle helped here too. For the same reason, there came a moment when the other small monkey also had to be brought back once.", "All the while, Sora kept counting both banks. \"This side: two people, two monkeys. Far side: three people, one monkey. All safe.\" The big monkey rowed the boat back and forth, connecting everyone.", "On the last crossing, the remaining small monkey hopped aboard with a bounce. The boat had crossed thirteen times in all, and all three people and all three monkeys were safely on the far bank. The monkeys waved happily from the trees."]}, {"ja": ["夕方、渡し場に静かな時間が戻ってきました。トラは小舟の中で丸くなって、もう眠そうです。", "ソラは今日のことをノートに書きました。「あわてて進むだけでは解けない問題がある。一度戻ること、そして両岸の状態を書き出して、数えて考えることが、答えを見つける力になる。」", "川渡りの問題は、実は約1200年も前から人々を楽しませてきた、とても古いパズルです（くわしくはコラムへ）。ソラが出会ったのは、その長い歴史の入り口でした。", "次は、あなたの番です。「やってみよう」で、アプリや紙の駒を使って、自分の手で渡してみてください。あなたなら、何回で渡れますか。"], "en": ["In the evening, quiet returned to the ferry landing. Tora curled up in the boat, already sleepy.", "Sora wrote about the day in his notebook. \"Some problems cannot be solved by rushing forward. Going back once, and writing down the state of both banks to count and think — that is the power that finds answers.\"", "The river-crossing puzzle is, in fact, a very old puzzle that has delighted people for about 1,200 years (see the column for more). What Sora met today was the doorway into that long history.", "Now it is your turn. In \"Try It Yourself,\" use the app or paper pieces and try crossing with your own hands. How many crossings will it take you?"]}], "column": {"ja": ["オオカミとヤギとキャベツの問題は、今から約1200年前、ヨーロッパの学者アルクィン（735年ごろ〜804年）が作った問題集『青年を鋭敏にするための問題集』に収められた問題のひとつです。知られている中では、最も古い世代の娯楽数学の問題集と言われています。", "アルクィンは、フランク王国の王様カール大帝に招かれて、宮廷で教えた先生でした。若い人たちの頭を鋭くするために、楽しみながら考えられる問題をたくさん集めたのです。オオカミとヤギの問題は、その中の第18問です。", "サル編のような「両岸の人数を比べる」タイプも、宣教師と人食いの問題をはじめ、世界中でいろいろな形に姿を変えて親しまれてきました。登場人物は変わっても、「危ない組み合わせを作らない」「両岸の状態を整理する」という考える筋道は同じです。", "両岸の状態をすべて書き出して、たどれる道を探す方法は、現代のコンピューターの基本的な考え方にもつながっています。この絵本とペアのアプリ『川渡りパズル』のヒント機能も、実はすべての状態をコンピューターに調べさせて、最短の渡り方を探しています。", "この絵本を作った清水正典先生は、昔、選択教科の数学の授業でこの問題を出しました。生徒たちはワークシートに考えを書き、黒板の前で自分の解き方を説明したそうです。「ヤギを連れ戻す」という大胆な一手が発表されたとき、教室がどっと沸いた、という思い出が残っています。"], "en": ["The problem of the wolf, the goat, and the cabbage is one of the problems in a collection made about 1,200 years ago by the European scholar Alcuin (c. 735–804), called \"Problems to Sharpen the Young.\" It is said to be among the oldest known collections of recreational mathematics.", "Alcuin was a teacher invited to the court of Charlemagne, king of the Franks. To sharpen the minds of the young, he gathered many problems that were fun to think about. The wolf-and-goat problem is number 18 in the collection.", "Puzzles that compare the numbers on both banks, like the monkey puzzle, have also been loved around the world in many shapes, such as the problem of the missionaries and the cannibals. The characters change, but the way of thinking stays the same: never make a dangerous combination, and organize the state of both banks.", "Writing down all the possible states and searching for a path through them connects to a basic idea in modern computers. The hint button in the sister app \"River Crossing Puzzle\" actually has the computer check every state to find the shortest way across.", "The maker of this picture book, Masanori Shimizu, once set this problem in his elective mathematics class. His students wrote their ideas on worksheets and explained their solutions in front of the blackboard. He remembers that when the bold move of \"bringing the goat back\" was presented, the whole classroom erupted with excitement."]}, "quiz": {"ja": ["Q1. 古典編で、最初に船で運ぶのは何ですか。　答え：ヤギです（オオカミとキャベツは、一緒に残しても大丈夫だからです）", "Q2. オオカミを運んだあと、帰りの船にヤギを乗せて連れ戻すのは、なぜですか。　答え：そのままキャベツを取りに戻ると、向こう岸でオオカミとヤギが残ってしまうからです", "Q3. サル編で、いつも守らなければいけない約束は何ですか。　答え：人がいる岸では、人の数がサルの数以上であることです"], "en": ["Q1. In the classic puzzle, what is carried across first?　Answer: The goat (because the wolf and the cabbage can safely stay together)", "Q2. After carrying the wolf across, why does the boat bring the goat back?　Answer: Because if you went to fetch the cabbage just like that, the wolf and the goat would be left together on the far bank", "Q3. In the monkey puzzle, what rule must always be kept?　Answer: On any bank where there are people, the number of people must be at least the number of monkeys"]}, "corner": {"ja": ["アプリ『川渡りパズル』で遊んでみましょう。古典編とサル編のほかに、宣教師と人食い編、ライオンとラマ編、家族と警官・泥棒編の、全部で5つのステージがあります。考えるためのワークシートも印刷できます（アプリの公開先は、noteの紹介記事でお知らせします）。", "紙と駒でも遊べます。紙に川を描いて、コインや消しゴムを登場人物に見立て、1回渡すごとに駒を動かしてみましょう。", "コツは、渡すたびに「両岸に誰がいるか」を書き出すことです。行き詰まったら、一度“連れ戻す”方法がないか考えてみてください。"], "en": ["Try the app \"River Crossing Puzzle.\" Besides the classic puzzle and the monkey puzzle, there are three more stages — the Missionaries and Cannibals, the Lion and Llama, and the Family, the Policeman and the Thief — five stages in all. You can also print worksheets for thinking on paper (the app's address will be announced in the introduction article on note).", "You can also play with paper and pieces. Draw a river on paper, use coins or erasers as the characters, and move a piece each time the boat crosses.", "The secret is to write down \"who is on each bank\" after every crossing. And when you are stuck, ask yourself: is there something I could bring back?"]}}, {"id": "futei", "title": {"ja": "ぴったり量れる？ 余る？ ― 不定方程式のおはなし", "en": "Exactly Right, or Some Left Over? — A Tale of Indeterminate Equations"}, "sub": {"ja": "小学校高学年〜中学生向け・1が作れれば、なんでも作れる", "en": "For upper elementary to middle school — if you can make 1, you can make anything"}, "cover": "fut1.jpg", "images": ["fut1.jpg", "fut2.jpg", "fut3.jpg", "fut4.jpg", "fut5.jpg", "fut5.jpg"], "pages": [{"ja": ["夏休みのはじめ、タクトはおばあちゃんと新幹線に乗って、小旅行に出かけました。新幹線の座席は、1つの列が、窓側の2人席と通路側の3人席に分かれています。", "車内では、いろいろなグループが座っていました。5人の家族は、2人席と3人席に分かれて座っています。4人のグループは2人席を2つ使い、6人なら、3人席を2つでも、2人席を3つでも座れます。", "「あれ？」タクトは考えました。「列のかたまりで座れる人数と、座れない人数がありそうだぞ。」2人、3人、4人、5人、6人、7人と数えてみると、座れないのは「1人」だけでした。", "「2人以上なら、何人でも座れるんだね。」おばあちゃんが言いました。「偶数の人数は、2人席の積み重ね。奇数なら、まず3人席を1つ使って、残りを偶数にすればいい。式で書くと『2×○＋3×○＝人数』。○に入る数の組み合わせの数だけ、座り方があるんだよ。」"], "en": ["At the start of summer vacation, Tacto took a little trip on the shinkansen bullet train with his grandmother. In the train, each row of seats is split into a two-seat side by the window and a three-seat side by the aisle.", "All kinds of groups were sitting in the car. A family of five was spread across a two-seat and a three-seat. A group of four used two two-seats, and six people could sit with two three-seats, or with three two-seats.", "\"Wait a minute,\" thought Tacto. \"Some group sizes can sit in one block of a row, and some cannot.\" He counted: two, three, four, five, six, seven... The only size that could not sit was one person alone.", "\"So any group of two or more can sit,\" said his grandmother. \"An even number is just a stack of two-seats. For an odd number, use one three-seat first, and the rest becomes even. As an equation: 2×□ + 3×□ = the number of people. There are as many seatings as there are ways to fill the boxes.\""]}, {"ja": ["着いた町で、二人はおばあちゃんの友だちの油屋さんに寄りました。油は量り売りです。ところが、店にある容器は、3リットルの容器と5リットルの容器の2つだけでした。ちょうどそこへ、「油をぴったり4リットルください」というお客さんが来ました。", "タクトは腕まくりをして挑戦しました。5リットルの容器を満たして、3リットルの容器へ移すと、2リットル残ります。でも、ほしいのは4リットルです。3リットルの容器から始めてみても、4リットルは作れません。", "「2リットルなら作れるのに……。」タクトは店先の帳面に、容器の中身の移り変わりを書き出しながら考えました。2リットルが2つあれば、4リットルになる。けれど、容器は2つしかありません。", "そのとき、おばあちゃんが言いました。「作れた2リットルを、どこかに取っておけないかな。」――そうだ。3リットルの容器に2リットルを移しておいて、もう一度5リットルの容器を満たせば……！"], "en": ["In the town they visited, the two stopped at the oil shop of Grandmother's friend. The oil was sold by measure, but the shop had only two containers: a 3-liter one and a 5-liter one. Just then, a customer arrived and said, \"Exactly four liters of oil, please.\"", "Tacto rolled up his sleeves and tried. Fill the 5-liter container and pour into the 3-liter one, and 2 liters remain. But the customer wants 4 liters. Starting from the 3-liter container did not make 4 liters either.", "\"I can make 2 liters, but...\" Tacto wrote down how the contents changed in the shop notebook, and thought. Two 2-liters would make 4. But there are only two containers.", "Then his grandmother said, \"Can you keep the 2 liters you made somewhere safe?\" — That was it! Park the 2 liters in the 3-liter container, fill the 5-liter container once more, and then..."]}, {"ja": ["タクトは、2リットルの入った3リットルの容器へ、満たした5リットルの容器から油を注ぎました。3リットルの容器に入るのは、あと1リットルだけです。注ぎ終わったとき、5リットルの容器に残ったのは――ぴったり4リットルでした。", "「できた！」式で書くと、5×2−3×2＝4。5リットルを2回入れて、3リットルを2回分引くと、4リットルが残るのです。お客さんは大喜びで、油を持って帰りました。", "それからタクトは、もっとすごいことにも気づきました。3リットルを2回量って、5リットルを1回引くと、3×2−5×1＝1。つまり、この2つの容器で「1リットル」が作れるのです。1が作れれば、1リットルずつ集めて、何リットルでも量ることができます。", "新幹線の2人席と3人席でも、3−2＝1で「1」が作れる組み合わせでした。「3と5、2と3みたいに、共通の約数が1だけの数同士を『互いに素』というんだよ。そういう組み合わせでは、いつか必ず1が作れる。それが、この問題の鍵だね。」おばあちゃんはうなずきました。"], "en": ["Tacto poured from the full 5-liter container into the 3-liter container, which held 2 liters. Only 1 more liter could fit into it. When he finished pouring, what remained in the 5-liter container was — exactly 4 liters!", "\"He did it!\" As an equation: 5×2 − 3×2 = 4. Pour in 5 liters twice, take away 3 liters twice, and 4 liters remain. The delighted customer carried the oil home.", "Then Tacto noticed something even more amazing. Measure 3 liters twice and take away 5 liters once: 3×2 − 5×1 = 1. With these two containers, you can make exactly 1 liter. And if you can make 1, you can gather 1 liter at a time and measure any number of liters at all.", "The train seats were the same kind of pair: 3 − 2 = 1 makes a 1 there too. \"Pairs like 3 and 5, or 2 and 3, whose only common divisor is 1, are called 'coprime.' With such a pair, you can always make 1 sooner or later. That is the key to this puzzle,\" Grandmother nodded."]}, {"ja": ["帰り道、二人は町の縁日に寄りました。屋台の一つに、「ぴったり払いゲーム」の看板があります。4円玉と7円玉のおもちゃコインだけを使って、品物の値段をぴったり払えたら、景品がもらえるのです。", "タクトが挑戦しました。4円、7円、8円、11円、12円、14円、15円、16円の品物は、コインの組み合わせでぴったり払えました。ところが、1円、2円、3円、5円、6円、9円、10円、13円は、どう組み合わせても作れません。", "「17円の品物はどうだい。」屋台のおじさんが、にやりと笑いました。タクトは指折り数えましたが、17円はどうしても作れません。景品はおあずけです。", "ところが、18円、19円、20円、21円の品物は、全部ぴったり払えたのです。「22円は、18円に4円を足せばいい。23円は19円に4円……。ということは、18円以上の金額は全部作れる！」作れない一番大きな金額は、17円で最後でした。"], "en": ["On the way back, they stopped at the town festival. One stall had a sign: \"The Exact-Payment Game.\" If you can pay the exact price of an item using only toy 4-yen and 7-yen coins, you win a prize.", "Tacto took the challenge. Items priced 4, 7, 8, 11, 12, 14, 15, and 16 yen could be paid exactly with coin combinations. But 1, 2, 3, 5, 6, 9, 10, and 13 yen could not be made, no matter how he combined the coins.", "\"How about the 17-yen item?\" The stall keeper grinned. Tacto counted on his fingers, but 17 yen simply could not be made. No prize this time.", "But the items priced 18, 19, 20, and 21 yen could all be paid exactly. \"And 22 is 18 plus 4. Twenty-three is 19 plus 4... That means every amount of 18 yen or more can be made!\" The largest amount that could not be made was 17 — and it was the last one."]}, {"ja": ["「どうして17円が最後なんだろう。」タクトは考えました。18、19、20、21と、4つ続けて作れる金額がそろえば、あとは4円玉を1枚ずつ足していくだけで、すべての金額に届きます。だから、作れない金額には、必ず終わりがあるのです。", "2種類の数aとbが互いに素のとき、作れない一番大きな数は、a×b−a−bで求められます。4と7なら、4×7−4−7＝17。新幹線の2と3なら、2×3−2−3＝1で、「座れないのは1人だけ」とぴったり一致しました。", "油の容器の話は、少しだけ違います。容器では「注いで引く」ことができたので、1が作れて、全部の量が量れました。コインは足すことしかできないから、作れない金額が残るのです。同じ「a×○＋b×○」の家族でも、できることが違うのですね。", "「ところで、コインが3種類以上になると、この公式は使えなくなるんだ。」屋台のおじさんが言いました。「作れない一番大きな金額を求める簡単な方法は見つかっていなくて、今も世界中の数学者が研究しているんだよ。」タクトは驚きました。こんな身近な問題の奥に、まだ解けていない謎が残っていたのです。"], "en": ["\"Why is 17 the last one?\" Tacto wondered. Once four amounts in a row — 18, 19, 20, 21 — can all be made, you only need to keep adding one 4-yen coin to reach every larger amount. So the amounts that cannot be made must come to an end.", "When two numbers a and b are coprime, the largest amount that cannot be made is a×b − a − b. For 4 and 7: 4×7 − 4 − 7 = 17. For the train's 2 and 3: 2×3 − 2 − 3 = 1, which matches \"only one person cannot sit\" exactly.", "The oil containers were a little different. With containers, you could pour and subtract, so you could make 1, and then measure every amount. Coins can only be added, so some amounts remain impossible. They belong to the same \"a×□ + b×□\" family, yet what they can do is different.", "\"By the way,\" said the stall keeper, \"with three or more kinds of coins, this formula no longer works. No simple way to find the largest impossible amount has been found, and mathematicians around the world are still studying it.\" Tacto was amazed. Behind such an everyday puzzle, there was still an unsolved mystery."]}, {"ja": ["夕方、帰りの電車の中で、タクトは今日のことをノートにまとめました。新幹線の座席、油屋さんの容器、縁日のコイン。3つの問題は、みんな「a×○＋b×○＝c」の形をした、同じ家族の問題でした。", "こういう、答えの組み合わせがたくさんあったり、1つもなかったりする方程式を、「不定方程式」といいます。「不定（決まらない）」けれど、作れるものと作れないものの境目は、はっきり決まっているのです。", "その境目を決めるのは、「1が作れるかどうか」でした。互いに素の2つの数からは、かけ算と引き算で必ず1が作れて、そこから世界が広がっていきます。", "次は、あなたの番です。「やってみよう」で、アプリや家の計量カップを使って、ぴったり量ることに挑戦してみてください。あなたなら、どんな組み合わせで1を作りますか。"], "en": ["In the evening, on the train home, Tacto wrote up the day in his notebook. The train seats, the oil shop's containers, the festival coins. All three puzzles had the same shape: a×□ + b×□ = c. They were one family.", "An equation like this — one that may have many answers, or none at all — is called an indeterminate equation. \"Indeterminate\" means the answer is not fixed, yet the border between what can be made and what cannot is perfectly sharp.", "What decides the border is whether you can make 1. From two coprime numbers, multiplication and subtraction can always build a 1, and from there the world opens up.", "Now it is your turn. In the \"Try It Yourself\" corner, take up the challenge of measuring exactly, with the app or with measuring cups at home. How would you build a 1?"]}], "column": {"ja": ["不定方程式は、別名を「ディオファントス方程式」といいます。今から約1700年前、ギリシャの数学者ディオファントスが書いた『算術』という本が、答えが整数の組み合わせになる方程式を、たくさん扱っていたからです。", "インドでも、この種の問題は熱心に研究されました。アーリヤバタ（5〜6世紀）やブラーマグプタ（7世紀）たちは、「クッタカ（粉々に砕く、という意味）」と呼ばれる解き方で、a×x＋b×y＝cの整数の答えを、順序立てて求める方法を作り上げました。暦や天文学の計算に、必要だったのです。", "硬貨の問題は、「フロベニウスの硬貨問題」という名前で知られています。19世紀から20世紀にかけて活躍したドイツの数学者、フロベニウスにちなんだ名前です。コインが2種類のとき、作れない一番大きな金額が a×b−a−b になることと、作れない金額の個数が (a−1)×(b−1)÷2 になることは、イギリスの数学者シルヴェスターが、1884年に示しました。", "ところが、コインが3種類以上になると、このような公式は今も見つかっていません。個々の組み合わせについてはコンピューターで調べられますが、「どんな場合でも成り立つ式」は、現代の数学でも未解決のまま残されているのです。", "この絵本を作った清水正典先生は、昔の授業で、油分け算と新幹線の座席の問題を扱いました。生徒たちが容器の絵を描きながら考えた、その授業の道具を再現したのが、姉妹アプリ『不定方程式シミュレーター』です。アプリのヒント機能は、すべての状態をコンピューターに調べさせて、最短の手順を探しています。"], "en": ["Indeterminate equations are also called Diophantine equations. About 1,700 years ago, the Greek mathematician Diophantus wrote a book called Arithmetica, which treated many equations whose answers are combinations of whole numbers.", "In India, too, these problems were studied eagerly. Mathematicians such as Aryabhata (5th–6th century) and Brahmagupta (7th century) built a method called kuttaka — \"the pulverizer\" — for finding whole-number answers to a×x + b×y = c in an orderly way. They needed it for calendars and astronomy.", "The coin problem is known as \"Frobenius's coin problem,\" named after the German mathematician Frobenius, who worked in the 19th and 20th centuries. For two kinds of coins, the English mathematician Sylvester showed in 1884 that the largest impossible amount is a×b − a − b, and that the number of impossible amounts is (a−1)×(b−1)÷2.", "But with three or more kinds of coins, no such formula has been found even today. Computers can check individual sets of coins, yet a formula that works in every case remains an unsolved problem in modern mathematics.", "Mr. Shimizu, who created this picture book, once taught lessons using the oil-dividing and train-seat problems. The sister app, \"Indeterminate Equation Simulator,\" recreates the tools of that classroom, where students drew pictures of containers and thought together. The app's hint feature lets a computer search through every possible state to find the shortest way."]}, "quiz": {"ja": ["Q1. 3リットルの容器と5リットルの容器で、「1リットル」を作る式はどれですか。　答え：3×2−5×1＝1です（3リットルを2回量り、5リットルを1回引きます）", "Q2. 2人席と3人席の列で、座れない人数はいくつですか。　答え：1人だけです（2人以上は、どんな人数でも座れます）", "Q3. 4円玉と7円玉で作れない、一番大きな金額はいくらですか。　答え：17円です（4×7−4−7＝17で求められます）"], "en": ["Q1. Which equation makes exactly 1 liter with a 3-liter container and a 5-liter container?　Answer: 3×2 − 5×1 = 1 (measure 3 liters twice, and take away 5 liters once)", "Q2. In a row of two-seats and three-seats, which group size cannot sit?　Answer: Only one person (any group of two or more can sit)", "Q3. What is the largest amount that cannot be made with 4-yen and 7-yen coins?　Answer: 17 yen (found by 4×7 − 4 − 7 = 17)"]}, "corner": {"ja": ["アプリ『不定方程式シミュレーター』で遊んでみましょう。油分け算モードでは、3リットルと5リットルの容器で4リットルを量る問題に挑戦できます（最短は6手です）。座席モードでは、人数を変えて、座れない人数がないか確かめられます。", "家でも実験できます。300ミリリットルと500ミリリットルの計量カップ（ペットボトルでも代わりになります）があれば、3と5の組み合わせと同じ仕組みで、400ミリリットルをぴったり量ることができます。大人の人と一緒に、水で試してみましょう。", "硬貨ゲームも作れます。紙に4円玉と7円玉を描いて切り抜き、1円から30円までの金額について、払える金額には○、払えない金額には×をつけて、表にしてみましょう。一番大きな×が17になるはずです。"], "en": ["Try the app \"Indeterminate Equation Simulator.\" In Oil-Dividing Mode, you can challenge yourself to measure 4 liters with 3-liter and 5-liter containers (the shortest solution takes six moves). In Seat Mode, you can change the number of people and check whether any group size cannot sit.", "You can experiment at home, too. With 300-milliliter and 500-milliliter measuring cups (or plastic bottles), you can measure exactly 400 milliliters, by the same mechanism as 3 and 5. Try it with water, together with a grown-up.", "You can make the coin game as well. Draw 4-yen and 7-yen coins on paper and cut them out. For every amount from 1 to 30 yen, mark a circle if it can be paid and a cross if it cannot, and make a table. The largest cross should be at 17."]}}, {"id": "birthday", "title": {"ja": "同じ誕生日はいる？ ― 余事象の確率のおはなし", "en": "Is Anyone Sharing a Birthday? — A Tale of Complementary Probability"}, "sub": {"ja": "小学校高学年〜中学生向け・反対側を数えると、答えが見えてくる", "en": "For upper elementary to middle school — count the opposite side, and the answer comes into view"}, "cover": "bir1.jpg", "images": ["bir1.jpg", "bir2.jpg", "bir3.jpg", "bir4.jpg", "bir5.jpg", "bir5.jpg"], "pages": [{"ja": ["4月、ユイは5年生になりました。新しいクラスは30人です。", "教室の後ろには、大きな「誕生日カレンダー」が貼ってあります。1月から12月まで、365日分のマスがあるカレンダーです。自己紹介のとき、みんなは自分の誕生日を言って、カレンダーの自分の日にシールを貼りました。", "ところが、途中で教室がざわつきました。出席番号7番の男の子と、19番の女の子が、同じ日にシールを貼ったのです。2人とも、10月14日生まれでした。", "「30人しかいないのに、もう重なるなんて。」ユイは首をかしげました。「365日もあるのに、すごい偶然だね。」"], "en": ["In April, Yui became a fifth grader. Her new class had thirty students.", "On the back wall of the classroom hung a big \"birthday calendar\" — a calendar with squares for all 365 days, from January to December. During introductions, everyone said their birthday and put a sticker on their own day.", "Partway through, the classroom began to buzz. The boy with attendance number 7 and the girl with number 19 had put their stickers on the very same day. Both of them were born on October 14.", "\"But there are only thirty of us, and it already happened,\" Yui said, tilting her head. \"There are 365 days — what a coincidence!\""]}, {"ja": ["休み時間、ユイは考えていました。自分と同じ誕生日の人は、このクラスにいるでしょうか。", "試しに「月」だけで見てみると、重なりだらけでした。月は12しかないので、13人集まれば、同じ月生まれの人が必ずいます。30人のクラスでは、どの月にも2〜3人はいる計算です。", "「月が同じなのは当たり前。でも、日まで同じって、やっぱり偶然じゃないの？」", "ユイがつぶやくと、先生が笑って言いました。「本当に偶然かどうか、計算してみようか。ただし、『誰かと誰かが重なる場合』を直接数えるのは、とても大変なんだ。」"], "en": ["During the break, Yui kept thinking. Was there someone in this class whose birthday was the same as hers?", "Looking only at months, matches were everywhere. There are only twelve months, so if thirteen people gather, two of them are sure to share a birth month. In a class of thirty, every month would have two or three people in it.", "\"Sharing a month is nothing special. But the same day as well — that really is a coincidence, isn't it?\"", "When Yui murmured this, her teacher smiled and said, \"Shall we calculate whether it is really a coincidence? Mind you, counting 'the cases where some pair matches' directly is very hard work.\""]}, {"ja": ["先生は黒板に、大きな○と、その外側を塗った図を描きました。", "「直接数えにくいときは、反対側を数える。これがコツだよ。誕生日の話なら、反対側は『全員の誕生日がバラバラ』の場合だね。」", "クラスのみんなで考えます。1人目の誕生日は、365日のどれでもよい。2人目は、1人目と違う日ならよいので、364日。3人目は363日……。全員がバラバラになる確率は、365分の365×364×363×……と、少しずつ小さくなる数を掛けていくことで求められます。", "「そして、『全員バラバラ』でなければ、『誰かと誰かが重なっている』はずだよね。」先生は、図の塗った部分を指さしました。「だから、重なる確率は、1から『全員バラバラ』の確率を引けばいい。これを、余事象の考え方というんだ。」"], "en": ["On the blackboard, the teacher drew a big circle, and shaded the whole area outside it.", "\"When something is hard to count directly, count the opposite side. That is the trick. For birthdays, the opposite side is the case where everyone's birthday is different.\"", "The whole class thought it through together. The first person's birthday can be any of the 365 days. The second person just needs a different day, so 364 days. The third person, 363 days... The probability that all the birthdays are different is found by multiplying numbers that shrink little by little: 365/365 × 364 × 363 × ...", "\"And if they are NOT all different, then some pair must be matching, right?\" The teacher pointed at the shaded part of the diagram. \"So the probability of a match is 1 minus the probability that all are different. This way of thinking is called the complementary event.\""]}, {"ja": ["みんなで電卓をたたきました。人数を増やしていくと、「誰かと誰かが同じ誕生日」の確率は、ぐんぐん上がっていきます。", "10人では約12%。20人では約41%。23人で、約51%と、半分を超えました。365日の半分どころか、23人で半々なのです。", "そして、30人のこのクラスでは――約71%。「ええっ、そんなに高いの！」", "つまり、7番と19番が重なったのは、ちっとも不思議な偶然ではなかったのです。むしろ、重ならないほうが珍しいことでした。教室中から、どよめきが起こりました。"], "en": ["Everyone tapped away at their calculators. As the number of people grew, the probability that some pair shared a birthday climbed and climbed.", "With 10 people, about 12%. With 20 people, about 41%. At 23 people, it passed one half, at about 51%. Not half of 365 days at all — just 23 people for an even chance.", "And in this very class of 30 — about 71%! \"What? That high?\"", "So numbers 7 and 19 matching was not a strange coincidence at all. If anything, NOT matching would have been the unusual outcome. The whole classroom erupted in surprise."]}, {"ja": ["でも、ユイには、まだ引っかかることがありました。「先生、私と同じ誕生日の人がいる確率も、71%なの？」", "先生は首を振りました。「それは別の話だよ。ユイの日は、もう決まっている。残りの29人が、その日を避ける確率を考えてみよう。」", "29人全員がユイの日を避ける確率は、約92%。ということは、ユイと同じ誕生日の人がいる確率は、約8%しかありません。", "「どうして、こんなに違うんだろう。」ユイは考えて、はっとしました。「『誰かと誰か』なら、ペアの組み合わせがたくさんあるからだ！」30人から2人を選ぶ組み合わせは、435通りもあります。ペアが435組もあれば、そのどれかが重なるのは、起こりやすいことなのです。"], "en": ["But something still bothered Yui. \"Teacher, is the probability that someone has the same birthday as me also 71%?\"", "The teacher shook her head. \"That is a different story. Your day is already decided. Let us think about the probability that the other 29 people all avoid your day.\"", "The probability that all 29 people avoid Yui's day is about 92%. Which means the probability that someone shares Yui's birthday is only about 8%.", "\"Why is it so different?\" Yui thought — and then, suddenly, she saw it. \"Because with 'some pair,' there are so many pairs!\" The number of ways to choose 2 people out of 30 is 435. With 435 pairs, it is easy for one of them to match."]}, {"ja": ["放課後、ユイは誕生日カレンダーを眺めていました。10月14日のマスには、シールが2枚並んでいます。", "「偶然だと思っていたことが、計算してみると『起こるほうが普通』だったなんて。」", "直接数えるのが大変なことでも、反対側（余事象）を数えれば、答えにたどり着ける。そして、「自分と同じ」と「誰かと同じ」は、似ているようで全然違う。この2つが、今日の発見でした。", "それから、もう1つ。人数が増えれば、重なる確率は1（確実）に近づいていきます。そして366人集まれば、計算するまでもなく、必ず誰かと誰かが重なります。365日の「巣」より鳩が1羽多ければ、どこかの巣に2羽入るからです。これを「鳩の巣原理」といって、「かもしれない」の確率の話と、「必ず」の話は、実は地続きだったのです。", "次は、あなたの番です。「やってみよう」で、あなたの家族やクラスでも確かめてみてください。23人集まれば、同じ誕生日のペアがいる確率は、もう半分を超えているのですから。"], "en": ["After school, Yui gazed at the birthday calendar. On the square for October 14, two stickers sat side by side.", "\"Something I thought was a coincidence turned out — once I calculated it — to be the normal thing to happen.\"", "Even when counting directly is hard, counting the opposite side (the complementary event) can lead you to the answer. And \"the same as me\" and \"the same as each other\" look alike, but are completely different. Those were the two discoveries of the day.", "And there was one more. As the number of people grows, the probability of a match comes closer and closer to 1 (certainty). And if 366 people gather, no calculation is needed: some pair is sure to match. If there are more pigeons than the 365 days' \"nests,\" two pigeons must enter the same nest. This is called the pigeonhole principle — and the story of \"might happen\" probabilities and the story of \"must happen\" turn out to be connected all along.", "Next, it is your turn. In \"Try It Yourself,\" check with your own family or class. Once 23 people gather, the probability that a birthday pair is among them is already more than half."]}], "column": {"ja": ["この問題は、「誕生日のパラドックス（逆説）」という名前で知られています。パラドックスと言っても、計算が間違っているわけではありません。「365日もあるのだから、重なるはずがない」という直感と、「23人で半分を超える」という計算結果のギャップが、逆説らしく感じられるのです。", "この話は、「鳩の巣原理」とも深く関わっています。鳩の巣原理（引き出し論法とも言い、数学者ディリクレの名前でも知られます）は、「365個の巣に366羽の鳩が入れば、2羽以上入る巣が必ずある」という考え方です。誕生日に当てはめれば、366人集まれば、同じ誕生日のペアが必ずいます。月なら、13人で必ず重なります。余事象の確率の話で言えば、「全員バラバラ」の確率は人数が増えるほど小さくなり、366人でちょうど0になる、ということでもあります。「重なるかもしれない」という確率の話と、「重ならざるを得ない」という原理の話は、人数という1本のものさしの上で、きれいにつながっているのです。", "大事な約束事も確認しておきましょう。この計算では、1年を365日とし（うるう日の2月29日は考えません）、どの日に生まれることも同じ程度に期待できるものとしています。実際には生まれやすい季節の偏りもありますが、考え方の芯は変わりません。", "実は、この絵本の作者・清水正典先生は、2006年、今から20年ほど前に、自分のブログでこの問題を記事にしています。「クラスには必ず同じ誕生日の人がいる？　余事象の確率」（https://ameblo.jp/masanori432/entry-10008026463.html ）という題で、40人のクラスの確率を表計算ソフトで計算し、約89%（正確には0.89123181）という結果を発表していました。コメントも9件ついた、読者と盛り上がった記事です。", "清水先生自身、小学生のとき、生年月日が全く同じ友達がいたそうです。中学・高校のクラスでも、同じ月・同じ日生まれの組み合わせが少なくとも1組はいた、と記事に書いています。この絵本は、その実感と20年前の記事を種にして、物語に仕立て直したものです。"], "en": ["This problem is known by the name \"the birthday paradox.\" It is called a paradox, but the calculation is not wrong. The gap between our intuition — \"there are 365 days, so no one could possibly match\" — and the calculated result — \"more than half, with just 23 people\" — is what makes it feel like a paradox.", "This story is also deeply connected with the pigeonhole principle. The pigeonhole principle (also called the drawer principle, and known by the name of the mathematician Dirichlet) is the idea that \"if 366 pigeons enter 365 nests, there must be a nest with two or more pigeons.\" Applied to birthdays, if 366 people gather, a matching pair is sure to exist. For months, thirteen people are enough. In the language of complementary probability, it also means this: the probability that \"all are different\" shrinks as the number of people grows, and becomes exactly 0 at 366 people. The story of \"might match\" and the principle of \"cannot avoid matching\" are beautifully connected on a single measuring stick — the number of people.", "Let us also check an important promise in the calculation. Here, a year is taken to have 365 days (the leap day, February 29, is not considered), and every day is assumed to be equally likely for a birth. In reality, births do lean toward certain seasons, but the heart of the idea does not change.", "In fact, the author of this picture book, Mr. Masanori Shimizu, wrote about this very problem on his own blog in 2006, some twenty years ago. In a post titled \"Is There Always Someone with the Same Birthday in the Class? — The Probability of the Complementary Event\" (https://ameblo.jp/masanori432/entry-10008026463.html ), he used spreadsheet software to calculate the probability for a class of 40, and published the result: about 89% (exactly 0.89123181). The post received nine comments — a lively time with his readers.", "Mr. Shimizu himself, when he was an elementary school student, had a friend whose birth date was exactly the same as his own. In his middle school and high school classes as well, there was always at least one pair sharing the same month and day, he wrote in the post. This picture book grew from that feeling, and from the article of twenty years ago, retold as a story."]}, "quiz": {"ja": ["Q1. 30人のクラスで、「誰かと誰かが同じ誕生日」の確率は、およそ何%ですか。　答え：約71%です（「全員バラバラ」の確率・約29%を、1から引いて求めます）", "Q2. 何人集まれば、「同じ誕生日のペアがいる」確率が半分を超えますか。　答え：23人です（約51%になります）", "Q3. 30人のクラスで、「自分と同じ誕生日」の人がいる確率が約8%しかないのは、なぜですか。　答え：自分の日は決まっていて、比べる相手は残りの29人だけだからです。「誰かと誰か」では2人の組み合わせが435通りもあるので、重なりやすさが全く違います", "Q4. 366人集まれば、同じ誕生日のペアが「必ず」いるのは、なぜですか。　答え：誕生日は365日しかないので、366人いれば、少なくとも1日は2人以上で分け合うことになるからです。これが鳩の巣原理で、「全員バラバラ」の確率が0になる場合でもあります"], "en": ["Q1. In a class of 30, about what percent is the probability that \"some pair shares a birthday\"?　Answer: About 71% (found by subtracting the probability that \"all are different,\" about 29%, from 1)", "Q2. How many people need to gather before the probability of \"a matching birthday pair\" passes one half?　Answer: 23 people (it becomes about 51%)", "Q3. In a class of 30, why is the probability that someone shares \"your\" birthday only about 8%?　Answer: Because your day is already fixed, and the people to compare with are only the other 29. With \"some pair,\" there are 435 combinations of two people, so the chance of matching is completely different", "Q4. Why is a matching birthday pair \"guaranteed\" when 366 people gather?　Answer: Because there are only 365 birthdays, so with 366 people, at least one day must be shared by two or more people. This is the pigeonhole principle — and it is also the case where the probability of \"all different\" becomes 0"]}, "corner": {"ja": ["（１）月で確かめる：友だちや家族を13人以上集めて、誕生月を聞いてみましょう。月は12しかないので、同じ月生まれのペアが必ず見つかります（これを「鳩の巣原理」と言います。366人集まれば、誕生日そのものも必ず重なります）。", "（２）クラスで確かめる：教室に誕生日カレンダーを作って、全員の日にシールを貼ってみましょう。30人前後のクラスなら、重なる日が見つかることが多いはずです。", "（３）家族で挑戦：お正月など、親戚が23人以上集まる機会があったら、全員の誕生日を聞いてみましょう。同じ誕生日のペアがいる確率は、約51%。見つかるかどうか、予想してから調べると面白いです。", "（４）計算に挑戦：2人だけなら、同じ誕生日の確率は365分の1です。3人、4人と増やすとどうなるか、「全員バラバラ」の確率から計算してみましょう。"], "en": ["(1) Check by month: Gather thirteen or more friends or family members, and ask them their birth months. There are only twelve months, so a pair sharing a birth month is sure to be found (this is the \"pigeonhole principle.\" With 366 people, the birthday itself is sure to match, too).", "(2) Check in class: Make a birthday calendar for the classroom, and have everyone put a sticker on their day. In a class of about thirty, you will very likely find a day that matches.", "(3) A family challenge: When relatives gather — at New Year's, for example — and there are 23 or more people, ask everyone their birthday. The probability that a matching pair is there is about 51%. It is more fun if you predict first, and then check.", "(4) A calculation challenge: With just 2 people, the probability of the same birthday is 1 in 365. What happens as you go to 3 people, then 4? Try calculating it from the probability that all the birthdays are different."]}}], "ui": {"en": {"appSub": "Meeting mathematics through stories", "appTitle": "Math Picture Books", "back": "Back to shelf", "column": "A Mini Column on Math History", "langBtn": "日本語", "next": "Next", "pageOf": "Page", "prev": "Back", "quiz": "Check Quiz", "read": "Read", "corner": "Try It Yourself"}, "ja": {"appSub": "物語で出会う、数学の世界", "appTitle": "数学の絵本", "back": "本棚にもどる", "column": "数学史ミニコラム", "langBtn": "English", "next": "つぎへ", "pageOf": "ページ", "prev": "まえへ", "quiz": "確認クイズ", "read": "読む", "corner": "やってみよう"}}};
let lang = localStorage.getItem('math_ehon_lang') || 'ja';
let curBook = null, curPage = 0;

const $ = id => document.getElementById(id);
const ui = () => DATA.ui[lang];

function applyLang(){
  document.documentElement.lang = lang === 'ja' ? 'ja' : 'en';
  $('appTitle').textContent = ui().appTitle;
  $('appSub').textContent = ui().appSub;
  $('langBtn').textContent = ui().langBtn;
  renderShelf();
  if (curBook !== null) renderPage();
}
function renderShelf(){
  const s = $('shelf'); s.innerHTML = '';
  DATA.books.forEach((b, i) => {
    const d = document.createElement('div'); d.className = 'book';
    d.innerHTML = `<img src="${b.cover}" alt=""><div class="info"><h2></h2><div class="bsub"></div><span class="read"></span></div>`;
    d.querySelector('h2').textContent = b.title[lang];
    d.querySelector('.bsub').textContent = b.sub[lang];
    d.querySelector('.read').textContent = ui().read;
    d.onclick = () => { curBook = i; curPage = 0; $('shelfView').classList.add('hidden'); $('readerView').classList.remove('hidden'); renderPage(); window.scrollTo(0,0); };
    s.appendChild(d);
  });
}
function renderPage(){
  const b = DATA.books[curBook], u = ui();
  $('rTitle').textContent = b.title[lang];
  $('rSub').textContent = b.sub[lang];
  $('rImg').src = b.images[curPage];
  $('rText').innerHTML = b.pages[curPage][lang].map(p => `<p></p>`).join('');
  [...$('rText').children].forEach((el, i) => el.textContent = b.pages[curPage][lang][i]);
  const extra = $('rExtra'); extra.innerHTML = '';
  if (curPage === b.pages.length - 1) {
    const mk = (title, paras) => {
      const d = document.createElement('div'); d.className = 'extra';
      d.innerHTML = `<h3></h3><div class="text">${paras.map(() => '<p></p>').join('')}</div>`;
      d.querySelector('h3').textContent = title;
      [...d.querySelectorAll('p')].forEach((el, i) => el.textContent = paras[i]);
      return d;
    };
    if (b.corner) extra.appendChild(mk(u.corner, b.corner[lang]));
    extra.appendChild(mk(u.column, b.column[lang]));
    extra.appendChild(mk(u.quiz, b.quiz[lang]));
  }
  $('pageNo').textContent = (curPage + 1) + ' / ' + b.pages.length;
  $('prevBtn').textContent = u.prev; $('nextBtn').textContent = u.next;
  $('backBtn').textContent = u.back;
  $('prevBtn').disabled = curPage === 0;
  $('nextBtn').disabled = curPage === b.pages.length - 1;
}
$('langBtn').onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; localStorage.setItem('math_ehon_lang', lang); applyLang(); };
$('prevBtn').onclick = () => { if (curPage > 0) { curPage--; renderPage(); window.scrollTo(0,0); } };
$('nextBtn').onclick = () => { if (curBook !== null && curPage < DATA.books[curBook].pages.length - 1) { curPage++; renderPage(); window.scrollTo(0,0); } };
$('backBtn').onclick = () => { curBook = null; $('readerView').classList.add('hidden'); $('shelfView').classList.remove('hidden'); window.scrollTo(0,0); };
applyLang();
</script>
</body>
</html>
