nese book \"Mathematical Puzzles\" (Shinichi Ikeno, Shigeo Takagi, Sosaku Tsuchihashi, and Gisaku Nakamura, Chuko Shinsho, 1976), pages 194–201. The book explains the method carefully, with the placements arranged in tables.", "Writing the outcome patterns with symbols for left, right, and out gives each coin something like a three-digit code. The same idea lives on in the codes modern computers use to carry information efficiently.", "And in the companion app, \"Which Coin Is Fake? — Three Weighings with a Balance\", the placements for the 12-coin game were checked by computer for every possibility, and verified to tell them all apart correctly."]}, "quiz": {"ja": ["Q1．天秤を1回量ると、結果は何通りありますか。　答え：3通り（左が下がる・つり合う・右が下がる）", "Q2．天秤を3回量ると、結果の並びは全部で何通りになりますか。　答え：27通り（3×3×3）", "Q3．12枚のコインから、重いか軽いか分からないニセ金1枚を探すとき、可能性は全部で何通りありますか。　答え：24通り（12枚 × 重い・軽いの2通り）で、27通り以下なので3回で見分けられる望みがある"], "en": ["Q1. How many outcomes does one weighing on a balance have?　Answer: 3 (left goes down, balanced, right goes down)", "Q2. With three weighings, how many outcome patterns are there in all?　Answer: 27 (3 × 3 × 3)", "Q3. When hunting one fake coin among 12, heavy or light unknown, how many possibilities are there in all?　Answer: 24 (12 coins × heavy-or-light 2 ways) — fewer than 27, so three weighings may be enough"]}, "corner": {"ja": ["①コイン3枚、ニセ金は軽いと分かっている場合：左と右に1枚ずつ置いて1回量れば、3通りの結果で必ず見つかります。実際にコインやおはじきで試してみましょう。", "②コイン9枚、ニセ金は軽いと分かっている場合：3枚ずつ3組に分ければ、2回の量りで見つかります。「候補が3分の1ずつ減る」ことを確かめてみましょう。", "③数を確かめる：3回の量りで結果の並びは 3×3×3＝27通り。12枚のニセ金探しの可能性は 12×2＝24通り。どちらが大きいか比べて、「3回でできそう」な理由を自分の言葉で説明してみましょう。", "④本編に挑戦：12枚・重いか軽いか不明の見分けは、アプリ「ニセ金はどれだ！ ― 天秤で3回勝負」（https://jkj7vv2nd7-lang.github.io/nisegane-tenbin/ ）で体験できます。お手本モードで表の使い方を見てから、本編に挑戦してみましょう。"], "en": ["①Three coins, fake known to be light: put one coin on each pan and weigh once — the three outcomes always find it. Try it with real coins or counters.", "②Nine coins, fake known to be light: split into three groups of three, and two weighings will find it. Check how the candidates shrink to a third each time.", "③Check the numbers: three weighings give 3 × 3 × 3 = 27 outcome patterns. The 12-coin hunt has 12 × 2 = 24 possibilities. Compare them, and explain in your own words why three weighings might be enough.", "④Try the full game: the 12-coin puzzle with heavy-or-light unknown can be played in the app \"Which Coin Is Fake? — Three Weighings with a Balance\" (https://jkj7vv2nd7-lang.github.io/nisegane-tenbin/ ). Watch the table at work in the guided mode first, then try the main game."]}}, {"id": "hotel", "title": {"ja": "満員でも入れるホテル ― 無限のおはなし", "en": "A Hotel That Is Full but Never Full — A Story of Infinity"}, "sub": {"ja": "中学生向け・無限の部屋があるホテルでは、満室でもお客さんを入れられる", "en": "For junior high students — a hotel with infinitely many rooms can welcome guests even when it is full"}, "cover": "hot1.jpg", "images": ["hot1.jpg", "hot2.jpg", "hot3.jpg", "hot4.jpg", "hot5.jpg", "hot5.jpg"], "pages": [{"ja": ["ある日の授業で、サワダ先生は不思議なホテルの話をしました。「部屋が無限にあるホテルを想像してごらん。1号室、2号室、3号室…と、どこまでも部屋が続いている。」", "その夜、ホテルは満室でした。無限にある部屋のすべてに、お客さんが入っています。そこへ、新しいお客さんが1人やって来ました。", "ふつうのホテルなら「満室です」と断るところです。ところが、このホテルの支配人は平然と言いました。「大丈夫です。すぐにお部屋をご用意します。」", "「満室なのに、どうやって。」ミオが首をかしげると、先生は言いました。「鍵は、全員に少しだけ動いてもらうことさ。」"], "en": ["One day in class, Mr. Sawada told a strange story about a hotel. \"Imagine a hotel with infinitely many rooms. Room 1, Room 2, Room 3… the rooms go on forever.\"", "One night, the hotel was completely full. Every one of its infinitely many rooms had a guest. Then a new guest arrived.", "An ordinary hotel would have to say, \"Sorry, we are full.\" But the manager of this hotel answered calmly, \"No problem. We will prepare a room for you at once.\"", "\"But the hotel is full — how?\" Mio tilted her head. \"The key,\" said Mr. Sawada, \"is to ask everyone to move just a little.\""]}, {"ja": ["支配人の方法は、こうです。1号室のお客さんは2号室へ、2号室のお客さんは3号室へ、3号室のお客さんは4号室へ。つまり、n号室のお客さんは、(n＋1)号室へ引っ越します。", "すると、1号室がぽっかりと空きます。新しいお客さんは、そこに入ればいいのです。", "「でも、最後の部屋の人は、引っ越し先がなくて困るんじゃ。」ミオの問いに、先生は言いました。「そこが無限の面白いところだ。部屋は無限にあるから、『最後の部屋』がない。何号室の人にも、必ず次の部屋があるんだ。」", "有限のホテルではできない芸当が、無限のホテルではできてしまうのです。"], "en": ["Here is the manager's method. The guest in Room 1 moves to Room 2, the guest in Room 2 moves to Room 3, the guest in Room 3 moves to Room 4. In short, the guest in Room n moves to Room n + 1.", "Then Room 1 becomes empty, and the new guest can move in.", "\"But won't the guest in the very last room have nowhere to go?\" asked Mio. \"That is the wonderful thing about infinity,\" said Mr. Sawada. \"The rooms never end, so there is no 'last room'. Every guest, whatever their room number, always has a next room.\"", "A trick that is impossible in a finite hotel works perfectly in an infinite one."]}, {"ja": ["今度は、新しいお客さんが10人来ました。支配人は、全員に10部屋ずつずれてもらいました。1号室の人は11号室へ、2号室の人は12号室へ。これで、1号室から10号室までが空きます。", "では、無限の人数のお客さんを乗せたバスが来たら、どうでしょう。支配人の答えは「全員に、部屋番号を2倍してもらう」です。1号室の人は2号室へ、2号室の人は4号室へ、3号室の人は6号室へ。", "すると、偶数号室はすべて埋まりますが、奇数号室（1、3、5、7…）はすべて空きます。奇数号室も無限にありますから、無限のお客さん全員を入れられます。", "「無限の半分も、無限なんだ。」ミオは感心しました。"], "en": ["Next, ten new guests arrived. The manager asked everyone to shift by ten rooms: Room 1 to Room 11, Room 2 to Room 12. Rooms 1 to 10 became free.", "But what if a bus arrives carrying infinitely many guests? The manager's answer: \"Ask everyone to double their room number.\" Room 1 goes to Room 2, Room 2 to Room 4, Room 3 to Room 6.", "Then all the even rooms are filled, but all the odd rooms — 1, 3, 5, 7… — become free. There are infinitely many odd rooms, so infinitely many new guests can move in.", "\"Half of infinity is still infinity,\" said Mio, impressed."]}, {"ja": ["ここに、無限の大切な性質があります。偶数だけを集めると、自然数（1、2、3…）の「半分」しかないように見えます。でも、1↔2、2↔4、3↔6…と一対一に対応を付けると、どちらも余りなく対応します。", "数学では、一対一に対応が付く集合どうしを「同じだけある（同じ大きさ）」と考えます。つまり無限の集合は、自分の部分と「同じ大きさ」になることができるのです。", "有限の世界では、全体は部分より必ず大きいものです。その当たり前が、無限では成り立たない。「部分と全体が同じ大きさ」になることこそ、無限の無限らしいところです。", "このように一対一対応で数えられる無限（自然数と対応が付く無限）を、「数えられる無限」と言います。無限ホテルの話は、その入り口です。"], "en": ["Here is an important property of infinity. The even numbers alone look like only \"half\" of the natural numbers (1, 2, 3…). But pair them up — 1↔2, 2↔4, 3↔6… — and the pairing matches with nothing left over on either side.", "In mathematics, two collections that can be paired one-to-one like this are considered \"the same size\". So an infinite collection can be the same size as a part of itself.", "In the finite world, a whole is always bigger than any part. That common sense fails for infinity. \"A part being the same size as the whole\" is exactly what makes infinity feel so strange.", "An infinity that can be counted by pairing with the natural numbers is called a \"countable infinity\". The infinite hotel is the doorway into it."]}, {"ja": ["ミオは、もっと難しい注文を考えました。「無限のバスが、無限の台数来たら。」支配人なら、どうするのでしょう。", "実は、それでも入れる方法があります。バスの番号と席の番号をうまく組み合わせて、斜めに数えるように部屋番号を割り当てると、全員に部屋が行き渡るのです。数え方の工夫次第で、無限×無限のお客さんも泊まれます。", "ただし、無限には「大きさの違う無限」もあります。たとえば、0と1の間にある実数（小数で表される数）は、どんなに工夫しても自然数と一対一に対応が付きません。実数のほうが「多い」無限なのです。", "「無限にも種類があるなんて。」ミオは目を輝かせました。無限は「とても大きい数」ではなく、数え方の約束を考える世界の入り口でした。"], "en": ["Mio thought of a harder order. \"What if infinitely many buses arrive, each carrying infinitely many guests?\" What would the manager do then?", "In fact, even that can be done. By numbering the buses and the seats cleverly — counting diagonally, so to speak — every single guest can be assigned a room number. With a good counting scheme, even infinity × infinity guests can stay.", "However, there are also infinities of different sizes. The real numbers between 0 and 1, for example, can never be paired one-to-one with the natural numbers, no matter how cleverly you try. The reals are a \"bigger\" infinity.", "\"Infinity comes in kinds?\" Mio's eyes shone. Infinity was not \"a very big number\", but a doorway into a world where we rethink what counting means."]}, {"ja": ["授業の終わりに、ミオは最初の疑問に戻りました。「満室って、もう入れないことだと思っていました。」", "有限のホテルでは、その通りです。でも無限のホテルでは、「満室」と「もう入れない」が同じ意味になりません。ずれてもらう余地が、いつでも残っているからです。", "「無限を扱うときは、有限の直感が通用しないことがある。」サワダ先生は言いました。「だからこそ、対応を付ける、という約束を大事にするんだ。」", "ミオはノートに書きました。「無限の部屋があるホテルでは、満室でもお客さんを入れられる。その鍵は、一対一対応。」不思議だけれど、筋の通った話でした。"], "en": ["At the end of the lesson, Mio returned to her first question. \"I thought 'full' meant nobody else could get in.\"", "In a finite hotel, that is true. But in the infinite hotel, \"full\" and \"no one else can enter\" are not the same thing — because there is always room to shift.", "\"With infinity, finite intuition sometimes fails,\" said Mr. Sawada. \"That is why we hold on carefully to the agreement of one-to-one pairing.\"", "Mio wrote in her notebook: \"A hotel with infinitely many rooms can welcome guests even when full. The key is one-to-one pairing.\" Strange — but perfectly logical."]}], "column": {"ja": ["無限ホテルの話は、ドイツの数学者ダフィット・ヒルベルトが1924年の講義で語ったとされる、有名な例え話です。無限の性質を、ホテルの部屋の話で誰にでも分かるように示したものでした。", "この話を世界に広めたのは、物理学者ジョージ・ガモフの本『1、2、3、…無限大』（1947年）です。ガモフはヒルベルトの講義の話としてこのホテルを紹介し、多くの読者が無限の不思議に触れました。", "実は、部分と全体が対応してしまう不思議には、もっと早い記録もあります。ガリレオ（第22話に出てきました）は、平方数（1、4、9、16…）が自然数と一対一に対応することに気づき、驚きを書き残しました（1638年の著書）。", "19世紀の終わりには、数学者カントールが、無限にも大きさの違う種類があることを示し、無限を数学の本格的な研究対象にしました。無限ホテルは、その深い世界への、楽しい入り口です。"], "en": ["The story of the infinite hotel is a famous tale said to come from a 1924 lecture by the German mathematician David Hilbert. He used the hotel to show the nature of infinity in a way anyone could picture.", "The story was spread around the world by the physicist George Gamow, in his book \"One, Two, Three… Infinity\" (1947). Gamow introduced the hotel as coming from Hilbert's lecture, and many readers met the wonders of infinity through it.", "Actually, the puzzle of a part matching the whole was noticed much earlier. Galileo (who appeared in Episode 22) saw that the square numbers (1, 4, 9, 16…) can be paired one-to-one with the natural numbers, and wrote down his amazement in a book in 1638.", "At the end of the 19th century, the mathematician Georg Cantor showed that infinities come in different sizes, and made infinity a serious subject of mathematics. The infinite hotel is a joyful doorway into that deep world."]}, "quiz": {"ja": ["Q1．満室の無限ホテルに新しいお客さんが1人来たとき、どうすれば入れられますか。　答え：全員に1部屋ずつずれてもらう（n号室の人はn＋1号室へ）。1号室が空く", "Q2．無限の人数のお客さんが来たときは、どうしますか。　答え：全員に部屋番号を2倍してもらい（n号室の人は2n号室へ）、空いた奇数号室に入ってもらう", "Q3．自然数と偶数は、どちらが多いですか。　答え：どちらも同じだけある。一対一に対応が付く（n↔2n）ので、同じ大きさと考える"], "en": ["Q1. The infinite hotel is full, and one new guest arrives. How can the hotel take them in?　Answer: Ask every guest to move one room up (Room n → Room n + 1); Room 1 becomes free", "Q2. What if infinitely many new guests arrive?　Answer: Ask everyone to double their room number (Room n → Room 2n), and put the new guests into the odd rooms that become free", "Q3. Which are there more of: the natural numbers, or the even numbers?　Answer: The same amount — they pair up one-to-one (n ↔ 2n), so they count as the same size"]}, "corner": {"ja": ["①1人ずつずれる引っ越し：新しいお客さんが1人来たとき、7号室のお客さんは何号室へ引っ越しますか。また、そのとき空く部屋は何号室でしょう（答え：8号室へ引っ越し、空くのは1号室）。", "②2倍の引っ越し：無限のバスのお客さんを迎えるため、全員に部屋番号を2倍してもらいます。5号室の人は何号室へ行きますか。空くのは何号室でしょう（答え：10号室へ。奇数号室がすべて空く）。", "③対応の表を作る：自然数1、2、3、…と偶数2、4、6、…の対応表を、10組まで書いてみましょう。自然数nに対応する偶数を式で書くとどうなりますか（答え：2n）。奇数との対応なら、nに対応するのは 2n－1 です。", "④ひっくり返す工夫：もし新しいお客さんたちが「偶数号室がいい」と言ったらどうしましょう。今のお客さん全員に (2n－1) 号室、つまり奇数号室へ引っ越してもらえば、偶数号室がすべて空きます。仕組みを説明してみましょう。"], "en": ["①Shifting by one: when one new guest arrives, where does the guest in Room 7 move to? And which room becomes free? (Answer: Room 8; Room 1 becomes free.)", "②Doubling: to welcome a bus with infinitely many guests, everyone doubles their room number. Where does the guest in Room 5 go? Which rooms become free? (Answer: Room 10; all the odd rooms become free.)", "③Make a pairing table: write the pairs of natural numbers 1, 2, 3… with even numbers 2, 4, 6…, up to ten pairs. What formula gives the even number paired with n? (Answer: 2n. For odd numbers, n pairs with 2n − 1.)", "④Turn it around: what if the new guests insist on even rooms? Ask the current guests to move to room 2n − 1 — the odd rooms. Then all the even rooms become free. Explain how it works."]}}, {"id": "magnitude", "title": {"ja": "マグニチュード7と6のちがい ― 対数のおはなし", "en": "Magnitude 7 and 6 Are Not \"One Apart\" — A Story of Logarithms"}, "sub": {"ja": "中学生向け・マグニチュードの「1」の違いは、エネルギーの約32倍の違い", "en": "For junior high students — one step on the magnitude scale means about 32 times the energy"}, "cover": "mag1.jpg", "images": ["mag1.jpg", "mag2.jpg", "mag3.jpg", "mag4.jpg", "mag5.jpg", "mag5.jpg"], "pages": [{"ja": ["夕食のとき、テレビのニュースが「マグニチュード7の地震がありました」と伝えました。ユイは首をかしげました。「マグニチュード6と7って、1しか違わないのに、どうしてあんなに大騒ぎするの。」", "おじいちゃんは言いました。「そこが大事なところだ。マグニチュードが1上がると、地震のエネルギーは約32倍になる。7と6では、エネルギーが32倍も違うんだ。」", "「32倍も。1違いなのに。」ユイは驚きました。「1違いに見えるのに実は大違い」という、不思議な目盛りの話が始まります。", "「マグニチュードは、ふつうの物差しとは違う目盛りでできているんだよ。」"], "en": ["At supper, the television news reported, \"There has been an earthquake of magnitude 7.\" Yui frowned. \"Magnitude 6 and 7 are only one apart. Why does everyone make such a fuss?\"", "\"That is exactly the point,\" said Grandfather. \"When the magnitude goes up by 1, the earthquake's energy becomes about 32 times bigger. Between 7 and 6, the energy differs about 32 times.\"", "\"Thirty-two times — for a difference of one?\" Yui was astonished. A story was beginning about a strange scale, where \"a difference of one\" can be an enormous difference in reality.", "\"The magnitude scale is built differently from an ordinary ruler.\""]}, {"ja": ["まず、マグニチュードと震度は違います。震度は、その場所でどれくらい揺れたか。マグニチュードは、地震そのものの大きさ（エネルギーの量）を表す数字です。", "地震のエネルギーは、とても幅が広いものです。小さな地震と大きな地震では、エネルギーが何桁も違います。ふつうの目盛りで書くと、大きな地震の数字は天文学的な大きさになってしまいます。", "そこでマグニチュードは、「対数」という目盛りを使います。マグニチュードが1上がるごとに、エネルギーは約32倍になります。2上がれば、32×32で約1000倍です。", "たとえば、マグニチュード5と7では、エネルギーは約1000倍違います。「1」という数字の裏に、大きな掛け算が隠れているのです。"], "en": ["First, magnitude and seismic intensity are different things. Intensity describes how strongly a particular place shook. Magnitude is a number for the size of the earthquake itself — the amount of energy it released.", "Earthquake energies span an enormous range. The energies of small and great earthquakes differ by many digits. On an ordinary scale, the numbers for great earthquakes would become astronomically large.", "So magnitude uses a scale called a \"logarithmic\" scale. Each time the magnitude rises by 1, the energy becomes about 32 times bigger. Rise by 2, and it is 32 × 32 — about 1000 times.", "For example, magnitudes 5 and 7 differ in energy by about 1000 times. Behind the little number \"1\" hides a very large multiplication."]}, {"ja": ["対数の目盛りは、「掛け算の世界を、足し算のものさしで測る」工夫です。目盛りの数字は1、2、3と足し算で増えますが、表している量のほうは、同じ倍率で掛け算のように増えていきます。", "階段にたとえてみましょう。1段上がる（数字が1増える）ごとに、エネルギーは約32倍。段を数えるのは足し算でも、高さの伸び方は掛け算なのです。", "この工夫のおかげで、小さな地震から巨大な地震までを、0から10くらいまでの扱いやすい数字で表せます。", "「目盛りの数字と、本当の量の増え方は、別物なんだね。」ユイが言うと、おじいちゃんは頷きました。「対数の目盛りを見るときは、そこを間違えちゃいけない。」"], "en": ["A logarithmic scale is a device for \"measuring a world of multiplication with a ruler of addition\". The numbers on the scale grow by adding — 1, 2, 3 — but the amounts they stand for grow by multiplying, always by the same factor.", "Think of a staircase. Each step up (the number rises by 1) makes the energy about 32 times bigger. Counting steps is addition, but the height grows by multiplication.", "Thanks to this device, everything from tiny earthquakes to gigantic ones fits into handy numbers between about 0 and 10.", "\"So the numbers on the scale and the real amounts grow in different ways,\" said Yui. Grandfather nodded. \"With a logarithmic scale, never confuse the two.\""]}, {"ja": ["対数の目盛りは、身の回りにもあります。音の大きさを表す「デシベル」もそうです。10デシベル上がると、音のエネルギーは10倍になります。40デシベルと70デシベルでは、30の違いで、音のエネルギーは1000倍違います。", "星の明るさの「等級」も対数の目盛りです。1等星と6等星では、明るさが約100倍違います。5段階の違いで100倍ですから、1段階では約2.5倍の違いです。昔の人が肉眼で分けた等級が、実は掛け算の目盛りになっていたのです。", "人の感覚そのものも、対数に近いと言われています。音も光も、「何倍になったか」で感じやすいからです。", "「マグニチュードだけじゃなかったんだ。」ユイは身の回りの数字を見直しました。"], "en": ["Logarithmic scales live all around us. The decibel, which measures sound, is one. When sound rises by 10 decibels, its energy becomes 10 times bigger. Between 40 and 70 decibels — a difference of 30 — the sound energy differs 1000 times.", "The magnitude of stars is another logarithmic scale. A 1st-magnitude star and a 6th-magnitude star differ in brightness by about 100 times. Five steps make 100 times, so each single step is about 2.5 times. The old astronomers' grades, made by naked eye, turned out to be a multiplication scale.", "Even our own senses are said to work almost logarithmically. We tend to feel sound and light \"by how many times bigger\" they became.", "\"It isn't only earthquakes,\" said Yui, looking at the numbers around her with new eyes."]}, {"ja": ["対数の考え方の芯は、指数（累乗）にあります。100は10の2乗、1000は10の3乗と書けます。100×1000＝100000は、10の（2＋3）乗、つまり10の5乗です。", "掛け算が、指数のほうでは足し算になりました。「10の何乗か」という数字を取り出すことが、対数の役目です。マグニチュードの目盛りも、エネルギーを「10の何乗くらいか」で数えたものなのです。", "マグニチュード1の違いでエネルギーが約32倍になるのは、32が「10の1.5乗」だからです。10の1.5乗は約31.6、つまり約32。目盛りが0.5違うだけでも、エネルギーは10の（1.5×0.5）乗、つまり10の0.75乗で約5.6倍になります。", "数字が少し動くだけで、量はぐんと動く。それが対数の目盛りの特徴です。"], "en": ["At the heart of logarithms are powers (exponents). 100 is 10 to the power 2, and 1000 is 10 to the power 3. And 100 × 1000 = 100,000 is 10 to the power (2 + 3) — that is, 10 to the power 5.", "The multiplication became an addition up in the exponents. The job of a logarithm is to pick out that number — \"10 to the power of what?\" The magnitude scale, too, counts energy by roughly \"10 to the power of what\".", "The reason one step of magnitude means about 32 times the energy is that 32 is \"10 to the power 1.5\". Ten to the power 1.5 is about 31.6 — about 32. Even half a step, 0.5, means 10 to the power (1.5 × 0.5) = 10 to the power 0.75, about 5.6 times the energy.", "A small move in the number makes the amount leap. That is the character of a logarithmic scale."]}, {"ja": ["ユイは、ニュースの数字をもう一度見てみました。「マグニチュード9と7の違いは、2の違い。でもエネルギーは約1000倍なんだ。」", "「その通り。『1違い』や『2違い』という言葉に、だまされちゃいけない。目盛りの種類を見分けることが大事だよ。」おじいちゃんは言いました。", "足し算の目盛り（長さや重さのふつうの物差し）と、掛け算の目盛り（対数の物差し）。世の中の数字には、この2種類があります。", "「数字を見たら、まず『どちらの物差しかな』って考える。」ユイはノートに書きました。数字の見方が、少し変わった夜でした。"], "en": ["Yui looked at the news numbers once more. \"Magnitude 9 and 7 differ by 2. But the energy differs by about 1000 times.\"", "\"Exactly. Don't be fooled by the words 'one apart' or 'two apart'. What matters is which kind of scale the number lives on,\" said Grandfather.", "There are two kinds of scales in the world: the addition kind (ordinary rulers for length and weight) and the multiplication kind (logarithmic rulers).", "\"When I see a number, first I'll ask: which ruler is it on?\" Yui wrote in her notebook. It was an evening that changed how numbers looked."]}], "column": {"ja": ["対数を発明したのは、スコットランドの数学者ジョン・ネイピアです。1614年に対数の本を発表しました。当時、天文学の計算では、大きな数の掛け算や割り算が大変な負担でした。", "ネイピアは約20年をかけて、掛け算を足し算に変える道具、対数を作りました。あらかじめ対数の表を用意しておけば、大きな数の掛け算は、表を引いて足し算をするだけで済むのです。", "イギリスのブリッグスは、10を底とする「常用対数」の表を整えました。その後、対数を使った計算尺は、電卓が広まるまで約350年間、技術者の計算の相棒でした。", "フランスの数学者ラプラスは、対数のおかげで計算の手間が減り「天文学者の寿命が延びた」という趣旨の言葉を残したと言われています。対数は、計算を助ける道具から、マグニチュードのような「量の目盛り」へと姿を変えて、今も生きているのです。"], "en": ["The inventor of logarithms was the Scottish mathematician John Napier, who published his book on logarithms in 1614. In those days, astronomy required endless multiplications and divisions of very large numbers — a heavy burden.", "Napier spent about twenty years creating logarithms: a tool that turns multiplication into addition. With logarithm tables prepared in advance, multiplying large numbers became just a matter of looking up numbers and adding them.", "The English mathematician Henry Briggs then built tables of \"common logarithms\", base 10. After that, the slide rule — a ruler based on logarithms — served as engineers' calculating companion for about 350 years, until calculators spread.", "The French mathematician Laplace is said to have remarked that, by shortening the labour of calculation, logarithms had extended the life of astronomers. Logarithms changed their role from a calculating tool into a \"scale for quantities\" like magnitude — and they are alive today."]}, "quiz": {"ja": ["Q1．マグニチュード7の地震のエネルギーは、マグニチュード6の約何倍ですか。　答え：約32倍（マグニチュードが1上がるとエネルギーは約32倍）", "Q2．マグニチュード8の地震のエネルギーは、マグニチュード6の約何倍ですか。　答え：約1000倍（32×32＝1024で、約1000倍）", "Q3．音の大きさが10デシベル上がると、音のエネルギーは約何倍になりますか。　答え：約10倍"], "en": ["Q1. About how many times more energy does a magnitude 7 earthquake have than a magnitude 6?　Answer: About 32 times (each +1 of magnitude multiplies the energy by about 32)", "Q2. About how many times more energy does a magnitude 8 earthquake have than a magnitude 6?　Answer: About 1000 times (32 × 32 = 1024, about 1000)", "Q3. If a sound becomes 10 decibels louder, about how many times more energy does it have?　Answer: About 10 times"]}, "corner": {"ja": ["①マグニチュードの計算：マグニチュードが2上がると、エネルギーは約32×32＝約1000倍です。では、マグニチュード9は6の約何倍でしょう。3上がるので、32×32×32＝32768、約3万倍です。自分でも計算してみましょう。", "②デシベルの計算：音は10デシベル上がるごとにエネルギーが10倍です。30デシベルの違い（たとえば40デシベルと70デシベル）では、10×10×10＝1000倍になります。20デシベルの違いでは何倍でしょう（答え：100倍）。", "③星の等級：等級が5違うと明るさは約100倍、1違うと約2.5倍です。2.5を5回掛けると 2.5⁵≒97.7 で、ほぼ100になることを電卓で確かめてみましょう。", "④対数の目盛りを作る：1、10、100、1000、10000という数に、「10の何乗か」の数字（0、1、2、3、4）を対応させてみましょう。これが対数の目盛りの正体です。間の数、たとえば30は、10の1乗と2乗の間のどこに来るでしょう。"], "en": ["①Magnitude arithmetic: when magnitude rises by 2, energy becomes about 32 × 32 = about 1000 times. Then how many times bigger is magnitude 9 than magnitude 6? Three steps up: 32 × 32 × 32 = 32,768 — about 30,000 times. Try the calculation yourself.", "②Decibel arithmetic: every 10 decibels multiplies sound energy by 10. A difference of 30 decibels (say, 40 and 70) makes 10 × 10 × 10 = 1000 times. What about a difference of 20 decibels? (Answer: 100 times.)", "③Star magnitudes: five steps of magnitude mean about 100 times the brightness, and one step is about 2.5 times. Use a calculator to check that 2.5 multiplied by itself five times, 2.5⁵ ≈ 97.7, is almost 100.", "④Build a logarithmic scale: match the numbers 1, 10, 100, 1000, 10000 with \"10 to the power of what\" — 0, 1, 2, 3, 4. That matching is exactly what a logarithm is. Where would 30 fall, between 10 to the power 1 and 10 to the power 2?"]}}, {"id": "impossible", "title": {"ja": "ありえない形のおはなし ― 絵には描けるのに、作れない形", "en": "Shapes That Cannot Be ― A Story of Impossible Figures"}, "sub": {"ja": "小学校高学年〜中学生向け・部分は正しいのに、全体が成り立たない", "en": "For upper elementary and junior high — every part looks right, yet the whole cannot exist"}, "cover": "imp1.jpg", "images": ["imp1.jpg", "imp2.jpg", "imp3.jpg", "imp4.jpg", "imp5.jpg", "imp6.jpg"], "pages": [{"ja": ["休みの日、ユイはおじいちゃんと、小さな展覧会に行きました。入口の看板には「ふしぎな絵の世界」と書いてあります。最初の部屋の壁には、れんがでできた大きな三角形の絵がかかっていました。", "絵の中では、小さな子どもたちが三角形の上を歩いています。ユイが指でなぞると、不思議なことに気づきました。坂を上って、角を曲がって、また上って……ぐるっと一周すると、始めた場所に戻ってくるのに、一度も下り坂がないのです。", "隣の絵は、草原の三角形です。こちらも同じ形で、歩く人は永遠に上り続けることができます。「おじいちゃん、この三角形、ほんとうに作れるの。」", "おじいちゃんはにやりと笑いました。「絵には描ける。でも、現実の世界では絶対に作れない形なんだ。これを『ありえない形』と言うんだよ。」"], "en": ["On a day off, Yui went with her grandfather to a small exhibition. The sign at the entrance said \"The World of Strange Pictures.\" On the wall of the first room hung a picture of a big triangle made of bricks.", "In the picture, small children were walking on top of the triangle. Tracing it with her finger, Yui noticed something odd. You climb a slope, turn a corner, climb again — and when you come all the way around, you are back where you started, without ever going downhill once.", "The next picture was a triangle in a grassy field. It had the same shape, and the people walking on it could climb forever. \"Grandpa, could anyone really build this triangle?\"", "Her grandfather grinned. \"You can draw it in a picture. But in the real world, it can never be built. Shapes like this are called impossible figures.\""]}, {"ja": ["次の部屋には、作れそうで作れない「物」の絵が並んでいました。三本の丸太の絵は、近くの端を見ると丸いのに、遠くの端は四角く見えます。途中を手で隠すと、どちらも普通の丸太に見えるのに、全体を見るとつながり方がおかしいのです。", "「音叉みたいな形を見てごらん。」丸い棒が3本並んで始まったはずの道具が、下のほうでは平たい足2本に変わっています。数え直しても、3本が2本に化ける場所が見つかりません。", "サイコロの絵も変でした。手前にあるはずの面が、同時に向こう側にもあるように見えます。どの面も、単独で見れば普通のサイコロの面なのに、組み合わせるとありえないのです。", "「部分だけ見ると、全部正しいんだ。」おじいちゃんは言いました。「おかしくなるのは、全体をまとめようとしたときだけだ。」"], "en": ["The next room held pictures of \"things\" that look buildable but are not. In the picture of three logs, the near end looks round, yet the far end looks square. Cover the middle with your hand and each part looks like an ordinary log — but seen as a whole, they join in an impossible way.", "\"Look at this tool, like a tuning fork.\" It begins with three round bars standing side by side, but lower down it turns into just two flat legs. Count as often as you like — you cannot find the place where three bars changed into two.", "The dice picture was strange too. A face that ought to be in front seems to be on the far side at the same time. Every face, seen alone, is an ordinary dice face; put them together and the dice cannot exist.", "\"Look at any single part, and everything is correct,\" said her grandfather. \"It only goes wrong when you try to put the whole together.\""]}, {"ja": ["三つ目の部屋は、箱と家の絵です。木の箱の絵は、角の線をたどると、内側にあるはずの角が外側に出てきたり、外側の角が中に入ったりします。指でたどるたびに、箱の「表」と「裏」が入れ替わってしまうのです。", "窓のある小さな家の絵も、じっと見ていると変なことが起きます。今まで手前に見えた壁が、まばたきした瞬間に、向こう側の壁に変わります。絵は何も変わっていないのに、見え方がひっくり返るのです。", "「これはネッカーの立方体という仕掛けに似ている。」おじいちゃんは言いました。「目と脳は、絵の中の少ない手がかりから奥行きを決めている。その決め方が2通りある絵だと、見え方が行ったり来たりするんだ。」", "ユイは何度もまばたきをして、「ほんとだ、壁が入れ替わる」と笑いました。目は正直なようで、意外とあいまいな決め方をしているようです。"], "en": ["The third room held pictures of a box and a house. In the picture of the wooden box, if you follow the lines of the corners, a corner that should be inside comes outside, and an outside corner slips in. Every time you trace it, the box's \"front\" and \"back\" trade places.", "The little house with windows played a trick too, if you kept looking at it. A wall that seemed to be the near wall suddenly, in the blink of an eye, became the far wall. The picture had not changed at all — only the way of seeing had flipped.", "\"This works like the trick called the Necker cube,\" said her grandfather. \"Our eyes and brain decide depth from only a few clues in a picture. When a picture allows two ways of deciding, the view flips back and forth.\"", "Yui blinked again and again and laughed. \"It's true — the walls keep swapping!\" Our eyes seem honest, but their way of deciding is surprisingly vague."]}, {"ja": ["四つ目の部屋は、水の絵でした。「めぐる水路」の絵では、水が高いところから低いところへ流れ落ち、たまった水がまた高いところに戻って、ぐるぐる循環しています。よく見ると、水が自分で坂を上っている場所があるのです。", "滝と水車の絵も同じでした。滝の水が水車を回し、流れた水は水路を伝って、なぜか滝の上まで戻っていきます。この絵の通りなら、水車は誰もいなくても永遠に回り続けるはずです。", "「でも、現実にはできない。」おじいちゃんは言いました。「水は、ひとりでに低いところから高いところへは行けないからね。絵だからこそ、水に無理な仕事をさせられるんだ。」", "ユイは水路を指でたどりました。一か所ずつは全部ゆるやかな下り坂に見えるのに、全体では上り坂になっている。その「一か所ずつ」のだまし方が、この形の芯でした。"], "en": ["The fourth room held pictures of water. In \"The Circling Waterway,\" water flows down from a high place to a low one, and the collected water returns to the high place and circles around. Look closely, and there is a place where the water climbs a slope all by itself.", "The waterfall and waterwheel picture was the same. The falling water turns the wheel, and the water that flowed away travels along a channel and somehow returns to the top of the falls. If this picture were real, the wheel would turn forever with no one helping.", "\"But in reality it cannot be done,\" said her grandfather. \"Water cannot go from a low place to a high place by itself. Only in a picture can water be given impossible work.\"", "Yui traced the channel with her finger. Each single stretch looked like a gentle downhill slope, yet the whole channel climbed. That trick of \"one stretch at a time\" was the heart of these shapes."]}, {"ja": ["五つ目の部屋は、建物の絵です。「石のかいろう」は、柱とアーチの回廊が輪になっていて、歩いても歩いても同じ景色が続きます。どの柱も立派な石造りで、部分だけ見れば立派な建物です。", "「のぼってものぼっても」の絵は、階段の輪です。子どもたちが階段を上り続けています。一段ずつ確かに上っているのに、いくら上っても出発した高さから離れられません。階段の終わりが、始まりにつながっているのです。", "「この階段は、ペンローズの階段と呼ばれている。」おじいちゃんは言いました。「上るという部分の約束と、輪になるという全体の約束が、絵の中では両立してしまうんだ。」同じ部屋には、水路の輪と石橋の輪が逆向きに編み込まれた「二重の輪」の絵もあり、2つの輪がほどけないように組み合わさっていました。", "もし現実にこの階段があったら、永遠に上り続けられるのに永遠に疲れるだけです。ユイは「作れなくてよかった」と思いました。"], "en": ["The fifth room held pictures of buildings. \"The Stone Corridor\" is a ring of pillars and arches; walk as long as you like and the same view continues. Every pillar is fine stonework, and any part alone looks like a splendid building.", "The picture called \"Climbing and Climbing\" is a ring of stairs. Children climb and climb. Each step truly goes up, yet no amount of climbing takes them away from the height where they began. The end of the stairs joins their beginning.", "\"These stairs are called the Penrose stairs,\" said her grandfather. \"The promise of each part — always going up — and the promise of the whole — forming a ring — can both be kept inside a picture.\" In the same room hung a picture of a double ring, too — a waterway ring and a stone-bridge ring woven together in opposite directions, joined so they could never come apart.", "If such stairs really existed, you could climb forever and only get tired. Yui thought, \"I'm glad they can't be built.\""]}, {"ja": ["最後の部屋には、いちばん不思議な絵が集まっていました。「三つの重力の庭」では、3つの向きに立つ人たちが同じ庭にいます。ある人の「下」は、別の人の「横」なのです。", "「ひっくりかえった小さな星」の絵では、星の内側と外側が入れ替わり、「いつまでもつかない汽車」の絵では、汽車が輪になった線路を走り続けます。五角形の形をした「ありえない五角形」もありました。大きな木の輪の中に小さな輪が入った「輪のなかの輪」と、空に浮かぶ島のまわりを線路の輪がめぐる絵も、この部屋の人気者でした。", "「どの絵も、部分だけ見ると正しいのに、全体では成り立たない。」おじいちゃんはまとめました。「私たちの目は、全体を一度に見るのではなく、部分ごとに判断している。だから絵は、その判断のすき間を使って、私たちをだませるんだ。」", "作れないと分かることも、立派な発見です。ユイは展覧会を出るとき、思いました。「作れない理由が分かるって、作るのと同じくらい面白い。」"], "en": ["The last room gathered the strangest pictures of all. In \"The Garden of Three Gravities,\" people stand in three different directions in the same garden. One person's \"down\" is another person's \"sideways.\"", "In \"The Little Upside-Down Star,\" the inside and outside of a star trade places, and in \"The Train That Never Arrives,\" a train runs forever on a loop of track. There was also an \"impossible pentagon,\" a five-sided shape. A ring within a ring — a small wooden ring inside a big one — and a ring of railway track circling an island that floats in the sky were also favourites in this room.", "\"Every picture looks right in its parts, yet the whole cannot stand,\" her grandfather summed up. \"Our eyes do not see the whole at once — they judge it part by part. That is why a picture can fool us through the gaps in that judging.\"", "Knowing that something cannot be built is a real discovery, too. Leaving the exhibition, Yui thought, \"Understanding why it can't be built is just as interesting as building it.\""]}], "column": {"ja": ["「ありえない三角形」を最初に描いたのは、スウェーデンの芸術家オスカー・ロイテルスバルトだと言われています。1934年のことでした。誰も作れないはずの三角形を、絵の中ではっきりと描いてみせたのです。", "その後、1950年代にイギリスで、精神科医のライオネル・ペンローズと、数学者・物理学者の息子ロジャーが、「ありえない三角形」と「終わらない階段」を論文で発表しました。ロジャー・ペンローズは後に、ブラックホールの研究でノーベル物理学賞を受けています。", "オランダの版画家エッシャーは、ペンローズ親子の仕事に刺激を受けて、「滝」（1961年）や「上昇と下降」（1960年）という版画を作りました。親子はエッシャーのファンでもあり、両者の間には手紙のやり取りもあったそうです。", "ありえない形は、今ではトリックアートの展示や、映画・ゲームの美術にも使われています。絵には描けるのに物は作れない。その境目を考えることが、目と脳の仕組みを知る手がかりにもなっているのです。"], "en": ["The first impossible triangle is said to have been drawn by a Swedish artist, Oscar Reutersvärd, in 1934. He drew, clearly and boldly in a picture, a triangle that nobody could ever build.", "Later, in the 1950s in England, a psychiatrist, Lionel Penrose, and his son Roger, a mathematician and physicist, published the \"impossible triangle\" and the \"endless stairs\" in a scientific paper. Roger Penrose later received the Nobel Prize in Physics for his work on black holes.", "The Dutch printmaker M. C. Escher, inspired by the work of the two Penroses, made the prints \"Waterfall\" (1961) and \"Ascending and Descending\" (1960). The Penroses were admirers of Escher, and letters passed between them.", "Impossible figures are now used in trick-art exhibitions and in the art of films and games. They can be drawn but never built — thinking carefully about that boundary teaches us how our eyes and brains work."]}, "quiz": {"ja": ["Q1 ペンローズの階段を上り続けると、どうなりますか。　答え：一段ずつ上っているのに、出発した場所と同じ高さに戻ってきてしまいます（永遠に上り続けられる絵になっています）。", "Q2 「ありえない形」が絵に描けるのは、なぜですか。　答え：私たちの目は、絵を部分ごとに別々に判断しているので、部分がそれぞれ正しく見えれば、全体のおかしさに気づきにくいからです。", "Q3 「ありえない三角形」を最初に描いたと言われるのは、誰ですか。　答え：スウェーデンの芸術家、オスカー・ロイテルスバルトです（1934年）。"], "en": ["Q1 What happens if you keep climbing the Penrose stairs?　Answer: Although every step goes up, you come back to the same height where you started (the picture lets you climb forever).", "Q2 Why can impossible figures be drawn in pictures?　Answer: Because our eyes judge a picture part by part; if each part looks correct on its own, we hardly notice that the whole is wrong.", "Q3 Who is said to have drawn the first \"impossible triangle\"?　Answer: A Swedish artist, Oscar Reutersvärd (in 1934)."]}, "corner": {"ja": ["近くのものを大きく、遠くのものを小さく撮る「トリック写真」に挑戦しましょう。もっと本格的には、厚紙で「なんちゃってペンローズの三角形」を作れます。ある決まった角度から見たときだけ三角形が閉じて見える形を紙で作り、写真に撮ると、本物そっくりに見えます。見る角度を少しでもずらすと、形がばらばらに崩れるのが面白いところです。", "絵の中の梁（はり）や柱を、指でゆっくりたどってみましょう。一方の端から出発して、もう一方の端までたどり、「ここで床と壁が入れ替わった」という場所に印をつけます。ありえない形は、「部分は正しいのに全体がおかしい」ので、おかしくなる場所が1か所に決まらないのが特徴です。", "ネッカーの立方体（線だけで描いた立方体）を自分で描いて、じっと見つめてみましょう。数秒ごとに、手前の面と奥の面が入れ替わって見えます。30秒の間に何回入れ替わるか数えると、自分の目の「決め方」が切り替わる速さが分かります。", "最後に、ありえない立方体を自分で写し描きしてみましょう。一つの角ずつ丁寧に描くと、最後の角で必ずつじつまが合わなくなります。「どこで間違えたのか」が見つからないことこそ、この形の不思議さです。間違えた場所を探す遊びとして、友だちと見せ合うのも楽しいですよ。"], "en": ["Try trick photography first: make near things huge and far things small. For something more ambitious, build a \"cheating Penrose triangle\" from thick paper — a shape that closes into a triangle only when seen from one exact angle — and photograph it. It looks completely real. Shift the angle a little, and the shape falls apart in a most amusing way.", "Trace a beam or a pillar in a picture slowly with your finger. Start at one end, follow it to the other, and mark the place where \"the floor and the wall traded places.\" With impossible figures, there is never just one wrong place — that is their special character.", "Draw a Necker cube — a cube drawn with lines only — and stare at it. Every few seconds, the front face and the back face trade places. Count how many times it flips in 30 seconds, and you learn how quickly your own eyes switch their way of deciding.", "Finally, try copying an impossible cube yourself. Draw it carefully, one corner at a time, and at the last corner the drawing will refuse to agree. Not being able to find \"where you went wrong\" is exactly the wonder of these shapes. Showing your attempts to friends and hunting for the mistake together is a fine game."]}}, {"id": "twins", "title": {"ja": "ふたごの素数をさがして ― 双子素数のおはなし", "en": "Searching for Twin Primes ― A Story of Prime Pairs"}, "sub": {"ja": "小学校高学年〜中学生向け・差が2の素数のペアは、無限にあるの？", "en": "For upper elementary and junior high — do prime pairs with a difference of 2 go on forever?"}, "cover": "twi1.jpg", "images": ["twi1.jpg", "twi2.jpg", "twi3.jpg", "twi4.jpg", "twi5.jpg", "twi5.jpg"], "pages": [{"ja": ["算数の時間、サワダ先生は黒板に素数を並べて書きました。2、3、5、7、11、13、17、19……。素数とは、1と自分自身でしか割り切れない数のことです。", "ミオは並んだ数を見ていて、あることに気づきました。「先生、3と5、5と7って、くっついている素数があります。」差が2しかない素数のペアが、ところどころにあるのです。", "「よく見つけたね。」先生は言いました。「差が2の素数のペアを『双子素数』と言うんだよ。まるで双子のきょうだいみたいに、並んで生まれてくるんだ。」", "「双子素数かあ。」ミオは目を輝かせました。「この双子、ずっと先までいるのかな。」双子素数を探す旅が始まります。"], "en": ["In maths class, Mr. Sawada wrote the prime numbers on the board. 2, 3, 5, 7, 11, 13, 17, 19… A prime is a number that can be divided only by 1 and by itself.", "Looking at the row of numbers, Mio noticed something. \"Teacher, some primes are stuck together — 3 and 5, and 5 and 7.\" Here and there were pairs of primes whose difference was only 2.", "\"Good spotting,\" said the teacher. \"A pair of primes with a difference of 2 is called a twin prime pair. They are born side by side, like twin brothers and sisters.\"", "\"Twin primes,\" said Mio, her eyes shining. \"Do the twins keep appearing, far, far ahead?\" The search for twin primes begins."]}, {"ja": ["まず、100までの素数を全部探すことにしました。昔のギリシャの数学者エラトステネスが考えた「ふるい」という方法を使います。2の倍数を消し、3の倍数を消し……と、合成数を次々に消していくと、残った数が素数です。", "100までの素数は25個ありました。その中から、差が2のペアを探します。3と5、5と7、11と13、17と19、29と31、41と43、59と61、71と73。ぜんぶで8組の双子が見つかりました。", "「5は、2つの組に出てくるね。」ミオが言いました。5は、3と5の組と、5と7の組の両方に入っているのです。「双子の真ん中になることもあるんだ。」", "8組も見つかると、双子は簡単には途切れなさそうに思えました。でも、数が大きくなるにつれて、素数そのものがまばらになっていきます。双子はこの先も現れるのでしょうか。"], "en": ["First, they hunted for all the primes up to 100, using the \"sieve\" invented long ago by the Greek mathematician Eratosthenes. Cross out the multiples of 2, then the multiples of 3, and so on — the numbers left standing are the primes.", "There were 25 primes up to 100. From them, they searched for pairs with a difference of 2: 3 and 5, 5 and 7, 11 and 13, 17 and 19, 29 and 31, 41 and 43, 59 and 61, 71 and 73. Eight twin pairs in all.", "\"Five appears in two pairs,\" said Mio. Five belongs both to the pair 3 and 5, and to the pair 5 and 7. \"It can be the middle of two twins.\"", "With eight pairs found, the twins did not look likely to stop. But as numbers grow, primes themselves become rarer. Would the twins keep appearing?"]}, {"ja": ["100から200の間も探してみました。101と103、107と109、137と139、149と151、179と181、191と193、197と199。7組の双子が見つかりましたが、100までの8組より、間隔が広くなった気がします。", "素数は、数が大きくなるほど現れにくくなります。双子素数は、まばらになる素数の中で、さらに「となり同士」という条件が付くので、もっと見つけにくくなるはずです。", "「それでも、7組もいた。」ミオはノートに書きました。「双子は、減りながらも、ちゃんと現れる。」", "先生は言いました。「コンピュータで探すと、何十万桁もある、巨大な双子素数も見つかっているよ。でもね、『たくさん見つかる』ことと、『無限にあると証明できる』ことは、まったく別なんだ。」"], "en": ["They searched between 100 and 200 as well: 101 and 103, 107 and 109, 137 and 139, 149 and 151, 179 and 181, 191 and 193, 197 and 199. Seven pairs were found, but the gaps between pairs felt wider than below 100.", "Primes appear less and less often as numbers grow. Twin primes need not only a prime, but a neighbour prime as well — so they should be even harder to find.", "\"Still, seven pairs were there,\" Mio wrote in her notebook. \"The twins grow fewer, but they do appear.\"", "The teacher said, \"With computers, people have found enormous twin primes with hundreds of thousands of digits. But 'finding many' and 'proving there are infinitely many' are completely different things.\""]}, {"ja": ["双子を探しているうちに、ミオは別の疑問を持ちました。「3と5と7みたいな、3つ並んだ組はないの。」", "調べてみると、差が2ずつの3つ組は、3と5と7の組だけでした。5と7の次は9ですが、9は3で割り切れるので素数ではありません。7と9の組も、そもそも始まりません。", "その理由は、考えると分かります。差が2ずつ並んだ3つの奇数があると、そのうちのどれか1つは、必ず3の倍数になるのです。3の倍数で素数なのは3だけですから、3つ組ができるのは「3、5、7」のときだけなのです。", "「小さい発見だけど、ちゃんと証明できた。」ミオは満足しました。「でも、双子が無限にいるかどうかは、まだ誰にも証明できていない大きな問題なんだよ。」先生の言葉に、ミオは驚きました。"], "en": ["While hunting for twins, Mio came up with another question. \"Is there a set of three in a row, like 3, 5 and 7?\"", "Checking showed that the only set of three primes spaced by 2 is 3, 5 and 7. After 5 and 7 comes 9, but 9 is divisible by 3, so it is not prime. The set starting at 7 cannot even begin.", "The reason becomes clear if you think. Among any three odd numbers spaced by 2, one of them is always a multiple of 3. The only multiple of 3 that is prime is 3 itself — so the set of three can happen only as \"3, 5, 7.\"", "\"A small discovery, but a real proof,\" said Mio with satisfaction. \"But whether the twins themselves go on forever — that is a big problem nobody has proved yet,\" said the teacher, and Mio was astonished."]}, {"ja": ["「双子素数が無限にあるのではないか」という予想は、『双子素数予想』と呼ばれています。何百年もの間、たくさんの数学者が挑戦しましたが、今もまだ、誰も証明できていません。これは、はっきり言えることです。予想は予想のままで、正しいかどうか、まだ分かっていないのです。", "コンピュータでいくら大きな双子を見つけても、それは「ここまではあった」という記録にすぎません。無限に続くことを示すには、終わりのない証明が必要なのです。", "「見つけることと、証明することは、こんなに違うんだ。」ミオは言いました。「双子が無限にいるかどうかは、今の世界の誰も知らないんだね。」", "分からないことがある、と正直に知ることも、数学の大事な一歩です。でも、まったく手がかりがないわけではありませんでした。"], "en": ["The guess that there are infinitely many twin primes is called the twin prime conjecture. For hundreds of years, many mathematicians have attacked it, and even now, nobody has proved it. This much can be said plainly: the guess is still a guess, and we do not yet know whether it is true.", "However many giant twins a computer finds, each is only a record that says \"they existed up to here.\" To show something continues forever, a proof without end is needed.", "\"Finding and proving are so different,\" said Mio. \"So nobody in the world knows yet whether the twins go on forever.\"", "Knowing honestly that we do not know is an important step in mathematics, too. But it was not true that there were no clues at all."]}, {"ja": ["2013年、アメリカで研究をしていた数学者チャン・イータン（張益唐）が、大きな一歩を発表しました。「差が7,000万以内の素数のペアなら、無限にたくさんある」ことを証明したのです。双子（差が2）ではないけれど、「近いペアが無限にある」ことが初めて示されました。", "その後、世界中の数学者がインターネットで協力する「ポリマス」という計画で、この差はどんどん狭められました。今では、「差が246以内の素数のペアは無限にある」ところまで証明できています。246から2までの距離は、まだ残された謎です。", "「246から2へ。これが、今の数学の最先端なんだ。」先生は言いました。「いつか、この本を読んでいる誰かが、最後の橋を架けるかもしれないね。」", "ミオは夜空を見上げました。寄り添う2つの星のように、双子素数もどこまでも続いている。そう信じたい気持ちと、「まだ分からない」という正直さの両方を、ミオは胸にしまいました。"], "en": ["In 2013, a mathematician working in America, Yitang Zhang, announced a great step. He proved that there are infinitely many pairs of primes with a gap of 70 million or less. Not twins with a gap of 2 — but for the first time, \"close pairs, infinitely many\" was shown to be true.", "After that, mathematicians around the world cooperated on the internet in a project called Polymath, and the gap was narrowed again and again. By now, it is proved that there are infinitely many prime pairs with a gap of 246 or less. The distance from 246 to 2 is the mystery that remains.", "\"From 246 to 2. That is the frontier of mathematics today,\" said the teacher. \"Someday, someone reading this book may build the last bridge.\"", "Mio looked up at the night sky. Like two stars shining side by side, the twin primes surely continue somewhere far away. She kept in her heart both the wish to believe it, and the honesty to say, \"We do not know yet.\""]}], "column": {"ja": ["素数が無限にあることは、今から約2,300年前、ギリシャの数学者ユークリッドが証明しました。どんなに大きな素数を見つけても、それより先にまた素数がある。素数の列に終わりはないのです。", "ところが、双子のように「近い素数のペア」が無限にあるかは、ずっと難しい問題でした。問題の形は小学生にも分かるほど簡単なのに、何百年も解けなかったのです。", "2013年、それまで目立たない存在だった58歳の数学者チャン・イータンが、「差が7,000万以内のペアは無限にある」ことを証明し、世界中を驚かせました。大きな問題に、初めて風穴が開いたのです。", "その後、テレンス・タオたちが始めたオンライン共同研究「ポリマス計画」で、差は246まで狭められました（2014年）。246から2への最後の道のりは、今も世界中の数学者が挑戦中です。"], "en": ["That there are infinitely many primes was proved about 2,300 years ago by the Greek mathematician Euclid. However large a prime you find, there is always another beyond it. The row of primes has no end.", "But whether \"close pairs\" of primes, like twins, are infinite too was a far harder problem. The question is simple enough for a schoolchild to understand, yet it stayed unsolved for hundreds of years.", "In 2013, Yitang Zhang, a 58-year-old mathematician who had been little known, proved that there are infinitely many prime pairs with a gap of 70 million or less, and surprised the whole world. For the first time, the great problem had been opened.", "After that, in the online collaboration called the Polymath project, begun by Terence Tao and others, the gap was narrowed to 246 (by 2014). The last road from 246 to 2 is still being challenged by mathematicians everywhere."]}, "quiz": {"ja": ["Q1 100までの双子素数は、何組ありますか。　答え：8組です（3と5、5と7、11と13、17と19、29と31、41と43、59と61、71と73）。", "Q2 差が2ずつ並んだ素数の3つ組が「3、5、7」だけなのは、なぜですか。　答え：差が2ずつ並ぶ3つの奇数のうち、どれか1つは必ず3の倍数になるからです。3の倍数で素数なのは3だけなので、3つ組は「3、5、7」のときだけできます。", "Q3 双子素数について、今の数学で証明できていることは何ですか。　答え：「差が246以内の素数のペアは無限にある」ことまで証明できています。差が2のペア（双子素数）が無限にあるかどうかは、まだ証明できていません。"], "en": ["Q1 How many twin prime pairs are there up to 100?　Answer: 8 pairs (3 and 5, 5 and 7, 11 and 13, 17 and 19, 29 and 31, 41 and 43, 59 and 61, 71 and 73).", "Q2 Why is \"3, 5, 7\" the only set of three primes spaced by 2?　Answer: Among any three odd numbers spaced by 2, one is always a multiple of 3; the only multiple of 3 that is prime is 3 itself, so the set can only be \"3, 5, 7.\"", "Q3 What has been proved so far about twin primes?　Answer: It is proved that there are infinitely many prime pairs with a gap of 246 or less. Whether pairs with a gap of exactly 2 (twin primes) are infinite has not been proved yet."]}, "corner": {"ja": ["100までの数の一覧をノートに書き、エラトステネスのふるいで素数を探しましょう。2の倍数を斜線で消し、3、5、7の倍数も消していくと、素数が浮かび上がります。残った25個の素数の中から、差が2のペアに丸をつけると、8組の双子素数が見つかります。", "「3、5、7」の3つ組について考えましょう。差が2ずつ並ぶ3つの奇数のうち、どれか1つが3の倍数になる理由を、3で割った余りに注目して説明できますか。余りが0、1、2と順に変わっていくことに気づけば、答えが見えてきます。", "100から200の間でも双子を探してみましょう。答えは7組です。100までの8組と比べて、双子どうしの間隔がどう変わったか、数直線に印をつけて眺めると実感できます。", "素数と素数の「差」の記録も面白いです。素数を順に書き、隣の素数との差をメモしていくと、2、4、6といった偶数が並びます。差が2のところが双子素数です。素数は全部（2を除いて）奇数なので、差は必ず偶数になることにも気づくはずです。"], "en": ["Write out the numbers up to 100 in your notebook and find the primes with the sieve of Eratosthenes. Cross out the multiples of 2, then of 3, 5 and 7, and the primes will stand out. Circle the pairs with a difference of 2 among the 25 primes, and you will find 8 twin pairs.", "Think about the set \"3, 5, 7.\" Can you explain, by looking at remainders when dividing by 3, why one of any three odd numbers spaced by 2 must be a multiple of 3? If you notice the remainders cycle through 0, 1 and 2, the answer comes into view.", "Hunt for twins between 100 and 200 as well. The answer is 7 pairs. Compare them with the 8 pairs below 100 — mark them on a number line and see how the spacing changes.", "Keeping a record of the \"gaps\" between primes is fun too. Write the primes in order and note each gap to the next prime: 2, 4, 6 — all even numbers. The gaps of exactly 2 are the twins. Since every prime except 2 is odd, every gap must be even — you will see why as you write."]}}, {"id": "pascal", "title": {"ja": "小さな力で重いものを持ち上げる ― パスカルの原理のおはなし", "en": "Lifting Something Heavy with a Small Force ― A Story of Pascal's Principle"}, "sub": {"ja": "小学校高学年〜中学生向け・圧力＝力÷面積が、力を何倍にもする", "en": "For upper elementary and junior high — pressure = force ÷ area can multiply a force many times over"}, "cover": "pas1.jpg", "images": ["pas1.jpg", "pas2.jpg", "pas4.jpg", "pas2.jpg", "pas3.jpg", "pas5.jpg"], "pages": [{"ja": ["ある日、おじいちゃんが車のタイヤを交換していました。車の下に小さな道具を差し込み、レバーを何度か押すと、重いはずの車の片側が、すっと浮き上がりました。", "「おじいちゃん、その小さな道具で、どうして車が持ち上がるの。」ユイも車を押してみましたが、車はびくともしません。大人が何人もかかっても難しいことを、小さな道具がやってしまったのです。", "道具の名前は「油圧ジャッキ」と言います。中には油が入っていて、レバーを押す力が、油を通して大きな力に化けるのです。", "「今日は、この『小さな力が大きな力に化ける』仕掛けを解き明かそう。」おじいちゃんは、ジャッキの中身を絵に描き始めました。"], "en": ["One day, Yui's grandfather was changing a tire on his car. He slid a small tool under the car, pushed its lever a few times, and one side of the heavy car rose smoothly into the air.", "\"Grandpa, how can that little tool lift a car?\" Yui pushed the car herself, but it would not budge. Something that would be hard for several adults was being done by one small tool.", "The tool is called a hydraulic jack. Inside it is oil, and the force of pushing the lever changes, through the oil, into a much bigger force.", "\"Today, let's solve the secret of how a small force turns into a big one.\" Her grandfather began to draw the inside of the jack."]}, {"ja": ["絵の中では、細い筒と太い筒が、下のほうでつながっていました。両方の筒には油が入っていて、それぞれの油の上には、ふたのような板（ピストン）が乗っています。", "細い筒のピストンを小さな力で押すと、油が押されます。油は逃げ場がないので、押された力は油の中を伝わり、太い筒のピストンを押し上げます。", "「液体は、押された圧力を、弱めずにそのまま伝えるんだ。」これが、パスカルの原理と呼ばれる法則です。圧力は、油の隅々まで、同じ大きさで届きます。", "太い筒の上には車が乗ります。細い筒を押す小さな力が、太い筒では車を持ち上げる力になる。一体、どこで力が増えるのでしょうか。"], "en": ["In his drawing, a narrow cylinder and a wide cylinder were joined at the bottom. Both were filled with oil, and on top of the oil in each sat a lid-like board called a piston.", "Push the piston of the narrow cylinder with a small force, and the oil is pressed. The oil has nowhere to escape, so the push travels through the oil and lifts the piston of the wide cylinder.", "\"A liquid carries pressure exactly as it receives it, without weakening it.\" This rule is called Pascal's principle. The pressure reaches every corner of the oil with the same strength.", "The car sits on top of the wide cylinder. A small force pressing the narrow one becomes a force that lifts a car in the wide one. Where does the force grow?"]}, {"ja": ["秘密は「面積」にありました。ここで大事なのが、圧力という考え方です。圧力は、「力÷面積」で決まります。押す力を、押す面の広さで割ったものが圧力です。", "細い筒では、小さな力を小さい面積で受けるので、圧力は思ったより大きくなります。その圧力がそのまま太い筒へ届くと、太い筒では広い面積に圧力がかかるので、出てくる力は大きくなります。", "たとえば、太い筒の面積が細い筒の10倍なら、出てくる力は10倍。100倍の面積なら、力も100倍です。指先ほどの力で車が持ち上がるのは、この「面積の分だけ力が増える」仕掛けのおかげでした。", "「力÷面積の圧力が同じ、という約束のもとで、面積の比が、そのまま力の倍率になるんだ。」ユイはノートに、比の式を書きました。"], "en": ["The secret is in the word \"area.\" What matters here is the idea of pressure. Pressure is decided by \"force ÷ area\" — the pushing force divided by the size of the surface it pushes on.", "In the narrow cylinder, a small force acts on a small area, so the pressure is bigger than you might expect. When that very pressure arrives in the wide cylinder, it pushes on a wide area, so the force that comes out is large.", "For example, if the wide cylinder's area is 10 times the narrow one's, the force comes out 10 times bigger. With 100 times the area, the force is 100 times. The reason a fingertip's force can lift a car is this trick: the force grows by exactly the area's share.", "\"Under the promise that the pressure — force ÷ area — stays the same, the ratio of the areas becomes the multiplying rate of the force.\" Yui wrote the ratio in her notebook."]}, {"ja": ["「でもおじいちゃん、力が増えるなんて、得ばかりでずるくない。」ユイが言いました。おじいちゃんは笑って言いました。「帳尻は、ちゃんと合うようになっているんだ。」", "細い筒のピストンは、少し押し込んでも、太い筒のピストンはほんの少ししか上がりません。太い筒が上がる距離は、面積の比の分だけ短くなるのです。面積が10倍なら、上がる距離は10分の1です。", "だから、ジャッキのレバーは何度も押します。小さな力を何回も繰り返して、少しずつ車を持ち上げる。「力で得をした分、距離と回数で返す」というわけです。", "うまい話には必ず帳尻がある。でも、小さな力を繰り返せるからこそ、人の手で車が持ち上がるのです。"], "en": ["\"But Grandpa, if the force just grows, isn't that getting something for nothing?\" said Yui. Her grandfather laughed. \"The accounts balance out, you'll see.\"", "Push the narrow piston in a little, and the wide piston rises only a tiny bit. The distance the wide cylinder rises is shorter by exactly the area ratio. With 10 times the area, the rising distance is one tenth.", "That is why you push a jack's lever again and again. Repeating a small force many times lifts the car little by little. \"What you gain in force, you pay back in distance and in repetitions.\"", "Every good bargain has its balance sheet. But because a small force can be repeated, human hands can lift a car."]}, {"ja": ["おじいちゃんは、パスカルという人の面白い実験の話をしました。フランスの数学者ブレーズ・パスカルは、樽の実験で人々を驚かせたと言われています。", "水で満たした大きな樽のふたに、細くて高い管を立て、その管に少しの水を注ぐと、なんと樽が割れてしまったというのです。注いだ水は少ないのに、高い管の水が大きな圧力を生み、その圧力が樽の内側の隅々まで伝わって、樽を壊すほどの力になったのです。", "「圧力は、量ではなく、高さと面積の掛け算で効いてくる。」ユイは、少しの水が樽を割る場面を想像して、ぞくっとしました。", "パスカルの原理は、ジャッキだけでなく、圧力が「全体に、同じだけ」伝わることが大事な場面で使われます。その代表が、車のブレーキです。"], "en": ["Her grandfather told her about a famous experiment by a man named Pascal. Blaise Pascal, a French mathematician, is said to have amazed people with his barrel experiment.", "He stood a tall, thin pipe on the lid of a big barrel filled with water, and poured a little water into the pipe — and the barrel burst. The water poured in was only a little, but its height in the tall pipe made a great pressure, and that pressure spread to every corner inside the barrel, becoming a force strong enough to break it.", "\"Pressure works not by the amount of water, but by height and area working together.\" Imagining a little water breaking a barrel, Yui shivered.", "Pascal's principle is used wherever pressure must reach \"everywhere, equally.\" The greatest example is the brakes of a car."]}, {"ja": ["車のブレーキペダルを踏むと、その力は油の圧力になって、4つのタイヤのブレーキに、同じ大きさで届きます。1つのペダルで、4つの車輪を同時に止められるのは、圧力が全体に伝わるおかげです。", "ほかにも、工事現場のショベルカーの腕、歯医者さんの椅子、理容室の椅子など、油圧の仕掛けは身の回りにたくさんあります。重いものを静かに、確実に動かすところには、たいていパスカルの原理が働いています。おもちゃにも、この原理を使ったものがあります。水を入れたペットボトルの中で浮き沈みする「浮沈子（ふちんし）」です。ボトルを握ると、その圧力が水全体に伝わり、浮沈子の中の空気が縮んで水が入り、重くなって沈みます。手をゆるめると、空気が膨らんで水を押し出し、浮かび上がります。ここで役割を分けると、握った圧力が全体に伝わるのがパスカルの原理、浮くか沈むかを決めるのが、もう一つの約束「アルキメデスの原理」です。物が水の中で受ける浮力（押し上げる力）は、その物が押しのけた水の重さとちょうど同じだけあります。浮沈子は、水が入り込むと全体の重さが浮力に勝って沈み、水が出ていくと浮力のほうが勝って浮くのです。", "「圧力＝力÷面積。この一つの式と、比の考え方で、指1本の力が車を持ち上げる。」ユイは、最初に見たジャッキを思い出しました。", "小さな力を大きな力に変える工夫は、魔法ではありません。数学が見つけた、自然の約束の使い方なのです。"], "en": ["When you press a car's brake pedal, the force becomes pressure in oil and reaches the brakes of all four tires with the same strength. One pedal can stop four wheels at once because the pressure travels to the whole system.", "Hydraulic tricks are all around us: the arm of an excavator at a building site, the dentist's chair, the barber's chair. Wherever something heavy is moved quietly and surely, Pascal's principle is usually at work. There is even a toy that uses the principle: the \"Cartesian diver,\" which floats and sinks inside a water-filled plastic bottle. Squeeze the bottle, and the pressure travels through all the water; the air inside the little diver shrinks, water slips in, and the diver grows heavier and sinks. Let go, and the air expands, pushes the water out, and the diver floats up again. If we divide the roles: the travelling of the squeezing pressure is Pascal's principle, and what decides floating or sinking is another promise, Archimedes' principle. The buoyancy a thing receives in water — the force pushing it up — is exactly the weight of the water the thing pushes aside. When water slips into the diver, its total weight beats the buoyancy and it sinks; when the water leaves, the buoyancy wins and it floats.", "\"Pressure = force ÷ area. With this one formula and the idea of ratios, the force of one finger lifts a car.\" Yui remembered the jack she had seen at the start.", "Turning a small force into a big one is not magic. It is a way of using a promise of nature that mathematics found."]}], "column": {"ja": ["ブレーズ・パスカル（1623〜1662）は、フランスの数学者・物理学者・思想家です。若い頃に歯車式の計算機「パスカリーヌ」を作り、確率の問題や、三角形に数を並べた「パスカルの三角形」でも知られています。", "パスカルは1646年ごろ、樽の実験で液体の圧力の伝わり方を示し、1653年に液体のつり合いについての原理をまとめました。その著書はパスカルの死後の1663年に刊行されています。", "気圧の研究でも有名で、高い山の上では空気の圧力が低くなることを確かめました。今、天気予報で聞く圧力の単位「パスカル（Pa）」と「ヘクトパスカル」は、彼の名前から取られています。自動車のブレーキや油圧ジャッキなど、私たちの安全を支える道具の中に、約370年前にパスカルが見つけた約束が、今も生きています。", "浮沈子で働くもう一つの約束、浮力の原理を見つけたのは、古代ギリシャの数学者アルキメデスです。王様から「金の王冠に、銀が混ざっていないか調べてほしい」と頼まれたアルキメデスは、お風呂に入ったときに体が軽くなることからヒントを得て、「ユリイカ！（分かったぞ）」と叫んで飛び出した、という言い伝えがあります。これは伝説として楽しむお話ですが、「浮力は、物が押しのけた水の重さと等しい」という法則は本当で、船が浮く理由も、この原理で説明できます。"], "en": ["Blaise Pascal (1623–1662) was a French mathematician, physicist and thinker. When young, he built a gear-driven calculating machine, the Pascaline, and he is also known for problems of probability and for \"Pascal's triangle,\" an arrangement of numbers in a triangle.", "Around 1646, Pascal showed with his barrel experiment how pressure travels through a liquid, and in 1653 he set down the principle of the balance of liquids. His book on it was published in 1663, after his death.", "He is famous for studying air pressure too, confirming that air pressure is lower on a high mountain. The units of pressure we hear in weather forecasts, the pascal (Pa) and the hectopascal, take their name from him. Inside the tools that keep us safe — car brakes and hydraulic jacks — a promise Pascal found about 370 years ago is still alive today.", "The other promise at work in the diver — the principle of buoyancy — was found by Archimedes, a mathematician of ancient Greece. The king had asked him to check whether silver was mixed into a golden crown. The story says that Archimedes, feeling his body grow lighter in the bath, found his hint, cried \"Eureka!\" (\"I've found it!\") and leapt out. Enjoy that tale as a legend — but the law itself, \"buoyancy equals the weight of the water pushed aside,\" is true, and it explains why ships float."]}, "quiz": {"ja": ["Q1 圧力を求める式は、何ですか。　答え：圧力＝力÷面積です。同じ力でも、面積が小さいほど圧力は大きくなります。", "Q2 太い筒の面積が細い筒の25倍のジャッキでは、押す力の何倍の力が出ますか。　答え：25倍です。圧力が同じまま伝わるので、出てくる力は面積の比の分だけ大きくなります。", "Q3 ジャッキのレバーを何度も押さなければならないのは、なぜですか。　答え：太い筒が持ち上がる距離は、面積の比の分だけ短くなるからです。力で得をした分、距離と回数で返すことになります。"], "en": ["Q1 What is the formula for pressure?　Answer: Pressure = force ÷ area. With the same force, a smaller area gives a greater pressure.", "Q2 In a jack whose wide cylinder has 25 times the area of the narrow one, the force comes out how many times the pushing force?　Answer: 25 times. The pressure travels unchanged, so the force grows by exactly the ratio of the areas.", "Q3 Why must a jack's lever be pushed many times?　Answer: Because the distance the wide cylinder rises is shorter by the area ratio. What you gain in force, you pay back in distance and repetitions."]}, "corner": {"ja": ["画鋲を使った実験です（大人の人と一緒に、手を刺さないように気をつけて）。画鋲1本の上に風船をそっと押し当てると、簡単に割れてしまいます。ところが、画鋲を何十本も並べた「画鋲ベッド」の上に風船を乗せて押すと、なかなか割れません。力がたくさんの点に分散され、1点あたりの圧力が小さくなるからです。これが「圧力＝力÷面積」の実感です。", "針のない注射器を2本（大小）用意し、チューブでつないで水を入れると、簡単なジャッキの模型ができます。細い注射器を押すと、太い注射器がゆっくり押し上がり、重いものを載せても持ち上がります。力を入れる側と、出てくる側の重さ比べをしてみましょう。距離の帳尻も確かめられます。細い注射器を10cmぶん押したとき、太い注射器は何mm上がるか、面積の比から予想して測ると、「力の倍率」と「距離の縮み方」が逆数の関係になっていることが分かります。", "浮沈子も作ってみましょう。用意するものは、炭酸飲料用のペットボトル（丈夫でおすすめ）と、魚の形の醤油さし（タレビン）です。①タレビンに水を半分ほど入れ、口を下にして水に浮かべ、浮くか沈むか、ぎりぎりの浮き具合になるよう水の量を加減します。②ペットボトルに水を口いっぱい近くまで入れ、タレビンを入れて、ふたをしっかり閉めます。③ボトルをぎゅっと握ると浮沈子が沈み、ゆるめると浮かび上がります。調整のコツは、握らないときは浮き、握ると沈む状態にすること。浮いたままで沈まないときはタレビンの水を少し増やし、沈んだまま浮かばないときは少し減らします。中の空気が縮んだり膨らんだりして、水の出入りが起きるのが仕掛けです。浮くか沈むかは、浮沈子が押しのけた水の重さ分の「浮力」と、浮沈子全体の重さのつり合いで決まります（アルキメデスの原理）。", "身の回りの「油圧探し」もしましょう。車のブレーキ、ショベルカー、バスや飛行機の装置、歯医者さんの椅子。見つけたら、「どこが細い筒で、どこが太い筒か」を考えるのが、この原理の復習になります。"], "en": ["Try the pin experiment (with an adult, and take care not to prick your hands). Press a balloon gently onto a single pin, and it pops easily. But rest the balloon on a \"bed\" of dozens of pins and press — it will not pop so easily. The force spreads over many points, so the pressure at each point becomes small. That is \"pressure = force ÷ area\" in your hands.", "Join two needle-less syringes, one big and one small, with a tube, and fill them with water, and you have a simple model jack. Push the small syringe, and the big one rises slowly, lifting even a heavy load. Compare the weight you push with and the weight that comes out. You can check the balancing of distances, too: when you push the small syringe in by 10 cm, how many millimetres does the big one rise? Predict from the area ratio, then measure — the force's multiplying rate and the distance's shrinking rate are reciprocals.", "Now make a Cartesian diver. You need a plastic bottle for fizzy drinks (strong, and best for this) and a little fish-shaped soy-sauce container. (1) Fill the little container about half full of water, turn it mouth-down in water, and adjust the water inside until it just barely floats. (2) Fill the bottle nearly to the brim, put the container in, and close the cap tightly. (3) Squeeze the bottle firmly and the diver sinks; loosen your grip and it floats up. The trick of adjusting is to reach the state where it floats when you are not squeezing and sinks when you do: if it will not sink, add a little water to the diver; if it will not rise, take a little out. The secret is the air inside, shrinking and swelling, letting water in and out. Whether the diver floats or sinks is decided by the balance between the buoyancy — the weight of the water the diver pushes aside — and the diver's whole weight (Archimedes' principle).", "Go hunting for hydraulics around you: car brakes, excavators, devices on buses and airplanes, the dentist's chair. When you find one, thinking \"which part is the narrow cylinder, and which is the wide one?\" is a perfect review of this principle."]}}, {"id": "kumiawase", "title": {"ja": "5人から3人をえらぶと何通り？ ― 組み合わせのおはなし", "en": "How Many Ways to Choose 3 from 5? ― A Story of Combinations"}, "sub": {"ja": "小学校高学年〜中学生向け・「えらぶ」数と「ならべる」数は、どうちがう？", "en": "For upper elementary and junior high — how is \"choosing\" different from \"lining up\"?"}, "cover": "kum1.jpg", "images": ["kum1.jpg", "kum2.jpg", "kum3.jpg", "kum4.jpg", "kum5.jpg", "kum5.jpg"], "pages": [{"ja": ["学校のお楽しみ会で、ユイたちのグループが歌の発表をすることになりました。グループは5人、ユイ、サクラ、タケル、ヒナ、ソラです。ところが、発表の係は3人だけ。前に出て歌う3人を、5人の中から選ばなければなりません。", "「じゃんけんで決めよう。」と言うタケルに、ヒナが首を振りました。「その前に聞きたい。選び方って、全部で何通りあるの。」", "5人から3人を選ぶ方法は、いくつあるのでしょう。ユイは家に帰って、おじいちゃんに相談しました。", "「いい質問だ。」おじいちゃんは目を細めました。「『選ぶ』数の数え方は、数学の中でもいちばん役に立つ数え方の一つだよ。いっしょに数えてみよう。」"], "en": ["At her school's fun fair, Yui's group was going to sing a song. The group had five members: Yui, Sakura, Takeru, Hina, and Sora. But only three of them would stand in front and sing. Three singers had to be chosen from the five.", "\"Let's decide by rock-paper-scissors,\" said Takeru. Hina shook her head. \"Before that, I want to know — how many ways are there to choose, in total?\"", "How many ways are there to choose 3 people from 5? Yui went home and asked her grandfather.", "\"A very good question,\" he said, his eyes crinkling. \"Counting 'choices' is one of the most useful kinds of counting in all of mathematics. Let's count together.\""]}, {"ja": ["ユイはノートに、思いつく組み合わせを書き出してみました。（ユイ・サクラ・タケル）、（ユイ・サクラ・ヒナ）、（ユイ・タケル・ソラ）……。しばらく書くと、手が止まってしまいました。", "「あれ、（サクラ・タケル・ヒナ）は、もう書いたっけ。書いたような、書いていないような……。」書き出したものの中に、漏れているものや、重なっているものがありそうで、自信が持てません。", "やみくもに書き出すと、漏れと重なりが出るのです。数え方に、工夫が要ります。", "おじいちゃんは言いました。「まず、『順番』をつけて数えてみよう。順番があるほうが、数えやすいんだ。」"], "en": ["Yui tried writing combinations in her notebook as they came to mind: (Yui, Sakura, Takeru), (Yui, Sakura, Hina), (Yui, Takeru, Sora)... After a while, her hand stopped.", "\"Wait — did I already write (Sakura, Takeru, Hina)? I think I did... or did I?\" She could not be sure whether some choices were missing or written twice.", "Writing things down at random creates gaps and duplicates. Counting needs a smarter plan.", "\"First, let's count with an order,\" said her grandfather. \"Counting is easier when there is an order.\""]}, {"ja": ["順番をつけるとは、係を「1番目の人」「2番目の人」「3番目の人」と分けて考えることです。", "1番目に来る人は、5人の中の誰でもいいので、5通り。2番目は残りの4人から選ぶので、4通り。3番目は残りの3人から選ぶので、3通りあります。", "かけ算すると、5×4×3＝60通り。順番まで区別して数えると、選び方は60通りあることが分かりました。", "「でもおじいちゃん、発表係に『1番目の人』も『2番目の人』もないよ。前に出る3人が決まればいいんでしょう。」ユイの言うとおりです。ここからが、大事なところでした。"], "en": ["Counting with an order means thinking of the singers as \"the first person,\" \"the second person,\" and \"the third person.\"", "The first person can be any of the 5, so there are 5 ways. The second person is chosen from the 4 who are left, so 4 ways. The third is chosen from the 3 who remain, so 3 ways.", "Multiplying, 5 × 4 × 3 = 60 ways. When we count the order as well, there are 60 ways to choose.", "\"But Grandpa, the singers don't have a 'first person' or a 'second person.' We just need to decide which three stand in front.\" Yui was right — and here came the important part."]}, {"ja": ["たとえば、ユイ、サクラ、タケルの3人が選ばれたとします。この3人の「順番のつけ方」は、何通りあるでしょうか。", "（ユイ・サクラ・タケル）、（ユイ・タケル・サクラ）、（サクラ・ユイ・タケル）、（サクラ・タケル・ユイ）、（タケル・ユイ・サクラ）、（タケル・サクラ・ユイ）。数えると、3×2×1＝6通りあります。", "でも、発表係としては、この6つは全部「同じ3人」です。さっきの60通りの中には、どの3人の組み合わせも、6回ずつ数えられていたのです。", "だから、60を6で割ります。60÷6＝10通り。これが、5人から3人を選ぶ方法の数です。"], "en": ["Suppose Yui, Sakura, and Takeru are chosen. In how many orders can these same three people be arranged?", "(Yui, Sakura, Takeru), (Yui, Takeru, Sakura), (Sakura, Yui, Takeru), (Sakura, Takeru, Yui), (Takeru, Yui, Sakura), (Takeru, Sakura, Yui). Counting them, there are 3 × 2 × 1 = 6 orders.", "But as singers, all six are \"the same three people.\" Inside the 60 ways we counted, every set of three people was counted 6 times.", "So we divide 60 by 6: 60 ÷ 6 = 10 ways. That is the number of ways to choose 3 people from 5."]}, {"ja": ["本当に10通りか、名前の頭文字で全部書き出して確かめてみましょう。ユイを「ユ」、サクラを「サ」、タケルを「タ」、ヒナを「ヒ」、ソラを「ソ」とします。", "ユサタ、ユサヒ、ユサソ、ユタヒ、ユタソ、ユヒソ、サタヒ、サタソ、サヒソ、タヒソ。数えると、ちょうど10通り。式の答えと合いました。", "書いている途中で、ユイは面白いことに気づきました。「3人を選ぶ」ことは、「残りの2人を選ぶ」ことと同じです。発表に出る3人が決まれば、出ない2人も自動的に決まるからです。", "つまり、5人から3人を選ぶ数と、5人から2人を選ぶ数は、同じ10通り。選ぶ人数が変わっても、答えが同じになることがあるのです。"], "en": ["Let's check that it really is 10, by writing them all with initials. Yui is \"Yu,\" Sakura is \"Sa,\" Takeru is \"Ta,\" Hina is \"Hi,\" and Sora is \"So.\"", "YuSaTa, YuSaHi, YuSaSo, YuTaHi, YuTaSo, YuHiSo, SaTaHi, SaTaSo, SaHiSo, TaHiSo. Counting them gives exactly 10 — the same as the formula.", "While writing, Yui noticed something interesting. \"Choosing 3 people\" is the same act as \"choosing the 2 who stay behind.\" Once the three singers are decided, the other two are decided automatically.", "So the number of ways to choose 3 from 5 and the number of ways to choose 2 from 5 are the same: 10. Even when the number you choose changes, the answer can stay the same."]}, {"ja": ["「選ぶ」と「並べる」は、どう違うのでしょう。徒競走の1等、2等、3等を考えるなら、順番が大切です。同じ3人でも、順位が違えば別の結果ですから、数は60通りのままです。", "でも、発表係や給食当番のように、顔ぶれだけが問題のときは、順番は関係ありません。順番つきで数えた数（60）を、同じ顔ぶれの並び替えの数（6）で割って、10通りになります。", "計算の形をまとめると、「5×4×3÷（3×2×1）」です。分子は「順番つきの数」、分母は「一つの組み合わせの中の並び替えの数」を表しています。", "結局、発表係は、この10通りの中から話し合いで決まりました。数え方を知っていると、「何通りあるか」に自信を持って、話し合いができるのです。"], "en": ["How are \"choosing\" and \"lining up\" different? If we think about first, second, and third place in a foot race, the order matters. The same three runners with different places are different results, so the count stays 60.", "But for singers or lunch duty, only the members matter, and the order does not. So we take the ordered count (60) and divide by the number of orders of the same members (6), giving 10.", "The shape of the calculation is \"5 × 4 × 3 ÷ (3 × 2 × 1).\" The top part is \"the count with order,\" and the bottom part is \"the number of orders inside one group.\"", "In the end, the three singers were chosen from these 10 ways by talking it over. When you know how to count, you can discuss with confidence, knowing exactly how many ways there are."]}], "column": {"ja": ["圧力の原理で知られるブレーズ・パスカルは、「パスカルの三角形」でも知られています。数を三角形の形に並べたもので、両はしは1、内側の数は左上と右上の和、という決まりで、いくらでも大きくできます。", "この三角形には、「選ぶ」数が全部現れます。たとえば、上から6つ目の段「1、5、10、10、5、1」は、「5人から0人、1人、2人、3人、4人、5人を選ぶ数」と、ぴったり重なります。今日の主役の「10」は、三角形の中にも住んでいたのです。", "実はこの三角形は、パスカルよりずっと前から世界のあちこちで知られていました。中国では13世紀に楊輝（ようき）という人が紹介したため「楊輝三角形」とも呼ばれ、ペルシャやインドでも古くから研究されていました。パスカルの名前が残ったのは、彼がこの三角形の性質を丁寧にまとめ、「選ぶ」数の計算に結びつけたからです。", "「選ぶ」数は、確率の計算の土台にもなります。くじ引きで当たる確率も、カードの組み合わせも、この数を使って考えることができます。並べる数と選ぶ数、この2つが、数える数学の大きな柱なのです。"], "en": ["Blaise Pascal, known for the principle of pressure, is also famous for \"Pascal's triangle.\" It is a triangle of numbers where the ends are 1 and each inside number is the sum of the two above it, and it can grow as large as you like.", "Every \"choosing\" number appears in this triangle. For example, the sixth row, \"1, 5, 10, 10, 5, 1,\" matches exactly the numbers of ways to choose 0, 1, 2, 3, 4, or 5 people from 5. Today's hero, the number 10, lives inside the triangle too.", "In fact, this triangle was known in many places long before Pascal. In China it is also called \"Yang Hui's triangle,\" after Yang Hui, who presented it in the 13th century, and it was studied in Persia and India long ago as well. Pascal's name stayed because he carefully collected the triangle's properties and connected them to the counting of choices.", "The numbers of choosing are also the foundation of probability. The chance of winning a lottery draw, or the combinations of cards, can all be thought about with these numbers. The number of ways to line things up and the number of ways to choose — these two are the great pillars of counting in mathematics."]}, "quiz": {"ja": ["Q1 5人から3人を選ぶ数が、5×4×3÷（3×2×1）で計算できるのは、なぜですか。　答え：順番つきで数えると5×4×3＝60通りですが、同じ3人の並び替えが3×2×1＝6通りずつ重なって数えられているので、60を6で割るからです。", "Q2 4人から2人を選ぶ方法は、何通りですか。　答え：6通りです。（4×3）÷（2×1）＝12÷2＝6通りになります。", "Q3 6人から3人を選ぶ方法は、何通りですか。　答え：20通りです。（6×5×4）÷（3×2×1）＝120÷6＝20通りになります。"], "en": ["Q1 Why can the number of ways to choose 3 from 5 be calculated as 5 × 4 × 3 ÷ (3 × 2 × 1)?　Answer: Counting with order gives 5 × 4 × 3 = 60 ways, but the same three people are counted 3 × 2 × 1 = 6 times in different orders, so we divide 60 by 6.", "Q2 How many ways are there to choose 2 people from 4?　Answer: 6 ways. (4 × 3) ÷ (2 × 1) = 12 ÷ 2 = 6 ways.", "Q3 How many ways are there to choose 3 people from 6?　Answer: 20 ways. (6 × 5 × 4) ÷ (3 × 2 × 1) = 120 ÷ 6 = 20 ways."]}, "corner": {"ja": ["まず、4人から2人を選ぶ場合を考えましょう。頭文字を書き出すと6通りになるはずです。式でも確かめてください。順番つきでは4×3＝12通り。1組の中の並び替えは2×1＝2通り。だから12÷2＝6通りです。書き出した答えと合いましたか。", "次は、6人から3人です。式で計算すると、（6×5×4）÷（3×2×1）＝120÷6＝20通り。全部書き出すのは大変でも、式なら一瞬です。大きな数ほど、この数え方のありがたみが分かります。", "パスカルの三角形を、自分で書いてみましょう。一番上に1、その下に1と1、両はしは1で、内側の数は「左上と右上の数の和」で作ります。1、121、1331、14641と進めて、次の段は「1、5、10、10、5、1」になるはずです。この「10」が2つ並ぶ段が、今日の5人の話です。2つの10は、「3人選ぶ」と「2人選ぶ」に対応しています。", "身の回りの「選ぶ」を探してみましょう。給食当番、掃除の班、ドッジボールのチーム、トランプの手札。順番が関係ない選び方を、できるだけたくさん見つけてください。見つけた場面で、「全部で何通りあるか」を式で計算してみるのも面白いですよ。"], "en": ["First, think about choosing 2 people from 4. Writing the initials should give you 6 ways. Check with the formula too: with order it is 4 × 3 = 12 ways, and the orders inside one pair are 2 × 1 = 2, so 12 ÷ 2 = 6 ways. Does it match your list?", "Next, choosing 3 from 6. The formula gives (6 × 5 × 4) ÷ (3 × 2 × 1) = 120 ÷ 6 = 20 ways. Writing them all out is hard work, but the formula takes a moment. The bigger the numbers, the more thankful you are for this way of counting.", "Now build Pascal's triangle yourself. Put 1 at the top, then 1 and 1 below it. The ends are always 1, and each inside number is the sum of the two numbers above it. Going 1, 121, 1331, 14641, the next row should be \"1, 5, 10, 10, 5, 1.\" The two 10s in this row are today's story of five people: they stand for \"choose 3\" and \"choose 2.\"", "Look for \"choosing\" in daily life: lunch duty, cleaning teams, dodgeball teams, a hand of cards. Find as many choices as you can where the order does not matter. For each scene you find, try computing \"how many ways in total\" with the formula."]}}, {"id": "erato", "title": {"ja": "棒と影で地球をはかる ― エラトステネスのおはなし", "en": "Measuring the Earth with a Stick and a Shadow ― The Story of Eratosthenes"}, "sub": {"ja": "小学校高学年〜中学生向け・影の角度と比例で、地球一周の長さを求める", "en": "For upper elementary and junior high — finding the distance around the Earth with a shadow's angle and proportion"}, "cover": "era1.jpg", "images": ["era1.jpg", "era2.jpg", "era3.jpg", "era4.jpg", "era5.jpg", "era5.jpg"], "pages": [{"ja": ["夕食のあと、ユイは地球儀をくるくる回しながら、おじいちゃんに聞きました。「地球一周って、約4万キロメートルなんだよね。でも、どうやって測ったの。地球のまわりを、メジャーでぐるっと測ることなんてできないよ。」", "飛行機も人工衛星もない時代に、地球の大きさを知る方法なんてあるのでしょうか。", "おじいちゃんは笑って言いました。「今から2200年以上も前に、棒と影だけで地球をはかった人がいるんだよ。エラトステネスという人だ。」", "「棒と影だけで、地球が。」ユイは地球儀の回転を止めました。おじいちゃんの話が始まります。"], "en": ["After dinner, Yui was spinning a globe when she asked her grandfather, \"The distance around the Earth is about 40,000 kilometers, right? But how did anyone measure it? You can't wrap a tape measure around the whole Earth.\"", "In an age with no airplanes and no satellites, could there be any way to know the size of the Earth?", "Her grandfather smiled. \"More than 2,200 years ago, a man measured the Earth with just a stick and a shadow. His name was Eratosthenes.\"", "\"With a stick and a shadow — the Earth?\" Yui stopped the globe, and her grandfather's story began."]}, {"ja": ["エラトステネスは、エジプトのアレクサンドリアという町に住む学者でした。彼は、遠く南にあるシエネという町の不思議な話を知っていました。", "シエネでは、夏至（一年で昼がいちばん長い日）の正午、太陽がちょうど真上に来て、深い井戸の底まで太陽の光が届くというのです。縦に立てた棒にも、影ができません。", "ところが、同じ日の同じ時刻、アレクサンドリアで棒を立てると、短いけれど、はっきりした影ができました。", "「同じ太陽なのに、場所によって影が違う。」エラトステネスは考えました。この違いこそ、地球の大きさをはかる手がかりになると、彼はひらめいたのです。"], "en": ["Eratosthenes was a scholar living in Alexandria, in Egypt. He knew a curious story about Syene, a town far to the south.", "In Syene, at noon on the summer solstice — the day with the longest daylight of the year — the sun stood exactly overhead, and its light reached the very bottom of a deep well. A stick standing upright cast no shadow at all.", "But at the same time on the same day, a stick in Alexandria cast a short but clear shadow.", "\"The same sun, yet the shadows differ from place to place.\" Eratosthenes thought hard, and an idea flashed: this difference itself could be the clue to measuring the Earth."]}, {"ja": ["アレクサンドリアの棒の影の角度を測ると、7.2°でした。棒の立っている向きと、影の向きの間の角度です。", "太陽の光は、とても遠くから届くので、平行に進んで来ると考えられます。エラトステネスは、この7.2°という角度が、「地球の中心から見た、アレクサンドリアとシエネの間の角度」と同じになることに気がつきました。地面が丸く傾いている分だけ、影の角度がずれるのです。", "円を一周する角度は360°です。360÷7.2＝50。つまり、2つの町の間の距離は、地球一周の50分の1にあたります。", "あとは、2つの町の間の距離が分かれば、その50倍が地球一周の長さになる。エラトステネスは、最後のピースを探しに行きました。"], "en": ["He measured the angle of the stick's shadow in Alexandria: 7.2 degrees. It is the angle between the upright stick and the direction of its shadow.", "Sunlight arrives from very far away, so we can think of its rays as traveling in parallel lines. Eratosthenes realized that this angle of 7.2 degrees is the same as \"the angle between Alexandria and Syene, seen from the center of the Earth.\" The shadow's angle shifts by exactly the tilt of the round ground.", "A full circle is 360 degrees. 360 ÷ 7.2 = 50. So the distance between the two cities is one fiftieth of the way around the Earth.", "Now, if he could find the distance between the two cities, fifty times that would be the distance around the Earth. Eratosthenes went looking for the last piece."]}, {"ja": ["アレクサンドリアとシエネの間の距離は、およそ5000スタジアとされていました。スタジアは、当時の長さの単位です。ラクダの隊商が何日もかけて歩く距離を、専門の測量係が歩いて測ったと言われています。", "計算は単純です。5000×50＝25万。地球一周は、約25万スタジア、という答えが出ました。", "25万スタジアを今の単位に直すと、約4万kmになります（スタジアの長さの解釈によって、少し幅があります）。", "棒と影と、歩いて測った距離と、角度の計算だけ。エラトステネスは、地球の外に出ることなく、地球一周の長さを言い当てたのです。"], "en": ["The distance between Alexandria and Syene was said to be about 5,000 stadia. The stadion was a unit of length at the time. Professional surveyors are said to have measured it by walking, using the days traveled by camel caravans.", "The calculation is simple: 5,000 × 50 = 250,000. The distance around the Earth came out to about 250,000 stadia.", "Converted into modern units, 250,000 stadia is about 40,000 kilometers (with some range, depending on how long one stadion was).", "A stick, a shadow, a distance measured on foot, and an angle calculation. Without ever leaving the Earth, Eratosthenes had named its full circumference."]}, {"ja": ["現代の測定では、地球一周（北極と南極を通る子午線の周）は、約40,008kmと分かっています。エラトステネスの答えは、これにとても近かったのです。", "スタジアという単位の長さには諸説あって、エラトステネスの答えには、ほどよい偶然も味方したと言われます。それでも、大事なのは「測り方」そのものでした。", "一部分の角度（7.2°が全体の何分の1か）と、一部分の距離が分かれば、全体の大きさが計算できます。直接測れない大きなものでも、この方法なら測れるのです。", "「地球が丸い」ことが前提の測り方でした。影の違いを、「地面の傾き」のせいだと考えた発想が、2200年以上前のものとは思えないほど鮮やかです。"], "en": ["Modern measurements say the distance around the Earth through the North and South Poles — along a meridian — is about 40,008 kilometers. Eratosthenes' answer was very close to this.", "There are different theories about the length of the stadion, and people say a measure of good luck may have helped his answer. Even so, what mattered most was the method itself.", "If you know the angle of one part (what fraction of the whole 7.2 degrees is) and the distance of that part, you can compute the size of the whole. Even things too big to measure directly can be measured this way.", "The method rests on the Earth being round. The idea that different shadows come from the tilt of the ground is astonishingly fresh for something thought up more than 2,200 years ago."]}, {"ja": ["「じゃあ、ユイも棒と影で何か測ってみるか。」おじいちゃんが言いました。「太陽の高さと影の長さには、決まった関係があるんだ。」", "たとえば、1mの棒の影が1mなら、太陽の光の角度は45°です。棒と影の長さの割合（比例）を使えば、直接測れない木の高さや、建物の高さも求められます。", "エラトステネスの方法の芯は、「一部を見て、全体を考える」ことです。そのために使ったのは、角度と比例という、算数と数学の基本の道具でした。", "測れないほど大きな地球も、棒1本の影の前に、正体を現しました。ユイは窓の外の、夕日の長い影を見ました。「今度は、私が何かを測ってみる。」"], "en": ["\"Well then, shall we measure something with a stick and a shadow, too?\" said her grandfather. \"The sun's height and the length of a shadow are tied together by a fixed relation.\"", "For example, if a 1-meter stick casts a 1-meter shadow, the sun's rays come in at 45 degrees. Using the proportion between the stick and its shadow, you can find the height of a tree or a building that you cannot measure directly.", "The heart of Eratosthenes' method is \"look at a part, and think about the whole.\" The tools he used were angle and proportion — the basic tools of arithmetic and mathematics.", "Even the Earth, too big to measure, revealed itself before the shadow of a single stick. Yui looked out at the long shadows of the setting sun. \"Next time, I'll measure something myself.\""]}], "column": {"ja": ["エラトステネス（紀元前276年ごろ〜紀元前194年ごろ）は、古代ギリシャの学者で、エジプトのアレクサンドリアにある大図書館の館長でした。数学、天文学、地理学、詩にまで通じた、その時代を代表する大学者です。", "素数を見つける「エラトステネスのふるい」の考案者としても知られています。数を並べて、2の倍数、3の倍数……と消していく、あの方法です。地球の測定と素数のふるい、一人の人がどちらの仕事もしていたのです。", "地球一周の測定は、紀元前240年ごろのこととされています。シエネの井戸の話に目をつけた観察力、2つの町の距離を専門の歩測係に測らせた準備のよさ、そして角度と比例で計算する数学の力。その3つがそろって、歴史に残る測定になりました。", "地球の大きさが分かると、地図作りが大きく進みます。のちの大航海時代に人々が海へ出られたのも、「地球がどれだけ大きくて、どんな形か」が分かっていたからです。棒1本の影から始まった測定は、世界の姿を明らかにする第一歩だったのです。"], "en": ["Eratosthenes (about 276 BC to about 194 BC) was an ancient Greek scholar who directed the great Library of Alexandria in Egypt. He was a leading scholar of his age, at home in mathematics, astronomy, geography, and even poetry.", "He is also known as the inventor of the \"sieve of Eratosthenes\" for finding prime numbers — the method where you line up numbers and cross out the multiples of 2, then of 3, and so on. The measuring of the Earth and the sieve of primes were the work of one and the same person.", "His measurement of the Earth's circumference is thought to date from about 240 BC. An observant eye that seized on the story of the well at Syene, careful preparation in having professional pacers measure the distance between the cities, and the power of mathematics to compute with angles and proportion — with all three together, the measurement went down in history.", "Once the size of the Earth is known, mapmaking advances greatly. The sailors of the later Age of Exploration could set out to sea because people knew how big the Earth is and what shape it has. A measurement that began with the shadow of one stick was the first step toward revealing the true picture of our world."]}, "quiz": {"ja": ["Q1 アレクサンドリアでの影の角度7.2°は、円を一周する360°の何分の1ですか。　答え：50分の1です。360÷7.2＝50なので、2つの町の間の距離は、地球一周の50分の1にあたります。", "Q2 2つの町の間の距離が約5000スタジアで、それが地球一周の50分の1だとすると、地球一周は何スタジアですか。　答え：約25万スタジアです。5000×50＝250,000スタジアで、今の単位では約4万kmにあたります。", "Q3 長さ1mの棒の影が、ちょうど1mになりました。太陽の光の角度は、何度ですか。　答え：45°です。棒と影が同じ長さのとき、棒・影・光の線で、直角二等辺三角形ができるからです。"], "en": ["Q1 The shadow's angle in Alexandria was 7.2 degrees. What fraction of a full circle, 360 degrees, is that?　Answer: One fiftieth. Since 360 ÷ 7.2 = 50, the distance between the two cities is one fiftieth of the way around the Earth.", "Q2 If the distance between the two cities is about 5,000 stadia, and that is one fiftieth of the way around the Earth, how many stadia is it around the Earth?　Answer: About 250,000 stadia. 5,000 × 50 = 250,000 stadia, which is about 40,000 kilometers in modern units.", "Q3 A stick 1 meter long casts a shadow of exactly 1 meter. At what angle are the sun's rays coming in?　Answer: 45 degrees. When the stick and its shadow are the same length, the stick, the shadow, and the sun's ray form a right isosceles triangle."]}, "corner": {"ja": ["棒と影で、高い木の高さを測ってみましょう。晴れた日に、まず長さの分かっている棒（1mの物差しなど）を地面に縦に立て、棒の影の長さを測ります。次に、木の影の長さを測ります。同じ時刻なら、太陽の光の角度は同じなので、「棒の高さ：棒の影＝木の高さ：木の影」という比例が成り立ちます。たとえば棒の影が0.5m、木の影が6mなら、木の高さは1×6÷0.5＝12mです。", "影の角度も確かめてみましょう。棒の長さと影の長さがちょうど同じになるとき、太陽の光の角度は45°です。午前と午後で影の長さと向きがどう変わるか、1時間ごとに棒の影の先に印をつけて観察すると、地球が回っていることも実感できます（影を直接見るときは、太陽を見ないように気をつけてください）。", "エラトステネスの計算を追いかけてみましょう。影の角度7.2°は、360°の何分の1ですか。360÷7.2＝50で、50分の1です。そして5000スタジア×50＝25万スタジア。電卓で確かめてください。ついでに、地球一周約4万kmは、日本列島の長さ（約3000km）のおよそ何倍かも計算してみましょう（約13倍です）。", "「円の何分の1か」で考える場面は、身の回りにもあります。ピザやケーキを8等分すると、一切れの角度は360÷8＝45°です。時計の文字盤で、針が1時間に進む角度は360÷12＝30°です。「全体の何分の1」という見方は、角度の計算の第一歩です。"], "en": ["Let's measure the height of a tall tree with a stick and a shadow. On a sunny day, stand a stick of known length (such as a 1-meter ruler) upright on the ground, and measure its shadow. Then measure the tree's shadow. At the same moment, the sun's rays have the same angle, so a proportion holds: \"stick's height : stick's shadow = tree's height : tree's shadow.\" If the stick's shadow is 0.5 m and the tree's shadow is 6 m, the tree is 1 × 6 ÷ 0.5 = 12 m tall.", "Check the shadow's angle, too. When the stick's length and its shadow are exactly the same, the sun's rays are at 45 degrees. If you mark the tip of the stick's shadow every hour, you can watch how its length and direction change through the day — and feel the Earth turning. (When you look at shadows, be careful never to look at the sun itself.)", "Follow Eratosthenes' calculation. What fraction of 360 degrees is the shadow's angle, 7.2 degrees? 360 ÷ 7.2 = 50, so it is one fiftieth. And 5,000 stadia × 50 = 250,000 stadia. Check it with a calculator. While you are at it, compute about how many times the length of the Japanese islands (about 3,000
