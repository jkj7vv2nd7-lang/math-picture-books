l fact\" is also an important part of learning history.", "Gauss (1777–1855) later became a great mathematician, sometimes called the \"Prince of Mathematicians\". His work ranged over number theory, the normal distribution in statistics, and computing orbits in astronomy. The flash of insight that saw 5050 in an instant may well have been the starting point of a great mathematician's way of thinking."]}, "quiz": {"ja": ["Q1. 1から20までの数を、全部足すといくつでしょう。　答え：210。（はじめ＋最後）×個数÷2 ＝（1＋20）×20÷2 ＝ 210 です。", "Q2. ●を三角に並べたとき、5段目までの丸の合計（三角数）はいくつでしょう。（ア）10 （イ）15 （ウ）25　答え：（イ）15。1＋2＋3＋4＋5＝15 で、式では 5×6÷2＝15 です。", "Q3. 1から100までの、偶数の合計と奇数の合計の差はいくつでしょう。　答え：50。2−1、4−3、6−5、…のようにペアにすると差はどれも1で、ペアが50組あるからです。"], "en": ["Q1. If you add up all the numbers from 1 to 20, what do you get?　Answer: 210. Using (first + last) × count ÷ 2 = (1+20)×20÷2 = 210.", "Q2. When dots are arranged in a triangle, what is the total number of dots up to the 5th row (a triangular number)? (a) 10 (b) 15 (c) 25　Answer: (b) 15. 1+2+3+4+5=15, and by the formula, 5×6÷2=15.", "Q3. Between the sum of the even numbers and the sum of the odd numbers from 1 to 100, what is the difference?　Answer: 50. Pairing them as 2−1, 4−3, 6−5, … every difference is 1, and there are 50 pairs."]}, "corner": {"ja": ["用意するものは、丸く切った折り紙やおはじき、ボタンなど、小さなもの36個ほどです。なければ、ノートに●を描いて考えるのでもかまいません。", "まず、三角に並べてみましょう。1段目に1個、2段目に2個と増やしていき、5段目まで作ります。丸は全部で何個でしょう。数えて答えを出したあと、式「5×6÷2」でも計算して、答えが合うか確かめてください。", "次は四角です。奇数の丸を「L字」の形に足していくと、四角が育ちます。1個の次に3個をL字に足すと2×2の四角、さらに5個を足すと3×3の四角です。7個、9個と続けると、何×何の四角になるか試してみましょう。", "最後に挑戦です。1から100までの偶数だけの合計と、奇数だけの合計を、それぞれ求めてみましょう。ペアの考え方と「（はじめ＋最後）×個数÷2」の公式が使えます（答えは、偶数の合計2550、奇数の合計2500です）。"], "en": ["You will need about 36 small round things — circles cut from origami paper, ohajiki counters, or buttons. If you do not have any, you can just draw ● in your notebook instead.", "First, arrange them in a triangle. Put 1 in the first row, 2 in the second, and keep going up to 5 rows. How many circles are there in total? Count them first, then compute with the formula \"5×6÷2\" and check that the answers agree.", "Next, squares. If you add odd numbers of circles in an \"L\" shape, a square grows. After 1 circle, adding 3 in an L makes a 2×2 square; adding 5 more makes a 3×3 square. Keep going with 7 and 9, and see what size of square you get each time.", "Finally, a challenge. Find the sum of just the even numbers from 1 to 100, and the sum of just the odd numbers. The pairing idea and the formula \"(first + last) × count ÷ 2\" will help. (The answers are 2550 for the evens and 2500 for the odds.)"]}}, {"id": "platonic", "title": {"ja": "正多面体はなぜ5つだけ？ ― 折って、数えて、見つけるおはなし", "en": "Why Are There Only Five Regular Polyhedra? — Folding, Counting, and Finding Out"}, "sub": {"ja": "小学校高学年〜中学生向け・正三角形と正方形と正五角形を折って確かめる、5種類だけの立体とオイラーの式", "en": "For upper elementary to middle school — folding triangles, squares, and pentagons to meet the five solids and Euler's formula"}, "cover": "pla1.jpg", "images": ["pla1.jpg", "pla2.jpg", "pla3.jpg", "pla4.jpg", "pla5.jpg", "pla5.jpg"], "pages": [{"ja": ["ある日の工作まじりの数学の時間、サワダ先生が色とりどりの厚紙のピースを配りました。どれも正三角形の形をしています。「今日は、このピースを組み合わせて、立体を作ってみよう。ただし約束が2つ。使う面は全部同じ正多角形にすること。そして、どの頂点でも、集まる面の数が同じになるようにすること。」", "「そんな立体、たくさんできそう！」ミオは、さっそくピースを机に並べました。面が全部同じ正多角形で、どの頂点も同じ集まり方をしている立体を「正多面体」といいます。サイコロの形（立方体）が、その代表です。", "ミオは、まず正三角形を3枚、1つの頂点に集めてみました。紙の端を持ち上げて折っていくと、カチッととんがりが立ちました。残りの面もつなぐと、ピラミッドのような、底も正三角形の立体ができました。「できた！ 三角形が4枚の立体！」", "それが「正四面体」です。面は4つ、全部が正三角形。ミオはノートに「正三角形×3枚を1つの頂点に集める」と書きました。さて、4枚集めたらどうなるでしょう。"], "en": ["One day, in a math class with a craft twist, Mr. Sawada handed out colourful pieces of thick paper, every one a regular triangle. \"Today, let us build solids from these pieces. But there are two promises. Every face must be the same regular polygon. And at every vertex, the same number of faces must meet.\"", "\"I bet we can make loads of them!\" Mio spread the pieces over her desk. A solid whose faces are all the same regular polygon, with the same arrangement at every vertex, is called a \"regular polyhedron\". A die — a cube — is the most familiar example.", "Mio began by gathering three triangles at one vertex. When she lifted the edges and folded, click — a point stood up. Joining the remaining faces gave a pyramid-like solid whose base was also a triangle. \"I did it! A solid made of four triangles!\"", "That is the \"regular tetrahedron\": four faces, all regular triangles. In her notebook Mio wrote, \"Three triangles meet at one vertex.\" Now — what happens with four?"]}, {"ja": ["頂点に4枚の正三角形を集めて折ると、上下にとんがりのある、そろばん玉のような立体になりました。面は8つ。「正八面体」です。5枚集めると、もっとまん丸に近い、面が20個もある「正二十面体」ができました。", "では、6枚集めたらどうでしょう。ミオは机の上で6枚の正三角形を1点に集めてみました。ところが、どう折ろうとしても、とんがりができません。6枚はきっちり平らに並んでしまうのです。", "正三角形の1つの角は60°です。頂点に3枚集まると角の合計は60×3＝180°、4枚では240°、5枚では300°。けれど6枚では60×6＝360°になって、平面とぴったり同じになってしまいます。", "とんがりができるためには、頂点に集まる角の合計が360°より小さくなければいけません。360°ちょうどでは平ら、360°を超えると紙が重なってしまいます。正三角形で作れるのは、3枚、4枚、5枚の3通りだけでした。"], "en": ["Gathering four triangles at a vertex and folding gave a solid with points at the top and bottom, like a spinning top. It had eight faces: the \"regular octahedron\". With five triangles, she got the rounder \"regular icosahedron\", with twenty faces.", "But what about six? Mio laid six triangles around one point on her desk. No matter how she tried, no point would stand up. The six triangles lay perfectly flat.", "Each angle of a regular triangle is 60°. Three at a vertex make 60×3=180°, four make 240°, five make 300°. But six make 60×6=360° — exactly the same as a flat plane.", "For a point to stand up, the angles meeting at a vertex must add to less than 360°. At exactly 360° the shape is flat, and over 360° the paper overlaps. With triangles, only three gatherings work: 3, 4, and 5 faces."]}, {"ja": ["今度は正方形のピースです。1つの角は90°。3枚集めると90×3＝270°で、折るとサイコロの角ができました。面6つの「立方体」です。けれど4枚では90×4＝360°で、やっぱり平らになってしまいます。", "次は正五角形。1つの角は108°と大きめです。3枚集めると108×3＝324°で、なんとか360°より小さく、折り上げることができました。面が12個の「正十二面体」です。4枚では108×4＝432°と360°を超えて、紙が重なってしまいます。", "では正六角形はどうでしょう。1つの角は120°で、3枚集めるだけで120×3＝360°。ハチの巣のように平らに広がるだけで、立体にはなりません。正七角形は1つの角が約129°ともっと大きいので、3枚で約386°と、はじめから360°を超えてしまいます。", "つまり、組み合わせは全部で5通りだけ。正三角形から3種類、正方形から1種類、正五角形から1種類。これが、正多面体が5種類しかない理由です。ミオは「角の合計の見張り番だね」と笑いました。"], "en": ["Next came square pieces. Each angle is 90°. Three squares make 90×3=270°, and folding them gives the corner of a die: the six-faced \"cube\". But four squares make 90×4=360° — flat again.", "Then pentagons, with a larger angle of 108°. Three of them make 108×3=324°, still less than 360°, so they fold up into the twelve-faced \"regular dodecahedron\". Four would make 108×4=432°, over 360°, and the paper overlaps.", "What about hexagons? Each angle is 120°, so just three make 120×3=360°. They spread out flat like a honeycomb and never become a solid. Heptagons have an even larger angle, about 129°, so three already make about 386° — over the limit from the very start.", "So there are only five combinations in all: three from triangles, one from squares, and one from pentagons. That is why there are only five regular polyhedra. \"The angle total is the gatekeeper!\" laughed Mio."]}, {"ja": ["できた5つの立体を並べて、ミオたちは「頂点の数」「辺の数」「面の数」を数え始めました。数え間違えないように、頂点には小さなシールを貼りながら数えます。", "正四面体は頂点4・辺6・面4。立方体は頂点8・辺12・面6。正八面体は頂点6・辺12・面8。正十二面体は頂点20・辺30・面12。正二十面体は頂点12・辺30・面20でした。", "「あれ？」ミオが首をかしげました。「頂点から辺を引いて、面を足してみて。4−6＋4＝2、8−12＋6＝2、6−12＋8＝2……。全部2になる！」正十二面体でも20−30＋12＝2、正二十面体でも12−30＋20＝2。大きな立体でも、ぴたり2でした。", "この「頂点−辺＋面＝2」という式は、約270年前、数学者オイラーが見つけたものです。5つの立体ぜんぶで成り立つどころか、へこみのない立体なら、どんな多面体でも成り立つという、不思議な式でした。"], "en": ["Lining up the five finished solids, Mio and her classmates began counting vertices, edges, and faces. To avoid mistakes, they stuck a tiny sticker on each vertex as they counted.", "The tetrahedron had 4 vertices, 6 edges, 4 faces. The cube: 8 vertices, 12 edges, 6 faces. The octahedron: 6 vertices, 12 edges, 8 faces. The dodecahedron: 20 vertices, 30 edges, 12 faces. The icosahedron: 12 vertices, 30 edges, 20 faces.", "\"Wait a moment…\" Mio tilted her head. \"Try vertices minus edges plus faces. 4−6+4=2, 8−12+6=2, 6−12+8=2… It's 2 every time!\" The dodecahedron gave 20−30+12=2, and the icosahedron 12−30+20=2. Even the biggest solids landed exactly on 2.", "This formula, \"vertices − edges + faces = 2\", was found about 270 years ago by the mathematician Euler. It holds not only for these five solids, but for any polyhedron without dents — a truly magical formula."]}, {"ja": ["数えた表をじっと見ていたミオが、もう1つ発見しました。「立方体は面6・頂点8、正八面体は面8・頂点6。面と頂点の数が、入れ替わっている！」", "正十二面体（面12・頂点20）と正二十面体（面20・頂点12）も、同じ関係です。正四面体（面4・頂点4）だけは、入れ替えても自分自身。まるで、双子のような立体の組があるのです。", "実際に、それぞれの面の真ん中に点を打って、その点同士を結んでいくと、相方の立体が姿を現します。立方体の6つの面の真ん中を結ぶと正八面体が、正八面体の8つの面の真ん中を結ぶと立方体ができるのです。この関係を「双対（そうつい）」といいます。", "サッカーボールの模様も思い出してください。あれは正五角形12個と正六角形20個からできた立体（面32・頂点60・辺90）で、60−90＋32＝2。正多面体ではないのに、オイラーの式はやっぱり成り立っています。"], "en": ["Staring at the table of numbers, Mio made one more discovery. \"The cube has 6 faces and 8 vertices. The octahedron has 8 faces and 6 vertices. Faces and vertices have swapped places!\"", "The dodecahedron (12 faces, 20 vertices) and the icosahedron (20 faces, 12 vertices) share the same relationship. Only the tetrahedron (4 faces, 4 vertices) swaps with itself. It is as if the solids come in twin pairs.", "And it is true: if you mark the centre of every face and join those points, the partner solid appears. Joining the centres of a cube's six faces makes an octahedron, and joining the centres of an octahedron's eight faces makes a cube. This relationship is called \"duality\".", "Remember the pattern of a soccer ball, too. It is a solid made of 12 pentagons and 20 hexagons (32 faces, 60 vertices, 90 edges), and 60−90+32=2. It is not a regular polyhedron, yet Euler's formula still holds."]}, {"ja": ["授業の終わりに、サワダ先生は少し懐かしそうに話しました。「先生が中学校で教えていたころ、平らな紙の状態から、輪ゴムの力でスーッと正十二面体が立ち上がる工作を見せたことがあるんだ。教室中から『おおっ』と声が上がったよ。」", "正多面体の話は、とても古くから知られていました。いまから約2300年前、ギリシャの数学者ユークリッドは『原論』という本の最後の巻（第13巻）で、5つの立体の作り方を示し、これ以外の正多面体は作れないことを明らかにしました。", "哲学者プラトンは、この5つの立体を、世界の材料（元素）と結びつけました。正四面体は火、立方体は土、正八面体は空気、正二十面体は水、そして正十二面体は宇宙全体の形だと考えたのです。そのため正多面体は「プラトンの立体」とも呼ばれます。", "「5つしかない、というのは、さびしい話じゃないんだ。」ミオは5つの立体を机に並べ直しました。「5つしかないからこそ、全部に名前があって、全部に物語があるんだね。」身の回りのサイコロも、サッカーボールも、急に物語の登場人物に見えてきました。"], "en": ["At the end of the lesson, Mr. Sawada grew nostalgic. \"When I taught at a junior high school, I once showed my class a paper dodecahedron that rose up by itself from a flat sheet, pulled by rubber bands. The whole classroom gasped 'Ohhh!'\"", "The story of the regular polyhedra is a very old one. About 2,300 years ago, the Greek mathematician Euclid, in the last book (Book 13) of his work the Elements, showed how to build the five solids, and made clear that no other regular polyhedron can be built.", "The philosopher Plato connected the five solids with the materials of the world — the elements. The tetrahedron was fire, the cube earth, the octahedron air, the icosahedron water, and the dodecahedron the shape of the whole universe. That is why the regular polyhedra are also called the \"Platonic solids\".", "\"Only five is not a sad story at all,\" said Mio, lining the five solids up again. \"Because there are only five, every one of them has a name, and every one has a story.\" Suddenly the die and the soccer ball at home looked like characters in a tale."]}], "column": {"ja": ["正多面体が「プラトンの立体」とも呼ばれるのは、哲学者プラトン（紀元前427年ごろ〜紀元前347年ごろ）が対話篇『ティマイオス』で、世界の材料である元素と結びつけたからです。火は正四面体、土は立方体、空気は正八面体、水は正二十面体、そして正十二面体は宇宙全体を包む形とされました。", "数学として5種類しかないことを示したのは、ユークリッドの『原論』（紀元前300年ごろ）です。全13巻の最後、第13巻で5つの立体の作り方が示され、「ほかには作れない」ことが確かめられました。現代の言い方では、頂点に集まる角の合計が360°未満という条件から、組み合わせが5通りに限られる、という証明です。", "「頂点−辺＋面＝2」の式を見つけたのは、スイスの数学者レオンハルト・オイラー（1707〜1783）です。1750年ごろ、友人の数学者ゴルトバハへの手紙でこの関係を伝え、1752年に発表しました。へこみのない多面体なら、正多面体でなくても成り立つ、普遍的な法則です。", "この法則は現代の科学にもつながっています。1985年には、炭素の原子60個がサッカーボールと同じ形に結びついた分子（フラーレン）が見つかりました。頂点60・辺90・面32で、やはり頂点−辺＋面＝2です。古代ギリシャの立体が、最新の科学の舞台にも立っているのです。"], "en": ["The regular polyhedra are also called the \"Platonic solids\" because the philosopher Plato (about 427–347 BC), in his dialogue Timaeus, connected them with the elements that make up the world. Fire was the tetrahedron, earth the cube, air the octahedron, water the icosahedron, and the dodecahedron was the shape embracing the whole universe.", "It was Euclid's Elements (about 300 BC) that showed, as mathematics, that there can be only five. In Book 13, the last of the thirteen books, the construction of the five solids is given, and it is established that no others can be made. In modern words: the angles at a vertex must total less than 360°, and that condition leaves only five combinations.", "The formula \"vertices − edges + faces = 2\" was found by the Swiss mathematician Leonhard Euler (1707–1783). Around 1750 he reported the relationship in a letter to his fellow mathematician Goldbach, and published it in 1752. It is a universal law: it holds for any polyhedron without dents, regular or not.", "The law reaches into modern science, too. In 1985, scientists found a molecule (a fullerene) in which 60 carbon atoms join in exactly the pattern of a soccer ball: 60 vertices, 90 edges, 32 faces — and again vertices − edges + faces = 2. The solids of ancient Greece are standing on the stage of the newest science."]}, "quiz": {"ja": ["Q1. 立方体の頂点の数と辺の数はいくつでしょう。　答え：頂点8、辺12。面は6つで、8−12＋6＝2になります。", "Q2. 正五角形を1つの頂点に3枚集めると、角の合計は何度でしょう。また、できる立体は何でしょう。　答え：108×3＝324度。正十二面体（面12）ができます。", "Q3. ある多面体は、面が8つ、頂点が6つあります。オイラーの式を使うと、辺の数はいくつでしょう。　答え：12。頂点−辺＋面＝2 なので、6−辺＋8＝2、辺＝12です（正八面体です）。"], "en": ["Q1. How many vertices and how many edges does a cube have?　Answer: 8 vertices and 12 edges. It has 6 faces, and 8−12+6=2.", "Q2. When three regular pentagons meet at one vertex, what is the total of their angles, and what solid can be built?　Answer: 108×3=324 degrees. The regular dodecahedron (12 faces) can be built.", "Q3. A polyhedron has 8 faces and 6 vertices. Using Euler's formula, how many edges does it have?　Answer: 12. Since vertices − edges + faces = 2, we get 6 − edges + 8 = 2, so edges = 12 (it is the regular octahedron)."]}, "corner": {"ja": ["この絵本には、正十二面体の型紙が2種類ついています。1つ目は、のりしろを貼り合わせて作る型紙（A4判）です。印刷して切り取り、山折りにして貼り合わせながら、面12・頂点20・辺30を、指で触って数えてみてください。", "2つ目は「立ち上がる正十二面体」の型紙です。正五角形6個の部品を2つ作ります。板目紙などの厚紙に印刷して切り取り、破線を山折りにして、折り目をしっかりつけます。紙は、板目紙のような、しっかりした厚紙がおすすめです。湿布薬の箱や、固めの和菓子の箱のような、身近な箱の板紙を展開しても作れます。部品をそれぞれ、おわんの形に折り曲げます。2つのおわんは、片方のとんがった頂点が、もう片方の谷に合うように、少しずらして（互い違いに）合わせます。合わせ目の外側に、輪ゴム1本を一周の輪としてかけると、立体の形が保たれます。輪ゴムは、側面の五角形の外側の頂点を結ぶように通り、くぼみのところでは、まっすぐ橋渡しするようになります。輪ゴムは1本で十分で、1本の方が引っかけやすいです。長さは、一回り小さめが目安です（短いときは、2〜3本つないで1本の輪にして調節してください）。", "遊び方はかんたんです。両手でそっとつぶして押さえ、手を離すと、輪ゴムが縮もうとする力で、スーッと正十二面体が立ち上がります。この工作は『算数・数学おもちゃ箱』（小沢健一・数学教育協議会／国土社）で紹介されたもので、型紙は今回書き下ろしました。穴を開けて輪ゴムを通す作り方もありますが、この型紙では、紙の強さと弾力を保つため、穴を開けない作り方にしています。教室で見せると「おおっ」と声が上がる、とっておきの仕掛けです。", "輪ゴムかけには、ちょっとしたコツがあります。合わせ目を片手で押さえながら、輪ゴムを引っぱって広げ、頂点の外側へぐるっと一周かけていくと、うまくいきます（下の図解を見てください）。初めは輪ゴムが外れて、苦労するかもしれません。でも、何度かやって、うまくかけられたときのうれしさは格別です。あきらめずに挑戦してみてください。", "発展です。正六面体（立方体）と正八面体、正二十面体も、同じ仕掛けで立ち上がらせることができます。正六面体は正方形3枚、正八面体は正三角形4枚、正二十面体は正三角形10枚の部品を2つずつ作ります。型紙と作り方は、Web版の発展ページ「立ち上がる正多面体」にあります。正四面体は、半分に分けると2枚ずつになって、おわんの形になりません。どうすれば立ち上がるか、考えてみてください。", "紙の正多角形で「角の見張り番」も確かめましょう。正三角形6枚・正方形4枚・正六角形3枚を1つの頂点に集めると、どれも平らになります（1つの角の大きさ×枚数＝360°）。家にある立体でもオイラーの式が確かめられます。ティッシュの箱なら頂点8−辺12＋面6＝2。挑戦問題です。立方体の展開図は全部で何種類あるでしょう（答えは11種類です）。"], "en": ["This picture book comes with two paper patterns for a regular dodecahedron. The first is a glue-together pattern (A4 size). Print it, cut it out, fold on the mountain lines, and glue the tabs as you count with your fingers: 12 faces, 20 vertices, 30 edges.", "The second pattern makes a \"stand-up dodecahedron,\" from two parts of six pentagons each. Print it on thick card — a stiff board paper is best; the board from an everyday box, such as a stiff sweets box, works well too — cut it out, and crease the dashed mountain folds firmly. Fold each part into a bowl. Put the two bowls together shifted a little, so that the pointed vertices of one fit into the notches of the other. Then stretch one rubber band around the outside of the joining seam as a single loop, and the solid holds its shape. The band runs along the outer side, joining the outer vertices of the side pentagons, and bridges straight across the notches. One band is enough — in fact, a single band is easier to hook on. It should be a little shorter than one full loop (if your band is too short, join two or three to make one longer loop).", "Playing is easy. Press the solid gently flat with both hands and hold it — then let go, and the rubber band's pull stands the dodecahedron smoothly back up. This craft was introduced in a Japanese book of mathematics toys (by Kenichi Ozawa and the Association of Mathematical Instruction, Kokudosha), and the pattern here was newly drawn for this book. Some versions punch holes and thread the band through, but this pattern uses no holes, so the paper keeps its strength and spring. It is a showpiece that makes a whole classroom gasp.", "Putting the band on has a little knack. Hold the seam closed with one hand, pull the band wide, and work it around the outside of the vertices in one loop (see the diagram below). At first the band may keep popping off, and it can be a struggle — but the joy when it finally stays on is something special. Keep trying.", "Going further: a cube, a regular octahedron and a regular icosahedron can also stand up by the same trick. The cube uses two parts of three squares, the octahedron two parts of four triangles, and the icosahedron two parts of ten triangles. The patterns and steps are on the extra page \"Standing-Up Regular Solids\" in the web version. A regular tetrahedron splits into two faces and two faces, which cannot form a bowl — how could you make it stand up? Think about it.", "Check the \"angle gatekeeper\" with paper polygons, too. Six triangles, four squares, or three hexagons around one vertex all lie perfectly flat (one angle × number of pieces = 360°). You can also test Euler's formula on solids at home: a tissue box gives 8 vertices − 12 edges + 6 faces = 2. And here is a challenge: how many different nets does a cube have in all? (The answer is 11.)"]}}, {"id": "hearts", "title": {"ja": "ハートはつながる？ ― 直交メビウスのおはなし", "en": "Will the Hearts Stay Together? — A Story of Two Crossed Möbius Rings"}, "sub": {"ja": "小学校高学年〜中学生向け・2つのメビウスの輪で試す、つながりのふしぎ", "en": "For upper elementary and junior high students — two Möbius rings and the mystery of linking"}, "cover": "hrt1.jpg", "images": ["hrt1.jpg", "hrt2.jpg", "hrt3.jpg", "hrt4.jpg", "hrt5.jpg", "hrt5.jpg"], "pages": [{"ja": ["ユイは、夏休みに作ったメビウスの帯のことを、よく覚えていました。片方のはしを半回転させてから貼った帯は、面が1つしかなく、真ん中を切ると大きな輪が1つできる、不思議な帯でした。", "秋祭りの前の晩、おじいちゃんは赤と白の長い紙の帯を2本、テーブルの上に置きました。「今日は、そのメビウスの帯を2つ使った、特別なおみくじを教えてあげよう。」", "「おみくじ？」ユイは目を丸くしました。おじいちゃんは笑って言いました。「輪を2つ貼り合わせて切ると、ハートが2つ出てくるんだよ。そのハートが手をつないでいたら、大吉だ。」", "ユイはわくわくして、赤い帯を手に取りました。願いごとは、来月の合唱コンクールで、みんなと心を合わせて歌えることです。"], "en": ["Yui still remembered the Möbius band she had made during the summer holidays. A band made by giving one end a half twist before gluing had only one side, and cutting it down the middle produced one big ring — a very strange band indeed.", "On the evening before the autumn festival, her grandfather placed two long paper strips, one red and one white, on the table. \"Today I will teach you a special fortune-telling trick that uses two of those Möbius bands.\"", "\"A fortune?\" Yui's eyes went round. Her grandfather smiled. \"Glue two rings together, cut them, and two hearts come out. If the hearts are holding hands, your fortune is the very best.\"", "Excited, Yui picked up the red strip. Her wish was that everyone in the school choir contest next month could sing with their hearts joined together."]}, {"ja": ["まず、赤い帯と白い帯で、メビウスの帯を1つずつ作ります。片方のはしを半回転させてから、はし同士をのりで貼ります。「面が1つ」の輪が、赤と白、2つできました。", "次に、2つの輪を十字に交わるように重ねて、交わった正方形のところだけを、しっかりのりで貼り付けます。上から見ると、まるで十文字です。2つの輪が直角に交わっているので、これは「直交メビウス」と呼ばれます。", "そして、両方の輪の真ん中に、点線を引きます。貼り付けた正方形の上にも、切れ目なく点線が通るようにするのが大事な約束です。", "「さあ、この点線のとおりに、両方の輪を切り分けていくよ。」おじいちゃんは、はさみをユイに渡しました。「ハートが手をつなぐかどうかは、切ってみるまで分からない。……本当にそうかな？」おじいちゃんは、にやりとしました。"], "en": ["First, they made one Möbius band from the red strip and one from the white strip. Give one end a half twist, then glue the ends together. Now there were two rings with only one side each — one red, one white.", "Next, they laid the two rings across each other like a cross and glued them firmly, but only at the square where they crossed. Seen from above, it looked like a plus sign. Because the two rings cross at a right angle, this shape is called crossed Möbius rings.", "Then they drew a dotted line along the middle of both rings. The important promise was that the dotted line must run across the glued square without a break.", "\"Now cut both rings apart along these dotted lines.\" Her grandfather handed Yui the scissors. \"Nobody knows whether the hearts will hold hands until we cut. …Or do we?\" He grinned."]}, {"ja": ["ユイは点線に沿って、そっとはさみを進めました。貼り付けた正方形のところも、そのまま切り進みます。輪1つの分を切り終わり、もう1つの輪も切り終わると……。", "テーブルに広がったのは、細長い帯でできたハートの形が2つ。しかも、その2つのハートは、輪のように手をつないでいて、離そうとしても離れません！", "「大吉だ！」ユイは大喜びです。でも、よく見ると不思議なことがありました。ハート1つは、半分が赤で、半分が白なのです。もう1つも同じです。赤い輪と白い輪は、途中で相手を交換したみたいに混ざり合っていました。", "おじいちゃんは言いました。「いつも手をつなぐと思うかい。もう一度作ってごらん。今度は、ねじる向きを変えてみるといい。」"], "en": ["Yui moved the scissors carefully along the dotted line. She cut straight through the glued square as well. When she had finished cutting the first ring, and then the second ring…", "Spread out on the table were two heart shapes made of thin paper bands. And the two hearts were linked together like rings — holding hands — and no gentle pulling could separate them!", "\"The best fortune!\" Yui was delighted. But looking closer, she noticed something odd. Each heart was half red and half white. Both of them. It was as if the red ring and the white ring had swapped partners halfway along.", "Her grandfather said, \"Do you think they always hold hands? Make it once more. This time, try twisting the other way.\""]}, {"ja": ["2回目は、両方の輪とも、さっきとは反対の向きにねじって作りました。十字に貼って、点線を引いて、切ってみると……今度はハートが2つ、バラバラに転がりました。手をつないでいません。", "「どうして？」ユイは首をかしげます。作り方は同じだったのに。おじいちゃんは、輪を1つ手に取って、ぺたんと潰して三角形の形にしました。「立体のままでは見えないことも、平らに潰すと見えてくる。次元を下げるって言うんだ。」", "三角形になった輪をのぞくと、紙が3枚重なっているのが見えます。1層目から2層目、3層目へと、重なりの順番を追ってみると、時計回りに回る輪と、反時計回りに回る輪があるのです。", "「時計回りの輪をα（アルファ）型、反対をβ（ベータ）型と呼ぼう。輪の形を少しくしゃくしゃにしても、この順番だけは変わらない。変わらないものを見つけるのが、数学の大事な手がかりなんだ。」"], "en": ["The second time, Yui twisted both rings in the opposite direction from before. She glued them in a cross, drew the dotted lines, and cut. This time, the two hearts tumbled out separately. They were not holding hands at all.", "\"Why?\" Yui tilted her head. She had made them in exactly the same way. Her grandfather picked up one ring and squashed it flat into a triangle. \"Some things you cannot see while a shape is solid become visible when you flatten it. We call that lowering the dimension.\"", "Looking into the flattened triangle ring, she could see the paper lying in three layers. Following the order of the layers — first, second, third — some rings went around clockwise, and others went counterclockwise.", "\"Let us call a clockwise ring a type-alpha ring, and the other a type-beta ring. Wiggle the ring as much as you like; this order never changes. Finding the thing that does not change is one of the great clues in mathematics.\""]}, {"ja": ["ユイはノートに書き出しました。輪が2つあるから、組み合わせは3通り。α型とα型、α型とβ型、β型とβ型。場合分けをして、1つずつ確かめればいいのです。", "さっきの結果を当てはめます。1回目は、手をつなぎました。輪の型を調べると、赤がα型、白がβ型でした。2回目は、両方とも同じ型どうしで、ハートはバラバラでした。", "「つまり、α型とβ型の組み合わせのときだけ、ハートは手をつなぐんだね！」ユイは顔を上げました。「同じ型どうしは、バラバラ。」", "おじいちゃんはうなずきました。「切る前に、型を調べて予想する。それがおみくじじゃなくて、数学だ。」ユイは3回目、片方をα型、もう片方をβ型になるように、ねじる向きを選んで作りました。予想は「手をつなぐ」。はさみを入れると……予想どおり、2つのハートが手をつないで現れました。"], "en": ["Yui wrote it in her notebook. With two rings, there are three combinations: alpha with alpha, alpha with beta, and beta with beta. Sort the cases, and check them one by one.", "Then she matched the results. In the first try, the hearts held hands. Checking the ring types, red was alpha and white was beta. In the second try, both rings were the same type, and the hearts came out separate.", "\"So the hearts hold hands only when one ring is alpha and the other is beta!\" Yui looked up. \"And the same types together come out separate.\"", "Her grandfather nodded. \"Check the types and predict before you cut. That is no longer fortune-telling — that is mathematics.\" For the third try, Yui chose the twist directions on purpose, making one ring alpha and the other beta. Her prediction: \"They will hold hands.\" She put in the scissors… and just as predicted, two linked hearts appeared."]}, {"ja": ["「もう1つ不思議があるよ。」おじいちゃんが言いました。「ハートが半分赤で、半分白だった訳を考えてごらん。」", "ユイは切る前の輪を思い浮かべました。貼り付けた正方形の場所で、赤い帯と白い帯は交わっています。真ん中を切っていくと、その場所で帯の行き先が入れ替わるのです。だから、できあがったハートは、どちらも赤と白のはんぶん同士でできていました。", "見えない結果を、切る前に言い当てる。そのために、変わらないもの（層の順番）を見つけて、場合分けをして考える。おじいちゃんは言いました。「数学は、手品のタネを見つける学問でもあるんだね。」", "ユイは手をつないだハートを、窓辺につるしました。赤と白がはんぶん同士のハートは、風に揺れて、まるで小さく手をつないで踊っているようでした。「合唱コンクール、みんなと心がつながりますように。」ユイはそっと手を合わせました。"], "en": ["\"There is one more mystery,\" said her grandfather. \"Think about why each heart was half red and half white.\"", "Yui pictured the rings before the cutting. At the glued square, the red band and the white band crossed. As she cut along the middle, the bands exchanged their paths at that square. That is why each finished heart was made of half of the red ring and half of the white one.", "To say what will happen before anyone can see it: find the thing that does not change — the order of the layers — and sort the cases. \"Mathematics,\" said her grandfather, \"is also the study that finds out how the magic trick works.\"", "Yui hung the linked hearts by the window. Half red and half white, they swayed in the breeze, as if dancing while holding little hands. \"May our hearts stay joined at the choir contest,\" Yui whispered, pressing her palms together."]}], "column": {"ja": ["メビウスの帯が見つかったのは1858年のことです。そのころから数学者は、輪や結び目の「つながり方」そのものを研究し始めました。輪をくしゃくしゃに変形させても、結び目がほどけたり、つながった輪が離れたりすることはありません。「離れているか、つながっているか」は、変形では変わらない性質なのです。", "19世紀の物理学者ケルビンは、「原子は、結び目の形をした渦ではないか」と考えました。その考え自体は当たりませんでしたが、それをきっかけに結び目の一覧表を作る研究が進み、結び目理論という数学の分野が生まれました。", "結び目理論は、今では私たちの体の中でも役立っています。細胞の中のDNAは、細長いひものような形をしていて、絡まってしまうことがあります。体の中には、その絡まりをほどく働きをする物質があり、数学者は数学の言葉でその仕組みを研究しています。", "「変わらないものを見つけて考える」という発想は、メビウスの帯のころから150年以上、今も数学の真ん中にあります。"], "en": ["The Möbius band was discovered in 1858. Around that time, mathematicians began to study the linking itself — how rings and knots are joined. Squash a ring or wiggle a knot as much as you like: a knot does not come undone, and linked rings do not fall apart. \"Separate or linked\" is a property that deformation cannot change.", "In the nineteenth century, the physicist Lord Kelvin wondered whether atoms might be tiny knotted swirls — vortices — in space. His idea itself turned out to be wrong, but it started a project to make tables of all knots, and a new field of mathematics called knot theory was born.", "Today, knot theory even helps inside our own bodies. The DNA in our cells is shaped like a very long string, and it sometimes gets tangled. The body has substances whose job is to untangle it, and mathematicians study how that works in the language of mathematics.", "The idea of \"finding the thing that does not change\" has stayed at the center of mathematics for more than 150 years, ever since the days of the Möbius band."]}, "quiz": {"ja": ["Q1．直交メビウスを、両方の輪の真ん中の線で切り分けると、いつも何が出てきますか。　答え：ハートの形をした帯が2つ出てくる", "Q2．ハートが手をつなぐのは、輪の型の組み合わせがどの場合ですか。　答え：α型とβ型の組み合わせ（αβ型）の場合だけ。αα型とββ型はバラバラになる", "Q3．輪を三角形に潰して、紙の層の順番を調べる方法は、どんな考え方ですか。　答え：立体を平面におきかえて考える「次元下げ」（変わらない性質＝不変要素を見つける工夫）"], "en": ["Q1. When you cut crossed Möbius rings apart along the middle line of both rings, what always comes out?　Answer: Two bands in the shape of hearts", "Q2. In which combination of ring types do the hearts hold hands?　Answer: Only when one ring is type alpha and the other is type beta (alpha-beta). Alpha-alpha and beta-beta come out separate", "Q3. What way of thinking is it to squash a ring into a triangle and read the order of its layers?　Answer: Lowering the dimension — replacing a solid shape with a flat one (a way to find the property that does not change, the invariant)"]}, "corner": {"ja": ["用意するもの：色の違う長い紙の帯2本（幅4cmくらい、長さは60cmくらい。画用紙を切ってつなぐと作りやすい）、のり、はさみ、ペン。", "①帯2本で、メビウスの帯を1つずつ作ります。片方のはしを半回転させてから貼るのがコツです。ねじる向きを変えると、輪の型が変わります。", "②2つの輪を十字に交わるように重ね、交わった正方形のところだけをのりで貼ります。上から見て、2つの輪のふくらみが同じ回る向きにそろうように置くのが約束です。", "③両方の輪の真ん中に点線を引きます。貼った正方形の上にも、点線が切れ目なく通るようにしてください。", "④切る前に予想します。それぞれの輪を三角形に潰して、紙の層の順番を追い、時計回りならα型、反時計回りならβ型と決めます。α型とβ型の組み合わせなら「手をつなぐ」、同じ型どうしなら「バラバラ」と予想しましょう。", "⑤点線のとおりに両方の輪を切り分け、予想が当たったか確かめます。貼った正方形の部分も、そのまま切り進んでください。はさみを使うときは、大人の人と一緒にやってください。"], "en": ["You will need: two long paper strips in different colors (about 4 cm wide and 60 cm long; cutting and joining drawing paper works well), glue, scissors, and a pen.", "①Make one Möbius band from each strip. The trick is to give one end a half twist before gluing. Changing the direction of the twist changes the ring's type.", "②Lay the two rings across each other like a cross, and glue only the square where they cross. The promise: seen from above, both rings should bulge in the same turning direction.", "③Draw a dotted line along the middle of both rings. Make sure the line runs across the glued square without a break.", "④Predict before you cut. Squash each ring flat into a triangle and follow the order of the paper layers: clockwise means type alpha, counterclockwise means type beta. Predict \"holding hands\" for alpha with beta, and \"separate\" when the types are the same.", "⑤Cut both rings apart along the dotted lines, cutting straight through the glued square, and check your prediction. Please do this craft together with an adult, because it uses scissors."]}}, {"id": "monkey", "title": {"ja": "サルに当たる？ ― モンキーハンティングのおはなし", "en": "Will It Hit the Monkey? — The Monkey-Hunting Story"}, "sub": {"ja": "小学校高学年〜中学生向け・弾もサルも同じだけ落ちる", "en": "For upper elementary and junior high students — the ball and the monkey fall by the same amount"}, "cover": "mon1.jpg", "images": ["mon1.jpg", "mon2.jpg", "mon3.jpg", "mon4.jpg", "mon5.jpg", "mon5.jpg"], "pages": [{"ja": ["ある休みの日、ユイが庭に出ると、おじいちゃんが不思議な実験の準備をしていました。木の枝からは、ひもでぶら下がった小さなサルのぬいぐるみ。少し離れた台の上には、ボールを飛ばす発射台が置いてあります。", "「今日の問題だよ、ユイ。」おじいちゃんは、発射台の照準をサルにぴたりと合わせました。「ボールを発射した瞬間に、サルはひもから離れて落ち始める。さて、ボールはサルに当たるかな？」", "ユイは少し考えて答えました。「当たらないと思う。ボールが届くまでの間に、サルは下に落ちちゃうから、ボールはサルの上を通り過ぎるはず。」", "「なるほど、もっともらしい予想だ。」おじいちゃんはうなずきました。「でも、本当にそうかな。やってみよう。」"], "en": ["One day off school, Yui went out into the garden and found her grandfather preparing a strange experiment. A small toy monkey hung from a string tied to a tree branch. A little way off, on a stand, sat a ball launcher.", "\"Here is today's problem, Yui.\" Her grandfather aimed the launcher exactly at the monkey. \"The moment the ball is launched, the monkey lets go and starts to fall. Will the ball hit the monkey?\"", "Yui thought for a while. \"It will miss. By the time the ball gets there, the monkey has fallen down, so the ball should pass above it.\"", "\"A reasonable prediction,\" nodded her grandfather. \"But is it really so? Let us try.\""]}, {"ja": ["おじいちゃんがレバーを引くと、ボールが飛び出すのと同時に、サルのひもが外れて、サルが落ち始めました。ボールは山なりの道を飛んでいきます。", "次の瞬間、ボールは落ちてくるサルに、空中でぴたりと当たりました。「ええっ、当たった！」ユイはびっくりです。", "もう一度、ゆっくり確かめます。今度も結果は同じ。当たりました。照準の先にいたはずの場所から、サルはかなり下に落ちていたのに、ボールはその落ちたサルに当たったのです。", "「ユイの予想は半分当たっていて、半分外れたんだ。」おじいちゃんは笑いました。「サルが落ちるのはその通り。でも、ボールも同じように落ちていたんだよ。」"], "en": ["When her grandfather pulled the lever, the string released at the very moment the ball flew out, and the monkey began to fall. The ball sailed along its arching path.", "In the next instant, the ball struck the falling monkey squarely in mid-air. \"What? It hit!\" Yui was astonished.", "They tried again, slowly, to be sure. The result was the same — a hit. The monkey had fallen quite a way below the spot where it had been hanging, and yet the ball met the monkey down there.", "\"Your prediction was half right and half wrong,\" smiled her grandfather. \"The monkey does fall, just as you said. But the ball was falling too, in exactly the same way.\""]}, {"ja": ["おじいちゃんは紙に図を描きました。まず、重力がなかったとしたら、ボールは照準の直線の上をまっすぐ進み、サルがいた場所に届きます。", "ところが現実には重力があります。ボールは飛んでいる間、ずっと下へ引っ張られていて、直線よりも下を進みます。サルも、同じ時間だけ、同じ重力に引っ張られて落ちています。", "大事なのはここです。ボールがサルの真下に着くまでの間に、ボールが直線から下がった分と、サルが落ちた分は、ちょうど同じ長さなのです。だから、2つは下がった場所で出会います。", "「重力は、ボールにもサルにも、分けへだてなく同じだけ働くんだ。」ユイは図を見ながら言いました。「だから、狙った場所より下で、当たるんだね。」"], "en": ["Her grandfather drew a diagram on paper. First, if there were no gravity, the ball would travel straight along the aim line and reach the place where the monkey was.", "In reality, though, gravity is always pulling the ball down as it flies, so the ball travels below that straight line. The monkey, too, is pulled by the same gravity for the same time, and falls.", "Here is the important point. In the time the ball needs to reach the monkey, the amount the ball has dropped below the straight line and the amount the monkey has fallen are exactly the same length. So the two meet at the lower place.", "\"Gravity works on the ball and on the monkey equally, without playing favorites,\" said Yui, looking at the diagram. \"That is why they meet below the place we aimed at.\""]}, {"ja": ["ボールが描く山なりの道には、名前があります。「放物線（ほうぶつせん）」です。横への動きは最後まで同じ速さで進み、下への落ち方はだんだん速くなります。その2つの動きが合わさると、この曲線になります。", "同じ時間ごとにボールの位置に点を打つと、横の間隔はいつも同じなのに、縦の落ちる間隔は1、3、5…と広がっていきます。落ちる動きには、面白い数の決まりが隠れているのです。", "速いボールを発射すると、高い場所で早く出会います。遅いボールでは、出会う場所は下がります。それでも当たるのは同じです。", "「ただし、遅すぎるとダメだ。」おじいちゃんが言いました。「サルが地面に着くほうが早いと、もう出会えない。それが外れるただ1つの場合だね。」"], "en": ["The arching path of the ball has a name: a parabola. The sideways motion keeps the same speed all the way, while the downward falling grows faster and faster. Put the two motions together, and you get this curve.", "If you plot the ball's position at equal steps of time, the sideways spacing is always the same, but the downward gaps grow — 1, 3, 5, and so on. The falling motion hides an interesting pattern of numbers.", "Launch a faster ball, and the two meet sooner and higher up. Launch a slower ball, and they meet lower down. Either way, they still meet.", "\"But too slow is no good,\" said her grandfather. \"If the monkey reaches the ground before the ball arrives, they can never meet. That is the only way this can miss.\""]}, {"ja": ["ユイは確かめたくなって、別の実験を頼みました。「サルが落ちなかったら、どうなるの？」今度は、サルをひもで固定したまま発射します。", "ボールは、サルのはるか下を通り過ぎました。落ちたのはボールだけだから、その分だけ下を外れたのです。「やっぱり！」ユイは手をたたきました。「サルが落ちるから、当たるんだ。」", "では、重力が弱い月の上ではどうでしょう。ボールもサルも、ゆっくりと少しだけ落ちます。でも、落ちる分が同じであることに変わりはありません。だから月でも当たります。", "重力の強い場所でも弱い場所でも、答えは同じ。「当たる」のです。ユイはノートに大きく書きました。「おちる分は、みんな同じ」。"], "en": ["Yui wanted to test the idea, so she asked for another experiment. \"What if the monkey does not fall?\" This time they launched the ball with the monkey tied fast to its string.", "The ball passed far below the monkey. Only the ball had fallen, so it missed by exactly that amount. \"I knew it!\" clapped Yui. \"It hits because the monkey falls.\"", "And what about the Moon, where gravity is weaker? The ball and the monkey both fall slowly and only a little. But the amounts are still equal to each other. So it hits on the Moon, too.", "In strong gravity or weak gravity, the answer is the same: it hits. In her notebook, Yui wrote in big letters: \"Everything falls by the same amount.\""]}, {"ja": ["「この問題には名前があるんだ。」おじいちゃんは懐かしそうに言いました。「モンキーハンティング。物理の教科書や参考書に、昔から載っている有名な問題だよ。おじいちゃんも若いころ、この問題に出会って目からうろこが落ちたんだ。」", "ユイは発射台の前に座り直しました。照準はサルにぴたり。「予想するよ。ボールは、狙った場所より下で、落ちてくるサルに当たる！」", "レバーを引くと、ボールは放物線を描き、落ちてくるサルに空中で当たりました。予想は今度もぴたりです。", "「重力は、すべてのものを同じだけ引っ張る。」おじいちゃんは言いました。「その当たり前を、ちゃんと確かめるところに、科学の面白さがあるんだね。」ユイは、落ちてきたサルを拾い上げて、もう一度枝にぶら下げました。「もう1回！」"], "en": ["\"This problem has a name,\" said her grandfather, sounding nostalgic. \"Monkey hunting. It is a famous problem that has been in physics textbooks and study guides for a very long time. When I was young, I met this problem and it opened my eyes.\"", "Yui sat down in front of the launcher again. The aim was exactly on the monkey. \"Here is my prediction. The ball will meet the falling monkey below the place I aimed at!\"", "She pulled the lever, the ball traced its parabola, and it struck the falling monkey in mid-air. Her prediction was exactly right this time.", "\"Gravity pulls everything by the same amount,\" said her grandfather. \"The fun of science is in checking even the things that seem obvious.\" Yui picked up the fallen monkey and hung it on the branch again. \"One more time!\""]}], "column": {"ja": ["ボールの動きを「横への動き」と「下への落ちる動き」に分けて考えたのは、イタリアの科学者ガリレオ・ガリレイ（1564〜1642）です。それまでの人々は、飛ぶものの動きを1つのかたまりとして考えていました。", "ガリレオは、横への動きは放っておけば同じ速さで進み続け、下への動きは重力でだんだん速くなる、と整理しました。2つの動きを合わせると、ボールの道すじは放物線になります。", "モンキーハンティングの問題は、この考え方をはっきり確かめられる実験として、世界の物理の教科書に長く載り続けてきました。弾とサルが「同じだけ落ちる」ことに気づけば、この不思議な当たり方は、当たり前になるのです。", "ガリレオが「落ちる動き」そのものをどうやって調べたかは、次の「重いものも軽いものも ― ガリレオと落下の法則のおはなし」で紹介します。"], "en": ["It was the Italian scientist Galileo Galilei (1564–1642) who thought of a flying ball's motion as two separate motions put together: the sideways motion and the downward falling motion. Before him, people thought of a projectile's flight as one single lump of movement.", "Galileo reasoned that the sideways motion continues at the same speed if left alone, while the downward motion speeds up under gravity. Combine the two motions, and the ball's path becomes a parabola.", "The monkey-hunting problem has stayed in physics textbooks around the world for a long time, because it tests this way of thinking so clearly. Once you notice that the bullet and the monkey \"fall by the same amount\", the surprising hit becomes obvious.", "How Galileo investigated the falling motion itself is the subject of the next story, \"Heavy or Light, They Fall Together — Galileo and the Law of Falling\"."]}, "quiz": {"ja": ["Q1．発射と同時にサルが落ち始めると、真っ直ぐ狙ったボールが当たるのはなぜですか。　答え：ボールもサルも、同じ時間に同じだけ重力で落ちるので、狙った場所より下で出会うから", "Q2．サルが手を離さず、落ちなかったら、ボールはどうなりますか。　答え：ボールだけが落ちるので、サルの下を通り過ぎて外れる", "Q3．重力の弱い月の上では、ボールとサルの出会い方はどうなりますか。　答え：両方ともゆっくり少しだけ落ちるが、落ちる分は同じなので、やはり当たる"], "en": ["Q1. Why does a ball aimed straight at the monkey hit it, when the monkey starts falling at the moment of launch?　Answer: Because the ball and the monkey are both pulled down by gravity by the same amount in the same time, so they meet below the aimed place", "Q2. If the monkey does not let go and does not fall, what happens to the ball?　Answer: Only the ball falls, so the ball passes below the monkey and misses", "Q3. On the Moon, where gravity is weaker, how do the ball and the monkey meet?　Answer: Both fall slowly and only a little, but by equal amounts, so they still meet — it hits"]}, "corner": {"ja": ["①2つのボールの実験：テーブルの端にボールを2つ用意します。1つはテーブルの端からそっと真下に落とし、もう1つは同じ瞬間に横へ転がして落とします。2つは同時に床に着くので、音は1回だけ聞こえます（横に転がしたボールも、落ちる速さは同じです）。", "②放物線を描いてみよう：方眼紙に、時間を0、1、2、3、4と分けて点を打ちます。横には時間と同じだけ進み（0、1、2、3、4）、下には時間の2乗だけ落ちる（0、1、4、9、16）として点を打つと、ボールの道すじ（放物線）になります。", "③おうちでモンキーハンティング：ぬいぐるみをひもでぶら下げ、柔らかいボールを真っ直ぐ狙います。発射の合図でひもを離してもらうと、タイミングがずれると外れます。本物の実験装置では、発射と落ち始めがぴたりと同時になる仕組みになっています。", "④予想を書いてから実験するのがおすすめです。「当たる・上を外れる・下を外れる・サルが先に着く」のどれか1つを選んでから、試してみましょう。"], "en": ["①The two-ball experiment: Put two balls at the edge of a table. Drop one straight down from the edge, and at the same instant roll the other one off sideways. They reach the floor at the same time, so you hear only one landing sound — the sideways ball falls at the same rate.", "②Draw a parabola: On graph paper, plot points for times 0, 1, 2, 3, 4. Move sideways by the time itself (0, 1, 2, 3, 4) and downward by the square of the time (0, 1, 4, 9, 16). Connecting the points gives the ball's path — a parabola.", "③Monkey hunting at home: Hang a stuffed animal from a string and aim a soft ball straight at it. If someone releases the string on your signal, the timing is hard to match and you may miss. In real experiment machines, the launch and the release happen at exactly the same instant.", "④Write your prediction first. Choose one — it will hit, it will pass above, it will pass below, or the monkey will land first — and then try the experiment."]}}, {"id": "galileo", "title": {"ja": "重いものも軽いものも ― ガリレオと落下の法則のおはなし", "en": "Heavy or Light, They Fall Together — Galileo and the Law of Falling"}, "sub": {"ja": "小学校高学年〜中学生向け・落ちる距離に隠れた奇数の法則", "en": "For upper elementary and junior high students — the odd-number pattern hidden in falling"}, "cover": "gal1.jpg", "images": ["gal1.jpg", "gal2.jpg", "gal3.jpg", "gal4.jpg", "gal5.jpg", "gal5.jpg"], "pages": [{"ja": ["「落ちるものは、だんだん速くなる。」おじいちゃんがボールを持ち上げて言いました。「でも、どれくらい速くなるか、測れるかな？」ユイはボールを落としてみましたが、速すぎて目では追えません。", "「400年前、ガリレオという人も同じことで困ったんだ。」おじいちゃんは、雨どいを斜めに置いて、ゆるやかな坂を作りました。「だから彼は、落ちる動きを坂でゆっくりにして測ったんだよ。」", "坂の上からボールを転がします。速すぎず、おそすぎず、ちょうど観察できる速さになりました。", "「今日はガリレオの実験を、わが家でやってみよう。手拍子に合わせて、ボールの位置に印をつけるんだ。」ユイは付箋を手に、坂の横に座りました。"], "en": ["\"A falling thing keeps getting faster,\" said her grandfather, holding up a ball. \"But can we measure how much faster?\" Yui tried dropping the ball, but it was far too quick for her eyes to follow.", "\"Galileo had the same trouble, four hundred years ago,\" said her grandfather, leaning a rain gutter to make a gentle slope. \"So he slowed falling down, using a slope.\"", "He rolled a ball down the slope. Not too fast, not too slow — just right for watching.", "\"Today we will do Galileo's experiment at home. I will clap at even beats, and you mark where the ball is at each clap.\" Yui sat down beside the slope with sticky notes in hand."]}, {"ja": ["おじいちゃんが等しい間隔で手をたたきます。「パン、パン、パン、パン。」ユイは、手拍子のたびに、ボールがいた場所に付箋を貼っていきました。", "坂の下でボールを受け止めて、付箋の間隔を紙テープに写し取り、長さを測ります。すると、不思議な並びが出てきました。1つ目の間隔は1、2つ目は3、3つ目は5、4つ目は7（単位は、1つ目の間隔の長さです）。", "「奇数だ！」ユイは叫びました。「1、3、5、7って、1つおきに増えてる。」", "おじいちゃんはうなずきました。「落ちるボールが、同じ時間ごとに進む距離は、奇数の並びになる。これがガリレオの見つけた法則だよ。」"], "en": ["Her grandfather clapped at even intervals. \"Clap, clap, clap, clap.\" At each clap, Yui stuck a note where the ball was at that moment.", "She caught the ball at the bottom, copied the spaces between the notes onto a paper tape, and measured them. A strange pattern appeared. The first space was 1, the second was 3, the third was 5, and the fourth was 7 (in units of the first space).", "\"Odd numbers!\" cried Yui. \"1, 3, 5, 7 — they go up by twos.\"", "Her grandfather nodded. \"The distance a falling ball travels in each equal step of time follows the odd numbers. That is the rule Galileo found.\""]}, {"ja": ["次に、スタートからの合計を計算してみます。1つ目までで1、2つ目までで 1＋3＝4、3つ目までで 4＋5＝9、4つ目までで 9＋7＝16。ユイは目を丸くしました。「1、4、9、16…これ、四角い数だ！」", "方眼紙に描いてみると、理由が見えてきます。1×1の四角に、L字形の3マスを足すと2×2の四角（4マス）に、次にL字形の5マスを足すと3×3の四角（9マス）になります。", "つまり、奇数を順番に足していくと、いつも四角数（1、4、9、16…）になるのです。坂の実験に現れた奇数は、数の世界でもぴたりと決まりを作っていました。", "「落ちる距離は、時間の2乗に比例する。」おじいちゃんは言いました。「2倍の時間では4倍、3倍の時間では9倍の距離を落ちる、ということだね。」"], "en": ["Next, they added up the distances from the start. After one step: 1. After two: 1 + 3 = 4. After three: 4 + 5 = 9. After four: 9 + 7 = 16. Yui's eyes widened. \"1, 4, 9, 16… those are square numbers!\"", "Drawing them on graph paper showed why. Start with a 1×1 square. Add an L-shape of 3 cells, and you get a 2×2 square (4 cells). Add an L-shape of 5 cells, and you get a 3×3 square (9 cells).", "So adding the odd numbers in order always gives a square number (1, 4, 9, 16…). The odd numbers from the slope experiment made a neat pattern in the world of numbers, too.", "\"The falling distance is proportional to the square of the time,\" said her grandfather. \"In twice the time, a thing falls four times as far; in three times the time, nine times as far.\""]}, {"ja": ["もう1つ、ガリレオの有名な主張がありました。「重いものも軽いものも、同じ速さで落ちる。」昔の偉い学者アリストテレスは「重いものほど速く落ちる」と考えていて、その考えが2000年近く信じられていました。", "確かめてみましょう。重いボールと軽いボールを、同じ高さから同時に落とします。床に着く音は、1回だけ。「ドン。」2つは同時に着きました。", "ガリレオがピサの斜塔の上から、重さの違う玉を落として見せた、という話も有名です。ただしこの話は、弟子が後に伝えたもの、本当にあったことなのかは分かりません。「伝説として伝えられる話」として楽しむのがよさそうです。", "一方、坂を使った実験と奇数の法則は、ガリレオ自身が本に書いて残した、本当の記録です。伝説と記録を分けて考えることも、科学の大事な態度でした。"], "en": ["Galileo had another famous claim: \"Heavy things and light things fall at the same rate.\" The great scholar Aristotle had taught that heavier things fall faster, and people believed that for nearly two thousand years.", "Let us check. Drop a heavy ball and a light ball from the same height at the same moment. The landing sound comes only once. \"Thud.\" The two landed together.", "There is also the famous story that Galileo dropped balls of different weights from the Leaning Tower of Pisa. But that story was written down later by his pupil, and nobody knows whether it really happened. It is best enjoyed as a story that is told — a legend.", "The slope experiments and the odd-number rule, on the other hand, are real records that Galileo wrote in his own book. Telling legends apart from records is an important part of science, too."]}, {"ja": ["ガリレオには、実験をしなくても分かる考え方の実験もありました。「重いものが速く落ちる」と仮定して、重い玉と軽い玉をひもで結んで落としたら、どうなるでしょう。", "軽い玉がブレーキになって、2つは中間の速さになるはずです。ところが、結んだ2つは元の重い玉よりさらに重いので、「もっと速く落ちる」はずにもなります。速くなるはずなのに遅くなる――話が合いません。", "この矛盾から、「重いものが速く落ちる」という仮定のほうが間違っている、と分かります。重さが違っても、落ちる速さは同じなのです。", "「頭の中だけで実験して、答えを出すこともあるんだね。」ユイが言うと、おじいちゃんは頷きました。「ガリレオは、測る実験と考えの実験、両方の名人だったんだ。」"], "en": ["Galileo also had an experiment you can do inside your head. Suppose heavier things really do fall faster. Now tie a heavy ball and a light ball together with a string, and drop them. What happens?", "The light ball should act as a brake, so the pair should fall at a speed in between. But the tied pair is heavier than the heavy ball alone, so by the same rule it should fall even faster. Faster and slower at the same time — the story contradicts itself.", "The contradiction shows that the assumption itself — \"heavier falls faster\" — must be wrong. Whatever the weight, the falling rate is the same.", "\"So you can do an experiment just by thinking,\" said Yui. Her grandfather nodded. \"Galileo was a master of both kinds: measuring experiments and thinking experiments.\""]}, {"ja": ["実験の最後に、ユイはもう一度ボールを転がしました。今度は、測る前に予想します。「間隔は1、3、5、7。合計は1、4、9、16になるはず。」", "測ってみると、予想はぴたりでした。法則が分かれば、まだ測っていないことも言い当てられます。", "ガリレオは、坂と水時計（水の量で時間をはかる道具）で落ちる動きを測り、奇数の法則と、四角数の合計を見つけました。その「重力」の研究は、やがて空の月にも届くことになります。", "「地上で落ちるボールと、空を回る月が、同じ法則で動いている。」おじいちゃんは夜空を見上げました。「それを言い当てた人の話は、また今度だね。」ユイも一緒に、月を見上げました。"], "en": ["At the end, Yui rolled the ball once more. This time she predicted before measuring. \"The spaces will be 1, 3, 5, 7, and the totals will be 1, 4, 9, 16.\"", "She measured, and her prediction was exactly right. Once you know a rule, you can say what will happen before you measure it.", "Galileo measured falling with a slope and a water clock — a tool that tells time by the amount of water — and found the odd-number rule and the square-number totals. His study of gravity would one day reach all the way to the Moon in the sky.", "\"The ball falling here on the ground, and the Moon going around the sky, move by the same rule,\" said her grandfather, looking up at the night sky. \"The story of the person who saw that will be for another day.\" Yui looked up at the Moon with him."]}], "column": {"ja": ["ガリレオ・ガリレイは、イタリアのピサに生まれた科学者です。落ちる動きを測るために、坂を使って動きをゆっくりにし、水時計で時間をはかりながら、転がる玉の位置を記録しました。そうして見つけたのが、距離の増え方が1、3、5、7…となる「奇数の法則」と、落ちる距離が時間の2乗に比例する法則です。", "ピサの斜塔から重さの違う玉を落としたという話は、弟子のヴィヴィアーニが書いた伝記に出てくる話で、実際にあったかどうかは分かっていません。伝説として親しまれていますが、ガリレオの本当の功績は、坂の実験のような、地道で確かな測り方にあります。", "ガリレオは望遠鏡を空に向けて、月に山や谷があることも見つけました。「空の世界も、地上と同じような場所かもしれない」と人々が考え始めるきっかけになりました。", "その考えは、のちにニュートンによって「地上と空に同じ法則」という大きな発見につながります。次の「りんごと月 ― ニュートンのおはなし」へ続きます。"], "en": ["Galileo Galilei was a scientist born in Pisa, Italy. To measure the falling motion, he used a slope to slow the motion down, and recorded the positions of a rolling ball while timing it with a water clock. In this way he found the \"odd-number rule\" — the distances grow as 1, 3, 5, 7 — and the law that the falling distance is proportional to the square of the time.", "The story that he dropped balls of different weights from the Leaning Tower of Pisa appears in a biography by his pupil Viviani, and whether it really happened is not known. It is loved as a legend, but Galileo's true achievement lies in careful, reliable measuring, like the slope experiment.", "Galileo also pointed a telescope at the sky and found that the Moon has mountains and valleys. It made people begin to think that the world in the sky might be a place much like the ground.", "That idea later led Newton to the great discovery that the same law rules both the ground and the sky. The story continues in \"The Apple and the Moon — Newton's Story\"."]}, "quiz": {"ja": ["Q1．坂を転がるボールの、3つ目の時間の区間に進む距離と、スタートからの合計はいくつですか（1つ目の区間を1として）。　答え：3つ目の区間は5、合計は 1＋3＋5＝9", "Q2．奇数を順に足すと四角数になります。1＋3＋5＋7＋9 はいくつですか。　答え：25（5×5の四角数）", "Q3．重いボールと軽いボールを、同じ高さから同時に落とすと、どうなりますか。　答え：同じ速さで落ちて、同時に地面に着く"], "en": ["Q1. In the slope experiment, how far does the ball travel in the third time step, and how far from the start in total (counting the first step as 1)?　Answer: The third step is 5, and the total is 1 + 3 + 5 = 9", "Q2. Adding odd numbers in order gives square numbers. What is 1 + 3 + 5 + 7 + 9?　Answer: 25 (the 5×5 square number)", "Q3. If you drop a heavy ball and a light ball from the same height at the same time, what happens?　Answer: They fall at the same rate and land on the ground together"]}, "corner": {"ja": ["①坂の実験：雨どいや厚紙でゆるい坂を作り、ボールを転がします。メトロノームや等しい手拍子に合わせて、ボールの位置に付箋を貼り、間隔を測ってみましょう。1、3、5、7の並びが見えるはずです。合計（1、4、9、16）も確かめてください。", "②四角数の工作：方眼紙に1×1、2×2、3×3、4×4の四角を描きます。四角を1つ大きくするときに増えるL字形のマスを数えると、3、5、7…と奇数になっています。奇数を足すと四角数になることを、目で確かめられます。", "③重いのと軽いの：重さの違う2つのボールを、同じ高さから同時に落として、着く音が1回かどうか聞いてみましょう。落とすときは、足の上に落ちないよう気をつけてください。", "④予想の練習：坂の実験で「2倍の時間転がしたら、距離は何倍？」と予想してから確かめます（答えは4倍）。3倍の時間では9倍です。"], "en": ["①The slope experiment: Make a gentle slope from a rain gutter or thick paper, and roll a ball down it. Using a metronome or even hand claps, mark the ball's position at each beat with sticky notes, and measure the spaces. You should see 1, 3, 5, 7. Check the totals, too: 1, 4, 9, 16.", "②Square-number craft: Draw 1×1, 2×2, 3×3, and 4×4 squares on graph paper. Count the L-shaped cells you add each time you make the square one size bigger: 3, 5, 7 — odd numbers. You can see with your eyes that odd numbers add up to square numbers.", "③Heavy and light: Drop two balls of different weights from the same height at the same time, and listen for whether the landing sound comes once. Be careful the balls do not land on your feet.", "④Prediction practice: In the slope experiment, predict first — \"If it rolls for twice the time, how many times farther will it go?\" — then check. (The answer is 4 times. For three times the time, it is 9 times.)"]}}, {"id": "newton", "title": {"ja": "りんごと月 ― ニュートンのおはなし", "en": "The Apple and the Moon — Newton's Story"}, "sub": {"ja": "小学校高学年〜中学生向け・地上と空に同じ法則", "en": "For upper elementary and junior high students — the same law on the ground and in the sky"}, "cover": "new1.jpg", "images": ["new1.jpg", "new2.jpg", "new3.jpg", "new4.jpg", "new5.jpg", "new5.jpg"], "pages": [{"ja": ["秋の庭で、りんごが1つ、木から落ちました。「りんごは下に落ちるのに、月はどうして落ちてこないの？」ユイは夜空の月を見て言いました。「月はずっと空に浮かんだままだよ。」", "おじいちゃんは笑って言いました。「実は、月も落ちているんだよ。りんごを見て、そのことに気づいた人がいる。ニュートンという科学者だ。」", "「えっ、月が落ちてるの？ だったら、どうして地面にぶつからないの？」", "「いい質問だ。」おじいちゃんは、落ちたりんごを拾いました。「300年以上前の、若いニュートンの考えたことを、たどってみよう。」"], "en": ["In the autumn garden, an apple fell from its tree. \"Apples fall down, so why doesn't the Moon fall?\" said Yui, looking at the Moon in the night sky. \"It just stays floating up there.\"", "Her grandfather smiled. \"Actually, the Moon is falling, too. A man named Newton realized that by watching an apple fall.\"", "\"What? The Moon is falling? Then why doesn't it crash into the ground?\"", "\"Good question,\" said her grandfather, picking up the fallen apple. \"Let us follow the thinking of the young Newton, more than three hundred years ago.\""]}, {"ja": ["1666年ごろのイギリス。疫病（えきびょう）が広がって大学が閉まり、若いニュートンは田舎の実家に帰っていました。庭のりんごが落ちるのを見て、彼は考えたと言われています。この話は、年をとったニュートン自身が語ったと伝えられる話です。", "りんごを下に引く力は、木のてっぺんにも届いている。もっと高い山の上にも届くだろう。では、はるか彼方の月にまで、この力は届いているのではないか。", "もし届いているなら、月も地球に引かれて「落ちている」はずです。なのに月は落ちてきません。この謎を解く鍵は、月の動き方にありました。", "「月は、ただ浮かんでいるんじゃない。」おじいちゃんは言いました。「ものすごい速さで、横に進んでいるんだ。」"], "en": ["Around 1666, in England, a plague had closed the university, and the young Newton had gone home to the countryside. Watching an apple fall in the garden, he thought — so the story goes, told by Newton himself in his old age.", "The force that pulls the apple down reaches the top of the tree. It would reach the top of a high mountain, too. Then might it not reach all the way to the far-off Moon?", "If it does, the Moon should also be pulled toward the Earth — it should be \"falling\". And yet the Moon never falls down. The key to the riddle was in how the Moon moves.", "\"The Moon is not just floating,\" said her grandfather. \"It is rushing sideways at a tremendous speed.\""]}, {"ja": ["想像してみましょう。高い山の上から、ボールを横に投げます。弱く投げれば近くに落ち、強く投げるほど遠くに落ちます。", "もっと速く、もっと速く投げたらどうなるでしょう。ボールは地球に向かって落ち続けますが、地面のほうが丸く曲がって逃げていくので、いつまでも地面に着かず、地球をぐるりと回ってしまいます。", "月がしているのは、まさにこれです。月は地球に向かって落ち続けながら、横にも速く進んでいるので、地球のまわりを回り続けているのです。", "ひもに付けたボールを回す実験でも分かります。ひもの引く力が重力の役目です。手を離すと、ボールは回るのをやめて、まっすぐ飛んでいきます。月には、見えない「重力のひも」がついているのです。"], "en": ["Imagine throwing a ball sideways from the top of a high mountain. Throw it gently, and it lands nearby. Throw it harder, and it lands farther away.", "What if you throw it faster and faster? The ball keeps falling toward the Earth, but the ground curves away beneath it, so it never lands — it goes all the way around the Earth.", "That is exactly what the Moon is doing. While it falls toward the Earth, it also moves sideways so fast that it keeps circling the Earth.", "You can feel this with a ball on a string. Twirl it, and the string's pull plays the part of gravity. Let go, and the ball stops circling and flies off straight. The Moon is held by an invisible \"string of gravity\"."]}, {"ja": ["ニュートンは、計算でも確かめました。りんごは、1秒で約4.9メートル落ちます。では、月は1秒でどれくらい地球に向かって落ちるでしょう。", "月は、地球の中心から、地球の半径の約60倍も離れたところを回っています。重力は、距離が遠くなるほど、距離の2乗の分だけ弱くなります。60倍の距離では、60×60＝3600分の1の弱さです。", "りんごの落ち方を3600で割ると、4900ミリメートル÷3600＝約1.4ミリメートル。実際に月の落ち方を計算すると、1秒に約1.4ミリメートルで、ぴたりと合いました。", "「地上のりんごの法則が、そのまま月の落ち方を言い当てたんだ。」おじいちゃんは言いました。「空と地上は、同じ法則で動いていたんだね。」"], "en": ["Newton checked with numbers, too. An apple falls about 4.9 meters in one second. How far does the Moon fall toward the Earth in one second?", "The Moon circles at a distance of about 60 times the Earth's radius from the Earth's center. Gravity weakens with the square of the distance. At 60 times the distance, it is weaker by 60 × 60 = 3600 times.", "Divide the apple's fall by 3600: 4900 millimeters ÷ 3600 ≈ 1.4 millimeters. And the Moon's actual fall, worked out from its motion, is about 1.4 millimeters in one second. The numbers matched exactly.", "\"The law of the apple on the ground predicted the falling of the Moon itself,\" said her grandfather. \"The sky and the ground were moving by the same law.\""]}, {"ja": ["距離と力の関係を、表にしてみましょう。距離が1倍なら力は1、2倍なら 1/4、3倍なら 1/9、4倍なら 1/16。距離の2乗に反比例して弱くなるのです。", "この法則は、りんごと月だけの話ではありません。地球と太陽、太陽と星々――宇宙のどこでも、もの同士は引かれ合っています。だからこの力は「万有引力（ばんゆういんりょく）」と呼ばれます。「万有」は「すべてのもの」という意味です。", "それまでの人々は、空の世界と地上の世界は、別の法則で動いていると考えていました。ニュートンは、その壁を取り払ったのです。", "「月も、りんごと同じに落ちている。」ユイはノートに書きました。「ちがうのは、横に進む速さと、遠さだけ。」"], "en": ["Let us make a table of distance and force. At distance 1, the force is 1; at 2, it is 1/4; at 3, 1/9; at 4, 1/16. The force weakens in inverse proportion to the square of the distance.", "This law is not only about apples and the Moon. The Earth and the Sun, the Sun and the stars — everywhere in the universe, things pull on one another. That is why this force is called universal gravitation. \"Universal\" means it works for everything.", "Before Newton, people believed that the world in the sky and the world on the ground moved by different laws. Newton took down that wall.", "\"The Moon falls just like the apple,\" Yui wrote in her notebook. \"The only differences are its sideways speed and its distance.\""]}, {"ja": ["その晩、ユイは庭から月を眺めました。月は静かに光っています。でも今のユイには、違って見えます。", "月は今この瞬間も、地球に向かって落ちています。1秒に約1.4ミリメートル、ずっと落ち続けているのに、横に進む速さのおかげで、いつまでも地球にたどり着きません。", "庭のボールとサル（モンキーハンティング）、坂を転がるボール（ガリレオの法則）、そして空の月。重力の話は、庭から宇宙まで、1本の線でつながっていました。", "「落ちるって、面白いね。」ユイが言うと、おじいちゃんはうなずきました。「当たり前に見えることを、ちゃんと考える。それがニュートンの一番のすごさだね。」月明かりの中で、りんごの木が静かに立っていました。"], "en": ["That night, Yui looked at the Moon from the garden. It shone quietly. But now it looked different to her.", "Even at this moment, the Moon is falling toward the Earth. About 1.4 millimeters every second, falling forever — yet thanks to its sideways speed, it never arrives.", "The ball and the monkey in the garden (monkey hunting), the ball rolling down the slope (Galileo's law), and now the Moon in the sky. The story of gravity ran in one line from the garden to the universe.", "\"Falling is fascinating,\" said Yui. Her grandfather nodded. \"Looking carefully at things that seem obvious — that was Newton's greatest talent.\" In the moonlight, the apple tree stood quietly."]}], "column": {"ja": ["アイザック・ニュートンは、イギリスに生まれた科学者です。疫病で大学が閉まっていた1665〜1666年、実家のウールズソープ村で過ごした時間に、微積分（びせきぶん）や光の研究、そして重力の法則の種になる考えを深めたと言われています。", "りんごの話は、年をとったニュートンが語ったと伝えられる話です。そのままの出来事かどうかは別として、「重力は月にも届くのではないか」という発想の転換が、発見の心でした。", "1687年、ニュートンは『プリンキピア』という本を出版し、万有引力の法則を数学で表しました。引力は、距離の2乗に反比例して弱くなります。月の落ち方の計算がこの法則と合ったことが、大きな証拠になりました。", "それ以来、地上のボールの動きも、惑星の動きも、同じ法則で計算できるようになりました。ガリレオが測った地上の重力の研究は、ニュートンによって宇宙全体の法則になったのです。"], "en": ["Isaac Newton was a scientist born in England. During 1665–1666, when the plague had closed his university, he spent his time at his family home in the village of Woolsthorpe, and it is said that he deepened the ideas that became calculus, the study of light, and the law of gravity.", "The apple story is one that Newton himself is said to have told in his old age. Whether it happened exactly so is another question; the heart of the discovery was the change of thinking — \"Perhaps gravity reaches the Moon, too.\"", "In 1687, Newton published a book called the Principia, expressing the law of universal gravitation in mathematics. The pull weakens in inverse proportion to the square of the distance. That the Moon's fall matched this law was powerful evidence for it.", "From then on, the motion of a ball on the ground and the motion of the planets could be calculated with the same law. Galileo's study of gravity on the ground became, through Newton, a law for the whole universe."]}, "quiz": {"ja": ["Q1．月は地球に落ちてこないのに、「落ち続けている」と言えるのはなぜですか。　答え：地球に向かって引かれて落ち続けているが、横にも速く進んでいるので、地球のまわりを回り続けるから", "Q2．距離が2倍になると、引力の強さはどうなりますか。　答え：距離の2乗に反比例するので、1/4になる", "Q3．60×60＝3600という計算は、何を確かめるものでしたか。　答え：月の1秒の落ち方（約1.4ミリメートル）が、りんごの落ち方（約4.9メートル）を、月の距離ぶん（3600分の1）弱めたものと一致すること"], "en": ["Q1. The Moon never crashes into the Earth, yet we say it is \"always falling\". Why?　Answer: Because it is always being pulled and falling toward the Earth, but it also moves sideways so fast that it keeps circling the Earth", "Q2. If the distance becomes twice as large, what happens to the strength of the pull?　Answer: It becomes 1/4, because the pull weakens in inverse proportion to the square of the distance", "Q3. What was the calculation 60 × 60 = 3600 used to check?　Answer: That the Moon's fall in one second (about 1.4 millimeters) matches the apple's fall (about 4.9 meters) weakened by the Moon's distance — divided by 3600"]}, "corner": {"ja": ["①ひものボールの実験：柔らかいボールをひもに結び、広い場所で回してみます。回している間、ひもがボールを中心に引いています（これが重力の役目）。手を離すと、ボールは回る方向ではなく、その瞬間に向いていた方向へまっすぐ飛びます。人や物に当たらない場所で、大人の人と一緒にやってください。", "②ニュートンの確かめ算：60×60＝3600を計算し、りんごの1秒の落下4900ミリメートルを3600で割って、約1.4ミリメートルになることを確かめましょう。月の落ち方と合うのが、法則の証拠でした。", "③弱まり方の表：距離が1、2、3、4、5倍になると、引力は1、1/4、1/9、1/16、1/25と弱くなります。方眼紙に、距離の2乗（1、4、9、16、25）を描いてから、その逆数を表にすると、法則が見えてきます。", "④月の観察：晴れた晩に、月の位置を建物や木と比べて記録し、1〜2時間後にもう一度見てみましょう。月が空を少しずつ移っていくのが分かります。その月が「落ち続けている」と想像してみてください。"], "en": ["①The string-and-ball experiment: Tie a soft ball to a string and twirl it in an open space. While you twirl, the string pulls the ball toward the center — that is gravity's part. Let go, and the ball flies off, not in the circling direction, but straight in the direction it was heading at that instant. Do this where it cannot hit anyone or anything, together with an adult.", "②Newton's check: Work out 60 × 60 = 3600, and divide the apple's one-second fall of 4900 millimeters by 3600 to get about 1.4 millimeters. That this matches the Moon's fall was the evidence for the law.", "③A weakening table: When the distance becomes 1, 2, 3, 4, 5 times as large, the pull becomes 1, 1/4, 1/9, 1/16, 1/25. Draw the squares of the distances (1, 4, 9, 16, 25) on graph paper, then make a table of their reciprocals, and the law will come into view.", "④Watching the Moon: On a clear night, note the Moon's position against a building or a tree, then look again after one or two hours. You will see that the Moon has shifted a little across the sky. Now imagine: that Moon is falling, all the time."]}}, {"id": "heptadecagon", "title": {"ja": "17角形は描ける？ ― コンパスと定規とガウスのおはなし", "en": "Can You Draw a 17-Gon? — Gauss, the Compass, and the Straightedge"}, "sub": {"ja": "中学生向け・作図できるかどうかは、数の性質で決まる", "en": "For junior high students — whether a polygon can be drawn is decided by the nature of its number"}, "cover": "hep1.jpg", "images": ["hep1.jpg", "hep2.jpg", "hep3.jpg", "hep4.jpg", "hep5.jpg", "hep5.jpg"], "pages": [{"ja": ["放課後の数学教室で、サワダ先生がコンパスと定規だけで図形を描いていました。正三角形、正方形、そして正五角形まで、先生はすらすらと描いてしまいます。「コンパスと定規だけ、というのが約束です。分度器は使いません。」", "ミオも挑戦しました。正五角形までは、なんとか描けました。ところが、正七角形で手が止まります。6つ目まではうまくいくのに、最後の1辺だけ、どうしても長さが合わないのです。", "「目分量なら描けるんですけど、正確には合いません。」ミオが首をかしげると、先生は言いました。「それは技術の問題じゃないんだ。正七角形は、コンパスと定規では正確に描けないことが、証明されているんだよ。」", "「えっ、描ける図形と描けない図形があるんですか。」ミオの目が丸くなりました。"], "en": ["In the after-school maths room, Mr. Sawada was drawing figures with only a compass and a straightedge. A regular triangle, a square, and then a regular pentagon — he drew them all smoothly. \"The rule is: compass and straightedge only. No protractor.\"", "Mio tried, too. She managed as far as the regular pentagon. But at the regular heptagon — the seven-sided figure — her hand stopped. Six sides went well, yet the last side would not match in length, no matter what she did.", "\"I can draw it by eye, but it never comes out exact,\" said Mio, puzzled. Mr. Sawada replied, \"That is not a matter of skill. It has been proved that a regular heptagon cannot be drawn exactly with a compass and a straightedge.\"", "\"What? So some figures can be drawn, and some cannot?\" Mio's eyes went round."]}, {"ja": ["先生は黒板に、正多角形の辺の数を並べて書きました。古代ギリシャの時代から、描けることが知られていたのは、3、4、5、6、8、10、12、15、16、20角形などです。", "一方、描けないのは、7、9、11、13、14、18、19角形です。ミオは並びをじっと見つめました。「15は描けるのに、9は描けない。12も描ける…。何か決まりがありそう。」", "「15＝3×5、12＝4×3、と分解してごらん。」先生に言われて、ミオは描けるほうの数を分解してみました。すると、3と5という素数がよく現れます。でも、9＝3×3は描けないほうです。", "「同じ3でも、2回使うとダメなのかな。」ミオの疑問に、先生は頷きました。「鍵は、数の分解のしかたと、特別な素数にあるんだ。」"], "en": ["Mr. Sawada wrote the numbers of sides on the board. Since the days of ancient Greece, the polygons known to be drawable were the 3, 4, 5, 6, 8, 10, 12, 15, 16, and 20-gons, among others.", "The ones that cannot be drawn are the 7, 9, 11, 13, 14, 18, and 19-gons. Mio studied the lists. \"15 can be drawn, but 9 cannot. 12 can, too… There must be a rule.\"", "\"Try breaking them down: 15 = 3 × 5, and 12 = 4 × 3.\" Mio factored the drawable numbers, and the primes 3 and 5 kept appearing. But 9 = 3 × 3 was on the cannot side.", "\"Using 3 twice makes it fail?\" At Mio's question, Mr. Sawada nodded. \"The key is how the number factors — and a special kind of prime.\""]}, {"ja": ["なぜ、数で決まるのでしょう。コンパスと定規で作れる長さは、もとの長さを足す・引く・掛ける・割る、そして平方根（√）を取る、という操作だけで表せる長さに限られます。", "直線と円、円と円の交点を求める計算は、いつも2次方程式という、√で解ける式になります。だから、道具で作れる長さは「√だけで書ける長さ」だけなのです。", "逆に、立方根（∛）が必要な長さは作れません。立方体の体積を2倍にする「立方体倍積問題」や、角を3等分する問題が、2000年以上解けなかった理由も、ここにあります。", "つまり、作図できるかどうかは、図形の問題ではなく、「その長さが√だけで表せるか」という数の問題だったのです。ミオはノートに大きく書きました。「作図＝数の問題」。"], "en": ["Why should numbers decide? Because the lengths you can make with a compass and a straightedge are limited to lengths that can be written using only adding, subtracting, multiplying, dividing, and taking square roots (√).", "Finding where two lines, or a line and a circle, or two circles meet always leads to a quadratic equation — the kind you can solve with a square root. So the tools can only ever produce \"lengths written with square roots\".", "Lengths that need a cube root (∛), on the other hand, can never be made. That is also why \"doubling the cube\" and \"trisecting an angle\" stayed unsolved for more than two thousand years.", "So whether a figure can be constructed is not a question about figures at all — it is a question about numbers: \"Can this length be written with square roots alone?\" Mio wrote it big in her notebook: \"Construction = a problem of numbers.\""]}, {"ja": ["特別な素数の正体は、「フェルマー素数」です。2を2乗し、さらに2乗し…と積み重ねて1を足した数、3、5、17、257、65537のことです。フェルマーは、この形の数は全部素数だと思っていました。", "ところが次の数、2の32乗＋1（4294967297）は、オイラーが 641×6700417 と分解して、素数でないことを示しました。今も、素数だと分かっているフェルマー素数は、この5つだけです。", "判定の決まりはこうです。正n角形が描けるのは、nが「2の累乗 × 相異なるフェルマー素数の積（ただし各素数は1回まで）」という形のときだけ。", "だから、15＝3×5は描けて、9＝3×3（同じ素数を2回）は描けません。そして17は、それ自体がフェルマー素数なので、正十七角形は描けるはずなのです。ギリシャ時代の人々は、そこまでは気づいていませんでした。"], "en": ["The special primes are the \"Fermat primes\": 3, 5, 17, 257, and 65537 — numbers you get by squaring 2 again and again and adding 1. Fermat believed every number of this form was prime.", "But the next one, 2^32 + 1 (4,294,967,297), was factored by Euler as 641 × 6,700,417, showing it is not prime. Even today, only these five are known to be prime.", "Here is the rule. A regular n-gon can be drawn exactly when n has the form \"a power of 2, times a product of distinct Fermat primes (each used at most once)\".", "That is why 15 = 3 × 5 works, but 9 = 3 × 3 (the same prime twice) does not. And 17 is itself a Fermat prime, so a regular 17-gon should be drawable. The ancient Greeks never got that far."]}, {"ja": ["1796年3月30日、ドイツの若者、ヨハン・カール・フリードリヒ・ガウスは、正十七角形が作図できることを見つけました。19歳の誕生日を1か月後に控えた、18歳のときです。", "古代ギリシャ以来2000年以上、描ける正多角形は1つも増えていませんでした。その壁を、若きガウスが破ったのです。彼はこの発見を日記の最初の記事に書き、数学の道に進む決心を固めたと言われています。", "その後ガウスは、1801年の本『整数論』で、作図できる場合の条件を完全に証明しました。正257角形も、正65537角形も、理論上は描けることになります。", "実際に、正65537角形の作図手順を完成させたヘルメスという人は、10年もの歳月をかけたそうです。その手順書は、今もゲッティンゲンに保管されていると言われています。"], "en": ["On 30 March 1796, a young German named Johann Carl Friedrich Gauss found that the regular 17-gon can be constructed. He was eighteen years old, one month before his nineteenth birthday.", "For more than two thousand years, since ancient Greece, not one new drawable regular polygon had been found. The young Gauss broke through that wall. It is said that he wrote the discovery as the very first entry in his diary, and that it settled his decision to devote himself to mathematics.", "Later, in his book Disquisitiones Arithmeticae (1801), Gauss proved the complete condition for when a construction is possible. Regular 257-gons and even 65537-gons should also be drawable in theory.", "In fact, a man named Hermes is said to have spent ten years completing the construction procedure for the regular 65537-gon. His manuscript is still kept in Göttingen, Germany."]}, {"ja": ["ミオは分度器を取り出しました。「正確な作図は√の話だけど、近似なら描けます。」中心角は 360÷17≒21.2度。分度器で角度を測って17個の点を打ち、順に結ぶと、正十七角形らしい形が現れました。", "「分度器では近似しか描けない。でも、コンパスと定規で『正確に』描けるかどうかは、道具の腕前じゃなくて、17という数の性質で決まっていたんだね。」", "最後にミオは、3から20までの判定表を完成させました。描ける：3、4、5、6、8、10、12、15、16、17、20。描けない：7、9、11、13、14、18、19。表はぴたりと決まりどおりでした。", "「描けないことにも、理由と証明がある。」サワダ先生は言いました。「それを見つけるのも、数学の面白さだね。」ミオは、自分の描いた17角形を、満足そうに眺めていました。"], "en": ["Mio took out a protractor. \"An exact construction is about square roots, but I can draw an approximation.\" The central angle is 360 ÷ 17 ≈ 21.2 degrees. Measuring with the protractor, she marked 17 points and joined them in order — and a shape very much like a regular 17-gon appeared.", "\"With a protractor, I can only approximate. But whether it can be drawn *exactly* with a compass and straightedge was decided not by skill with the tools, but by the nature of the number 17.\"", "At the end, Mio completed her table for 3 to 20. Drawable: 3, 4, 5, 6, 8, 10, 12, 15, 16, 17, 20. Not drawable: 7, 9, 11, 13, 14, 18, 19. The table matched the rule exactly.", "\"Even 'cannot be drawn' has a reason, and a proof,\" said Mr. Sawada. \"Finding that is part of the fun of mathematics.\" Mio looked at her 17-gon with satisfaction."]}], "column": {"ja": ["古代ギリシャの数学者たちは、コンパスと定規だけの作図を重んじ、正三角形から正十五角形までを描く方法を見つけていました。しかし、そのあと2000年以上、新しく作図できる正多角形は1つも見つかりませんでした。", "フェルマー素数の物語も有名です。フェルマーは「2の2乗を繰り返した数＋1」はすべて素数だと予想しましたが、5番目の数（2の32乗＋1）については、オイラーが 641×6700417 という分解を見つけ、予想が外れたことを示しました。素数だと確認されているのは、3、5、17、257、65537の5つだけです。", "1796年3月30日、18歳のガウスは正十七角形の作図可能性を発見し、その日を日記の最初の記事にしました。のちに『整数論』（1801年）で条件の完全な証明を与え、「作図できるのは、辺の数が2の累乗と相異なるフェルマー素数の積である場合に限る」ことが確定しました。", "ガウスの故郷ブラウンシュヴァイクにある記念碑には、17角形の星が刻まれていると言われています。2000年の壁を破った発見は、若き天才の出発点になりました。なお、判定の決まりを完全に証明したのはガウスとワンツェルで、描けない側の証明はワンツェル（1837年）によるものが有名です。"], "en": ["The mathematicians of ancient Greece valued constructions with compass and straightedge alone, and found ways to draw the regular polygons from the triangle up to the 15-gon. But after that, for more than two thousand years, not one new constructible regular polygon was found.", "The story of the Fermat primes is famous, too. Fermat guessed that every number made by repeatedly squaring 2 and adding 1 was prime, but Euler found the factorisation 641 × 6,700,417 for the fifth one (2^32 + 1), showing the guess was wrong. Only five are confirmed prime: 3, 5, 17, 257, and 65537.", "On 30 March 1796, the eighteen-year-old Gauss discovered that the regular 17-gon can be constructed, and made it the first entry in his diary. Later, in the Disquisitiones Arithmeticae (1801), he gave a complete proof of the condition, establishing that a regular polygon can be constructed only when its number of sides is a power of 2 times a product of distinct Fermat primes.", "A 17-pointed star is said to be carved on Gauss's memorial in his home city of Braunschweig. The discovery that broke a 2000-year wall became the starting point of a young genius. The proof of the \"cannot be drawn\" side is credited to Wantzel (1837), who made the condition fully rigorous."]}, "quiz": {"ja": ["Q1．正七角形は、コンパスと定規で正確に作図できますか。　答え：できない（7はフェルマー素数ではないため）", "Q2．正十五角形は、コンパスと定規で正確に作図できますか。　答え：できる（15＝3×5で、相異なるフェルマー素数の積になっているため）", "Q3．正九角形は、コンパスと定規で正確に作図できますか。　答え：できない（9＝3×3で、同じフェルマー素数を2回使っているため）"], "en": ["Q1. Can a regular heptagon (7 sides) be constructed exactly with a compass and a straightedge?　Answer: No — 7 is not a Fermat prime", "Q2. Can a regular 15-gon be constructed exactly with a compass and a straightedge?　Answer: Yes — 15 = 3 × 5, a product of distinct Fermat primes", "Q3. Can a regular 9-gon be constructed exactly with a compass and a straightedge?　Answer: No — 9 = 3 × 3 uses the same Fermat prime twice"]}, "corner": {"ja": ["①正五角形の作図：円と中心Oを描き、垂直な2本の直径（縦と横）を引きます。横の半径の中点Mを取り、Mを中心として縦の直径の上端Aを通る円を描き、横の直径の直線との交点Nを求めます。線分ANの長さが、正五角形の1辺の長さです。この長さをコンパスで円周上に移していくと、正五角形が描けます。", "②√の長さを作る：1辺1の直角三角形から斜辺√2を作り、その√2を1辺として次の直角三角形を作ると√3、さらに√4（＝2）、√5と、√の長さを次々に作れます（第6話「テオドロスの螺旋」と同じ仕組みです）。コンパスと定規で作れるのは、このような√の長さだということを実感してみましょう。", "③描けるか判定表：3から20までの正多角形について、nを「2の累乗 × フェルマー素数（3、5、17…各1回まで）」の形に分解できるかどうかで、「描ける／描けない」を判定する表を、自分で完成させてみましょう（答えは本文6ページ目にあります）。", "④分度器で正十七角形：360÷17を計算すると約21.2度です。円の中心から分度器で21.2度ずつ測って17点を打ち、順に結んでみましょう。これは近似の図ですが、「正確に描ける」ことの意味を考える入口になります。"], "en": ["①Draw a regular pentagon: Draw a circle with center O, and two perpendicular diameters (vertical and horizontal). Take the midpoint M of a horizontal radius, draw a circle centered at M passing through the top end A of the vertical diameter, and find its intersection N with the horizontal diameter line. The segment AN is exactly one side of the regular pentagon. Step this length around the circle with your compass, and the pentagon appears.", "②Make square-root lengths: From a right triangle with legs of length 1, make the hypotenuse √2. Use that √2 as one leg of the next right triangle to get √3, then √4 (= 2), then √5 — square-root lengths, one after another (the same idea as Theodorus's spiral in Episode 6). Feel for yourself that these are the lengths a compass and straightedge can make.", "③The drawable-or-not table: For the regular polygons from 3 to 20 sides, decide \"drawable / not drawable\" by testing whether n can be written as \"a power of 2 × Fermat primes (3, 5, 17…, each at most once)\". Complete the table yourself. (The answers are on page 6 of the story.)", "④A 17-gon with a protractor: Work out 360 ÷ 17 ≈ 21.2 degrees. From the center of a circle, measure 21.2 degrees at a time with a protractor, mark 17 points, and join them in order. It is an approximation — a good doorway into thinking about what \"drawing exactly\" really means."]}}, {"id": "nisegane", "title": {"ja": "ニセ金はどれだ？ ― 天秤3回で見つけるおはなし", "en": "Which Coin Is Fake? — Finding It with Three Weighings"}, "sub": {"ja": "小学校高学年〜中学生向け・1回で3通り、3回で27通り", "en": "For upper elementary to junior high students — three outcomes at a time, twenty-seven in three weighings"}, "cover": "nis1.jpg", "images": ["nis1.jpg", "nis2.jpg", "nis3.jpg", "nis4.jpg", "nis5.jpg", "nis5.jpg"], "pages": [{"ja": ["おじいちゃんが、金色のコインを12枚持ってきました。「この中に、ニセ金が1枚だけ混ざっている。本物より重いか軽いかは、分からない。」", "ユイは1枚ずつ手に取ってみましたが、見た目はどれも同じです。「1枚ずつ比べていたら、何回も量らないと分からないよ。」", "「使えるのは、この天秤を3回だけだ。」おじいちゃんは言いました。「3回量るだけで、どれがニセ金で、重いか軽いかまで当ててみせよう。」", "「えっ、12枚もあるのに、たった3回で。」ユイは半信半疑でした。"], "en": ["Grandfather brought out twelve gold-colored coins. \"One of these is a fake. We don't know whether it is heavier or lighter than the real ones.\"", "Yui picked them up one by one, but they all looked the same. \"If I compare them one at a time, I'll need ever so many weighings.\"", "\"You may use this balance only three times,\" said Grandfather. \"In just three weighings, I will find which coin is fake — and whether it is heavy or light.\"", "\"Only three times, with twelve coins?\" Yui was half in doubt."]}, {"ja": ["まず練習です。コイン3枚、ニセ金は「軽い」と分かっているとします。ユイは、天秤の左と右に1枚ずつ置きました。", "左が上がれば左の1枚、右が上がれば右の1枚、そしてつり合えば、残りの1枚がニセ金です。「1回で見つかった。結果が3通りあるからだ。」", "次は9枚です（ニセ金は軽いと分かっています）。3枚ずつ3組に分けて、2組を量ります。下がらなかった組の中にニセ金がいる、と当たりを付け、もう1回量れば見つかります。", "「量るたびに、候補は3分の1に減っていくんだね。」ユイが言うと、おじいちゃんは頷きました。「そう、鍵は『1回の結果は3通り』というところだ。」"], "en": ["First, practice. Suppose there are 3 coins, and we know the fake is LIGHT. Yui put one coin on the left pan and one on the right.", "If the left pan rises, the left coin is fake; if the right rises, the right coin; if they balance, the remaining coin is the fake. \"Found it in one weighing — because there are three possible outcomes.\"", "Next, 9 coins (fake known to be light). Split them into three groups of three and weigh two groups. The fake is in the group that did not go down, and one more weighing finds it.", "\"Each weighing cuts the candidates to a third,\" said Yui. Grandfather nodded. \"Yes — the key is that one weighing has three outcomes.\""]}, {"ja": ["では、3回量ると、結果の組み合わせは何通りでしょう。1回目は3通り、2回目も3通り、3回目も3通り。全部で 3×3×3＝27通り です。", "一方、調べたい可能性は、12枚のどれか ×（重い・軽い）の2通りで、12×2＝24通り。27は24より大きいので、3回で見分けられる望みがあります。", "「でも、どう量ればいいの。適当に量っても、うまくいかないよね。」その通りで、量り方は最初に全部決めておく必要があります。どのコインを、どの回に、左・右・外のどこへ置くか、表にしておくのです。", "結果の並び（たとえば「左が下がる、右が下がる、左が下がる」）が、そのままニセ金の名前になるように表を作れば、3回量り終わった瞬間に答えが分かります。まるで、コインに暗号の名前を付けるようなものです。"], "en": ["So with three weighings, how many outcome patterns are there? Three for the first, three for the second, three for the third: 3 × 3 × 3 = 27 patterns in all.", "The possibilities we must tell apart are: any of 12 coins × (heavy or light) = 12 × 2 = 24 possibilities. Since 27 is bigger than 24, three weighings just might be enough.", "\"But how do we weigh? Random weighing won't work, will it?\" Exactly right — the whole plan must be decided before we start. We write a table: for each weighing, which coins go on the left, on the right, or stay out.", "If the table is made so that each outcome pattern — say \"left down, right down, left down\" — names exactly one answer, then the moment the third weighing ends, we know. It is like giving every coin a secret code name."]}, {"ja": ["いよいよ本番です。おじいちゃんは、作っておいた表を見ながら量ります。1回目は、1〜4番を左に、5〜8番を右に、9〜12番は外に置きました。左が下がりました。", "「ニセ金は、左の4枚のどれかが重いか、右の4枚のどれかが軽いかだ。可能性は8通りに絞られた。」2回目と3回目も、表の通りに置き換えながら量ります。結果は「左が下がる、右が下がる、左が下がる」でした。", "おじいちゃんは、表と結果を見比べました。「この並びになるのは、6番が重い場合だけだ。ニセ金は6番、しかも重いほうだ。」", "確かめに、6番と本物を片手ずつに持つと、確かに6番のほうがずっしりします。「当たった。3回で本当に分かった。」"], "en": ["Now the real game. Following the table Grandfather had prepared, the first weighing put coins 1–4 on the left, 5–8 on the right, and 9–12 out. The left side went down.", "\"The fake is either one of the left four, and heavy, or one of the right four, and light. Only eight possibilities left.\" The second and third weighings rearranged the coins as the table said. The outcomes were: left down, right down, left down.", "Grandfather compared the pattern with the table. \"Only one case gives this pattern: coin 6, heavy. The fake is number 6 — and it is the heavy kind.\"", "To check, he held coin 6 in one hand and a real coin in the other: coin 6 was indeed a touch heavier. \"You got it. Three weighings really were enough.\""]}, {"ja": ["なぜうまくいくのでしょう。量る前に表を作ることで、24通りの可能性のすべてに、違う結果の並びが割り当てられます。並びが重なってしまう置き方では、見分けられません。", "そして、使わない並びもあります。「3回とも外（つり合い）」という並びは、どのコインがニセ金でも起こりません。27通りから使えるのは26通り、それでも24通りをまかなえるのです。", "もっと難しい置き方として、本物だと分かっているコインを1枚借りてきて皿に加える方法もあります。借りた本物が「目印」になって、見分けの幅が広がるのです。", "「分からないことは、まず数える。可能性の数を数えて、表にして、場合を分ける。」おじいちゃんは言いました。「第20話のメビウスの輪でも使った考え方だね。」"], "en": ["Why does it work? Because the table is made in advance, each of the 24 possibilities is assigned its own different outcome pattern. If two possibilities shared a pattern, we could never tell them apart.", "Some patterns go unused, too. The pattern \"balanced, balanced, balanced\" can never happen, whichever coin is fake. So of the 27 patterns, 26 are usable — still enough to cover 24.", "There is an even trickier arrangement: borrow one coin that is known to be genuine and add it to a pan. The borrowed real coin acts as a marker and widens what we can tell apart.", "\"When you don't know something: first count it. Count the possibilities, make a table, and split into cases,\" said Grandfather. \"The same thinking we used with the Möbius rings in Episode 20.\""]}, {"ja": ["最後にユイは、自分の力で9枚（ニセ金は軽いと分かっている場合）の表を作ってみました。3枚ずつに分け、結果の並びでどのコインか分かるように置き方を決めます。", "おじいちゃんがニセ金を混ぜて量り始めると、ユイは結果を読み上げました。「右が上がった。もう1回…つり合った。ニセ金は7番だ。」", "果たして7番がニセ金でした。「できた。自分で表が作れた。」", "天秤は、重さを量る道具です。でも、結果の「3通り」を数えて表にすれば、探しものを見つける道具にもなります。「分からないことは数えてみる。」ユイはノートに書きました。"], "en": ["At the end, Yui made her own table for 9 coins (fake known to be light). She split them into groups of three and decided the placements so the outcome pattern would name the coin.", "Grandfather mixed in a fake and began weighing. Yui read the outcomes aloud. \"The right side went up. Once more… balanced. The fake is number 7!\"", "And number 7 it was. \"I did it — I made the table myself.\"", "A balance is a tool for weighing. But count its three outcomes and build a table, and it becomes a tool for finding things. \"When you don't know — count.\" Yui wrote it in her notebook."]}], "column": {"ja": ["天秤の量り方は、「3進法」という数の表し方と深くつながっています。ふだんの10進法が0〜9の10個の数字を使うのに対して、3進法は0、1、2の3個の数字で数を表します。天秤の結果は「左が下がる・つり合う・右が下がる」の3通りですから、1回の量りは、まるで3進法の1桁を決めるようなものなのです。", "12枚のニセ金探しは、日本の本『数理パズル』（池野信一・高木茂男・土橋創作・中村義作、中公新書、1976年）の194〜201ページに紹介されている、昔から知られた有名な問題です。3回量る置き方を表にまとめる解き方は、その本でも丁寧に解説されています。", "結果の並びを「左・右・外」の記号で書くと、それはコインに付けた3桁の暗号のようなものになります。現代のコンピュータが使う符号や、情報を効率よく伝える工夫の考え方にも、通じるものがあります。", "なお、この絵本と連動するアプリ「ニセ金はどれだ！ ― 天秤で3回勝負」では、本編12枚の置き方をコンピュータで全通り確かめ、すべて正しく見分けられることを検証してあります。"], "en": ["Weighing with a balance is deeply connected to \"base three\", a way of writing numbers. Ordinary base ten uses ten digits, 0 to 9; base three uses only three digits, 0, 1, and 2. A weighing has three outcomes — left down, balanced, right down — so each weighing is like choosing one digit of a base-three number.", "The 12-coin problem is a famous classic, introduced in the Japa
