ト・フェルディナント・メビウスが、この不思議な帯について発表しました。メビウスは天文台で星を観測する天文学者でもありました。", "同じ1858年には、もう一人の数学者ヨハン・ベネディクト・リスティングも、独立に同じ帯を発見していたことが知られています。偉大な発見は、同時期に複数の人から生まれることがあるのです。", "メビウスの帯は、「位相幾何学（トポロジー）」という数学の入り口として有名です。トポロジーは、図形を伸ばしたり曲げたりしても変わらない性質――つながり方や、面と縁の数など――を調べる分野です。", "画家のエッシャーは版画『メビウスの輪』で、帯の上をアリが延々と歩き続ける姿を描きました。歩いても歩いても裏側へ出られない不思議さが、芸術家の心もつかんだのです。", "工場のベルトコンベヤーでは、帯全体が均等にすり減るように、わざと半回転ひねって（メビウスの帯のように）つなぐ工夫がされることもあります。小さなひねりが、数学と暮らしの両方を変えてきました。"], "en": ["In 1858, the German mathematician August Ferdinand Möbius published this curious strip. Möbius was also an astronomer who observed the stars at an observatory.", "In that same year, 1858, another mathematician, Johann Benedict Listing, is known to have discovered the same strip independently. Great discoveries are sometimes born from several people at the same time.", "The Möbius strip is famous as a doorway into the mathematics called topology. Topology studies the properties that do not change when a shape is stretched or bent — how things are connected, and how many sides and edges they have.", "The artist Escher, in his woodcut \"Möbius Strip,\" drew ants walking on the strip forever. The wonder of walking and walking without ever reaching a back side captured the hearts of artists, too.", "On factory conveyor belts, engineers sometimes join the belt with a half twist — like a Möbius strip — so that the whole surface wears down evenly. One small twist has changed both mathematics and daily life."]}, "quiz": {"ja": ["Q1. メビウスの帯の面はいくつ、ふち（縁）はいくつありますか。　答え：面は1つ、ふちは1本だけです", "Q2. メビウスの帯を真ん中の線で切ると、どうなりますか。　答え：2本に分かれず、長さ2倍の1本の大きな輪になります", "Q3. メビウスの帯を作るとき、端同士を貼る前に何をしますか。　答え：片方の端を半回転（180°）ひねります"], "en": ["Q1. How many sides does a Möbius strip have, and how many edges?　答え：One side, and only one edge", "Q2. What happens when you cut a Möbius strip along its middle line?　答え：It does not split in two — it becomes one big ring, twice as long", "Q3. When making a Möbius strip, what do you do before joining the ends?　答え：Give one end a half turn (180°)"]}, "corner": {"ja": ["用意するもの：細長い紙（新聞紙や包装紙を長さ1m・幅5cmくらいに切ったもの。短い紙を3枚つないでもよい）、のりかテープ、クレヨン、はさみ。", "1．まず、ひねらない「ふつうの輪」を作ります。面の数（表と裏で2つ）と、ふちの数（2本）を指でたどって確かめましょう。", "2．新しい帯は、貼る前に片方の端を半回転（180°）ひねってから、端同士を貼ります。", "3．帯の真ん中にクレヨンで線を引いていきます。手を離さずに、出発点に帰ってくるまで引き続けましょう。面はいくつありましたか。", "4．ふちを指でたどってみましょう。何周で元の場所に帰ってきましたか。", "5．どうなるか予想を言ってから、真ん中の線に沿ってはさみで切っていきます。はさみが1周しても終わらないときは、そのまま切り続けてください。結果は予想どおりでしたか。", "6．できた大きな輪も、真ん中を切ってみましょう。今度はどうなりましたか。", "もっと変わった帯（540°ひねりや、2枚重ねの帯）を試したい人は、アプリ「メビウスの帯 工作キット」に型紙と実験が用意してあります。"], "en": ["You will need: a long strip of paper (cut newspaper or wrapping paper to about 1 m long and 5 cm wide — or join three short strips), glue or tape, a crayon, and scissors.", "1. First, make an ordinary ring with no twist. Trace with your finger to check: how many sides (front and back make two), and how many edges (two)?", "2. For the new strip, give one end a half turn (180°) before you join the ends with glue.", "3. Draw a line along the middle with your crayon. Do not lift your hand until you return to the start. How many sides did the strip have?", "4. Trace the edge with your finger. How many trips around did it take to come back to the start?", "5. Say your prediction out loud, then cut along the middle line with scissors. If one trip around does not finish it, just keep cutting. Was the result what you predicted?", "6. Now cut the big new ring along its middle, too. What happened this time?", "If you want to try stranger strips (a 540° twist, or two strips twisted together), the app \"Möbius Strip Craft Kit\" has templates and experiments ready for you."]}}, {"id": "pythagoras", "title": {"ja": "弦の長さがつくる音階 ― ピタゴラスと分数のおはなし", "en": "Scales Built from String Lengths — Pythagoras and the Music of Fractions"}, "sub": {"ja": "小学校高学年〜中学生向け・音の高さと分数のふしぎ", "en": "For upper elementary to middle school — the wonder of pitch and fractions"}, "cover": "pyt1.jpg", "images": ["pyt1.jpg", "pyt2.jpg", "pyt3.jpg", "pyt4.jpg", "pyt5.jpg", "pyt5.jpg"], "pages": [{"ja": ["今から2500年ほど前、ギリシャの町に、ピタゴラスという先生がいました。「世界は、数でできている」。そう信じて、数と図形の不思議を仲間たちと研究した人です。", "弟子の少年テオは、先生のそばで学ぶのが大好きでした。先生は星の動きにも、図形にも、数の決まりが隠れていると教えてくれたからです。", "ピタゴラスには、こんな言い伝えがあります。ある日、鍛冶屋の前を通りかかると、大きさの違うハンマーが、美しく響き合う音を立てていた、というのです。", "「音の美しさにも、数の決まりがあるのではないか。」そう考えたピタゴラスは、弦を使った実験を始めたと言い伝えられています。"], "en": ["About 2,500 years ago, in a Greek town, there lived a teacher named Pythagoras. \"The world is made of numbers\" — so he believed, studying the wonders of numbers and shapes with his companions.", "A boy named Theo, his student, loved learning at his master's side, for Pythagoras taught that hidden rules of number lay within the motions of the stars and within shapes as well.", "There is a story told about Pythagoras. One day, passing a blacksmith's forge, he heard hammers of different sizes ringing together in beautiful harmony — so the tale goes.", "\"If beauty in sound also follows rules of number…\" Thinking this, Pythagoras is said to have begun experiments with strings."]}, {"ja": ["ピタゴラスが用意したのは、木の箱に1本の弦を張った楽器です（一弦琴（モノコード）と呼ばれます）。弦をはじくと、「ボーン」と低い音が鳴りました。", "「テオ、弦のちょうど真ん中を押さえて、半分の長さだけを鳴らしてごらん。」", "テオが半分の弦をはじくと、元の音より高い音が出ました。しかも、その音は元の音とぴったり重なって、気持ちよく響き合うのです。", "「長さが半分になると、音はちょうど1オクターブ上がる。弦の長さの比は2対1だ。」ピタゴラスの目が輝きました。"], "en": ["Pythagoras prepared an instrument with a single string stretched over a wooden box (it is called a monochord). When he plucked the string, it sounded a low \"boon.\"", "\"Theo, press the string at exactly its middle, and sound only half of its length.\"", "When Theo plucked the half string, out came a higher note — and it fitted the first note perfectly, ringing together with it in the most pleasing way.", "\"When the length is halved, the pitch rises by exactly one octave. The ratio of the lengths is 2 to 1.\" Pythagoras's eyes shone."]}, {"ja": ["今度は、弦の長さの3分の2だけを鳴らしてみました。すると、オクターブとは違う、力強く美しい響きが生まれました（この響きは、のちに「完全五度」と呼ばれます。長さの比は3対2です）。", "長さの4分の3では、また違う穏やかな響きになりました（「完全四度」。長さの比は4対3です）。", "ところが、半端な長さで鳴らすと、音同士がぶつかり合って、美しく響きません。", "「単純な整数の比のときだけ、音は調和する。分数の美しさが、耳に聞こえるんだ！」テオは思わず声を上げました。"], "en": ["Next, they sounded only two-thirds of the string's length. A new harmony was born — strong and beautiful, different from the octave (later, this interval came to be called the \"perfect fifth.\" The ratio of lengths is 3 to 2).", "At three-quarters of the length came yet another, gentler harmony (the \"perfect fourth.\" The ratio is 4 to 3).", "But sound the string at an in-between length, and the notes clash against each other and do not ring beautifully at all.", "\"Only with simple whole-number ratios do the sounds harmonize. You can hear the beauty of fractions!\" Theo cried out without thinking."]}, {"ja": ["ピタゴラスと弟子たちは、この発見から「音階」作りに挑戦しました。美しく響く比を組み合わせて、音の高さを順番に並べていったのです。", "弦の長さを分数で決めると、ド・レ・ミの並びが少しずつ姿を現しました。楽器の音の並びが、紙の上の計算で作れるのです。", "弟子たちがそれぞれ弦をはじくと、小さな合奏が生まれました。音と音が、まるで約束したように響き合います。", "「音楽は、分数でできていたんだね、先生！」テオの言葉に、ピタゴラスはうれしそうにうなずきました。"], "en": ["From this discovery, Pythagoras and his students took up the challenge of building a \"scale.\" They combined the ratios that rang beautifully, and lined up the pitches in order.", "Deciding string lengths by fractions, the pattern do-re-mi slowly took shape. The notes of an instrument could be built by calculation on paper.", "When each student plucked a string, a tiny concert was born. Note after note rang together, as if they had all promised to agree.", "\"Music was made of fractions, Master!\" At Theo's words, Pythagoras nodded with delight."]}, {"ja": ["ピタゴラスと仲間たち（ピタゴラス学派）は、この発見をとても大切にしました。「万物は、整数とその比（分数）で表すことができる」。それが学派の信念の中心になったのです。", "星の運行にも、きっと数の調和があるはずだ。仲間たちは、遠く離れた星々が奏でる音楽まで想像しました。", "音の実験は、ただの遊びではありませんでした。世界の仕組みを数で読み解くための、大事な手がかりだったのです。", "けれども、その信念を揺るがす大事件が、のちに学派を襲うことになります（くわしくはコラムで）。"], "en": ["Pythagoras and his companions (the Pythagorean school) treasured this discovery. \"Everything can be expressed by whole numbers and their ratios (fractions).\" This became the heart of the school's belief.", "Then the motions of the stars must have a harmony of number, too. The companions even imagined music played by the far-off stars.", "The sound experiments were not mere play. They were an important clue for reading the workings of the world through numbers.", "But in time, a great shock would strike that belief of the school (see the column for more)."]}, {"ja": ["2500年たった今も、弦の仕組みは変わっていません。ギターやバイオリンの弦は、押さえる場所で長さを変えて、音の高さを決めているのです。", "弦の半分の場所を押さえれば、1オクターブ高い音。ピタゴラスたちが耳で見つけた決まりは、今日の音楽の中に生き続けています。", "そして、音階の土台になったのは、2対1、3対2、4対3という、シンプルな分数の比でした。", "次は、あなたの番です。「やってみよう」で、輪ゴムの弦の音を聴き比べてみてください。"], "en": ["Even now, 2,500 years later, the way strings work has not changed. On guitars and violins, the place you press the string changes its length, and that decides the pitch.", "Press at exactly half the string, and you get a note one octave higher. The rule Pythagoras and his students found by ear lives on in today's music.", "And the foundation of the scale was a set of simple fractional ratios: 2 to 1, 3 to 2, and 4 to 3.", "Now it is your turn. In the activity below, compare the sounds of a rubber-band string."]}], "column": {"ja": ["ピタゴラス（紀元前570年ごろ〜紀元前495年ごろ）と、その仲間たち「ピタゴラス学派」は、「万物は整数とその比（分数）で表せる」と信じていました。音の比の発見は、その信念を支える自慢の成果でした。", "ところが、学派の弟子ヒッパソスが、分数では表せない数（正方形の対角線の長さ√2のような「無理数」）を見つけ、秘密を外に漏らしたため、海で溺れ死んだ――そんな言い伝えが残っています。", "ただし、この話の出典は、イアンブリコス（3世紀）やパッポス（4世紀）という、事件の時代から約800年も後の人たちの書物です。しかも版によって「漏らしたのは正十二面体の作り方だった」「溺死ではなく追放だった」と、内容が食い違っています。", "無理数の発見をヒッパソス本人の業績だと明記した古代の著述家は、いません。ピタゴラス本人が殺したという話にいたっては、二人の時代が重ならず、不可能に近いと考えられています。ですから、この話は「伝説」として楽しむのが正しい扱いです。", "ヒッパソスには、青銅の円盤を鳴らして音の比を調べた、という音楽実験の伝承もあります（プラトンの『パイドン』への古い注釈に残る話）。今回の音階のお話と響き合う伝承です。なお、鍛冶屋のハンマーの逸話も言い伝えで、実際にはハンマーの音の高さは重さの比だけでは決まらないことが分かっています。比が正確に成り立つのは、弦の実験のほうなのです。"], "en": ["Pythagoras (c. 570 – c. 495 BC) and his companions, the Pythagorean school, believed that \"everything can be expressed by whole numbers and their ratios (fractions).\" The discovery of the ratios in sound was a treasured proof of that belief.", "Yet a tale remains: a student of the school, Hippasus, found a number that no fraction can express (an \"irrational number,\" like √2, the diagonal of a square), leaked the secret outside, and drowned at sea for it.", "However, the sources of this story are the writings of Iamblichus (3rd century) and Pappus (4th century) — men who lived some 800 years after the supposed events. And the versions disagree: in some, what he leaked was how to construct a regular dodecahedron; in others, he was exiled, not drowned.", "No ancient writer clearly states that Hippasus himself discovered the irrational numbers. As for the story that Pythagoras personally had him killed, the two men's lifetimes do not even overlap, so it is considered all but impossible. The right way to treat this tale is to enjoy it as a legend.", "Hippasus also has a tradition of musical experiments, testing ratios of sound with bronze disks (a story kept in an ancient commentary on Plato's \"Phaedo\"). It resonates with this episode's story of scales. The blacksmith's-hammer tale is likewise a legend: in reality, a hammer's pitch is not decided by the ratio of weights alone. It is in the string experiments that the ratios hold exactly."]}, "quiz": {"ja": ["Q1. 弦の長さをちょうど半分にすると、音はどうなりますか。　答え：1オクターブ高い音になります（弦の長さの比は2：1）", "Q2. 完全五度を作る、弦の長さの比はいくつですか。　答え：3：2です", "Q3. ヒッパソスが海で溺れ死んだという話は、確かな事実ですか。　答え：いいえ。約800年後の書物に残る言い伝えで、内容も版によって食い違います"], "en": ["Q1. What happens to the sound when a string's length is made exactly half?　答え：It becomes a note one octave higher (the ratio of string lengths is 2:1)", "Q2. What ratio of string lengths makes a perfect fifth?　答え：3:2", "Q3. Is the story that Hippasus drowned at sea a certain fact?　答え：No. It is a tale kept in books written about 800 years later, and the versions disagree with each other"]}, "corner": {"ja": ["用意するもの：空のティッシュ箱（またはプラスチックの容器）、輪ゴム数本、定規、割り箸か鉛筆。", "1．輪ゴムを箱の口に渡して指ではじき、音を聞いてみましょう（輪ゴムを顔のほうに向けないこと）。", "2．鳴っている部分の長さを定規で測り、ちょうど半分の場所を指で押さえてはじいてみましょう。約1オクターブ高い音が聞こえます。", "3．長さの3分の2の場所を押さえてはじくと五度っぽい音、4分の3の場所では四度っぽい音になります。元の音と重ねて、響きを比べてみましょう。", "4．押さえる場所を少しずつずらしながらはじくと、音の高さがどう変わるか観察しましょう。短くなるほど、音は高くなります。", "5．きれいに響き合う場所が見つかったら、その長さの比を分数で書いてみましょう。ピタゴラスと同じ発見ができたかもしれません。"], "en": ["You will need: an empty tissue box (or a plastic container), several rubber bands, a ruler, and a pair of chopsticks or a pencil.", "1. Stretch a rubber band across the opening of the box and pluck it with your finger to hear its sound (never point a rubber band toward your face).", "2. Measure the length of the sounding part with the ruler, press at exactly the halfway point with a finger, and pluck. You will hear a note about one octave higher.", "3. Press at two-thirds of the length for a fifth-like sound, and at three-quarters for a fourth-like sound. Play them together with the original note and compare how they ring.", "4. Move the pressing point little by little and pluck each time. Watch how the pitch changes: the shorter the string, the higher the sound.", "5. When you find a spot that rings beautifully, write its length ratio as a fraction. You may have made the very same discovery as Pythagoras."]}}, {"id": "river", "title": {"ja": "川をわたるには ― 川渡り問題のおはなし", "en": "How to Cross the River — A River-Crossing Puzzle Story"}, "sub": {"ja": "小学校高学年〜中学生向け・もどる勇気と、数えて考える力", "en": "For upper elementary to middle school — the courage to go back, and the power of counting"}, "cover": "kawa1.jpg", "images": ["kawa1.jpg", "kawa2.jpg", "kawa3.jpg", "kawa4.jpg", "kawa5.jpg", "kawa5.jpg"], "pages": [{"ja": ["川のほとりの渡し場に、渡し守の見習いの少年、ソラが住んでいました。相棒は、首に赤い鈴をつけた、茶トラの猫トラです。", "ソラの小舟は小さくて、漕ぐ人のほかに乗せられるのは、1人（ひとつ）だけ。朝の光の中、今日もソラは櫂を手に、お客さんを待っていました。", "そこへ、農夫のおじさんがやって来ました。連れているのは、オオカミとヤギ、そして大きな大きなキャベツです。「みんなを、向こう岸へ渡してほしいんだ。」", "ところが、この渡しには困った約束がありました。ソラがいない岸でオオカミとヤギが残ると、ヤギが危ない目にあいます。ヤギとキャベツが残ると、キャベツが食べられてしまいます。1つずつしか運べないのに、どうすればよいのでしょう。"], "en": ["At a ferry landing by a river lived a boy named Sora, an apprentice ferryman. His partner was Tora, an orange tabby cat with a little red bell on his collar.", "Sora's boat was small: besides the one who rowed, it could carry only one more person (or one thing). In the morning light, Sora took up his oar and waited for the day's guests.", "Along came a farmer. With him were a wolf, a goat, and one enormous cabbage. \"Please take us all across to the far bank.\"", "But this crossing had a troublesome rule. If the wolf and the goat were left on a bank without Sora, the goat would be in danger. If the goat and the cabbage were left, the cabbage would be eaten. He could carry only one at a time — so what could he do?"]}, {"ja": ["ソラは腕を組みました。「まずオオカミを運ぼう……いや、だめだ。残ったヤギとキャベツが危ない。」", "「じゃあキャベツが先？ それもだめだ。オオカミとヤギが残ってしまう。」トラが、にゃあ、と鳴きました。", "「そうか。オオカミとキャベツなら、一緒に残っても大丈夫だ。最初はヤギだ！」ソラはヤギを船に乗せ、静かに川を渡りました。", "向こう岸にヤギを置き、ソラは一人で戻ります。つぎはオオカミを運びました。でも、舟が向こう岸に着いたとき、ソラは困ってしまいました。「このままキャベツを取りに戻ると、オオカミとヤギが二人きりになってしまう……。」"], "en": ["Sora folded his arms. \"First, the wolf… no, wait. That leaves the goat and the cabbage behind, and they are not safe together.\"", "\"Then the cabbage first? No good either. That leaves the wolf and the goat.\" Tora meowed, as if to say, think again.", "\"I see it now. The wolf and the cabbage can stay together safely. So the goat goes first!\" Sora put the goat in the boat and quietly rowed across.", "He left the goat on the far bank and rowed back alone. Next he carried the wolf. But when the boat reached the far bank, Sora was stuck again. \"If I go back for the cabbage now, the wolf and the goat will be left alone together…\""]}, {"ja": ["そのとき、トラが小舟のへりにちょこんと座って、こちらをじっと見ていました。行きも帰りも、トラはいつでもソラと一緒です。「……そうか、連れ戻せばいいんだ！」", "ソラは、向こう岸のヤギをもう一度船に乗せ、こちら岸へ連れ戻しました。一見、後もどりです。でも、これでどちらの岸も安全なまま、キャベツを取りに行けます。", "キャベツを向こう岸へ運び、ソラは一人で戻って、最後にヤギを乗せました。オオカミ、キャベツ、ヤギ、全員が無事に向こう岸へ渡れたのです。船は7回、川を行き来しました。", "「進むだけが答えじゃないんだね。戻る勇気が、答えへの近道になることもある。」農夫のおじさんは、大きくうなずいて手を振りました。"], "en": ["Just then, Tora sat on the edge of the boat and stared at him. Going and returning, Tora was always with Sora. \"…That's it. I can bring something back!\"", "Sora put the goat from the far bank back into the boat, and carried it back to the first bank. It looked like going backwards. But now, with both banks safe, he could go and fetch the cabbage.", "He carried the cabbage across, rowed back alone, and took the goat aboard one last time. The wolf, the cabbage, and the goat — everyone had crossed safely. The boat went back and forth seven times in all.", "\"Moving forward isn't the only answer. Sometimes the courage to go back is the shortcut to the solution.\" The farmer nodded deeply and waved goodbye."]}, {"ja": ["お昼を過ぎたころ、新しいお客さんが来ました。旅の人たち3人と、サルたちです。大きいサルが1匹と、小さいサルが2匹。サルたちは、着岸すると船からぴょんと飛び降ります。", "船は2人（2匹）まで。船を漕げるのは、人の3人と大きいサルだけです。そして大事な約束は、どちらの岸でも、人がいる岸では「人の数が、サルの数以上」でなければならないことでした。", "「今度は、組み合わせだけじゃなくて、両岸の数を数えるんだ。」ソラは地面に枝で絵を描き、両岸の様子を書き出して考えました。", "まず、先にサルたちを渡し始めることにしました。人が小さいサルを1匹連れて渡り、人は一人で戻ります。つぎに大きいサルが小さいサルを連れて渡り、大きいサルが戻ってきました。"], "en": ["In the afternoon, new guests arrived: three travelers, and some monkeys — one big monkey and two small ones. When the boat reached a bank, the monkeys would hop right out of it.", "The boat could hold two (people or monkeys). Only the three people and the big monkey could row. And the important rule was this: on either bank, wherever there were people, the number of people had to be at least the number of monkeys.", "\"This time it isn't just about combinations — I have to count both banks.\" Sora drew pictures in the dirt with a stick, writing down the state of each bank as he thought.", "First, he would start by sending the monkeys across. A person took one small monkey over and came back alone. Then the big monkey took the other small monkey over, and the big monkey came back."]}, {"ja": ["つぎに、人が2人で渡りました。ここで大事なのは、船を戻すときです。人が一人で戻ってしまうと、向こう岸に残るのは人1人とサル2匹。これでは約束が守れません。そこで、戻る人は小さいサルを1匹、船に乗せて連れ戻しました。", "「また“連れ戻す”だ！」古典編のひらめきが、ここでも役に立ちました。同じ理由で、もう1匹の小さいサルも、一度こちら岸へ連れ戻す場面がありました。", "そのあいだも、ソラは両岸の数を数え続けました。「こちらは人2・サル2。むこうは人3・サル1。大丈夫。」大きいサルは船を行ったり来たりさせて、みんなをつないでくれました。", "最後の船に、残りの小さいサルがぴょんと飛び乗りました。船は合わせて13回川を行き来して、3人と3匹、全員が向こう岸へ渡ることができました。サルたちは木の上で、うれしそうに手を振っていました。"], "en": ["Next, two people crossed together. The important part was the return trip: if a person rowed back alone, the far bank would be left with one person and two monkeys — the rule would break. So the returning person brought one small monkey back in the boat.", "\"The bring-back trick again!\" The flash of insight from the wolf-and-goat puzzle helped here too. For the same reason, there came a moment when the other small monkey also had to be brought back once.", "All the while, Sora kept counting both banks. \"This side: two people, two monkeys. Far side: three people, one monkey. All safe.\" The big monkey rowed the boat back and forth, connecting everyone.", "On the last crossing, the remaining small monkey hopped aboard with a bounce. The boat had crossed thirteen times in all, and all three people and all three monkeys were safely on the far bank. The monkeys waved happily from the trees."]}, {"ja": ["夕方、渡し場に静かな時間が戻ってきました。トラは小舟の中で丸くなって、もう眠そうです。", "ソラは今日のことをノートに書きました。「あわてて進むだけでは解けない問題がある。一度戻ること、そして両岸の状態を書き出して、数えて考えることが、答えを見つける力になる。」", "川渡りの問題は、実は約1200年も前から人々を楽しませてきた、とても古いパズルです（くわしくはコラムへ）。ソラが出会ったのは、その長い歴史の入り口でした。", "次は、あなたの番です。「やってみよう」で、アプリや紙の駒を使って、自分の手で渡してみてください。あなたなら、何回で渡れますか。"], "en": ["In the evening, quiet returned to the ferry landing. Tora curled up in the boat, already sleepy.", "Sora wrote about the day in his notebook. \"Some problems cannot be solved by rushing forward. Going back once, and writing down the state of both banks to count and think — that is the power that finds answers.\"", "The river-crossing puzzle is, in fact, a very old puzzle that has delighted people for about 1,200 years (see the column for more). What Sora met today was the doorway into that long history.", "Now it is your turn. In \"Try It Yourself,\" use the app or paper pieces and try crossing with your own hands. How many crossings will it take you?"]}], "column": {"ja": ["オオカミとヤギとキャベツの問題は、今から約1200年前、ヨーロッパの学者アルクィン（735年ごろ〜804年）が作った問題集『青年を鋭敏にするための問題集』に収められた問題のひとつです。知られている中では、最も古い世代の娯楽数学の問題集と言われています。", "アルクィンは、フランク王国の王様カール大帝に招かれて、宮廷で教えた先生でした。若い人たちの頭を鋭くするために、楽しみながら考えられる問題をたくさん集めたのです。オオカミとヤギの問題は、その中の第18問です。", "サル編のような「両岸の人数を比べる」タイプも、宣教師と人食いの問題をはじめ、世界中でいろいろな形に姿を変えて親しまれてきました。登場人物は変わっても、「危ない組み合わせを作らない」「両岸の状態を整理する」という考える筋道は同じです。", "両岸の状態をすべて書き出して、たどれる道を探す方法は、現代のコンピューターの基本的な考え方にもつながっています。この絵本とペアのアプリ『川渡りパズル』のヒント機能も、実はすべての状態をコンピューターに調べさせて、最短の渡り方を探しています。", "この絵本を作った清水正典先生は、昔、選択教科の数学の授業でこの問題を出しました。生徒たちはワークシートに考えを書き、黒板の前で自分の解き方を説明したそうです。「ヤギを連れ戻す」という大胆な一手が発表されたとき、教室がどっと沸いた、という思い出が残っています。"], "en": ["The problem of the wolf, the goat, and the cabbage is one of the problems in a collection made about 1,200 years ago by the European scholar Alcuin (c. 735–804), called \"Problems to Sharpen the Young.\" It is said to be among the oldest known collections of recreational mathematics.", "Alcuin was a teacher invited to the court of Charlemagne, king of the Franks. To sharpen the minds of the young, he gathered many problems that were fun to think about. The wolf-and-goat problem is number 18 in the collection.", "Puzzles that compare the numbers on both banks, like the monkey puzzle, have also been loved around the world in many shapes, such as the problem of the missionaries and the cannibals. The characters change, but the way of thinking stays the same: never make a dangerous combination, and organize the state of both banks.", "Writing down all the possible states and searching for a path through them connects to a basic idea in modern computers. The hint button in the sister app \"River Crossing Puzzle\" actually has the computer check every state to find the shortest way across.", "The maker of this picture book, Masanori Shimizu, once set this problem in his elective mathematics class. His students wrote their ideas on worksheets and explained their solutions in front of the blackboard. He remembers that when the bold move of \"bringing the goat back\" was presented, the whole classroom erupted with excitement."]}, "quiz": {"ja": ["Q1. 古典編で、最初に船で運ぶのは何ですか。　答え：ヤギです（オオカミとキャベツは、一緒に残しても大丈夫だからです）", "Q2. オオカミを運んだあと、帰りの船にヤギを乗せて連れ戻すのは、なぜですか。　答え：そのままキャベツを取りに戻ると、向こう岸でオオカミとヤギが残ってしまうからです", "Q3. サル編で、いつも守らなければいけない約束は何ですか。　答え：人がいる岸では、人の数がサルの数以上であることです"], "en": ["Q1. In the classic puzzle, what is carried across first?　Answer: The goat (because the wolf and the cabbage can safely stay together)", "Q2. After carrying the wolf across, why does the boat bring the goat back?　Answer: Because if you went to fetch the cabbage just like that, the wolf and the goat would be left together on the far bank", "Q3. In the monkey puzzle, what rule must always be kept?　Answer: On any bank where there are people, the number of people must be at least the number of monkeys"]}, "corner": {"ja": ["アプリ『川渡りパズル』で遊んでみましょう。古典編とサル編のほかに、宣教師と人食い編、ライオンとラマ編、家族と警官・泥棒編の、全部で5つのステージがあります。考えるためのワークシートも印刷できます（アプリの公開先は、noteの紹介記事でお知らせします）。", "紙と駒でも遊べます。紙に川を描いて、コインや消しゴムを登場人物に見立て、1回渡すごとに駒を動かしてみましょう。", "コツは、渡すたびに「両岸に誰がいるか」を書き出すことです。行き詰まったら、一度“連れ戻す”方法がないか考えてみてください。"], "en": ["Try the app \"River Crossing Puzzle.\" Besides the classic puzzle and the monkey puzzle, there are three more stages — the Missionaries and Cannibals, the Lion and Llama, and the Family, the Policeman and the Thief — five stages in all. You can also print worksheets for thinking on paper (the app's address will be announced in the introduction article on note).", "You can also play with paper and pieces. Draw a river on paper, use coins or erasers as the characters, and move a piece each time the boat crosses.", "The secret is to write down \"who is on each bank\" after every crossing. And when you are stuck, ask yourself: is there something I could bring back?"]}}, {"id": "futei", "title": {"ja": "ぴったり量れる？ 余る？ ― 不定方程式のおはなし", "en": "Exactly Right, or Some Left Over? — A Tale of Indeterminate Equations"}, "sub": {"ja": "小学校高学年〜中学生向け・1が作れれば、なんでも作れる", "en": "For upper elementary to middle school — if you can make 1, you can make anything"}, "cover": "fut1.jpg", "images": ["fut1.jpg", "fut2.jpg", "fut3.jpg", "fut4.jpg", "fut5.jpg", "fut5.jpg"], "pages": [{"ja": ["夏休みのはじめ、タクトはおばあちゃんと新幹線に乗って、小旅行に出かけました。新幹線の座席は、1つの列が、窓側の2人席と通路側の3人席に分かれています。", "車内では、いろいろなグループが座っていました。5人の家族は、2人席と3人席に分かれて座っています。4人のグループは2人席を2つ使い、6人なら、3人席を2つでも、2人席を3つでも座れます。", "「あれ？」タクトは考えました。「列のかたまりで座れる人数と、座れない人数がありそうだぞ。」2人、3人、4人、5人、6人、7人と数えてみると、座れないのは「1人」だけでした。", "「2人以上なら、何人でも座れるんだね。」おばあちゃんが言いました。「偶数の人数は、2人席の積み重ね。奇数なら、まず3人席を1つ使って、残りを偶数にすればいい。式で書くと『2×○＋3×○＝人数』。○に入る数の組み合わせの数だけ、座り方があるんだよ。」"], "en": ["At the start of summer vacation, Tacto took a little trip on the shinkansen bullet train with his grandmother. In the train, each row of seats is split into a two-seat side by the window and a three-seat side by the aisle.", "All kinds of groups were sitting in the car. A family of five was spread across a two-seat and a three-seat. A group of four used two two-seats, and six people could sit with two three-seats, or with three two-seats.", "\"Wait a minute,\" thought Tacto. \"Some group sizes can sit in one block of a row, and some cannot.\" He counted: two, three, four, five, six, seven... The only size that could not sit was one person alone.", "\"So any group of two or more can sit,\" said his grandmother. \"An even number is just a stack of two-seats. For an odd number, use one three-seat first, and the rest becomes even. As an equation: 2×□ + 3×□ = the number of people. There are as many seatings as there are ways to fill the boxes.\""]}, {"ja": ["着いた町で、二人はおばあちゃんの友だちの油屋さんに寄りました。油は量り売りです。ところが、店にある容器は、3リットルの容器と5リットルの容器の2つだけでした。ちょうどそこへ、「油をぴったり4リットルください」というお客さんが来ました。", "タクトは腕まくりをして挑戦しました。5リットルの容器を満たして、3リットルの容器へ移すと、2リットル残ります。でも、ほしいのは4リットルです。3リットルの容器から始めてみても、4リットルは作れません。", "「2リットルなら作れるのに……。」タクトは店先の帳面に、容器の中身の移り変わりを書き出しながら考えました。2リットルが2つあれば、4リットルになる。けれど、容器は2つしかありません。", "そのとき、おばあちゃんが言いました。「作れた2リットルを、どこかに取っておけないかな。」――そうだ。3リットルの容器に2リットルを移しておいて、もう一度5リットルの容器を満たせば……！"], "en": ["In the town they visited, the two stopped at the oil shop of Grandmother's friend. The oil was sold by measure, but the shop had only two containers: a 3-liter one and a 5-liter one. Just then, a customer arrived and said, \"Exactly four liters of oil, please.\"", "Tacto rolled up his sleeves and tried. Fill the 5-liter container and pour into the 3-liter one, and 2 liters remain. But the customer wants 4 liters. Starting from the 3-liter container did not make 4 liters either.", "\"I can make 2 liters, but...\" Tacto wrote down how the contents changed in the shop notebook, and thought. Two 2-liters would make 4. But there are only two containers.", "Then his grandmother said, \"Can you keep the 2 liters you made somewhere safe?\" — That was it! Park the 2 liters in the 3-liter container, fill the 5-liter container once more, and then..."]}, {"ja": ["タクトは、2リットルの入った3リットルの容器へ、満たした5リットルの容器から油を注ぎました。3リットルの容器に入るのは、あと1リットルだけです。注ぎ終わったとき、5リットルの容器に残ったのは――ぴったり4リットルでした。", "「できた！」式で書くと、5×2−3×2＝4。5リットルを2回入れて、3リットルを2回分引くと、4リットルが残るのです。お客さんは大喜びで、油を持って帰りました。", "それからタクトは、もっとすごいことにも気づきました。3リットルを2回量って、5リットルを1回引くと、3×2−5×1＝1。つまり、この2つの容器で「1リットル」が作れるのです。1が作れれば、1リットルずつ集めて、何リットルでも量ることができます。", "新幹線の2人席と3人席でも、3−2＝1で「1」が作れる組み合わせでした。「3と5、2と3みたいに、共通の約数が1だけの数同士を『互いに素』というんだよ。そういう組み合わせでは、いつか必ず1が作れる。それが、この問題の鍵だね。」おばあちゃんはうなずきました。"], "en": ["Tacto poured from the full 5-liter container into the 3-liter container, which held 2 liters. Only 1 more liter could fit into it. When he finished pouring, what remained in the 5-liter container was — exactly 4 liters!", "\"He did it!\" As an equation: 5×2 − 3×2 = 4. Pour in 5 liters twice, take away 3 liters twice, and 4 liters remain. The delighted customer carried the oil home.", "Then Tacto noticed something even more amazing. Measure 3 liters twice and take away 5 liters once: 3×2 − 5×1 = 1. With these two containers, you can make exactly 1 liter. And if you can make 1, you can gather 1 liter at a time and measure any number of liters at all.", "The train seats were the same kind of pair: 3 − 2 = 1 makes a 1 there too. \"Pairs like 3 and 5, or 2 and 3, whose only common divisor is 1, are called 'coprime.' With such a pair, you can always make 1 sooner or later. That is the key to this puzzle,\" Grandmother nodded."]}, {"ja": ["帰り道、二人は町の縁日に寄りました。屋台の一つに、「ぴったり払いゲーム」の看板があります。4円玉と7円玉のおもちゃコインだけを使って、品物の値段をぴったり払えたら、景品がもらえるのです。", "タクトが挑戦しました。4円、7円、8円、11円、12円、14円、15円、16円の品物は、コインの組み合わせでぴったり払えました。ところが、1円、2円、3円、5円、6円、9円、10円、13円は、どう組み合わせても作れません。", "「17円の品物はどうだい。」屋台のおじさんが、にやりと笑いました。タクトは指折り数えましたが、17円はどうしても作れません。景品はおあずけです。", "ところが、18円、19円、20円、21円の品物は、全部ぴったり払えたのです。「22円は、18円に4円を足せばいい。23円は19円に4円……。ということは、18円以上の金額は全部作れる！」作れない一番大きな金額は、17円で最後でした。"], "en": ["On the way back, they stopped at the town festival. One stall had a sign: \"The Exact-Payment Game.\" If you can pay the exact price of an item using only toy 4-yen and 7-yen coins, you win a prize.", "Tacto took the challenge. Items priced 4, 7, 8, 11, 12, 14, 15, and 16 yen could be paid exactly with coin combinations. But 1, 2, 3, 5, 6, 9, 10, and 13 yen could not be made, no matter how he combined the coins.", "\"How about the 17-yen item?\" The stall keeper grinned. Tacto counted on his fingers, but 17 yen simply could not be made. No prize this time.", "But the items priced 18, 19, 20, and 21 yen could all be paid exactly. \"And 22 is 18 plus 4. Twenty-three is 19 plus 4... That means every amount of 18 yen or more can be made!\" The largest amount that could not be made was 17 — and it was the last one."]}, {"ja": ["「どうして17円が最後なんだろう。」タクトは考えました。18、19、20、21と、4つ続けて作れる金額がそろえば、あとは4円玉を1枚ずつ足していくだけで、すべての金額に届きます。だから、作れない金額には、必ず終わりがあるのです。", "2種類の数aとbが互いに素のとき、作れない一番大きな数は、a×b−a−bで求められます。4と7なら、4×7−4−7＝17。新幹線の2と3なら、2×3−2−3＝1で、「座れないのは1人だけ」とぴったり一致しました。", "油の容器の話は、少しだけ違います。容器では「注いで引く」ことができたので、1が作れて、全部の量が量れました。コインは足すことしかできないから、作れない金額が残るのです。同じ「a×○＋b×○」の家族でも、できることが違うのですね。", "「ところで、コインが3種類以上になると、この公式は使えなくなるんだ。」屋台のおじさんが言いました。「作れない一番大きな金額を求める簡単な方法は見つかっていなくて、今も世界中の数学者が研究しているんだよ。」タクトは驚きました。こんな身近な問題の奥に、まだ解けていない謎が残っていたのです。"], "en": ["\"Why is 17 the last one?\" Tacto wondered. Once four amounts in a row — 18, 19, 20, 21 — can all be made, you only need to keep adding one 4-yen coin to reach every larger amount. So the amounts that cannot be made must come to an end.", "When two numbers a and b are coprime, the largest amount that cannot be made is a×b − a − b. For 4 and 7: 4×7 − 4 − 7 = 17. For the train's 2 and 3: 2×3 − 2 − 3 = 1, which matches \"only one person cannot sit\" exactly.", "The oil containers were a little different. With containers, you could pour and subtract, so you could make 1, and then measure every amount. Coins can only be added, so some amounts remain impossible. They belong to the same \"a×□ + b×□\" family, yet what they can do is different.", "\"By the way,\" said the stall keeper, \"with three or more kinds of coins, this formula no longer works. No simple way to find the largest impossible amount has been found, and mathematicians around the world are still studying it.\" Tacto was amazed. Behind such an everyday puzzle, there was still an unsolved mystery."]}, {"ja": ["夕方、帰りの電車の中で、タクトは今日のことをノートにまとめました。新幹線の座席、油屋さんの容器、縁日のコイン。3つの問題は、みんな「a×○＋b×○＝c」の形をした、同じ家族の問題でした。", "こういう、答えの組み合わせがたくさんあったり、1つもなかったりする方程式を、「不定方程式」といいます。「不定（決まらない）」けれど、作れるものと作れないものの境目は、はっきり決まっているのです。", "その境目を決めるのは、「1が作れるかどうか」でした。互いに素の2つの数からは、かけ算と引き算で必ず1が作れて、そこから世界が広がっていきます。", "次は、あなたの番です。「やってみよう」で、アプリや家の計量カップを使って、ぴったり量ることに挑戦してみてください。あなたなら、どんな組み合わせで1を作りますか。"], "en": ["In the evening, on the train home, Tacto wrote up the day in his notebook. The train seats, the oil shop's containers, the festival coins. All three puzzles had the same shape: a×□ + b×□ = c. They were one family.", "An equation like this — one that may have many answers, or none at all — is called an indeterminate equation. \"Indeterminate\" means the answer is not fixed, yet the border between what can be made and what cannot is perfectly sharp.", "What decides the border is whether you can make 1. From two coprime numbers, multiplication and subtraction can always build a 1, and from there the world opens up.", "Now it is your turn. In the \"Try It Yourself\" corner, take up the challenge of measuring exactly, with the app or with measuring cups at home. How would you build a 1?"]}], "column": {"ja": ["不定方程式は、別名を「ディオファントス方程式」といいます。今から約1700年前、ギリシャの数学者ディオファントスが書いた『算術』という本が、答えが整数の組み合わせになる方程式を、たくさん扱っていたからです。", "インドでも、この種の問題は熱心に研究されました。アーリヤバタ（5〜6世紀）やブラーマグプタ（7世紀）たちは、「クッタカ（粉々に砕く、という意味）」と呼ばれる解き方で、a×x＋b×y＝cの整数の答えを、順序立てて求める方法を作り上げました。暦や天文学の計算に、必要だったのです。", "硬貨の問題は、「フロベニウスの硬貨問題」という名前で知られています。19世紀から20世紀にかけて活躍したドイツの数学者、フロベニウスにちなんだ名前です。コインが2種類のとき、作れない一番大きな金額が a×b−a−b になることと、作れない金額の個数が (a−1)×(b−1)÷2 になることは、イギリスの数学者シルヴェスターが、1884年に示しました。", "ところが、コインが3種類以上になると、このような公式は今も見つかっていません。個々の組み合わせについてはコンピューターで調べられますが、「どんな場合でも成り立つ式」は、現代の数学でも未解決のまま残されているのです。", "この絵本を作った清水正典先生は、昔の授業で、油分け算と新幹線の座席の問題を扱いました。生徒たちが容器の絵を描きながら考えた、その授業の道具を再現したのが、姉妹アプリ『不定方程式シミュレーター』です。アプリのヒント機能は、すべての状態をコンピューターに調べさせて、最短の手順を探しています。"], "en": ["Indeterminate equations are also called Diophantine equations. About 1,700 years ago, the Greek mathematician Diophantus wrote a book called Arithmetica, which treated many equations whose answers are combinations of whole numbers.", "In India, too, these problems were studied eagerly. Mathematicians such as Aryabhata (5th–6th century) and Brahmagupta (7th century) built a method called kuttaka — \"the pulverizer\" — for finding whole-number answers to a×x + b×y = c in an orderly way. They needed it for calendars and astronomy.", "The coin problem is known as \"Frobenius's coin problem,\" named after the German mathematician Frobenius, who worked in the 19th and 20th centuries. For two kinds of coins, the English mathematician Sylvester showed in 1884 that the largest impossible amount is a×b − a − b, and that the number of impossible amounts is (a−1)×(b−1)÷2.", "But with three or more kinds of coins, no such formula has been found even today. Computers can check individual sets of coins, yet a formula that works in every case remains an unsolved problem in modern mathematics.", "Mr. Shimizu, who created this picture book, once taught lessons using the oil-dividing and train-seat problems. The sister app, \"Indeterminate Equation Simulator,\" recreates the tools of that classroom, where students drew pictures of containers and thought together. The app's hint feature lets a computer search through every possible state to find the shortest way."]}, "quiz": {"ja": ["Q1. 3リットルの容器と5リットルの容器で、「1リットル」を作る式はどれですか。　答え：3×2−5×1＝1です（3リットルを2回量り、5リットルを1回引きます）", "Q2. 2人席と3人席の列で、座れない人数はいくつですか。　答え：1人だけです（2人以上は、どんな人数でも座れます）", "Q3. 4円玉と7円玉で作れない、一番大きな金額はいくらですか。　答え：17円です（4×7−4−7＝17で求められます）"], "en": ["Q1. Which equation makes exactly 1 liter with a 3-liter container and a 5-liter container?　Answer: 3×2 − 5×1 = 1 (measure 3 liters twice, and take away 5 liters once)", "Q2. In a row of two-seats and three-seats, which group size cannot sit?　Answer: Only one person (any group of two or more can sit)", "Q3. What is the largest amount that cannot be made with 4-yen and 7-yen coins?　Answer: 17 yen (found by 4×7 − 4 − 7 = 17)"]}, "corner": {"ja": ["アプリ『不定方程式シミュレーター』で遊んでみましょう。油分け算モードでは、3リットルと5リットルの容器で4リットルを量る問題に挑戦できます（最短は6手です）。座席モードでは、人数を変えて、座れない人数がないか確かめられます。", "家でも実験できます。300ミリリットルと500ミリリットルの計量カップ（ペットボトルでも代わりになります）があれば、3と5の組み合わせと同じ仕組みで、400ミリリットルをぴったり量ることができます。大人の人と一緒に、水で試してみましょう。", "硬貨ゲームも作れます。紙に4円玉と7円玉を描いて切り抜き、1円から30円までの金額について、払える金額には○、払えない金額には×をつけて、表にしてみましょう。一番大きな×が17になるはずです。"], "en": ["Try the app \"Indeterminate Equation Simulator.\" In Oil-Dividing Mode, you can challenge yourself to measure 4 liters with 3-liter and 5-liter containers (the shortest solution takes six moves). In Seat Mode, you can change the number of people and check whether any group size cannot sit.", "You can experiment at home, too. With 300-milliliter and 500-milliliter measuring cups (or plastic bottles), you can measure exactly 400 milliliters, by the same mechanism as 3 and 5. Try it with water, together with a grown-up.", "You can make the coin game as well. Draw 4-yen and 7-yen coins on paper and cut them out. For every amount from 1 to 30 yen, mark a circle if it can be paid and a cross if it cannot, and make a table. The largest cross should be at 17."]}}, {"id": "birthday", "title": {"ja": "同じ誕生日はいる？ ― 余事象の確率のおはなし", "en": "Is Anyone Sharing a Birthday? — A Tale of Complementary Probability"}, "sub": {"ja": "小学校高学年〜中学生向け・反対側を数えると、答えが見えてくる", "en": "For upper elementary to middle school — count the opposite side, and the answer comes into view"}, "cover": "bir1.jpg", "images": ["bir1.jpg", "bir2.jpg", "bir3.jpg", "bir4.jpg", "bir5.jpg", "bir5.jpg"], "pages": [{"ja": ["4月、ユイは5年生になりました。新しいクラスは30人です。", "教室の後ろには、大きな「誕生日カレンダー」が貼ってあります。1月から12月まで、365日分のマスがあるカレンダーです。自己紹介のとき、みんなは自分の誕生日を言って、カレンダーの自分の日にシールを貼りました。", "ところが、途中で教室がざわつきました。出席番号7番の男の子と、19番の女の子が、同じ日にシールを貼ったのです。2人とも、10月14日生まれでした。", "「30人しかいないのに、もう重なるなんて。」ユイは首をかしげました。「365日もあるのに、すごい偶然だね。」"], "en": ["In April, Yui became a fifth grader. Her new class had thirty students.", "On the back wall of the classroom hung a big \"birthday calendar\" — a calendar with squares for all 365 days, from January to December. During introductions, everyone said their birthday and put a sticker on their own day.", "Partway through, the classroom began to buzz. The boy with attendance number 7 and the girl with number 19 had put their stickers on the very same day. Both of them were born on October 14.", "\"But there are only thirty of us, and it already happened,\" Yui said, tilting her head. \"There are 365 days — what a coincidence!\""]}, {"ja": ["休み時間、ユイは考えていました。自分と同じ誕生日の人は、このクラスにいるでしょうか。", "試しに「月」だけで見てみると、重なりだらけでした。月は12しかないので、13人集まれば、同じ月生まれの人が必ずいます。30人のクラスでは、どの月にも2〜3人はいる計算です。", "「月が同じなのは当たり前。でも、日まで同じって、やっぱり偶然じゃないの？」", "ユイがつぶやくと、先生が笑って言いました。「本当に偶然かどうか、計算してみようか。ただし、『誰かと誰かが重なる場合』を直接数えるのは、とても大変なんだ。」"], "en": ["During the break, Yui kept thinking. Was there someone in this class whose birthday was the same as hers?", "Looking only at months, matches were everywhere. There are only twelve months, so if thirteen people gather, two of them are sure to share a birth month. In a class of thirty, every month would have two or three people in it.", "\"Sharing a month is nothing special. But the same day as well — that really is a coincidence, isn't it?\"", "When Yui murmured this, her teacher smiled and said, \"Shall we calculate whether it is really a coincidence? Mind you, counting 'the cases where some pair matches' directly is very hard work.\""]}, {"ja": ["先生は黒板に、大きな○と、その外側を塗った図を描きました。", "「直接数えにくいときは、反対側を数える。これがコツだよ。誕生日の話なら、反対側は『全員の誕生日がバラバラ』の場合だね。」", "クラスのみんなで考えます。1人目の誕生日は、365日のどれでもよい。2人目は、1人目と違う日ならよいので、364日。3人目は363日……。全員がバラバラになる確率は、365分の365×364×363×……と、少しずつ小さくなる数を掛けていくことで求められます。", "「そして、『全員バラバラ』でなければ、『誰かと誰かが重なっている』はずだよね。」先生は、図の塗った部分を指さしました。「だから、重なる確率は、1から『全員バラバラ』の確率を引けばいい。これを、余事象の考え方というんだ。」"], "en": ["On the blackboard, the teacher drew a big circle, and shaded the whole area outside it.", "\"When something is hard to count directly, count the opposite side. That is the trick. For birthdays, the opposite side is the case where everyone's birthday is different.\"", "The whole class thought it through together. The first person's birthday can be any of the 365 days. The second person just needs a different day, so 364 days. The third person, 363 days... The probability that all the birthdays are different is found by multiplying numbers that shrink little by little: 365/365 × 364 × 363 × ...", "\"And if they are NOT all different, then some pair must be matching, right?\" The teacher pointed at the shaded part of the diagram. \"So the probability of a match is 1 minus the probability that all are different. This way of thinking is called the complementary event.\""]}, {"ja": ["みんなで電卓をたたきました。人数を増やしていくと、「誰かと誰かが同じ誕生日」の確率は、ぐんぐん上がっていきます。", "10人では約12%。20人では約41%。23人で、約51%と、半分を超えました。365日の半分どころか、23人で半々なのです。", "そして、30人のこのクラスでは――約71%。「ええっ、そんなに高いの！」", "つまり、7番と19番が重なったのは、ちっとも不思議な偶然ではなかったのです。むしろ、重ならないほうが珍しいことでした。教室中から、どよめきが起こりました。"], "en": ["Everyone tapped away at their calculators. As the number of people grew, the probability that some pair shared a birthday climbed and climbed.", "With 10 people, about 12%. With 20 people, about 41%. At 23 people, it passed one half, at about 51%. Not half of 365 days at all — just 23 people for an even chance.", "And in this very class of 30 — about 71%! \"What? That high?\"", "So numbers 7 and 19 matching was not a strange coincidence at all. If anything, NOT matching would have been the unusual outcome. The whole classroom erupted in surprise."]}, {"ja": ["でも、ユイには、まだ引っかかることがありました。「先生、私と同じ誕生日の人がいる確率も、71%なの？」", "先生は首を振りました。「それは別の話だよ。ユイの日は、もう決まっている。残りの29人が、その日を避ける確率を考えてみよう。」", "29人全員がユイの日を避ける確率は、約92%。ということは、ユイと同じ誕生日の人がいる確率は、約8%しかありません。", "「どうして、こんなに違うんだろう。」ユイは考えて、はっとしました。「『誰かと誰か』なら、ペアの組み合わせがたくさんあるからだ！」30人から2人を選ぶ組み合わせは、435通りもあります。ペアが435組もあれば、そのどれかが重なるのは、起こりやすいことなのです。"], "en": ["But something still bothered Yui. \"Teacher, is the probability that someone has the same birthday as me also 71%?\"", "The teacher shook her head. \"That is a different story. Your day is already decided. Let us think about the probability that the other 29 people all avoid your day.\"", "The probability that all 29 people avoid Yui's day is about 92%. Which means the probability that someone shares Yui's birthday is only about 8%.", "\"Why is it so different?\" Yui thought — and then, suddenly, she saw it. \"Because with 'some pair,' there are so many pairs!\" The number of ways to choose 2 people out of 30 is 435. With 435 pairs, it is easy for one of them to match."]}, {"ja": ["放課後、ユイは誕生日カレンダーを眺めていました。10月14日のマスには、シールが2枚並んでいます。", "「偶然だと思っていたことが、計算してみると『起こるほうが普通』だったなんて。」", "直接数えるのが大変なことでも、反対側（余事象）を数えれば、答えにたどり着ける。そして、「自分と同じ」と「誰かと同じ」は、似ているようで全然違う。この2つが、今日の発見でした。", "それから、もう1つ。人数が増えれば、重なる確率は1（確実）に近づいていきます。そして366人集まれば、計算するまでもなく、必ず誰かと誰かが重なります。365日の「巣」より鳩が1羽多ければ、どこかの巣に2羽入るからです。これを「鳩の巣原理」といって、「かもしれない」の確率の話と、「必ず」の話は、実は地続きだったのです。", "次は、あなたの番です。「やってみよう」で、あなたの家族やクラスでも確かめてみてください。23人集まれば、同じ誕生日のペアがいる確率は、もう半分を超えているのですから。"], "en": ["After school, Yui gazed at the birthday calendar. On the square for October 14, two stickers sat side by side.", "\"Something I thought was a coincidence turned out — once I calculated it — to be the normal thing to happen.\"", "Even when counting directly is hard, counting the opposite side (the complementary event) can lead you to the answer. And \"the same as me\" and \"the same as each other\" look alike, but are completely different. Those were the two discoveries of the day.", "And there was one more. As the number of people grows, the probability of a match comes closer and closer to 1 (certainty). And if 366 people gather, no calculation is needed: some pair is sure to match. If there are more pigeons than the 365 days' \"nests,\" two pigeons must enter the same nest. This is called the pigeonhole principle — and the story of \"might happen\" probabilities and the story of \"must happen\" turn out to be connected all along.", "Next, it is your turn. In \"Try It Yourself,\" check with your own family or class. Once 23 people gather, the probability that a birthday pair is among them is already more than half."]}], "column": {"ja": ["この問題は、「誕生日のパラドックス（逆説）」という名前で知られています。パラドックスと言っても、計算が間違っているわけではありません。「365日もあるのだから、重なるはずがない」という直感と、「23人で半分を超える」という計算結果のギャップが、逆説らしく感じられるのです。", "この話は、「鳩の巣原理」とも深く関わっています。鳩の巣原理（引き出し論法とも言い、数学者ディリクレの名前でも知られます）は、「365個の巣に366羽の鳩が入れば、2羽以上入る巣が必ずある」という考え方です。誕生日に当てはめれば、366人集まれば、同じ誕生日のペアが必ずいます。月なら、13人で必ず重なります。余事象の確率の話で言えば、「全員バラバラ」の確率は人数が増えるほど小さくなり、366人でちょうど0になる、ということでもあります。「重なるかもしれない」という確率の話と、「重ならざるを得ない」という原理の話は、人数という1本のものさしの上で、きれいにつながっているのです。", "大事な約束事も確認しておきましょう。この計算では、1年を365日とし（うるう日の2月29日は考えません）、どの日に生まれることも同じ程度に期待できるものとしています。実際には生まれやすい季節の偏りもありますが、考え方の芯は変わりません。", "実は、この絵本の作者・清水正典先生は、2006年、今から20年ほど前に、自分のブログでこの問題を記事にしています。「クラスには必ず同じ誕生日の人がいる？　余事象の確率」（https://ameblo.jp/masanori432/entry-10008026463.html ）という題で、40人のクラスの確率を表計算ソフトで計算し、約89%（正確には0.89123181）という結果を発表していました。コメントも9件ついた、読者と盛り上がった記事です。", "清水先生自身、小学生のとき、生年月日が全く同じ友達がいたそうです。中学・高校のクラスでも、同じ月・同じ日生まれの組み合わせが少なくとも1組はいた、と記事に書いています。この絵本は、その実感と20年前の記事を種にして、物語に仕立て直したものです。"], "en": ["This problem is known by the name \"the birthday paradox.\" It is called a paradox, but the calculation is not wrong. The gap between our intuition — \"there are 365 days, so no one could possibly match\" — and the calculated result — \"more than half, with just 23 people\" — is what makes it feel like a paradox.", "This story is also deeply connected with the pigeonhole principle. The pigeonhole principle (also called the drawer principle, and known by the name of the mathematician Dirichlet) is the idea that \"if 366 pigeons enter 365 nests, there must be a nest with two or more pigeons.\" Applied to birthdays, if 366 people gather, a matching pair is sure to exist. For months, thirteen people are enough. In the language of complementary probability, it also means this: the probability that \"all are different\" shrinks as the number of people grows, and becomes exactly 0 at 366 people. The story of \"might match\" and the principle of \"cannot avoid matching\" are beautifully connected on a single measuring stick — the number of people.", "Let us also check an important promise in the calculation. Here, a year is taken to have 365 days (the leap day, February 29, is not considered), and every day is assumed to be equally likely for a birth. In reality, births do lean toward certain seasons, but the heart of the idea does not change.", "In fact, the author of this picture book, Mr. Masanori Shimizu, wrote about this very problem on his own blog in 2006, some twenty years ago. In a post titled \"Is There Always Someone with the Same Birthday in the Class? — The Probability of the Complementary Event\" (https://ameblo.jp/masanori432/entry-10008026463.html ), he used spreadsheet software to calculate the probability for a class of 40, and published the result: about 89% (exactly 0.89123181). The post received nine comments — a lively time with his readers.", "Mr. Shimizu himself, when he was an elementary school student, had a friend whose birth date was exactly the same as his own. In his middle school and high school classes as well, there was always at least one pair sharing the same month and day, he wrote in the post. This picture book grew from that feeling, and from the article of twenty years ago, retold as a story."]}, "quiz": {"ja": ["Q1. 30人のクラスで、「誰かと誰かが同じ誕生日」の確率は、およそ何%ですか。　答え：約71%です（「全員バラバラ」の確率・約29%を、1から引いて求めます）", "Q2. 何人集まれば、「同じ誕生日のペアがいる」確率が半分を超えますか。　答え：23人です（約51%になります）", "Q3. 30人のクラスで、「自分と同じ誕生日」の人がいる確率が約8%しかないのは、なぜですか。　答え：自分の日は決まっていて、比べる相手は残りの29人だけだからです。「誰かと誰か」では2人の組み合わせが435通りもあるので、重なりやすさが全く違います", "Q4. 366人集まれば、同じ誕生日のペアが「必ず」いるのは、なぜですか。　答え：誕生日は365日しかないので、366人いれば、少なくとも1日は2人以上で分け合うことになるからです。これが鳩の巣原理で、「全員バラバラ」の確率が0になる場合でもあります"], "en": ["Q1. In a class of 30, about what percent is the probability that \"some pair shares a birthday\"?　Answer: About 71% (found by subtracting the probability that \"all are different,\" about 29%, from 1)", "Q2. How many people need to gather before the probability of \"a matching birthday pair\" passes one half?　Answer: 23 people (it becomes about 51%)", "Q3. In a class of 30, why is the probability that someone shares \"your\" birthday only about 8%?　Answer: Because your day is already fixed, and the people to compare with are only the other 29. With \"some pair,\" there are 435 combinations of two people, so the chance of matching is completely different", "Q4. Why is a matching birthday pair \"guaranteed\" when 366 people gather?　Answer: Because there are only 365 birthdays, so with 366 people, at least one day must be shared by two or more people. This is the pigeonhole principle — and it is also the case where the probability of \"all different\" becomes 0"]}, "corner": {"ja": ["（１）月で確かめる：友だちや家族を13人以上集めて、誕生月を聞いてみましょう。月は12しかないので、同じ月生まれのペアが必ず見つかります（これを「鳩の巣原理」と言います。366人集まれば、誕生日そのものも必ず重なります）。", "（２）クラスで確かめる：教室に誕生日カレンダーを作って、全員の日にシールを貼ってみましょう。30人前後のクラスなら、重なる日が見つかることが多いはずです。", "（３）家族で挑戦：お正月など、親戚が23人以上集まる機会があったら、全員の誕生日を聞いてみましょう。同じ誕生日のペアがいる確率は、約51%。見つかるかどうか、予想してから調べると面白いです。", "（４）計算に挑戦：2人だけなら、同じ誕生日の確率は365分の1です。3人、4人と増やすとどうなるか、「全員バラバラ」の確率から計算してみましょう。"], "en": ["(1) Check by month: Gather thirteen or more friends or family members, and ask them their birth months. There are only twelve months, so a pair sharing a birth month is sure to be found (this is the \"pigeonhole principle.\" With 366 people, the birthday itself is sure to match, too).", "(2) Check in class: Make a birthday calendar for the classroom, and have everyone put a sticker on their day. In a class of about thirty, you will very likely find a day that matches.", "(3) A family challenge: When relatives gather — at New Year's, for example — and there are 23 or more people, ask everyone their birthday. The probability that a matching pair is there is about 51%. It is more fun if you predict first, and then check.", "(4) A calculation challenge: With just 2 people, the probability of the same birthday is 1 in 365. What happens as you go to 3 people, then 4? Try calculating it from the probability that all the birthdays are different."]}}, {"id": "radix", "title": {"ja": "√の字のひみつ ― radix（根）のrのおはなし", "en": "The Secret of the √ Sign — The Story of the Letter r"}, "sub": {"ja": "中学生向け・記号は意味の略記、√は500年働きつづけるrの字", "en": "For middle school students — symbols are meanings in shorthand, and √ is a letter r that has been working for 500 years"}, "cover": "rad1.jpg", "images": ["rad1.jpg", "rad2.jpg", "rad3.jpg", "rad4.jpg", "rad5.jpg", "rad5.jpg"], "pages": [{"ja": ["中学1年生のミオは、数学の授業で「平方根」を習いました。黒板には、√9 ＝ 3、√16 ＝ 4 と書いてあります。2乗するとその数になるもの――それが平方根です。", "ノートに写しながら、ミオは首をかしげました。この √ という記号、チェック印に屋根がくっついたような、変な形をしています。どうして、こんな形なのでしょう。", "隣の席の友だちは「そういうものだよ」と笑いました。けれどミオには、どうしても気になります。足し算の ＋ や、等号の ＝ ともちがう、見たことのない形でした。", "するとサワダ先生が、にっこりして言いました。「その形には、ひみつがあるんだよ。実はあれ、500年も働きつづけている『文字』なんだ。」"], "en": ["Mio, a first-year middle school student, was learning about square roots in math class. On the blackboard her teacher had written √9 = 3 and √16 = 4. A square root is a number that gives the original number when multiplied by itself.", "As Mio copied the notes, she tilted her head. This sign √ had a strange shape — like a check mark wearing a little roof. Why did it look like that?", "Her friend next to her laughed and said, \"That's just how it is.\" But Mio could not let it go. It looked like nothing else — not the + of addition, not the = of equals.", "Then her teacher, Ms. Sawada, smiled. \"That shape has a secret,\" she said. \"It is actually a letter — one that has been working for five hundred years.\""]}, {"ja": ["先生は黒板に、大きな r の字を書きました。「昔、数学はラテン語で書かれていたんだ。そのラテン語で『根』は、radix（ラディクス）と言った。」", "9の平方根は、昔は「radix 9」と、言葉のまま書いていました。けれど、何度も書くのは大変です。そこで頭文字の r だけを使うようになりました。", "その r を、速く、つなげて書いているうちに、形が伸びて、しっぽが長くなりました。√ の形は、r が変形したものだと考えられています。", "だから、√ の立った部分と上の線は、もともと1つの文字なのです。線が離れてしまったら、文字がちぎれてしまうのと同じことでした。"], "en": ["The teacher wrote a big letter r on the blackboard. \"Long ago, mathematics was written in Latin. And in Latin, the word for 'root' was radix.\"", "The square root of 9 used to be written out in words, as \"radix 9.\" But writing it again and again was tiresome, so people began to use just its first letter, r.", "When that r was written quickly, over and over, its shape stretched and its tail grew long. The sign √ is thought to be what the letter r turned into.", "So the upright part of √ and the line above it were once a single letter. If the line came away from the sign, it would be like a letter torn in two."]}, {"ja": ["では、なぜ平方根を「根」と呼ぶのでしょう。先生は、黒板に木の絵を描きました。「3 × 3 ＝ 9。9は、3という『もと』から育った数だね。」", "植物の根は、土の中で見えません。けれど、土の上の葉や実は、根から育ちます。9という実を支えている、土の中の根っこが3。平方根の「根」は、その根っこのことです。", "√16 ＝ 4、√25 ＝ 5 のように、根がきれいな数になることもあります。でも √2 は、1.41421356…と、小数がどこまでも続きます。根は、いつもきれいとは限らないのです。", "ミオは思いました。√ の中にある数は「育った数」で、√ は「その根っこを探せ」という印なのだと。"], "en": ["But why call a square root a \"root\" at all? The teacher drew a tree on the blackboard. \"3 × 3 = 9. The number 9 grew from a source — the number 3.\"", "A plant's roots are hidden underground. Yet the leaves and fruit above the ground all grow from those roots. The fruit called 9 is held up by a root called 3, hidden below. That is the \"root\" in square root.", "Sometimes the root is a tidy number: √16 = 4 and √25 = 5. But √2 is 1.41421356…, a decimal that never ends. Roots are not always tidy.", "Mio thought: the number inside √ is the number that grew, and √ is the sign that says, \"Find its root.\""]}, {"ja": ["1525年、ドイツの数学者ルドルフが、代数の本『コス』の中で √ を印刷しました。√ が本に印刷された、初めてのできごとです。ただし、このときの √ には、まだ上の線（屋根）がありませんでした。", "屋根がないと、困ることがあります。「√9 + 16」は、どこまでが根の中なのでしょう。「√9 に16を足す」のか、「9 + 16 の根」なのか、読み手には分かりません。", "そこで1637年、フランスのデカルトが、√ の上に線を付けました。線の名前は vinculum（ウィンクルム）。ラテン語で「結ぶもの」という意味です。屋根の下ぜんぶが、根の中だよ、という目印でした。", "√(9 + 16) ＝ √25 ＝ 5 ですが、√9 + 16 ＝ 3 + 16 ＝ 19 です。線の長さひとつで、答えが変わってしまう。だから上の線は、√ から生えるように、くっついていなければならないのです。"], "en": ["In 1525, a German mathematician named Rudolff printed √ in his algebra book, Die Coss. It was the first time the sign ever appeared in print. But Rudolff's √ had no line on top — no roof yet.", "A missing roof causes trouble. In \"√9 + 16,\" how far does the root reach? Does it mean \"√9, then add 16,\" or \"the root of 9 + 16\"? A reader could not tell.", "So in 1637, Descartes of France added a line above the √. The line's name is vinculum, a Latin word meaning \"a bond, something that ties.\" It marked that everything under the roof was inside the root.", "Now √(9 + 16) = √25 = 5, while √9 + 16 = 3 + 16 = 19. The length of one small line changes the answer. That is why the line must grow out of the √ and stay connected to it."]}, {"ja": ["先生は、もうひとつ話をしました。「古代ギリシャのテオドロスという人は、直角三角形を重ねて、√2、√3、√4…の長さを、次々に描いてみせたんだ。」", "1辺が1の直角三角形の斜辺は √2。その斜辺を使って次の三角形を描くと、斜辺は √3。ぐるぐると渦巻きのように三角形が増えていきます。√4 はちょうど2ですが、√2 や √3 は、小数では決して書き終わりません。", "それでも、コンパスと定規があれば、その長さを紙の上にぴたりと描くことができます。数で書ききれない長さに、√ という印が名前を与えたのです。", "ミオは、ノートの √2 を見つめました。ただの記号だと思っていたのに、見え方がすっかり変わっていました。"], "en": ["The teacher told one more story. \"A Greek mathematician named Theodorus drew right triangles, one on top of another, to show the lengths √2, √3, √4, and on and on.\"", "The hypotenuse of a right triangle with both short sides 1 is √2. Build the next triangle on that hypotenuse, and the new hypotenuse is √3. The triangles grow around in a spiral. √4 turns out to be exactly 2, but √2 and √3 can never be written out fully as decimals.", "Even so, with a compass and a ruler, you can draw those lengths exactly on paper. The little sign √ gave names to lengths that numbers alone could not finish writing.", "Mio looked at the √2 in her notebook. She had thought it was just a symbol — but now it looked completely different."]}, {"ja": ["放課後、ミオはノートを広げて、ほかの記号を眺めました。＋、−、×、÷、＝。どれも、毎日あたりまえに使っている記号です。", "けれど、そのひとつひとつを、昔の誰かが考えて、作ったはずでした。＝ の2本線にも、× の形にも、きっと理由があります。", "記号は「意味の略記」です。長い言葉や深い考えを、小さな印ひとつに詰め込んだ、昔の人からの手紙のようなものでした。", "ミオは √9 ＝ 3 と、丁寧に書きました。上の線を、√ から離さないように。500年働いてきた r の字が、今日もミオのノートの中で働いています。"], "en": ["After school, Mio opened her notebook and looked at the other symbols: +, −, ×, ÷, =. She used every one of them every day without thinking.", "Yet each of them must have been thought up, long ago, by somebody. The two lines of =, the cross of × — there must be a reason for each shape.", "Symbols are meanings written in shorthand. Like letters from people of the past, they pack long words and deep ideas into one small sign.", "Mio wrote √9 = 3, carefully, keeping the line joined to the √. The letter r, at work for five hundred years, was working again today in Mio's notebook."]}], "column": {"ja": ["√ のほかにも、数学の記号には「生まれた年」があります。その多くは、いまから500年ほど前、印刷が広まった時代に生まれました。", "＋ と − は、1489年にドイツのウィッドマンが、商人のための計算の本の中で印刷したのが始まりと言われます。もとは倉庫の品物の「余り」と「不足」を示す印だったようです。", "＝ は、1557年にウェールズのレコードが考えました。「2本の平行な線ほど、等しいものは2つとない」――そう考えて、2本の線を等号にした、という話が伝わっています。", "× は1631年にイギリスのオートレッドが、÷ は1659年にラーンが代数の本で割り算の印として使ったのが、広まりの始まりです。", "√ の r がそうだったように、記号はどれも「意味の略記」です。記号の向こう側には、それを考えた人の顔があります。次に記号を書くとき、少しだけ思い出してみてください。"], "en": ["Like √, the other symbols of mathematics have \"birth years.\" Many of them were born about five hundred years ago, in the age when printing spread.", "The signs + and − were first printed in 1489, in a book of arithmetic for merchants by Widmann of Germany. They are said to have begun as marks for \"surplus\" and \"shortage\" on goods in a warehouse.", "The sign = was invented in 1557 by Recorde of Wales. The story goes that he chose two parallel lines because, as he felt, no two things could be more equal than two straight lines of the same length, side by side.", "The sign × came into use through Oughtred of England in 1631, and ÷ was used as a sign for division by Rahn in his algebra book of 1659.", "Just like the r inside √, every symbol is a meaning written in shorthand. Behind each symbol is the face of the person who thought of it. Next time you write a symbol, try to remember that for a moment."]}, "quiz": {"ja": ["Q1. √ の形のもとになった文字は、ラテン語 radix の頭文字でした。その文字は、次のうちどれでしょう。（ア）a （イ）r （ウ）x　答え：（イ）r。radix は「根」という意味で、r を速く書くうちに形が伸びて √ になったと考えられています。", "Q2. √9 + 16 と √(9 + 16) では、答えがちがいます。それぞれ、いくつになるでしょう。　答え：√9 + 16 ＝ 3 + 16 ＝ 19。√(9 + 16) ＝ √25 ＝ 5。上の線（屋根）の長さで、根の中の範囲が決まります。", "Q3. √ の上に線（vinculum）を付けたのは誰でしょう。また、その線にはどんな役目があるでしょう。　答え：デカルト（1637年）。線の下にあるものぜんぶが「根の中」であることを示す役目があります。"], "en": ["Q1. The sign √ began as the first letter of the Latin word radix. Which letter was it? (a) a (b) r (c) x　Answer: (b) r. Radix means \"root,\" and the letter r, written quickly again and again, is thought to have stretched into the shape of √.", "Q2. The expressions √9 + 16 and √(9 + 16) have different answers. What is each answer?　Answer: √9 + 16 = 3 + 16 = 19. √(9 + 16) = √25 = 5. The length of the line above (the roof) decides what lies inside the root.", "Q3. Who added the line (the vinculum) above the √, and what job does the line do?　Answer: Descartes (in 1637). It shows that everything under the line is inside the root."]}, "corner": {"ja": ["用意するもの：紙、定規、コンパス、鉛筆。長さの「1」は、10cmにすると描きやすいですよ。", "まず、1辺が「1」の正方形を描いて、対角線を引きます。その対角線の長さが √2 です。定規で測ると、約1.41（14.1cm）になるはずです。", "次に、その対角線を1辺にして、もう1辺が「1」の直角三角形を描きます。コンパスで対角線の長さを写し取ると、正確に描けます。新しい斜辺の長さが √3 で、約1.73（17.3cm）になります。", "同じことをもう1回くりかえすと、√4 が描けます。測ってみると、ちょうど2（20cm）。ぴったりになるのが、少し気持ちいいはずです。", "続けていくと、三角形の渦巻き「テオドロスの渦巻き」になります。√5、√6…と、根の長さがぐるぐる育っていく絵を描いてみましょう。"], "en": ["You will need: paper, a ruler, a compass, and a pencil. It is easier to draw if you let the length \"1\" be 10 cm.", "First, draw a square with sides of length 1, and draw its diagonal. The length of that diagonal is √2. Measure it with your ruler — it should be about 1.41 (14.1 cm).", "Next, use the diagonal as one side, and draw a right triangle whose other short side is 1. Use the compass to copy the diagonal's length so you can draw it exactly. The new hypotenuse has length √3, about 1.73 (17.3 cm).", "Do the same thing once more, and you will draw √4. Measure it — it should be exactly 2 (20 cm). Landing exactly on 2 feels rather good.", "If you keep going, your triangles become the Spiral of Theodorus. Try drawing the roots √5, √6, and more, growing round and round."]}}, {"id": "colors", "title": {"ja": "地図は何色あればぬれる？ ― 四色問題のおはなし", "en": "How Many Colors Does a Map Need? — The Story of the Four-Color Problem"}, "sub": {"ja": "小学校高学年〜中学生向け・「隣と同じ色はダメ」の約束から生まれた、124年越しの大問題", "en": "For upper elementary to middle school — a small coloring rule that became a 124-year problem"}, "cover": "col1.jpg", "images": ["col1.jpg", "col2.jpg", "col3.jpg", "col4.jpg", "col5.jpg", "col5.jpg"], "pages": [{"ja": ["ある日の数学の時間、サワダ先生が白地図を配りました。架空の島の地図で、中には国境の線がいくつも引かれ、国がいくつにも分かれています。「今日は、この地図に色をぬってみよう。約束はひとつだけ。隣り合う国同士は、同じ色になってはいけないよ。」", "ミオは色鉛筆を全部出して、ぬり始めました。赤、青、黄、緑、むらさき、オレンジ……。隣とちがう色を選んでいけば、どんな地図でもぬれます。あっという間に、カラフルな島ができあがりました。", "ところが先生は言いました。「きれいにぬれたね。でも、色鉛筆をたくさん使えば簡単だ。問題はここからだよ。その地図、いったい何色まで減らせるかな？」", "教室がざわつきました。使う色を少なくするのは、そんなにむずかしいことなのでしょうか。ミオは新しい白地図をもらって、挑戦することにしました。"], "en": ["One day in math class, Ms. Sawada handed out blank maps. They showed an imaginary island, divided by border lines into several countries. \"Today, let us color this map,\" she said. \"There is just one rule: two countries that share a border must never have the same color.\"", "Mio took out all her colored pencils and began: red, blue, yellow, green, purple, orange. As long as she always chose a color different from the neighbors, any map could be colored. In no time, her island was finished, bright and colorful.", "But then her teacher said, \"Beautifully done. But with so many pencils, it is easy. Here is the real question. How few colors can you get away with?\"", "The class buzzed. Would using fewer colors really be so hard? Mio took a fresh map and decided to try."]}, {"ja": ["まず5色で試してみます。これは、すぐにできました。次は4色。国の数が多いので、少し考えなければなりません。こっちを赤にすると、あっちが困る。行きづまったら、ひとつ前の色をぬり直して、やり直します。", "「ぬっては消して、消してはぬって……まるで迷路みたい。」ミオは、場合をひとつずつ整理しながら進めました。最後の1国がスポッと収まったとき、思わず小さくガッツポーズが出ました。4色でぬれたのです。", "隣の席の友だちも4色で完成させました。別の地図でも、やっぱり4色でぬれます。「ねえ先生、もしかして、どんな地図でも4色でぬれるんじゃない？」", "先生はにやりとしました。「それがね、ミオ。その『もしかして』に、世界中の数学者が124年間も悩まされたんだよ。」"], "en": ["First she tried five colors. That was easy. Next, four colors. With so many countries, she had to think. If she painted this one red, that one over there would get stuck. Whenever she reached a dead end, she went back one step, changed a color, and tried again.", "\"Paint, erase, paint, erase... it is like a maze,\" Mio said, carefully keeping track of the cases as she went. When the very last country slipped into place, she could not help making a tiny fist pump. She had done it with four colors.", "Her friend in the next seat also finished with four colors. And with a different map, four colors worked again. \"Ms. Sawada,\" Mio said, \"maybe ANY map can be colored with just four colors?\"", "Her teacher grinned. \"That 'maybe' of yours, Mio — mathematicians all over the world wrestled with it for 124 years.\""]}, {"ja": ["では、3色ではどうでしょう。ミオは意気込んで始めましたが、ある地図で手が止まりました。丸い島を3つに切り分けたような地図です。島の外側には海があります。先生が言いました。「海も、ひとつの『地域』として数えてごらん。」", "地域は全部で4つ。真ん中の切り分けでできた3つの地域は、たがいに隣り合っています。そして外側の海は、その3つ全部と隣り合っています。つまり、4つの地域が、どれも残りの3つ全部と隣り合っているのです。", "こうなると、色は4色ないと足りません。1つ目に赤、2つ目に青、3つ目に黄をぬると、4つ目は赤も青も黄も使えないからです。「3色では、どうやっても無理な地図があるんだ……。」", "裏を返すと、この地図は「4色は絶対に必要」な証拠です。では、5色目が必要な地図はあるのでしょうか。クラス全員でいろいろな地図を作って試しましたが、5色目が要る地図は、ひとつも見つかりませんでした。"], "en": ["Then how about three colors? Mio started eagerly, but one map stopped her cold. It was a round island cut into three pieces, like a cake — and around the island lay the sea. \"Count the sea as one region, too,\" her teacher said.", "That made four regions in all. The three pieces of the island all touched each other. And the sea outside touched all three of them. In other words, each of the four regions touched all three of the others.", "With a map like that, three colors are simply not enough. If the first region is red, the second blue, and the third yellow, then the fourth region cannot use red, blue, or yellow. \"So some maps just cannot be done in three...\"", "Turned around, this map proved that four colors are sometimes really needed. But would any map ever need a fifth? The whole class drew map after map and tried — and not one of them needed a fifth color."]}, {"ja": ["この問題が初めて考えられたのは、1852年のことです。イギリスのガスリーという人が、イングランドの地図をぬっていて気づきました。「もしかして、どんな地図も4色でぬれるのではないか？」", "簡単そうに見える問題でした。ところが、誰も証明できません。反対に、5色必要な地図も見つかりません。「できるはず」と「証明できない」の間で、数学者たちは100年以上も立ち往生したのです。", "1879年には、ケンプという人が「証明できた」と発表して、みんなが喜びました。ところが11年後、その証明には穴があることが分かってしまいます。ぬか喜びのまま、問題はまた振り出しに戻りました。", "ちなみに1890年、ヒーウッドという人は、その穴を見つけると同時に「5色あれば、どんな地図でも必ずぬれる」ことは証明しました。答えは4色か5色か。その差の「1色」が、どうしても埋まらなかったのです。"], "en": ["This problem was first thought of in 1852. A man in England named Francis Guthrie was coloring a map of the counties when he noticed something: \"Maybe every map can be colored with four colors.\"", "It looked like an easy problem. But nobody could prove it. And nobody could find a map that needed five colors, either. Between \"it seems to work\" and \"we cannot prove it,\" mathematicians were stuck for more than a hundred years.", "In 1879, a man named Kempe announced, \"I have proved it!\" and everyone rejoiced. But eleven years later, a hole was found in his proof. The celebration had been too early, and the problem went back to the start.", "To be fair, in 1890 Percy Heawood — the man who found the hole — also proved that five colors always suffice for any map. So the answer was either four or five. That single color of difference just would not go away."]}, {"ja": ["転機は1976年に訪れました。アメリカのアッペルとハーケンという2人の数学者が、四色問題を解いたと発表したのです。ただし、その方法は今までとまったくちがっていました。コンピュータの助けを借りたのです。", "2人は、地図のパターンを整理して、調べなければならない場合を1,936通りにまで絞り込みました。そして、その全部をコンピュータに確かめさせたのです。人間が手で調べたら何年もかかる分量でした。", "発表の後、数学者の間では議論が起きました。「コンピュータが調べただけで、証明と言えるのだろうか？」人間がすべてを自分の目で確かめられない証明を、どう考えるか。四色問題は、「証明とは何か」という問いまで持ち込んだのでした。", "それでも、いくつもの点検を経て、この証明は正しいと認められました。1852年の小さな疑問は、124年かかって、ようやく決着したのです。"], "en": ["The turning point came in 1976. Two American mathematicians, Kenneth Appel and Wolfgang Haken, announced that they had solved the four-color problem — but their method was unlike anything before. They had borrowed the help of a computer.", "The two had organized the patterns a map can take and narrowed down all the cases that had to be checked to 1,936. Then they let the computer verify every single one — an amount of work that would have taken a human checker many years.", "After the announcement, mathematicians argued. \"If a computer checked it, can we call that a proof?\" A proof that no human could follow all the way through by hand — how should we think about such a thing? The four-color problem had raised a new question: what is a proof, really?", "Even so, after many rounds of checking, the proof was accepted as correct. The small question of 1852 had finally been settled, 124 years later."]}, {"ja": ["放課後、ミオは自分で地図を描いてみました。国境の線をぐにゃぐにゃに引いて、できるだけ複雑な地図にします。「今度こそ、5色目が要る地図を作ってやる！」", "けれど、ぬってみると、やっぱり4色で足りてしまいます。ぬり直しを何回かするうちに、最後の国まできれいに収まりました。ミオは笑いながらも、少しだけ悔しくなりました。", "「証明された」ということは、ミオがどんな地図を描いても、絶対に4色でぬれるということです。反例探しは、もう終わっています。それでも、自分の手でぬって確かめる作業は、少しも退屈ではありませんでした。", "地図をぬる。ただそれだけのことが、124年もの大問題になりました。次に地図帳を開いたとき、ミオはきっと、そっと色鉛筆を取り出すでしょう。「何色でぬれるかな？」とつぶやきながら。"], "en": ["After school, Mio drew her own map. She made the border lines as wiggly and complicated as she could. \"This time, I will make a map that needs a fifth color!\"", "But when she colored it, four colors were enough once again. After a few erasures and retries, even the last country settled neatly into place. Mio laughed — and felt just a little bit frustrated.", "Because the problem has been proved, no matter what map Mio draws, four colors will always be enough. The hunt for a counterexample is over. And yet, coloring maps with her own hands had not been boring for a single minute.", "Coloring a map. That tiny thing became a problem that lasted 124 years. The next time Mio opens an atlas, she will probably reach quietly for her pencils and murmur, \"Now, how many colors will this one need?\""]}], "column": {"ja": ["1852年、フランシス・ガスリーは、イングランドの州の地図をぬりながら四色問題を思いつきました。弟を通じて数学者ド・モルガンに伝えられ、問題は数学界に広まります。あまりに簡単そうに見えたため、多くの人が「すぐに解ける」と思いました。", "1879年、アルフレッド・ケンプが証明を発表し、問題は解決したかに見えました。しかし1890年、パーシー・ヒーウッドがその証明の誤りを指摘します。同じ論文でヒーウッドは「五色定理」、つまり5色あればどんな地図もぬれることを証明しました。あと1色の差が、その後86年間残り続けます。", "1976年、イリノイ大学のケネス・アッペルとヴォルフガング・ハーケンは、コンピュータを使って四色問題を証明しました。調べた配置は1,936通り。当時、コンピュータによる大規模な確かめを「証明」と呼んでよいか、大きな議論になりました。", "その後、調べる配置の数はさらに少なく整理され、2005年には証明そのものをコンピュータで点検する「形式検証」も行われました。四色問題は、数学とコンピュータの関係を考える、最初の大きな事件だったと言われています。"], "en": ["In 1852, Francis Guthrie thought of the four-color problem while coloring a map of the English counties. Through his brother, the question reached the mathematician Augustus De Morgan, and it spread through the mathematical world. It looked so simple that many people expected it to fall quickly.", "In 1879, Alfred Kempe published a proof, and the problem seemed solved. But in 1890, Percy Heawood pointed out a mistake in it. In the same paper, Heawood proved the five-color theorem: five colors always suffice for any map. That one stubborn color of difference remained for another 86 years.", "In 1976, at the University of Illinois, Kenneth Appel and Wolfgang Haken proved the four-color theorem with the help of a computer. They checked 1,936 configurations. Whether such a massive computer check should count as a \"proof\" caused a famous debate at the time.", "Later, the number of cases was reduced still further, and in 2005 the proof itself was formally verified by computer. The four-color problem is remembered as the first great event in the story of mathematics and computers."]}, "quiz": {"ja": ["Q1. 隣り合う地域が同じ色にならないように、どんな地図でも必ずぬれることが証明されている色数は、何色でしょう。（ア）3色 （イ）4色 （ウ）6色　答え：（イ）4色。1976年にアッペルとハーケンが証明しました。", "Q2. 丸い島を3つに切り分けた地図で、外側の海も1つの地域と数えます。地域は全部でいくつありますか。また、この地図をぬるのに最低何色必要でしょう。　答え：地域は4つ（島の3つと海）。4つの地域がたがいに全部隣り合うので、最低4色必要です。3色ではぬれません。", "Q3. 四色問題が解かれたのは何年で、どんな方法が使われたでしょう。　答え：1976年。コンピュータの助けを借りて、1,936通りの場合をすべて確かめる方法でした。"], "en": ["Q1. What is the smallest number of colors that is proven to be enough to color any map so that neighbors always differ? (a) 3 colors (b) 4 colors (c) 6 colors　Answer: (b) 4 colors. Appel and Haken proved it in 1976.", "Q2. Take a round island cut into three pieces, and count the sea outside as one region. How many regions are there in all, and what is the smallest number of colors this map needs?　Answer: Four regions (the island's three pieces and the sea). Since every region touches all the others, it needs at least 4 colors; 3 colors are not enough.", "Q3. In what year was the four-color problem solved, and what method was used?　Answer: 1976. A computer helped check all 1,936 cases."]}, "corner": {"ja": ["この絵本と組になっているアプリ「四色ぬりえパズル」で、実際に地図ぬりに挑戦してみましょう。地域をタップして色を選ぶだけの、かんたんな操作です。隣の国と同じ色にしてしまうと、その場で分かる表示が出ます。", "まずは、少ない色数でぬることに挑戦です。易しい地図から難しい地図まで用意してあります。どの地図も、4色でぬれることはプログラムで確かめてあります。", "「3色チャレンジ」のモードでは、3色でぬれる地図と、どうやっても3色ではぬれない地図の両方を体験できます。絵本の3ページ目で出てきた「4つの地域が全部隣り合う地図」も入っています。手が止まったら、それが「3色では無理」のサインかもしれません。", "自由にぬれるモードでは、色数に制限はありません。カラフルな地図を仕上げるもよし、自分なりの最速記録に挑むもよし。そして慣れてきたら、紙と鉛筆で自分の地図を描いて、家族や友だちに出題してみてください。「何色でぬれる？」は、そのまま数学の問いになります。"], "en": ["Try coloring real maps in the companion app, the Four-Color Puzzle. Just tap a region and choose a color. If a region ends up the same color as its neighbor, the app shows you right away.", "Your first challenge is to finish each map with as few colors as possible. There are maps from easy to hard, and every one of them has been checked by a program to make sure four colors are enough.", "In \"3-Color Challenge\" mode, you can try maps that can be colored with three colors — and maps that simply cannot. The \"four regions all touching each other\" map from page 3 of this story is in there, too. If your hand stops and thinks, that may be the sign that three colors cannot work.", "In Free Color mode, there is no limit on colors at all. Finish a rainbow map, or race your own best time. And once you get the hang of it, draw your own map on paper and quiz your family and friends. \"How many colors does it need?\" is a real mathematics question, all by itself."]}}, {"id": "gauss", "title": {"ja": "あっという間に5050！ ― ガウス少年の数のならべかえ", "en": "5050 in a Flash! — Young Gauss and the Great Rearranging"}, "sub": {"ja": "小学校高学年〜中1向け・「1＋2＋…＋100」を一瞬で解いた、数のペアのひらめき", "en": "For upper elementary to early middle school — the pairing idea that solved 1+2+…+100 in an instant"}, "cover": "gau1.jpg", "images": ["gau1.jpg", "gau2.jpg", "gau3.jpg", "gau4.jpg", "gau5.jpg", "gau5.jpg"], "pages": [{"ja": ["ある日の数学の時間、サワダ先生が黒板に大きな式を書きました。「1＋2＋3＋4＋……＋99＋100」。「今日の課題はこれ。1から100までの数を、全部足してみよう。」", "教室がどよめきました。100個も足すなんて、気が遠くなります。ミオはノートに式を写し、左から順に足し始めました。1＋2＝3、＋3＝6、＋4＝10……。まだ序の口なのに、答えの数はどんどん大きくなっていきます。", "「先生、これ、間違えずに最後までたどり着ける自信がありません……。」誰かがぼやくと、みんなもうなずきました。たし算そのものは難しくないのに、回数が多すぎるのです。", "すると先生はにっこりしました。「実はね、この問題には有名なお話があるんだ。ずっと昔のドイツの学校で、一人の少年があっという間に答えを出して、先生をびっくりさせたっていうお話だよ。」"], "en": ["One day in math class, Mr. Sawada wrote a huge sum on the blackboard: \"1+2+3+4+…+99+100\". \"Here is today's task. Add up all the numbers from 1 to 100.\"", "The classroom buzzed. Adding a hundred numbers felt endless. Mio copied the sum into her notebook and started from the left: 1+2=3, +3=6, +4=10… She had barely begun, and the answers were already growing fast.", "\"Teacher, I'm not confident I can reach the end without a mistake…\" someone moaned, and everyone nodded. Adding itself was not hard — there were just far too many additions.", "Mr. Sawada smiled. \"Actually, there is a famous story about this very problem. Long ago, in a school in Germany, one boy produced the answer in no time at all, and amazed his teacher.\""]}, {"ja": ["「これは、有名な逸話（いつわ）として伝わってきたお話だよ。細かいところは、語る人によっていろいろなのだけれど、少年のひらめきのすごさは、200年以上たった今も語り草なんだ。」", "その少年は、数の並びをじっと見つめたあと、並びを「逆さまから」もう一度書いてみたのだそうです。1、2、3、……、100 の下に、100、99、98、……、1 をそろえて並べるのです。", "すると、縦のペアの合計が、どれも同じになりました。1＋100＝101、2＋99＝101、3＋98＝101……。はじめから終わりまで、全部101です。", "ペアは全部で100組あるので、2倍にした合計は101×100＝10100。もとの合計は、その半分です。「10100÷2＝5050！」少年は、こうしてあっという間に答えにたどり着いた、と言われています。"], "en": ["\"This story has been handed down as a famous anecdote. The small details differ a little depending on who tells it, but the boy's brilliant idea is still talked about more than 200 years later.\"", "The boy, it is said, stared at the row of numbers, and then wrote the row once more — backwards. Under 1, 2, 3, …, 100, he lined up 100, 99, 98, …, 1.", "Then something wonderful appeared: every vertical pair had the same total. 1+100=101, 2+99=101, 3+98=101… From the first pair to the last, all of them were 101.", "There were 100 pairs, so twice the sum was 101×100=10100. The real sum was half of that. \"10100÷2=5050!\" And so, the story goes, the boy reached the answer in a flash."]}, {"ja": ["「すごい！ 並べかえただけなのに！」ミオは目を輝かせました。大切なのは、式をそのままの順で足すのではなく、並びを変えてペアを作ることでした。", "黒板で確かめてみます。両端からペアにすると、1＋100＝101、2＋99＝101、3＋98＝101……。内側へ1つ進むたび、片方の数は1増え、もう片方は1減るので、合計はいつも101のままです。", "ペアの数は、100個の数を2つずつ組にするので、50組。101×50＝5050。さっきの「2倍にして半分にする」方法と、ぴたり同じ答えになりました。", "「やり方を工夫すると、遠くに見えた答えが急に近くなるんだね。」ミオはノートに「ならべかえの術」と大きく書きました。"], "en": ["\"Amazing! And all he did was rearrange them!\" Mio's eyes sparkled. The key was not to add the numbers in their given order, but to change the order and make pairs.", "Let us check it on the blackboard. Pairing from both ends gives 1+100=101, 2+99=101, 3+98=101… Each step inward, one number grows by 1 and the other shrinks by 1, so the total stays 101 forever.", "The number of pairs is 100 numbers grouped two by two: 50 pairs. 101×50=5050. Exactly the same answer as the \"double it and halve it\" method.", "\"When you think of a clever way, a faraway answer suddenly comes close.\" In her notebook, Mio wrote in big letters: \"The Rearranging Trick.\""]}, {"ja": ["では、1から10までの合計なら、どうでしょう。両端からペアにすると、1＋10＝11、2＋9＝11、3＋8＝11、4＋7＝11、5＋6＝11で、全部で5組。11×5＝55。1つずつ全部足しても55で、ぴたり合いました。", "数が奇数個、たとえば1から9までならどうでしょう。ペアは1＋9＝10、2＋8＝10、3＋7＝10、4＋6＝10の4組で、真ん中の5が1つ残ります。10×4＋5＝45。これも、全部足した答えと一致しました。", "まとめると、等しい間隔で並んだ数の合計は、「（はじめの数＋最後の数）×個数÷2」で求められます。1から9までなら、（1＋9）×9÷2＝45。偶数個でも奇数個でも、この式がそのまま使えます。", "「公式って、覚えるものじゃなくて、自分で見つけるものなんだ。」ミオは、さっきの「ならべかえ」の図を、もう一度丁寧に描き直しました。"], "en": ["Now, what about the sum from 1 to 10? Pairing from the ends: 1+10=11, 2+9=11, 3+8=11, 4+7=11, 5+6=11 — five pairs in all. 11×5=55. Adding them one by one also gives 55. A perfect match.", "What if there is an odd count of numbers, like 1 to 9? The pairs are 1+9=10, 2+8=10, 3+7=10, 4+6=10 — four pairs, with the middle 5 left over. 10×4+5=45. That also matches the total you get by adding everything.", "In short, the sum of numbers spaced evenly apart is \"(first number + last number) × count ÷ 2\". For 1 to 9, that is (1+9)×9÷2=45. The formula works whether the count is even or odd.", "\"A formula is not something to memorize — it is something to discover for yourself.\" Mio carefully redrew the pairing picture from the story."]}, {"ja": ["授業の後半、先生は言いました。「数の合計は、形でも考えられるんだよ。」黒板に、丸（●）を三角の形に並べた図が描かれました。1段目に1個、2段目に2個、3段目に3個、という並べ方です。", "1段目までの合計は1、2段目までは1＋2＝3、3段目までは6、4段目までは10、5段目までは15。こうしてできる数を「三角数」と言います。三角数は、まさに1からの合計そのものなのです。", "その三角をもう1つ、逆さまにして隣にくっつけると、長方形になります。5段の三角なら、横6・縦5の長方形のちょうど半分。だから三角数は「段の数×（段の数＋1）÷2」で求められます。ガウスの合計の式と、まったく同じ形をしています。", "さらに、奇数を順に足していくと、四角い形の数が現れます。1＝1、1＋3＝4、1＋3＋5＝9、1＋3＋5＋7＝16……。合計が1、4、9、16という「四角数」になるのです。数は、形の顔も持っているのですね。"], "en": ["In the second half of the lesson, Mr. Sawada said, \"A sum of numbers can also be seen as a shape.\" On the blackboard he drew dots (●) arranged in a triangle: one dot in the first row, two in the second, three in the third.", "The totals grow like this: up to row 1, the total is 1; up to row 2, 1+2=3; up to row 3, 6; up to row 4, 10; up to row 5, 15. Numbers made this way are called \"triangular numbers\". A triangular number is exactly a sum starting from 1.", "Now place a second, upside-down triangle next to the first, and the two fit together into a rectangle. For a 5-row triangle, it is exactly half of a rectangle 6 wide and 5 tall. So a triangular number equals \"rows × (rows + 1) ÷ 2\" — the very same shape as Gauss's sum formula.", "And if you add odd numbers in order, square shapes appear: 1=1, 1+3=4, 1+3+5=9, 1+3+5+7=16… The totals are 1, 4, 9, 16 — the \"square numbers\". Numbers have a face made of shapes, too."]}, {"ja": ["「では、おまけの問題だよ。」先生が書いたのは、「1から100までの偶数の合計と、奇数の合計の差はいくつか」という問題でした。", "ミオは、またペアで考えました。2−1＝1、4−3＝1、6−5＝1……。偶数と奇数は交互に並んでいて、となり同士の差はいつも1です。ペアは全部で50組あるから、答えは1×50＝50。「やった、またペアの考え方が使えた！」", "数を形で見る見方は、とても古くからあるものです。古代ギリシャのピタゴラスとその仲間たちは、小石を三角や四角に並べて、数の性質を調べていたと言われています。", "「5050のひらめきは、並べかえの工夫。そしてその工夫は、『数を形で見る』楽しさにもつながっているんだ。」ミオのノートの最後のページには、丸で描いた小さな三角が残っていました。"], "en": ["\"Here is a bonus problem,\" said Mr. Sawada, writing on the board: \"What is the difference between the sum of the even numbers from 1 to 100 and the sum of the odd numbers?\"", "Mio thought in pairs again. 2−1=1, 4−3=1, 6−5=1… Even and odd numbers take turns appearing, and neighbours always differ by 1. There are 50 pairs, so the answer is 1×50=50. \"Yes! The pairing idea worked again!\"", "Seeing numbers as shapes is a very old idea. Long ago in Greece, Pythagoras and his followers are said to have arranged pebbles into triangles and squares to study the secrets of numbers.", "\"The flash of insight behind 5050 was the rearranging trick — and that trick connects to the joy of seeing numbers as shapes.\" On the last page of Mio's notebook remained a small triangle drawn with little circles."]}], "column": {"ja": ["三角数や四角数のように、数を図形の形で表したものを「図形数」と言います。古代ギリシャには小石を並べて数を考える習慣があり、ピタゴラスの学派は、三角数や四角数の性質を熱心に調べました。たとえば、となり合う三角数を足すと四角数になる（3＋6＝9、6＋10＝16）ことなど、形から見えてくる性質は、たくさんあります。", "「2つの三角を合わせると長方形になる」という見方は、合計の公式を、目で見て確かめる方法でもあります。式だけの説明より、図の方が「なるほど！」と思えることがあります。ガウスのペアの考え方も、実はこの「並べかえて、組み合わせる」発想と、根っこのところでつながっています。", "少年ガウスのお話について、ひとつ注意があります。この逸話は数学の世界で広く伝わっていますが、少年の年齢や先生の名前といった細部は、伝える本によって少しずつ違っています。そこで、この絵本でも細部は断定せずに紹介しました。「有名な逸話」と「確かな史実」を分けて考えることも、歴史を学ぶ大切な姿勢です。", "ガウス（1777〜1855）は、のちに「数学の王」とも呼ばれる大数学者になりました。数論、統計に現れる正規分布、天文学での軌道の計算など、その業績は多方面にわたります。一瞬で5050を見抜いたひらめきは、大数学者の考え方の原点だったのかもしれません。"], "en": ["Numbers expressed as shapes, like triangular numbers and square numbers, are called \"figurate numbers\". In ancient Greece, people studied numbers by arranging pebbles, and the school of Pythagoras eagerly explored the properties of triangular and square numbers. For example, two neighbouring triangular numbers add up to a square number (3+6=9, 6+10=16). Many properties become visible only when you look at the shape.", "The idea that \"two triangles joined together make a rectangle\" is also a way to check the sum formula with your own eyes. A picture can convince you with a \"Now I see!\" in a way a formula alone sometimes cannot. Gauss's pairing idea is, at its root, connected to this same idea of rearranging and combining.", "One caution about the young Gauss story. The anecdote is widely told in the world of mathematics, but details such as the boy's age and his teacher's name differ slightly from book to book. That is why this picture book introduces the story without fixing those details. Separating \"a famous anecdote\" from \"certain historica
