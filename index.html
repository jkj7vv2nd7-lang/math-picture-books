ared in the previous episode, there is the hunt for the world's largest primes. In 2024, a prime with more than 41 million digits (2 to the power of 136,279,841, minus 1) was found by GIMPS, a project linking volunteers' computers around the world. Those who chase the pattern of the primes, and those who hunt big primes one by one — the passion for primes continues worldwide today."]}, "quiz": {"ja": ["Q1　100までに、素数は何個あるでしょう。　答え：25個", "Q2　リーマン予想は、何が1本の直線の上に並んでいると予想しているでしょう。　答え：ゼータ関数の大切な零点（波の「音」にあたる点）が、すべて「真ん中の線」の上に並ぶこと", "Q3　2026年の発表で、賞金100万ドルはもう決まったでしょう。　答え：決まっていない（専門誌への公表、2年以上の経過、数学界に広く受け入れられること、という条件をまだ満たしていない）"], "en": ["Q1　How many primes are there up to 100?　Answer: 25", "Q2　What does the Riemann hypothesis say is lined up on a single straight line?　Answer: All the important zeros of the zeta function (the points acting as the \"notes\" of the waves) lie on the \"middle line\"", "Q3　With the 2026 announcement, has the one-million-dollar prize already been decided?　Answer: No (the conditions — journal publication, two or more years passing, and general acceptance by the mathematical community — are not yet met)"]}, "corner": {"ja": ["用意するものは、方眼紙と鉛筆です。まず、100までの素数を全部書き出してみましょう（第52話の「ふるい」を使うと便利です）。素数は全部で25個あります。", "次に、10までに何個、20までに何個、と数えていきます（4個、8個、10個、12個、15個、17個、19個、22個、24個、25個）。その数を点で打ってつなぐと、「素数のかいだん」が描けます。", "階段は右上がりに伸びていきますが、段の間隔はばらばらです。この「だいたい伸びるけれど、がたがたしている」感じこそ、リーマン予想が解き明かそうとした素数のリズムです。", "おまけの遊びです。1から30まで声に出して数え、素数のときだけ手をたたいてみましょう。リズムが不規則で、なかなか難しいはずです。その「つかめなさ」が、167年も数学者を夢中にさせました。"], "en": ["You will need graph paper and a pencil. First, write out all the primes up to 100 (the sieve from episode 52 is handy). There are 25 of them in all.", "Next, count how many there are up to 10, up to 20, and so on (4, 8, 10, 12, 15, 17, 19, 22, 24, 25). Plot the counts as points and connect them, and you will draw the \"prime staircase.\"", "The staircase climbs to the upper right, but the spacing of its steps is irregular. That feeling — \"it grows, roughly, but jaggedly\" — is exactly the rhythm of the primes that the Riemann hypothesis tried to explain.", "Here is a bonus game. Count aloud from 1 to 30, and clap only on the primes. The rhythm is irregular and surprisingly hard. That elusiveness is what fascinated mathematicians for 167 years."]}}, {"id": "tangram", "title": {"ja": "7枚の板で何がつくれる？ ― タングラムのおはなし", "en": "What Can You Make with Seven Pieces? ― The Story of the Tangram"}, "sub": {"ja": "小学校中学年〜高学年向け・正方形を切った7枚の板で遊ぶ、図形のおはなし", "en": "For middle to upper elementary — a geometry story about playing with a square cut into seven pieces"}, "cover": "tan1.jpg", "images": ["tan1.jpg", "tan2.jpg", "tan3.jpg", "tan4.jpg", "tan5.jpg", "tan5.jpg"], "pages": [{"ja": ["ある日の図工の時間、サワダ先生が木の板を持ってきました。もとは1枚の正方形だった板が、7枚のピースに切り分けられています。「これはタングラム。中国で生まれた、古いパズルのおもちゃだよ。」", "ミオが数えてみると、三角形が5枚、正方形が1枚、平行四辺形が1枚。合わせて7枚です。三角形にも、大きなものと小さなものがありました。", "「この7枚を全部使って、いろいろな形を作って遊ぶんだ。」先生は、7枚を並べて鳥の形を作ってみせました。翼を広げた鳥が、机の上に現れました。", "「えっ、さっきの正方形が、鳥になった！」ミオは目を丸くしました。「先生、ほかに何が作れるの？」"], "en": ["One day in art class, Mr. Sawada brought in a wooden board. It had once been a single square, but now it was cut into seven pieces. \"This is a tangram — an old puzzle toy born in China.\"", "Mio counted them: five triangles, one square, and one parallelogram — seven pieces in all. The triangles came in different sizes, too: big ones and small ones.", "\"Using all seven pieces, you can build all sorts of shapes.\" The teacher arranged the seven pieces and made a bird. There it was on the desk — a bird with its wings spread wide.", "\"Wow! The square turned into a bird!\" Mio's eyes went round. \"Sir, what else can we make?\""]}, {"ja": ["ミオも挑戦です。まず家を作りました。大きな三角形を屋根にして、正方形のピースを家の胴体にします。「できた！　おうち！」", "次は、走る人です。頭に小さな三角形、足に長い平行四辺形を置くと、今にも駆け出しそうな人の形になりました。形を少し動かすたびに、走る速さまで変わって見えます。", "先生は船も作りました。大きな三角形が帆になり、小さな三角形が船の先っぽです。「同じ7枚なのに、家にも、人にも、船にもなるんだね。」", "実は、この7枚で作れる形は、千通り以上あると言われています。何百年もの間、世界中の人が、新しい形を考え続けてきたのです。"], "en": ["Now it was Mio's turn. First she made a house. A big triangle became the roof, and the square piece became the body of the house. \"Done! A house!\"", "Next, a running person. A small triangle for the head, and the long parallelogram for a leg — the figure looked ready to dash off at any moment. Every time she nudged a piece, even the runner's speed seemed to change.", "The teacher built a boat, too. A big triangle made the sail, and a small triangle the tip of the boat. \"The same seven pieces can become a house, a person, or a boat.\"", "In fact, it is said that more than a thousand different shapes can be made with these seven pieces. For hundreds of years, people all over the world have kept inventing new ones."]}, {"ja": ["遊んでいるうちに、ミオはふと疑問に思いました。「形はバラバラなのに、面積はどうなっているんだろう。」先生は言いました。「では、面積を数えてごらん。いちばん小さい三角形の面積を1としてね。」", "ミオは、小さい三角形をものさし代わりにして数えていきました。小さい三角形は1。中くらいの三角形は、小さいの2つ分で2。正方形のピースも、平行四辺形も、どちらも2でした。", "大きな三角形は、小さい三角形4つ分で4です。2枚あるので、4と4。ぜんぶ足すと、4＋4＋2＋2＋2＋1＋1で、16になりました。", "「16！　もとの正方形の面積と、ぴったり同じだ！」当たり前といえば当たり前です。7枚は、もとの正方形を切り分けたものなのですから。でも、数字で確かめると、ミオはすっきりしました。"], "en": ["As she played, a question came to Mio. \"The shapes are all different — but what happens to the area?\" The teacher said, \"Let's count the areas. Take the smallest triangle as 1.\"", "Using the small triangle as a measuring unit, Mio counted piece by piece. The small triangle is 1. The middle-sized triangle is worth two small ones, so 2. The square piece and the parallelogram were also 2 each.", "A big triangle is worth four small triangles, so 4. There are two of them: 4 and 4. Adding everything — 4 + 4 + 2 + 2 + 2 + 1 + 1 — gave 16.", "\"Sixteen! Exactly the same as the area of the original square!\" Well, of course: the seven pieces are just the original square, cut apart. But checking it with numbers made Mio feel satisfied."]}, {"ja": ["ここからが、タングラムの本当の面白さです。7枚全部を使って作る限り、どんな形を作っても、面積は16のまま変わりません。形は変わるのに、面積は変わらないのです。", "ミオは高い塔を作りました。細長くそびえる塔も、面積は16。次に平べったい船を作りました。海に浮かぶ船も、面積は16です。", "数学では、面積を変えずに形を変えることを「等積変形」と言います。タングラムは、等積変形を手で触って遊べるパズルなのです。", "「形が変われば、面積も変わると思っていた……。」ミオのつぶやきに、先生はにっこりしました。「変わるものと、変わらないものを見分けること。それが、図形の勉強の第一歩だよ。」"], "en": ["Here is where the tangram gets truly interesting. As long as you use all seven pieces, no matter what shape you build, the area stays 16. The shape changes, but the area does not.", "Mio built a tall tower. The slim, soaring tower still had area 16. Next she built a flat boat. The boat floating on the sea also had area 16.", "In mathematics, changing a shape without changing its area is called an \"equal-area transformation.\" The tangram is a puzzle that lets you play with equal-area transformations with your own hands.", "\"I thought if the shape changed, the area would change too...\" At Mio's murmur, the teacher smiled. \"Telling apart what changes and what does not — that is the first step in studying geometry.\""]}, {"ja": ["遊び慣れてくると、ミオは1枚のピースに目を留めました。平行四辺形です。「先生、このピースだけ、うまくはまらないときがあるよ。」", "「よく気づいたね。平行四辺形だけは、裏返さないと作れない形があるんだ。」三角形や正方形は、回すだけで裏表が同じになりますが、平行四辺形は、裏返した形が別物になるのです。", "タングラムの本には、作り方の例がたくさん載っています。でも、答えを見ずに自分で考えるのが一番楽しい、と先生は言いました。何分も悩んで、ぴたっとはまったときの気持ちよさは、格別です。", "ミオは最後に、猫を作りました。耳の小さな三角形が、ぴんと立っています。「今度の休みに、家でも作ってみよう。お父さんに、問題を出すんだ。」"], "en": ["As she got used to playing, Mio's eye stopped on one piece: the parallelogram. \"Sir, this piece sometimes just won't fit.\"", "\"Good noticing. The parallelogram is the only piece that must sometimes be flipped over.\" Triangles and squares look the same when turned over, but a flipped parallelogram becomes a different shape.", "Tangram books show many examples of shapes to build. But thinking them out for yourself, without peeking at the answers, is the most fun, the teacher said. After minutes of puzzling, the moment a piece clicks into place feels wonderful.", "At the end, Mio made a cat. The small triangles of its ears stood up smartly. \"On the next day off, I'll make one at home, too — and set my dad a puzzle.\""]}, {"ja": ["タングラムは、遠い中国の生まれです。何百年も前から、「七巧板」という名前で親しまれてきました。「巧」という字は、「たくみ、工夫」という意味です。", "7枚の板に、たくさんの工夫を詰め込む。名前の通り、タングラムは工夫のパズルでした。やがて船に乗って世界中に広まり、ヨーロッパでも大流行した時代があったそうです。", "ミオは、7枚のピースを箱にしまいながら考えました。「形は自由に変わる。でも、面積は変わらない。変わるものと、変わらないもの、両方あるんだ。」", "もしかしたら、あなたも新しい形を発明できるかもしれません。千通り以上の形の、その先の1つを。タングラムの物語は、今も世界中で続いています。"], "en": ["The tangram was born in faraway China. For hundreds of years it has been loved there under the name \"qiqiaoban\" — the seven clever pieces. The word \"qiao\" means skill and ingenuity.", "Packing lots of ingenuity into seven pieces of board — true to its name, the tangram is a puzzle of cleverness. In time it crossed the sea by ship, spread around the world, and there was even a time when it was all the rage in Europe.", "Mio thought as she put the seven pieces back in their box. \"Shapes can change freely. But the area never changes. Some things change, and some things don't.\"", "Perhaps you, too, can invent a brand-new shape — one more beyond the thousand that are known. The story of the tangram is still going on, all over the world."]}], "column": {"ja": ["タングラムは、中国で「七巧板（しちこうばん）」と呼ばれてきました。7枚の板を巧みに組み合わせる、という意味の名前です。中国では古くから親しまれ、形の例を集めた本も作られました。現在知られている最も古いタングラムの本は、1813年に中国で出た『七巧図合璧（しちこうずがっぺき）』です。", "1815年、タングラムは船に乗ってアメリカへ渡りました。積み荷の中に七巧板とその本が入っていたのです。そこからヨーロッパにも伝わり、1817年から1818年にかけて、ヨーロッパで大流行しました。各国でタングラムの本が次々に出版され、大人も子どもも夢中になったと言われています。", "フランスの皇帝だったナポレオンが、セントヘレナ島に流されていた時代に、タングラムで遊んでいたという話も伝わっています。ただし、これは確かな記録のある話ではなく、「そう言い伝えられている話」として楽しむのがよさそうです。", "日本にも伝わり、江戸時代の和算家や遊び好きの人々の間で楽しまれました。1枚の正方形から生まれた小さなパズルは、海を越え、時代を越えて、今も世界中で遊ばれています。"], "en": ["In China, the tangram has long been called \"qiqiaoban\" — a name meaning seven boards combined with skill. It has been enjoyed in China since long ago, and books collecting example shapes were made. The oldest tangram book known today is the \"Qiqiao Tu Hepi,\" published in China in 1813.", "In 1815, the tangram crossed the sea by ship to America. A qiqiaoban set and its book were among the cargo. From there it spread to Europe, and in 1817 and 1818 it became a huge craze across Europe. Tangram books were published one after another in many countries, and adults and children alike were absorbed in it.", "There is also a story that Napoleon, the former emperor of France, played with a tangram while he was exiled on the island of Saint Helena. However, there is no firm record of this, so it is best enjoyed as a tale that has been \"handed down.\"", "The tangram reached Japan as well, where it was enjoyed by wasan mathematicians and puzzle lovers of the Edo period. A small puzzle born from a single square has crossed oceans and centuries, and is still played all over the world today."]}, "quiz": {"ja": ["Q1　全体の面積を16とすると、大きな三角形1枚の面積はいくつでしょう。　答え：4（小さい三角形4つ分。大きな三角形は2枚あるので、合わせて8で全体の半分）", "Q2　7枚全部を使ってどんな形を作っても、面積はどうなるでしょう。　答え：変わらない（もとの正方形と同じ16のまま。このような変形を等積変形という）", "Q3　タングラムがヨーロッパで大流行したのは、いつごろでしょう。　答え：1817〜18年ごろ（1813年に中国の『七巧図合璧』が出て、1815年に船でアメリカへ渡ったあと、ヨーロッパに広まった）"], "en": ["Q1　If the total area is 16, what is the area of one big triangle?　Answer: 4 (it is worth four small triangles; there are two big triangles, making 8 together — half of the whole)", "Q2　Using all seven pieces, what happens to the area, whatever shape you build?　Answer: It does not change (it stays 16, the same as the original square; such a change of shape is called an equal-area transformation)", "Q3　When did the tangram become a huge craze in Europe?　Answer: Around 1817–18 (after China's \"Qiqiao Tu Hepi\" appeared in 1813 and the puzzle traveled by ship to America in 1815, it spread to Europe)"]}, "corner": {"ja": ["用意するものは、厚紙（または画用紙）、定規、鉛筆、はさみです。まず厚紙に、1辺が10cmくらいの正方形を描きましょう。正方形に対角線などの線を引いて、大きな三角形2枚、中くらいの三角形1枚、小さな三角形2枚、正方形1枚、平行四辺形1枚になるよう、7枚に切り分けます（切り方の図は、タングラムの本や、今回の課題集PDFを見てください）。", "切り分けたら、面積を数えて確かめてみましょう。いちばん小さい三角形を1として、大きな三角形は4、中くらいの三角形・正方形・平行四辺形は2、小さな三角形は1。全部足すと16になり、もとの正方形の面積と一致するはずです。", "次に、7枚全部を使って、家と猫を作ってみましょう。作れたら、面積が16のままかどうかも思い出してください。形は変わっても、面積は変わりません。", "最後は発明の時間です。自分だけの形を作って、家族や友だちに「これは何でしょう？」と問題を出してみましょう。平行四辺形を裏返すことも、忘れずに試してください。"], "en": ["You will need thick paper (or drawing paper), a ruler, a pencil, and scissors. First, draw a square about 10 cm on each side on the paper. Draw the cutting lines — diagonals and other lines — so that the square divides into seven pieces: two big triangles, one middle-sized triangle, two small triangles, one square, and one parallelogram, and cut them apart (for the cutting diagram, see a tangram book, or the challenge-collection PDF that comes with this episode).", "Once you have cut the pieces, count the areas to check. Taking the smallest triangle as 1: a big triangle is 4; the middle-sized triangle, the square, and the parallelogram are 2; and the small triangles are 1. Adding them all should give 16, matching the area of the original square.", "Next, use all seven pieces to build a house and a cat. When you succeed, remember to ask whether the area is still 16. The shape changes, but the area does not.", "Finally, invention time. Create a shape of your own, and ask your family or friends, \"What is this?\" Don't forget to try flipping the parallelogram over, too."]}}, {"id": "goldbach", "title": {"ja": "どんな偶数も2つの素数の和？ ― ゴールドバッハ予想のおはなし", "en": "Can Every Even Number Be Made from Two Primes? ― The Story of the Goldbach Conjecture"}, "sub": {"ja": "小学校高学年〜中学生向け・4以上の偶数は、2つの素数の和で表せるのかというおはなし", "en": "For upper elementary to junior high — can every even number from 4 on be written as a sum of two primes?"}, "cover": "gol1.jpg", "images": ["gol1.jpg", "gol2.jpg", "gol3.jpg", "gol4.jpg", "gol5.jpg", "gol5.jpg"], "pages": [{"ja": ["ある日の数学の時間、サワダ先生は黒板に「4＝2＋2」と書きました。「今日の主役は、素数だ。素数とは、1とその数自身でしか割り切れない数のこと。2、3、5、7、11……と続いていく。ただし、1は素数ではないよ。」", "ミオは首をかしげました。「4は、素数と素数を足してできているんですね。」先生がうなずきます。「そう。では、6は？　8は？」ミオは指を折って考えます。「6＝3＋3。8＝3＋5。できました！」", "「偶数は、2つの素数の足し算で作れるのかもしれない。」ミオのつぶやきに、教室がざわつきました。2で割り切れる数が偶数です。4、6、8と、確かに作れています。", "先生はにやりとしました。「その『かもしれない』が、実は大変なんだ。なんと、280年以上も前から、世界中の数学者を悩ませているナゾなんだよ。」"], "en": ["One day in math class, Mr. Sawada wrote \"4 = 2 + 2\" on the blackboard. \"Today's stars are the prime numbers. A prime is a number that can be divided only by 1 and by itself: 2, 3, 5, 7, 11, and so on. But remember, 1 is not a prime.\"", "Mio tilted her head. \"So 4 is made by adding a prime and a prime.\" The teacher nodded. \"Exactly. Then what about 6? And 8?\" Mio counted on her fingers. \"6 = 3 + 3. 8 = 3 + 5. I did it!\"", "\"Maybe every even number can be built by adding two primes.\" At Mio's murmur, the classroom buzzed. Numbers that divide by 2 are even numbers. And 4, 6, and 8 really could all be built.", "The teacher grinned. \"That little 'maybe' is actually a very big deal. Believe it or not, it has been troubling mathematicians all over the world for more than 280 years.\""]}, {"ja": ["ミオは、ノートに偶数を並べて、次々に試してみることにしました。10＝3＋7。……あれ、10は5＋5でも作れます。「先生、10は2通りあります！」", "12＝5＋7。14＝3＋11と、7＋7で、こちらも2通り。22になると、3＋19、5＋17、11＋11と、3通りに増えました。数が大きくなるにつれて、表し方も増えていくようです。", "クラスでも競争が始まりました。「16は3＋13と5＋11！」「18は5＋13と7＋11！」見つけるたびに、歓声が上がります。作れない偶数は、今のところ1つもありません。", "ところが、先生が言いました。「みんなが調べたのは、まだほんの一部だよ。偶数は、この先も無限に続いていく。その『全部』について言えるかどうかが、問題なんだ。」"], "en": ["Mio lined up even numbers in her notebook and tried them one after another. 10 = 3 + 7. ...Wait, 10 could also be made as 5 + 5. \"Sir, 10 has two ways!\"", "12 = 5 + 7. And 14 had two ways as well: 3 + 11 and 7 + 7. By 22, there were three ways: 3 + 19, 5 + 17, and 11 + 11. As the numbers grew bigger, the number of ways seemed to grow, too.", "A contest began in class. \"16 is 3 + 13 and 5 + 11!\" \"18 is 5 + 13 and 7 + 11!\" Every new find brought a cheer. So far, there was not a single even number that could not be built.", "But then the teacher said, \"What you have checked is only a tiny piece. Even numbers go on forever. The question is whether we can say it about all of them.\""]}, {"ja": ["休み時間になっても、ミオはノートに向かっていました。今度の相手は、100です。「100を作るには、大きな素数が要るはず……。」素数表とにらめっこして、ミオは叫びました。「3＋97！　できました！」", "100の表し方は、それだけではありませんでした。11＋89、17＋83、29＋71、41＋59、47＋53。全部で6通りもあったのです。大きな数ほど、相手の素数の候補が増えるのですね。", "放課後、ミオは4から30までの偶数を全部確かめ直しました。どの偶数も、少なくとも1通りは素数＋素数で表せました。1つも例外がありません。", "「やっぱり、全部の偶数がそうなるんじゃないですか？」ミオの言葉に、先生は黒板に大きく書きました。「4以上の偶数は、すべて2つの素数の和で表せる」。「これが、今日の主役の名前だよ。」"], "en": ["Even during the break, Mio stayed at her desk with her notebook. Her next opponent was 100. \"To build 100, I'll need a big prime...\" Staring at her table of primes, Mio suddenly shouted. \"3 + 97! I did it!\"", "And that was not the only way to write 100. There were also 11 + 89, 17 + 83, 29 + 71, 41 + 59, and 47 + 53 — six ways in all. The bigger the number, the more partner primes there are to choose from.", "After school, Mio checked every even number from 4 to 30 all over again. Every single one could be written as a prime plus a prime in at least one way. There were no exceptions at all.", "\"So really, doesn't every even number work?\" At Mio's words, the teacher wrote in big letters on the blackboard: \"Every even number from 4 on can be written as a sum of two primes.\" \"This,\" he said, \"is the name of today's star.\""]}, {"ja": ["その予想は、「ゴールドバッハ予想」と呼ばれています。今から280年以上も前の1742年、数学者ゴールドバッハが、友人のオイラーに送った手紙が始まりでした。", "オイラーは、当時の最高の数学者の1人です。そのオイラーでも、この予想を証明することはできませんでした。「正しそうだ」とは思っても、理由までは分からなかったのです。", "「先生、こんなにたくさん確かめたんだから、もう正しいって決まったんじゃないんですか？」ミオが聞くと、先生は首を横に振りました。「それが違うんだ。予想は予想のまま。今も誰も証明していない。」", "問題の文は、子どもでも読めるほど短いのに、答えは300年近く出ていません。あまりの難しさに、「数学の未解決問題」の代表格として、世界中で知られているのです。"], "en": ["That idea is called the Goldbach conjecture. It began more than 280 years ago, in 1742, with a letter that the mathematician Goldbach sent to his friend Euler.", "Euler was one of the greatest mathematicians of his time. Yet even Euler could not prove this conjecture. He may have felt it was true, but he could not find the reason why.", "\"Sir, we've checked so many numbers — isn't it decided that it's true?\" asked Mio. The teacher shook his head. \"That's just it. A conjecture stays a conjecture. Nobody has proved it yet.\"", "The problem itself is short enough for a child to read, yet its answer has been missing for nearly 300 years. Because it is so hard, it is known around the world as one of the most famous unsolved problems in mathematics."]}, {"ja": ["「予想」と「証明」は、どう違うのでしょう。予想とは、「こうなるのではないか」という考えのこと。たくさん確かめて当たっていても、それだけでは予想のままです。", "実際、数学者たちはコンピュータを使って、ものすごく大きな数まで確かめました。その範囲は、4×10¹⁸、つまり400京という途方もない数まで。そこまでの偶数は、すべて2つの素数の和で表せました。", "それでも、証明にはなりません。偶数は無限に続くので、「次」の数は永遠に残るのです。確かめた範囲の外には、まだ確かめていない偶数が無限にあります。全部を調べ尽くすことは、原理的にできないのです。", "証明とは、「どんな偶数でも、必ず2つの素数の和になる」という理由そのものを示すことです。1つずつ確かめるのではなく、全部に通じる理由を見つける。それが、300年近く誰にもできていないのです。"], "en": ["How are a \"conjecture\" and a \"proof\" different? A conjecture is an idea that says, \"This is probably true.\" Even if you check many cases and they all work, it is still only a conjecture.", "In fact, mathematicians used computers to check up to truly enormous numbers — all the way to 4 × 10¹⁸, which is 4,000,000,000,000,000,000. Every even number up to there could be written as a sum of two primes.", "Even so, that is not a proof. Even numbers go on forever, so there is always a \"next\" number left over. Beyond any checked range, infinitely many unchecked even numbers remain. Checking every single one is impossible in principle.", "A proof means showing the reason itself: why every even number must be a sum of two primes. Not checking them one by one, but finding a reason that works for all of them at once. For nearly 300 years, nobody has been able to do that."]}, {"ja": ["実は、この予想には「弟」のような問題もあります。「7以上の奇数は、3つの素数の和で表せる」というもので、「弱いゴールドバッハ予想」と呼ばれています。", "こちらは、2013年に、ペルーの数学者ハラルド・ヘルフゴットが証明しました。約270年越しの快挙でした。「弟」の方は、決着がついたのです。", "ところが「兄」の方、偶数の予想は、今もまだ解けていません。コンピュータが速くなっても、理由が見つからなければ証明にはならない。その一線が、この問題を今も未解決のままにしているのです。", "ミオはノートの隅に書きました。「4以上の偶数＝素数＋素数？　証明は、まだ。」もしかしたら、この問題を解くのは、今この本を読んでいる誰かかもしれません。"], "en": ["In fact, this conjecture has a kind of \"younger brother\": the claim that every odd number from 7 on can be written as a sum of three primes. It is called the weak Goldbach conjecture.", "This one was proved in 2013 by Harald Helfgott, a mathematician from Peru. It was a triumph some 270 years in the making. The \"younger brother\" was settled.", "But the \"older brother,\" the even-number conjecture, is still unsolved today. No matter how fast computers become, without a reason, there is no proof. That one line is what keeps this problem unsolved.", "In the corner of her notebook, Mio wrote: \"Every even number from 4 on = prime + prime? Proof: not yet.\" Perhaps the person who finally solves it will be someone reading this book right now."]}], "column": {"ja": ["1742年、プロイセンの数学者クリスティアン・ゴールドバッハは、友人のレオンハルト・オイラーに手紙を書きました。その手紙に書かれた予想を、オイラーが「4以上の偶数は、2つの素数の和で表せる」と整理し直したものが、今のゴールドバッハ予想です。", "オイラー自身、「正しいと確信しているが、証明はできない」という意味の返事をしたと伝えられています。以来280年以上、多くの数学者が挑んできましたが、証明も、反例（成り立たない偶数）も、まだ見つかっていません。", "20世紀以降はコンピュータも参戦し、2013年ごろまでには、4×10¹⁸（400京）までの偶数はすべて成り立つことが確かめられました。けれども、無限に続く偶数の「全部」を確かめることはできないため、これは証明の代わりにはなりません。", "一方、「7以上の奇数は3つの素数の和」という弱いゴールドバッハ予想は、2013年、ペルーの数学者ハラルド・ヘルフゴットによって証明されました。偶数版の証明がいつ届くのか。それは、今の数学が抱える大きな宿題の1つです。"], "en": ["In 1742, the Prussian mathematician Christian Goldbach wrote a letter to his friend Leonhard Euler. The conjecture in that letter, restated by Euler as \"every even number from 4 on can be written as a sum of two primes,\" is what we now call the Goldbach conjecture.", "Euler himself is said to have replied, in effect, that he was certain it was true but could not prove it. For more than 280 years since then, many mathematicians have taken up the challenge, yet neither a proof nor a counterexample — an even number where it fails — has ever been found.", "From the twentieth century on, computers joined the effort, and by around 2013 it had been verified that every even number up to 4 × 10¹⁸ works. But since even numbers continue forever, no amount of checking can cover \"all\" of them, so this can never take the place of a proof.", "Meanwhile, the weak Goldbach conjecture — every odd number from 7 on is a sum of three primes — was proved in 2013 by Harald Helfgott, a mathematician from Peru. When will a proof of the even version arrive? It remains one of the great homework problems of mathematics today."]}, "quiz": {"ja": ["Q1　14を、2つの素数の和で表してください。　答え：3＋11と、7＋7の2通り", "Q2　100を2つの素数の和で表す方法は、全部で何通りあるでしょう。　答え：6通り（3＋97、11＋89、17＋83、29＋71、41＋59、47＋53）", "Q3　コンピュータで大きな数まで確かめれば、ゴールドバッハ予想は「証明された」ことになるでしょう。　答え：ならない（偶数は無限にあるので、全部を確かめることはできない。証明には「どんな偶数でも成り立つ理由」が必要）"], "en": ["Q1　Write 14 as a sum of two primes.　Answer: Two ways: 3 + 11 and 7 + 7", "Q2　How many ways are there to write 100 as a sum of two primes?　Answer: 6 ways (3 + 97, 11 + 89, 17 + 83, 29 + 71, 41 + 59, 47 + 53)", "Q3　If computers check the conjecture up to very large numbers, does that mean the Goldbach conjecture has been \"proved\"?　Answer: No (even numbers are infinite, so they can never all be checked. A proof needs a reason that works for every even number)"]}, "corner": {"ja": ["用意するものは、ノートと鉛筆です。まず、100までの素数を書き出しましょう。2から順に、割り切れる数の倍数を消していく「ふるい」という方法を使うと、素数だけが残ります。", "次に、4から30までの偶数を、全部「素数＋素数」の形に直してみましょう。どの偶数にも、少なくとも1通りはあります。表し方が何通りあるかも数えてみてください。", "慣れてきたら、100に挑戦です。100は全部で6通りあります。全部見つけられるでしょうか。大きな素数から試すか、小さな素数から試すか、作戦を立てるのも楽しいですよ。", "家族や友だちと、どちらが速く表し方を見つけられるか競争するのもおすすめです。「この偶数は何通りある？」と予想してから調べると、数の組み合わせを見る目が育ちます。"], "en": ["You will need a notebook and a pencil. First, write out all the primes up to 100. If you cross out multiples one after another, starting from 2 — a method called a \"sieve\" — only the primes are left.", "Next, rewrite every even number from 4 to 30 as \"prime + prime.\" Every one of them has at least one way. Count how many ways each number has, too.", "Once you get used to it, take on 100. There are six ways in all. Can you find every one? Deciding on a strategy — starting from big primes or from small ones — is part of the fun.", "It is also fun to race family or friends to see who can find a way first. Guessing \"how many ways will this even number have?\" before you check sharpens your eye for combinations of numbers."]}}, {"id": "zeno", "title": {"ja": "アキレスは亀に追いつける？ ― ゼノンのパラドックスのおはなし", "en": "Can Achilles Ever Catch the Tortoise? ― The Story of Zeno's Paradox"}, "sub": {"ja": "小学校高学年〜中学生向け・半分、また半分と近づいても届かない？　無限の足し算のおはなし", "en": "For upper elementary to junior high — an endless sum of halves that lands exactly on the goal"}, "cover": "zen1.jpg", "images": ["zen1.jpg", "zen2.jpg", "zen3.jpg", "zen4.jpg", "zen5.jpg", "zen5.jpg"], "pages": [{"ja": ["ある日の数学の時間、サワダ先生は、2,500年も前のなぞなぞを出しました。「ギリシャの英雄アキレスは、足の速さでは誰にも負けない。そのアキレスが、のろい亀とかけっこをしたら、どうなるかな。」", "亀はのろいので、少し先からスタートします。アキレスはあっという間に、亀がいた場所まで走ります。ところが、その間に亀は、ほんの少しだけ先へ進んでいます。", "アキレスはまた走って、亀がいた場所に着きます。でも、その間に亀は、またほんの少し先へ。これをどこまでもくり返すと、アキレスは亀に追いつけない、というのです。", "「そんなはずない！」ミオは思わず声を上げました。「ふつうに考えたら、すぐに追いつくのに。」先生はにっこりしました。「その『おかしいぞ』こそ、2,500年も人々を悩ませてきたんだよ。」"], "en": ["One day in math class, Mr. Sawada told a riddle that is 2,500 years old. \"Achilles, the hero of Greece, was the fastest runner of all. What would happen if Achilles raced a slow, plodding tortoise?\"", "The tortoise is slow, so it starts a little ahead. In no time, Achilles runs to the place where the tortoise was. But by then, the tortoise has crept a tiny bit further ahead.", "Achilles runs again and reaches the tortoise's new place. But by then, the tortoise has crept a tiny bit further still. If this goes on forever, the argument says, Achilles can never catch the tortoise.", "\"That can't be right!\" Mio burst out. \"He'd catch it right away, wouldn't he?\" The teacher smiled. \"That feeling of 'wait, that's strange' has puzzled people for 2,500 years.\""]}, {"ja": ["次の時間、2人は運動場に出ました。亀の役は、学校で飼っているカメのタロウです。先生は地面に線を引きました。「タロウはアキレスの半分の速さで進むとしよう。はじめの距離は8メートルだ。」", "アキレスが8メートル走って、タロウがいた場所に着く間に、タロウは4メートル進みます。2人の距離は、8メートルから4メートルに縮みました。", "次にアキレスがその4メートルを走る間に、タロウは2メートル進みます。距離は2メートル。さらに次は1メートル、次は半メートル……。距離は、半分、半分と縮んでいきます。", "「8、4、2、1、0.5……。」ミオはチョークで印をつけながら数えました。「近づいてはいるけど、印の数はどこまでも続きそう。」半分にしても、半分にしても、距離は決して0にはならないのです。"], "en": ["In the next lesson, the two went out to the schoolyard. The part of the tortoise was played by Taro, the tortoise the school keeps. The teacher drew a line on the ground. \"Let's say Taro moves at half the speed of Achilles. The first gap between them is 8 meters.\"", "While Achilles runs 8 meters to reach the place where Taro was, Taro moves 4 meters ahead. The gap between them shrinks from 8 meters to 4 meters.", "Next, while Achilles runs those 4 meters, Taro moves 2 meters ahead. The gap is now 2 meters. Then 1 meter, then half a meter... The gap keeps shrinking to half, and half again.", "\"8, 4, 2, 1, 0.5...\" Mio counted as she made chalk marks. \"They are getting closer, but the marks seem to go on forever.\" No matter how many times you halve it, the gap never quite becomes zero."]}, {"ja": ["教室に戻ると、先生は黒板に長い紙の帯を貼りました。「アキレスが追いつくまでに走る道のり全体を、この帯の長さ1としよう。最初の一走りで、その半分を進む。」", "次のひと走りは、残りの半分。さらに次は、また残りの半分……。帯の上に印をつけていくと、印と印の間隔は、1/2、1/4、1/8、1/16……と、どんどん小さくなっていきます。", "足し算してみましょう。1/2＋1/4＝3/4。さらに＋1/8＝7/8。＋1/16＝15/16。足すたびに1に近づきますが、帯の終わりを追い越すことは、決してありません。", "「つまり、」先生は言いました。「1/2＋1/4＋1/8＋…と、どこまでも足し続けると、答えはぴたりと1になる。無限に足しても、答えが無限に大きくなるわけではないんだ。」"], "en": ["Back in the classroom, the teacher taped a long strip of paper to the blackboard. \"Let's call the whole distance Achilles runs before he catches up '1,' the length of this strip. His first run covers half of it.\"", "His next run covers half of what is left. The run after that, half of what is left again... As marks are added to the strip, the spaces between them grow smaller and smaller: 1/2, 1/4, 1/8, 1/16...", "Let's add them up. 1/2 + 1/4 = 3/4. Then + 1/8 = 7/8. Then + 1/16 = 15/16. Each step comes closer to 1, but it never goes past the end of the strip.", "\"So you see,\" said the teacher, \"if you keep adding 1/2 + 1/4 + 1/8 + ... forever, the answer is exactly 1. Adding forever does not mean the answer grows forever.\""]}, {"ja": ["でも、まだ疑問が残ります。「区切りの数が無限なら、追いつくまでの時間も、無限にかかるんじゃないですか。」ミオが聞きました。", "先生は首を振りました。「時間も同じだよ。最初の一走りにかかる時間を1とすると、次の一走りは、その半分の1/2、その次は1/4……。時間も、半分ずつ小さくなっていく。」", "距離のときと同じ計算です。時間の合計は、1＋1/2＋1/4＋…＝2。無限に多くの区切りが、有限の時間の中に、ちゃんと収まってしまうのです。", "「つまり、アキレスはちゃんと亀に追いつく。そして、追い越す。」先生は言いました。「なぞなぞのカギは、『無限に分けられること』と『無限に時間がかかること』は、別物だということだね。」"], "en": ["But one question was still left. \"If there are infinitely many steps, wouldn't it take infinitely long to catch up?\" Mio asked.", "The teacher shook his head. \"Time works the same way. If the first run takes time 1, the next run takes half of that, 1/2, and the next takes 1/4... The times shrink by half, too.\"", "It is the same calculation as with the distance. The total time is 1 + 1/2 + 1/4 + ... = 2. Infinitely many steps fit neatly inside a finite amount of time.", "\"So Achilles really does catch the tortoise. And then he passes it,\" said the teacher. \"The key to the riddle is that 'can be divided forever' and 'takes forever' are two different things.\""]}, {"ja": ["とはいえ、ゼノンの言い分にも、一理あります。「追いつくまで」を区切って数えると、区切りは本当に無限にあります。無限というものをどう扱えばいいのか、昔の人々には、その道具がまだなかったのです。", "この問題にきちんと答えられるようになったのは、19世紀になってからです。コーシーという数学者が、「限りなく近づく」という考えを、厳密な計算の言葉にしました。無限に足す計算の理論が、ここでようやく整ったのです。", "いまでは、1/2＋1/4＋1/8＋…＝1のような計算は、高校や大学で学ぶ大切な道具になっています。2,500年前のなぞなぞが、数学の大きな道具を育てたのでした。", "「『変だな』と思うことを、あきらめずに考えること。」先生は言いました。「ゼノンの亀は、そのための練習問題だったのかもしれないね。」"], "en": ["Even so, there is a point to Zeno's argument. If you count the steps \"until he catches up,\" there really are infinitely many of them. Long ago, people simply had no tools yet for handling this thing called infinity.", "It was only in the 19th century that the problem could be answered properly. A mathematician named Cauchy turned the idea of \"getting closer and closer\" into precise, careful mathematics. The theory of adding up infinitely many numbers was finally in place.", "Today, calculations like 1/2 + 1/4 + 1/8 + ... = 1 are important tools learned in high school and university. A 2,500-year-old riddle helped to grow a great tool of mathematics.", "\"'This feels strange' — when you feel that, don't give up thinking,\" said the teacher. \"Perhaps Zeno's tortoise was a practice problem for exactly that.\""]}, {"ja": ["運動会の日、ミオは短距離走に出ました。スタートとゴールの間には、半分の地点、そのまた半分の地点が、無限にあるはずです。", "でも、ミオはちゃんとゴールに届きました。無限の区切りは、走ることを止めはしなかったのです。", "「アキレスも、きっと追いついたよね。」ミオはタロウにレタスをあげながら言いました。タロウは、のんびりと首を伸ばしました。", "ミオはノートの隅に書きました。「1/2＋1/4＋1/8＋…＝1。無限に分けても、ゴールには届く。」2,500年前のなぞなぞは、いまも教室の中で生きています。"], "en": ["On sports day, Mio ran in the sprint. Between the start and the goal, there should be a halfway point, and another halfway point, and another — infinitely many of them.", "But Mio reached the goal just fine. The infinite divisions did not stop her from running.", "\"You caught up too, didn't you, Achilles?\" Mio said as she gave Taro some lettuce. Taro slowly stretched out his neck.", "In the corner of her notebook, Mio wrote: \"1/2 + 1/4 + 1/8 + ... = 1. Even if you divide forever, you can still reach the goal.\" The 2,500-year-old riddle is still alive in a classroom today."]}], "column": {"ja": ["ゼノンは、紀元前5世紀ごろの古代ギリシャ、エレアという町の哲学者です。師匠のパルメニデスは、「世界は1つのもので、変化や運動は見かけにすぎない」と考えました。ゼノンはその教えを守るために、「運動があるとすると、こんな矛盾が出るはずだ」という議論を作ったと伝わります。", "アキレスと亀のほかにも、「まず半分まで行かねばならず、ゴールには永遠に着かない」という二分割の議論や、「飛んでいる矢は、各瞬間には止まっている」という議論などが、ゼノンのパラドックスとして知られています。ゼノン自身の本は失われてしまい、いまはアリストテレスが『自然学』の中で紹介し、反論を試みたおかげで知られています。", "この問題にきちんと答えるには、「無限に足すとどうなるか」を厳密に扱う理論が必要でした。その土台ができたのは19世紀、コーシーらが「極限」の考え方を整えてからのことです。パラドックスが生まれてから、2,000年以上がたっていました。", "ゼノンの議論は、たんなる間違い探しとして片づけるには惜しい問題です。「無限」という、つかみどころのないものを、数学はどう扱えばいいのか。その出発点に、この亀と英雄のかけっこがあるのです。"], "en": ["Zeno lived in the 5th century BC in a Greek town called Elea. His teacher, Parmenides, believed that \"the world is one single thing, and change and motion are only appearances.\" To defend his teacher's idea, Zeno is said to have built arguments of the form: \"If motion existed, contradictions like this would appear.\"", "Besides Achilles and the tortoise, Zeno's paradoxes include the \"dichotomy\" — you must first go halfway, so you can never reach the goal — and the \"arrow,\" which says that a flying arrow is at rest at each instant. Zeno's own book has been lost, and we know his arguments today because Aristotle introduced them, and tried to answer them, in his book \"Physics.\"", "To answer the problem properly, mathematics needed a rigorous theory of what happens when you add infinitely many things. That foundation was only built in the 19th century, when Cauchy and others put the idea of a \"limit\" in order. More than 2,000 years had passed since the paradox was born.", "Zeno's arguments are too good to throw away as simple mistakes. How should mathematics handle \"infinity,\" that slippery thing no one can hold? At the starting point of that question stands this race between a tortoise and a hero."]}, "quiz": {"ja": ["Q1　1/2＋1/4＋1/8＋1/16を計算すると、いくつになるでしょう。　答え：15/16（あと1/16で1になるところまで来ている）", "Q2　1/2＋1/4＋1/8＋…と、どこまでも足し続けると、答えはいくつになるでしょう。　答え：1（足す数は無限にあっても、合計は1におさまる）", "Q3　ゼノンのパラドックスが今日に伝わっているのは、誰の書いた本のおかげでしょう。　答え：アリストテレス（『自然学』の中で紹介し、反論を試みた）"], "en": ["Q1　What is 1/2 + 1/4 + 1/8 + 1/16?　Answer: 15/16 (it has come to within 1/16 of 1)", "Q2　If you keep adding 1/2 + 1/4 + 1/8 + ... forever, what is the total?　Answer: 1 (there are infinitely many numbers to add, but the total settles at 1)", "Q3　Thanks to whose book have Zeno's paradoxes been passed down to us today?　Answer: Aristotle's (he introduced them, and tried to answer them, in his \"Physics\")"]}, "corner": {"ja": ["紙の帯や折り紙を用意して、半分に折り、さらに半分、また半分と折ってみましょう。折り目で区切られた部分の長さは、1/2、1/4、1/8……。全部を合わせると、ちょうど帯1本分になります。", "計算でも確かめましょう。1/2＋1/4＝3/4、＋1/8＝7/8、＋1/16＝15/16。あと少しで1、という「残り」に注目すると、1/4、1/8、1/16と、残りも半分ずつになっています。10回足したときの残りは、1/1024だけです。", "壁に向かって進む実験もできます。今いる場所から壁までの半分、次は残りの半分、と進んでいくと、歩幅はどんどん小さくなりますが、数回で壁のすぐそばまで行けます。「無限の区切り」と「実際に届くこと」の両方を、体で感じてみてください。", "友だちと「0.999…は1と同じか、違うか」を話し合うのも、面白いテーマです。実はこの問題、1/2＋1/4＋1/8＋…の話と、深いところでつながっています。"], "en": ["Take a strip of paper or a sheet of origami paper, and fold it in half, then in half again, and again. The lengths of the parts made by the folds are 1/2, 1/4, 1/8... Put them all together, and they make exactly one whole strip.", "Check it with arithmetic, too. 1/2 + 1/4 = 3/4, + 1/8 = 7/8, + 1/16 = 15/16. Look at the little bit that is \"still missing\": 1/4, 1/8, 1/16 — the missing part also halves each time. After adding ten times, the part still missing is only 1/1024.", "You can also try walking toward a wall. Walk half the way to the wall, then half of what is left, and so on. Your steps get smaller and smaller, but after only a few steps you are right next to the wall. Feel with your body both the \"infinite steps\" and the \"actually arriving.\"", "It is also fun to talk with friends about whether 0.999... is the same as 1, or different. Deep down, that question is connected to the story of 1/2 + 1/4 + 1/8 + ..."]}}], "ui": {"en": {"appSub": "Meeting mathematics through stories", "appTitle": "Math Picture Books", "back": "Back to shelf", "column": "A Mini Column on Math History", "langBtn": "日本語", "next": "Next", "pageOf": "Page", "prev": "Back", "quiz": "Check Quiz", "read": "Read", "corner": "Try It Yourself"}, "ja": {"appSub": "物語で出会う、数学の世界", "appTitle": "数学の絵本", "back": "本棚にもどる", "column": "数学史ミニコラム", "langBtn": "English", "next": "つぎへ", "pageOf": "ページ", "prev": "まえへ", "quiz": "確認クイズ", "read": "読む", "corner": "やってみよう"}}};
let lang = localStorage.getItem('math_ehon_lang') || 'ja';
let curBook = null, curPage = 0;

const $ = id => document.getElementById(id);
const ui = () => DATA.ui[lang];

function applyLang(){
  document.documentElement.lang = lang === 'ja' ? 'ja' : 'en';
  $('appTitle').textContent = ui().appTitle;
  $('appSub').textContent = ui().appSub;
  $('langBtn').textContent = ui().langBtn;
  renderShelf();
  if (curBook !== null) renderPage();
}
function renderShelf(){
  const s = $('shelf'); s.innerHTML = '';
  DATA.books.forEach((b, i) => {
    const d = document.createElement('div'); d.className = 'book';
    d.innerHTML = `<img src="${b.cover}" alt=""><div class="info"><h2></h2><div class="bsub"></div><span class="read"></span></div>`;
    d.querySelector('h2').textContent = b.title[lang];
    d.querySelector('.bsub').textContent = b.sub[lang];
    d.querySelector('.read').textContent = ui().read;
    d.onclick = () => { curBook = i; curPage = 0; $('shelfView').classList.add('hidden'); $('readerView').classList.remove('hidden'); renderPage(); window.scrollTo(0,0); };
    s.appendChild(d);
  });
}
function renderPage(){
  const b = DATA.books[curBook], u = ui();
  $('rTitle').textContent = b.title[lang];
  $('rSub').textContent = b.sub[lang];
  $('rImg').src = b.images[curPage];
  $('rText').innerHTML = b.pages[curPage][lang].map(p => `<p></p>`).join('');
  [...$('rText').children].forEach((el, i) => el.textContent = b.pages[curPage][lang][i]);
  const extra = $('rExtra'); extra.innerHTML = '';
  if (curPage === b.pages.length - 1) {
    const mk = (title, paras) => {
      const d = document.createElement('div'); d.className = 'extra';
      d.innerHTML = `<h3></h3><div class="text">${paras.map(() => '<p></p>').join('')}</div>`;
      d.querySelector('h3').textContent = title;
      [...d.querySelectorAll('p')].forEach((el, i) => el.textContent = paras[i]);
      return d;
    };
    if (b.corner) extra.appendChild(mk(u.corner, b.corner[lang]));
    if (b.id === 'davinci') {
      const fig = document.createElement('img');
      fig.src = 'dav-zu.jpg';
      fig.alt = lang === 'ja' ? 'ダ・ヴィンチブリッジの組み方（図解）' : 'How to build the Da Vinci bridge (diagram)';
      fig.style.cssText = 'display:block;width:100%;max-width:760px;margin:18px auto 4px;border:1px solid #e5ddc8;border-radius:12px';
      extra.appendChild(fig);
    }
    if (b.id === 'platonic') {
      const fig = document.createElement('img');
      fig.src = 'pla-zu.jpg';
      fig.alt = lang === 'ja' ? '輪ゴムのかけ方のコツ（図解）' : 'How to hook the rubber band (diagram)';
      fig.style.cssText = 'display:block;width:100%;max-width:760px;margin:18px auto 4px;border:1px solid #e5ddc8;border-radius:12px';
      extra.appendChild(fig);
      const a = document.createElement('a');
      a.className = 'katalink'; a.href = 'katagami-platonic.pdf'; a.target = '_blank'; a.rel = 'noopener';
      const kt = document.createElement('div'); kt.className = 'kt';
      kt.textContent = lang === 'ja' ? '📐 正十二面体の型紙（A4・PDF）を開く' : '📐 Open the dodecahedron paper pattern (A4 PDF)';
      const kn = document.createElement('div'); kn.className = 'kn';
      kn.textContent = lang === 'ja'
        ? '印刷して太い線で切り取り、破線を山折りにして、のりしろを貼り合わせると、一辺約30mmの正十二面体が作れます。印刷の前に、型紙の赤い線が5cmになっているか確かめてください。'
        : 'Print it, cut along the thick lines, fold on the dashed lines, and glue the tabs to build a dodecahedron with edges of about 30 mm. Before printing, check that the red line on the pattern measures 5 cm.';
      a.appendChild(kt); a.appendChild(kn);
      extra.appendChild(a);
      const a2 = document.createElement('a');
      a2.className = 'katalink'; a2.href = 'katagami-platonic2.pdf'; a2.target = '_blank'; a2.rel = 'noopener';
      const kt2 = document.createElement('div'); kt2.className = 'kt';
      kt2.textContent = lang === 'ja' ? '📐 立ち上がる正十二面体の型紙（A4・PDF）を開く' : '📐 Open the stand-up dodecahedron paper pattern (A4 PDF)';
      const kn2 = document.createElement('div'); kn2.className = 'kn';
      kn2.textContent = lang === 'ja'
        ? '正五角形6個の部品を2つ作り、おわん型に折って合わせ、合わせ目の外側に輪ゴム1本を一周かけると組み上がります。つぶして手を離すと、輪ゴムの力でスーッと立ち上がります。作り方は「やってみよう」にあります。印刷の前に、型紙の赤い線が5cmになっているか確かめてください。'
        : 'Make two parts of six pentagons each, fold them into bowls, put them together, and stretch one rubber band once around the outside of the seam. Press it flat, let go, and the rubber band stands it back up. The making steps are in the Try It corner. Before printing, check that the red line on the pattern measures 5 cm.';
      a2.appendChild(kt2); a2.appendChild(kn2);
      extra.appendChild(a2);
      const a3 = document.createElement('a');
      a3.className = 'katalink'; a3.href = 'tachiagaru.html';
      const kt3 = document.createElement('div'); kt3.className = 'kt';
      kt3.textContent = lang === 'ja' ? '🔗 発展ページ「立ち上がる正多面体」を開く' : '🔗 Open the extra page: Standing-Up Regular Solids';
      const kn3 = document.createElement('div'); kn3.className = 'kn';
      kn3.textContent = lang === 'ja'
        ? '正十二面体と同じ仕掛けで立ち上がる、正六面体・正八面体・正二十面体の型紙と作り方のページです。'
        : 'Patterns and steps for a cube, a regular octahedron and a regular icosahedron that stand up by the same trick as the dodecahedron.';
      a3.appendChild(kt3); a3.appendChild(kn3);
      extra.appendChild(a3);
    }
    extra.appendChild(mk(u.column, b.column[lang]));
    extra.appendChild(mk(u.quiz, b.quiz[lang]));
  }
  $('pageNo').textContent = (curPage + 1) + ' / ' + b.pages.length;
  $('prevBtn').textContent = u.prev; $('nextBtn').textContent = u.next;
  $('backBtn').textContent = u.back;
  $('prevBtn').disabled = curPage === 0;
  $('nextBtn').disabled = curPage === b.pages.length - 1;
}
$('langBtn').onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; localStorage.setItem('math_ehon_lang', lang); applyLang(); };
$('prevBtn').onclick = () => { if (curPage > 0) { curPage--; renderPage(); window.scrollTo(0,0); } };
$('nextBtn').onclick = () => { if (curBook !== null && curPage < DATA.books[curBook].pages.length - 1) { curPage++; renderPage(); window.scrollTo(0,0); } };
$('backBtn').onclick = () => { curBook = null; $('readerView').classList.add('hidden'); $('shelfView').classList.remove('hidden'); window.scrollTo(0,0); };
applyLang();
</script>
</body>
</html>
