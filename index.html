km) fits into the distance around the Earth, about 40,000 km (it is about 13 times).", "Thinking in \"fractions of a circle\" happens in daily life, too. Cut a pizza or a cake into 8 equal pieces, and each piece has an angle of 360 ÷ 8 = 45 degrees. On a clock face, the hand moves 360 ÷ 12 = 30 degrees in one hour. The view of \"what fraction of the whole\" is the first step in calculating with angles."]}}, {"id": "chidou", "title": {"ja": "地球は動いている ― 天動説から地動説への長い道のおはなし", "en": "The Earth Is Moving ― The Long Road from a Moving Sky to a Moving Earth"}, "sub": {"ja": "小学校高学年〜中学生向け・当たり前の真実にたどり着くまでの、長い人の歴史", "en": "For upper elementary and junior high — the long human history behind a truth we now take for granted"}, "cover": "chi1.jpg", "images": ["chi1.jpg", "chi2.jpg", "chi3.jpg", "chi4.jpg", "chi5.jpg", "chi5.jpg"], "pages": [{"ja": ["夕方、ユイとおじいちゃんは、沈んでいく太陽を眺めていました。「太陽が動いているように見えるのに、どうして『地球が動いている』と言えるの。」ユイの疑問は、もっともです。足の下の地面は、びくともしないように感じられます。", "昔の人々も、そう考えました。地球が宇宙の中心にあって、太陽も月も星も、地球のまわりを回っている。これが「天動説」です。目で見たままの、自然な考え方でした。", "「でもねユイ、今では当たり前の地動説も、認められるまでにとても長い時間がかかったんだ。」おじいちゃんは、沈む太陽を見つめて言いました。", "この話の主役は、誰か一人の英雄ではありません。「証拠がそろうまでにかかった時間」と、「間違った前提でも計算が合ってしまう数学」です。その時間は、なんと1400年以上にもなりました。"], "en": ["One evening, Yui and her grandfather watched the sun go down. \"The sun looks like it is moving. So why do we say the Earth is moving?\" Yui's question was a natural one. The ground under our feet feels perfectly still.", "Long ago, everyone thought the same way. The Earth sits at the center of the universe, and the sun, the moon, and the stars circle around it. This is called the geocentric model — the \"moving sky\" theory. It was the natural idea, matching exactly what our eyes see.", "\"But Yui,\" said her grandfather, watching the sinking sun, \"even the heliocentric model we take for granted today took a very long time to be accepted.\"", "The hero of this story is not any single person. It is \"the time it took for the evidence to come together\" — and \"mathematics that gives right answers from a wrong starting idea.\" That time stretched to more than 1,400 years."]}, {"ja": ["天動説には、一つ厄介な問題がありました。火星などの惑星が、空の中で時々、逆向きに戻るように動いて見えるのです（逆行と言います）。中心の地球のまわりを単純に回っているだけでは、この動きが説明できません。", "そこで考え出されたのが「周転円（しゅうてんえん）」という仕掛けです。惑星は小さな円の上を回り、その小さな円が、さらに大きな円の上を回る。円と円を組み合わせるのです。", "おじいちゃんはコンパスで、大きな円と、その上に小さな円を描いてみせました。ユイが小さな円の上の点を指でたどると、点は進んでは戻り、進んでは戻ります。「ほら、これが逆行だ。」驚くことに、惑星の位置は、この円と円の計算で、観測とかなりよく合いました。天動説の数学は、とても精巧だったのです。", "ここに大切な教訓があります。前提が間違っていても、計算がそこそこ合ってしまうことがあるのです。天動説が1400年続いた大きな理由は、「よく当たったから」でした。"], "en": ["The geocentric model had one troublesome problem. Planets such as Mars sometimes seem to move backward across the sky for a while (this is called retrograde motion). Simply circling around a central Earth cannot explain that movement.", "So people invented a device called the \"epicycle.\" A planet rides on a small circle, and that small circle rides on a larger circle. Circles upon circles.", "Her grandfather took a compass and drew a large circle, and on it a small circle. When Yui traced a point on the small circle with her finger, the point went forward, then back, then forward again. \"See — that is retrograde motion.\" Amazingly, calculations with these circles matched the observed positions of the planets quite well. The mathematics of the geocentric model was truly ingenious.", "Here is an important lesson. Even when the starting idea is wrong, the calculations can still come out almost right. The geocentric model lasted 1,400 years largely because \"it worked.\""]}, {"ja": ["1543年、ポーランドの学者コペルニクスが、太陽を中心に置く「地動説」の本を出版しました。本が出たのは、彼が亡くなった年でした。", "太陽を中心にすると、計算はずっと自然になります。惑星の逆行も、「動いている地球が、外側の惑星を追い越すときに、相手が戻るように見える」と、すっきり説明できました。", "でも、地球が動いている証拠は、まだ何もありませんでした。地面は動いているように感じられないし、星の位置のずれも観測できません。地動説は、すぐには受け入れられなかったのです。", "イタリアの修道士ブルーノは、コペルニクスの考えを支持し、さらに「宇宙は無限で、星は遠くの太陽だ」と説きました。彼は1600年に火あぶりの刑になりました。ただし、処刑の理由は地動説だけではなく、複数の異端の罪によるものだったと伝えられています。"], "en": ["In 1543, the Polish scholar Copernicus published a book placing the sun at the center — the heliocentric model. The book appeared in the very year he died.", "With the sun at the center, the calculations become much more natural. Retrograde motion, too, is explained cleanly: \"as the moving Earth overtakes an outer planet, that planet looks as if it moves backward.\"", "But there was still no proof at all that the Earth moves. The ground does not feel like it moves, and no shift in the stars' positions could be observed. The heliocentric model was not accepted right away.", "Bruno, an Italian friar, supported Copernicus' idea and went further, teaching that the universe is infinite and the stars are distant suns. In 1600 he was burned at the stake. It is said, however, that he was executed not for the heliocentric idea alone, but for several charges of heresy."]}, {"ja": ["ガリレオ・ガリレイは、落体の法則で第22話にも登場した学者です。彼は1609年ごろ、自分で改良した望遠鏡を空に向けました。1610年、彼はすごいものを見つけます。", "木星のそばに、小さな星が4つ並んでいて、夜ごとに位置を変えながら、木星のまわりを回っていたのです。地球以外のもののまわりを回る天体が、確かにありました。さらに金星は、月のように満ち欠けし、大きさも変わって見えました。これは、地動説でこそ説明できる姿でした。", "それでもガリレオは、1633年に宗教裁判にかけられ、有罪となりました。彼は自宅から出ることを許されないまま、1642年に生涯を終えます。", "裁判のあとで彼が「それでも地球は回っている」とつぶやいた、という話が伝わっています。これは、彼が本当に言った言葉ではなく、後世の人々が作って語り継いだ伝説の言葉です。ピサの斜塔の実験の話と同じように、伝説として楽しみましょう。"], "en": ["Galileo Galilei — the scholar of the law of falling bodies who also appeared in Episode 22 — turned a telescope he had improved toward the sky around 1609. In 1610, he found something astonishing.", "Beside Jupiter, four small stars stood in a line, changing position night by night, circling around Jupiter itself. Here were bodies that clearly revolve around something other than the Earth. Venus, too, showed phases like the moon, and changed in apparent size — a shape the heliocentric model explains well.", "Even so, in 1633 Galileo was put on trial by the Church and found guilty. Forbidden to leave his home, he spent the rest of his life there, until his death in 1642.", "It is said that after the trial he muttered, \"And yet it moves.\" These were not words he truly spoke; they are a legend created and passed down by later generations. Like the tale of the Leaning Tower of Pisa experiment, let us enjoy it as a legend."]}, {"ja": ["地動説の決定的な証拠は、ずっと見つかりませんでした。その証拠の名は「年周視差（ねんしゅうしさ）」。地球が太陽のまわりを動いているなら、近くの星は、半年前と比べてわずかにずれて見えるはずなのです。", "ところが、星はあまりにも遠くにありました。ずれは、角度にして1度の、さらに3600分の1よりも小さいほどです。当時の望遠鏡では、とても測れませんでした。", "その間、何人もの天文学者が生まれ、年周視差を探し、見つけられないまま生涯を終えました。そして1838年。ドイツの天文学者ベッセルが、はくちょう座61番星の年周視差を、ついに観測したのです。コペルニクスの本から、295年、およそ300年がたっていました。", "証拠が遅れたのは、地動説が間違っていたからではありません。測る技術が、そこまで育つのに時間が必要だったのです。"], "en": ["For a long time, no decisive proof of the heliocentric model could be found. The proof's name is \"annual parallax.\" If the Earth travels around the sun, then a nearby star should appear to shift slightly compared with half a year earlier.", "But the stars were simply too far away. The shift is smaller than one 3,600th of a single degree. The telescopes of the time could never measure it.", "In between, many astronomers were born, searched for the parallax, and ended their lives without finding it. Then, in 1838, the German astronomer Bessel at last measured the annual parallax of the star 61 Cygni. 295 years — about 300 years — had passed since Copernicus' book.", "The proof was late, not because the heliocentric model was wrong, but because measuring technology needed time to grow."]}, {"ja": ["1992年、カトリック教会は、ガリレオの裁判が誤りだったことを認め、公式に謝罪しました。1633年の裁判から、359年後のことです。", "数字で並べてみましょう。天動説は1400年。コペルニクスから年周視差の観測まで295年。ガリレオの裁判から謝罪まで359年。今、私たちが教科書で当たり前に使う真実も、たどり着くまでには、これほどの時間とたくさんの人の努力があったのです。", "「見たまま」が正しいとは限らない。でも、観測し、計算し、証拠を積み重ねれば、人間は少しずつ真実に近づける。地動説の歴史は、その歩みそのものです。", "夕日は沈み、空には星が光り始めました。「この星の光も、地球が回っているから動いて見えるんだね。」ユイは空を見上げました。足の下の地球は、今日も静かに回り続けています。"], "en": ["In 1992, the Catholic Church admitted that Galileo's trial had been a mistake and formally apologized. It was 359 years after the trial of 1633.", "Let's line the numbers up. The geocentric model: 1,400 years. From Copernicus to the observation of parallax: 295 years. From Galileo's trial to the apology: 359 years. Every truth we use today as a matter of course in textbooks needed this much time, and the efforts of so many people, to reach.", "What our eyes see is not always the truth. But by observing, calculating, and piling up evidence, human beings can draw closer to the truth, step by step. The history of the heliocentric model is exactly that journey.", "The sun had set, and stars were beginning to shine. \"The stars look like they move because the Earth is turning, don't they,\" said Yui, looking up. Beneath her feet, the Earth is quietly turning still today."]}], "column": {"ja": ["実は、太陽を中心に置く考えは、コペルニクスより約1800年も前に生まれていました。古代ギリシャのアリスタルコス（紀元前310年ごろ〜紀元前230年ごろ）が唱えたのですが、時代が早すぎて、受け入れられませんでした。", "天動説の数学を完成させたのは、2世紀の天文学者プトレマイオスです。彼の本『アルマゲスト』は、周転円を組み合わせて惑星の位置をかなり正確に予測しました。「よく当たる計算」が、1400年という長い寿命を天動説に与えたのです。", "地動説の側では、ケプラーが惑星の軌道が楕円であることを見つけ（1609年）、のちにニュートンが万有引力の法則で「なぜ惑星が太陽のまわりを回るのか」を説明しました（1687年）。落下の法則のガリレオ（第22話）、りんごと月のニュートン（第23話）と、地動説の物語はつながっています。", "コペルニクスの1543年から、ベッセルの1838年まで約300年。そして教会の謝罪の1992年まで、449年。真実が「当たり前」になるには、証拠と、計算と、そして途方もない時間が必要でした。科学の歩みは、速くはありません。でも、止まりもしません。"], "en": ["In fact, the idea of placing the sun at the center was born about 1,800 years before Copernicus. Aristarchus of ancient Greece (about 310 BC to about 230 BC) proposed it, but his age was too early, and the idea was not accepted.", "The mathematics of the geocentric model was completed by Ptolemy, an astronomer of the 2nd century. His book, the \"Almagest,\" predicted the positions of the planets with considerable accuracy by combining epicycles. It was \"calculation that worked\" that gave the geocentric model its long life of 1,400 years.", "On the heliocentric side, Kepler discovered that the planets' orbits are ellipses (1609), and later Newton explained \"why the planets circle the sun\" with the law of universal gravitation (1687). The story of the moving Earth is tied to Galileo of the falling law (Episode 22) and Newton of the apple and the moon (Episode 23).", "From Copernicus in 1543 to Bessel in 1838 is about 300 years, and to the Church's apology in 1992, 449 years. For a truth to become \"obvious,\" it needed evidence, mathematics, and an enormous amount of time. The walk of science is not fast. But it never stops, either."]}, "quiz": {"ja": ["Q1 天動説が1400年もの長い間、信じられ続けた大きな理由は何ですか。　答え：周転円という精巧な数学の仕掛けによって、惑星の位置を観測とかなりよく合うように計算できたからです。前提が間違っていても、計算が当たってしまうことがあるのです。", "Q2 ガリレオが1610年ごろに望遠鏡で見つけた、地動説を支える観測を、一つ挙げてください。　答え：木星のまわりを回る4つの衛星（地球以外の天体のまわりを回る星もある）です。金星が満ち欠けし、大きさも変わって見えることも、地動説を支える観測でした。", "Q3 地球が動いている決定的な証拠「年周視差」が観測されたのは何年で、コペルニクスの本からおよそ何年後ですか。　答え：1838年で、およそ300年後です。星があまりにも遠く、ずれが極端に小さいため、測る技術が育つまで待たなければならなかったのです。"], "en": ["Q1 What was a big reason the geocentric model was believed for as long as 1,400 years?　Answer: Because, with the ingenious device of epicycles, the positions of the planets could be calculated to match observations quite well. Even a wrong starting idea can produce calculations that come true.", "Q2 Name one observation Galileo made with his telescope around 1610 that supported the heliocentric model.　Answer: The four moons circling Jupiter — there are bodies that revolve around something other than the Earth. (Venus showing phases and changing apparent size also supported the model.)", "Q3 In what year was the decisive proof that the Earth moves, \"annual parallax,\" observed, and about how many years after Copernicus' book was that?　Answer: In 1838, about 300 years later. The stars are so far away, and the shift so extremely small, that people had to wait until measuring technology grew."]}, "corner": {"ja": ["惑星の「逆行」を体験してみましょう。広い場所で、友達にゆっくり歩いてもらい、自分はそれより速く歩いて追い越してください。追い越す瞬間、友達が背景に対して「後ろへ戻る」ように見えるはずです。地球が火星を追い越すときに見える逆行も、これと同じ仕掛けです（道路など、安全な場所で試してください）。", "金星の満ち欠けを、部屋で再現してみましょう。懐中電灯を「太陽」、白いボールを「金星」に見立てます。暗い部屋で、ボールを持つ人にゆっくり回ってもらい、離れた場所からボールを見ると、光の当たる部分が月のように満ち欠けして見えます。その上、ボールが近くに来たときと遠くに行ったときで、大きさが違って見えることも確かめてください。", "年周視差を、自分の指で体験しましょう。指を1本、顔の前に立てて、片目ずつ交互に開け閉めすると、指が左右にずれて見えます。これが「視差」です。指を遠くに離すほど、ずれは小さくなります。星の年周視差がなかなか測れなかったのは、星が途方もなく遠くて、ずれが極端に小さいからなのです。", "教科書の「当たり前」を、他にも調べてみましょう。地球の自転と公転、血液の循環、音の伝わり方……。「いつ、誰が、どうやって見つけたか」を一つ選んで調べると、どの真実の裏にも、人間の長い歴史があることが分かります。"], "en": ["Let's experience a planet's \"retrograde motion.\" Have a friend walk slowly across a wide place, and walk faster to overtake them. At the moment you pass, your friend should appear to move backward against the background. The retrograde of Mars, seen as the Earth overtakes it, works the same way. (Try this in a safe place, away from roads.)", "Let's recreate the phases of Venus in a room. Use a flashlight as the \"sun\" and a white ball as \"Venus.\" In a dark room, have someone holding the ball walk slowly in a circle, and watch the ball from a distance: the lit part waxes and wanes like the moon. Check also that the ball looks bigger when it comes near and smaller when it goes far.", "Experience parallax with your own finger. Hold one finger up in front of your face and close each eye in turn: your finger seems to jump left and right. That jump is \"parallax.\" The farther away your finger is, the smaller the jump becomes. The parallax of the stars was so hard to measure because the stars are unimaginably far, and the jump is extremely tiny.", "Look up other \"obvious\" facts from your textbooks: the Earth's rotation and revolution, the circulation of the blood, how sound travels... Choose one and find out \"when, who, and how it was discovered,\" and you will see that behind every truth stands a long human history."]}}, {"id": "biseki", "title": {"ja": "同じ真理に、3人がたどり着いた ― 微分・積分の発見のおはなし", "en": "Three People Reached the Same Truth ― The Story of the Discovery of Calculus"}, "sub": {"ja": "小学校高学年〜中学生向け・真理は一人だけのものではない、という発見の歴史", "en": "For upper elementary and junior high — a history of discovery, and the truth that belongs to no one person"}, "cover": "bis1.jpg", "images": ["bis1.jpg", "bis2.jpg", "bis3.jpg", "bis3.jpg", "bis4.jpg", "bis5.jpg"], "pages": [{"ja": ["ボールを坂で転がしながら、ユイが言いました。「ボールはどんどん速くなるね。この『速さの変わり方』って、どうやって表すんだろう。」", "変わっていく速さを追う方法と、曲がった形の面積を正確に求める方法。この2つをまとめた数学が、「微分・積分（びぶん・せきぶん）」です。中学校や高校で出会う、とても大切な数学です。", "「それを誰が作ったか、知っているかい。」おじいちゃんが聞きました。「実はね、ほぼ同じころに、離れた場所で3人の名前が挙がるんだ。しかも、そのうちの2人は、どちらが先かで大げんかまでした。」", "真理の発見に、けんかがついて回ることがあるのです。3人の物語を、たどってみましょう。"], "en": ["Rolling a ball down a slope, Yui said, \"The ball keeps going faster and faster. How can we describe 'the way its speed changes'?\"", "A way to follow changing speeds, and a way to find the exact area of curved shapes. The mathematics that brings these two together is called \"calculus\" — differentiation and integration. It is very important mathematics that you will meet in junior high and high school.", "\"Do you know who created it?\" asked her grandfather. \"In fact, around the same time, in far-apart places, three names come up. And two of them even had a great quarrel over who was first.\"", "The discovery of truth sometimes comes with a quarrel attached. Let's follow the story of the three."]}, {"ja": ["1人目は、イギリスのニュートンです。第23話で、りんごと月の物語に登場しました。1665年から66年にかけて、ペストの流行で大学が閉まり、彼は田舎の家に帰っていました。", "万有引力の計算には、動いていくものの「変化の速さ」を追う方法が必要でした。ニュートンはこのころ、流れていく量の変化を追う方法、「流率法（りゅうりつほう）」を編み出します。これが、微分の始まりでした。", "彼は、弱冠20代半ばで、歴史に残る大発見をいくつも成し遂げました。後世の人は、この時期を「驚異の年」と呼びます。", "ところがニュートンは、編み出した方法を、なかなか発表しませんでした。考えを温め続け、公にしたのは、ずっと後のこと。この「発表の遅れ」が、のちの大争いの種になります。"], "en": ["The first was Newton of England, who appeared in Episode 23 with the story of the apple and the moon. From 1665 to 1666, his university was closed by the plague, and he had gone home to the countryside.", "To calculate universal gravitation, he needed a way to follow \"the speed of change\" of things in motion. Around this time Newton worked out a method for following how flowing quantities change — his \"method of fluxions.\" This was the beginning of differentiation.", "He was still in his mid-twenties, and he made several discoveries that would remain in history. Later generations call this period his \"miraculous year.\"", "But Newton did not publish his method for a long time. He kept turning it over in his mind, and made it public only much later. This \"delay in publishing\" became the seed of a great dispute."]}, {"ja": ["2人目は、ドイツのライプニッツです。学者であり、外交の仕事もした、幅広い才能の持ち主でした。彼は1670年代にパリで数学を学び、ニュートンとは別に、独自に同じ方法にたどり着きます。", "ライプニッツは1684年、自分の方法を論文として発表しました。発表の早さでは、ライプニッツが先です。", "彼のもう一つの大きな仕事は、「記号」の工夫でした。今の教科書で使う ∫（インテグラル）という記号は、「和」を意味するラテン語の頭文字 S を伸ばした形です。「差」を表す d という記号も、彼の考案です。", "使いやすい記号は、考える道具そのものです。ライプニッツの記号が優れていたため、微分・積分は世界中へ広がっていきました。私たちが今使う記号は、彼のものを受け継いでいます。"], "en": ["The second was Leibniz of Germany, a scholar of wide talents who also worked as a diplomat. In the 1670s he studied mathematics in Paris, and, separately from Newton, he reached the same method by his own path.", "In 1684, Leibniz published his method as a paper. In speed of publication, Leibniz was first.", "His other great work was the invention of \"notation.\" The symbol ∫ (integral) used in textbooks today is the letter S — the first letter of the Latin word for \"sum\" — drawn out long. The symbol d, standing for a difference, was also his invention.", "Easy-to-use symbols are tools for thinking itself. Because Leibniz's notation was so good, calculus spread around the world. The symbols we use today are inherited from him."]}, {"ja": ["やがて、「先に見つけたのは誰か」という争いが始まります。1700年代に入ると、ニュートンの支持者とライプニッツの支持者が、互いに「相手がまねをした」と非難し合うようになりました。", "1712年には、ニュートンが会長を務めるロンドンの王立協会が報告書を出し、ライプニッツ側を責めました。争いは国と国を巻き込む大論争になり、ライプニッツが亡くなる1716年まで続きました。", "この争いのため、イギリスの数学者たちはニュートンの記号にこだわり続け、使いやすいライプニッツの記号を取り入れるのが遅れた、とも言われます。人間の意地が、数学の進み方にまで影を落としたのです。", "真理の発見の歴史は、美しいだけではありません。先を争う人間の姿も含めて、それが発見の歴史なのです。"], "en": ["Before long, a dispute began over \"who found it first.\" In the 1700s, Newton's supporters and Leibniz's supporters began accusing each other: \"The other side copied.\"", "In 1712, the Royal Society of London — whose president was Newton himself — issued a report blaming Leibniz's side. The quarrel grew into a great controversy involving whole countries, and it continued until Leibniz died in 1716.", "Because of this dispute, it is said, British mathematicians clung to Newton's notation and were slow to adopt Leibniz's easier symbols. Human pride cast a shadow even on the progress of mathematics.", "The history of discovering truth is not only beautiful. The sight of people competing to be first is part of that history, too."]}, {"ja": ["3人目は、日本の関孝和です。第9話で、建部賢弘の先生として登場しました。ニュートンやライプニッツと、ほぼ同じ時代を生きた、江戸の数学者です。", "関孝和は、「円理（えんり）」という数学を究めました。たとえば円の面積は、円を限りなく細い扇形に切り分けて、向きを互い違いに並べると、だんだん平行四辺形（長方形）に近づくことで分かります。縦は半径、横は円周の半分（πr）ですから、面積は πr×r＝πr²。これが、円の面積の公式の理由です。「細かく分けて集める」考えが、円理の芯でした。", "実は、この考えの芽は、ずっと昔にありました。紀元前3世紀のアルキメデスは、球の表面積が、同じ半径の円の面積のちょうど4倍（4πr²）になることを見つけました。さらに、球を「中心を頂点とする、細かい錐体（すいたい）の集まり」と考え、一つ分の体積（1/3×底面積×半径）を全部集めると、球の体積は （1/3）×表面積×半径＝4/3πr³ になることまで、突き止めていたのです。", "関孝和も同じ精神で円を追い続け、円周率を、3.14159265359…と、小数第10位まで正確に求めました。アルキメデスの蒔いた芽は、時代と海を越えて、関孝和の円理の中にも息づいていたのです。ヨーロッパの2人の争いとは無縁の場所で、真理は静かに育っていました。真理は、決まった一人の天才だけのものではないのです。"], "en": ["The third person was Seki Takakazu of Japan, who appeared in Episode 9 as the teacher of Takebe Katahiro. He was a mathematician of Edo who lived at almost the same time as Newton and Leibniz.", "Seki perfected a mathematics called \"enri\" — the study of circles. The area of a circle, for example, becomes clear when you cut the circle into ever-thinner sectors and lay them side by side, alternating their directions: the shape comes closer and closer to a parallelogram (a rectangle). Its height is the radius, and its width is half the circumference (πr), so the area is πr × r = πr². That is the reason behind the formula for the area of a circle. The idea of \"divide small and gather\" was the heart of enri.", "In fact, the bud of this idea existed long, long ago. Archimedes, in the 3rd century BC, found that the surface area of a sphere is exactly four times the area of a circle with the same radius (4πr²). Going further, he thought of the sphere as \"a gathering of thin pyramids with their tips at the center,\" and found that adding up each pyramid's volume — (1/3) × base area × radius — gives the sphere's volume as (1/3) × surface area × radius = 4/3πr³.", "Seki, too, pursued the circle in the same spirit, and found pi as 3.14159265359..., correct to the tenth decimal place. The bud planted by Archimedes was alive, across ages and seas, inside Seki's enri as well. Far from the quarrel of the two Europeans, the truth was growing quietly. Truth is not the property of one single genius."]}, {"ja": ["微分は「変化を追う」方法、積分は「小さく分けて集める」方法。そしてこの2つは、実は裏表の関係にあります。ニュートンとライプニッツは、2人ともその関係に気づいていました。だからこそ、2人の仕事は「同じ発見」と言えるのです。", "時代が実を結ぶころになると、真理には、離れた場所で複数の人が同時にたどり着くことがあります。ニュートンとライプニッツ、そして関孝和の3人は、その大きな例でした。", "今の教科書は、微分・積分を「ニュートンとライプニッツが、独立に創始した」と伝えます。争いの結末としてではなく、2人の功績を並べる形で、歴史は落ち着いたのです。", "「真理って、誰か一人のものじゃないんだね。」ユイは、坂を転がり終えたボールを拾い上げました。ボールは今も、速さを変えながら転がります。その変化を追う道具を、人類は3つの場所で、ほぼ同時につかんでいたのでした。"], "en": ["Differentiation is the method of \"following change,\" and integration is the method of \"dividing small and gathering.\" And the two are actually two sides of one coin. Both Newton and Leibniz noticed this relation. That is why their work can be called \"the same discovery.\"", "When an age ripens, truth is sometimes reached by several people at the same time, in far-apart places. Newton, Leibniz, and Seki Takakazu were a great example of this.", "Today's textbooks say that calculus was \"founded independently by Newton and Leibniz.\" History settled not with a winner of the quarrel, but with the two men's achievements standing side by side.", "\"So truth doesn't belong to just one person,\" said Yui, picking up the ball that had finished rolling. Balls still roll, changing speed as they go. And the tool for following that change was grasped by humankind in three places, at almost the same time."]}], "column": {"ja": ["微分と積分が「裏表」であることは、「微分積分学の基本定理」と呼ばれます。変化を追って元に戻すと集めた量になり、集めた量の変化を追うと元の変化になる。この不思議な関係の発見が、2人の仕事を一つの数学に結びつけました。", "ニュートンの慎重さは、発表の遅れにつながりました。1665〜66年に方法を編み出しながら、主著『プリンキピア』（1687年）では幾何学の形で説明し、微分・積分の論文が公刊されたのは1704年のことでした。30年以上の遅れが、ライプニッツとの争いの大きな原因になりました。", "争いのあと、歴史の評価は落ち着きました。現代の教科書は、2人を並べて「独立に創始した」と書きます。記号はライプニッツのものが残り、物理学への応用はニュートンの流れも大きく受け継ぎました。けんかの勝敗ではなく、両方の功績が、今の数学を作っています。", "日本では、関孝和の円理は、弟子の建部賢弘たちに受け継がれ（第9話）、和算として大きく発展しました。円周率の計算も、さらに細かい位まで進みます。そして芽をたどれば、紀元前3世紀のアルキメデスに行き着きます。「小さく分けて集める」数学は、古代に芽生え、17世紀の世界のあちこちで、同時に花開いていたのです。"], "en": ["That differentiation and integration are \"two sides of one coin\" is called the fundamental theorem of calculus. Follow a change and put it back, and you get the gathered amount; follow the change of a gathered amount, and you get the original change. The discovery of this curious relation joined the two men's work into one mathematics.", "Newton's caution led to his delay in publishing. He worked out his method in 1665–66, yet in his great book, the \"Principia\" (1687), he explained things in geometric form, and his paper on calculus was not published until 1704. A delay of more than thirty years was a major cause of the dispute with Leibniz.", "After the quarrel, history's judgment settled. Modern textbooks place the two side by side as independent founders. Leibniz's symbols survived, and the applications to physics inherited much from Newton's stream as well. It is not the win or loss of the quarrel, but both men's achievements together, that made today's mathematics.", "In Japan, Seki's enri was inherited by his pupils, including Takebe Katahiro (Episode 9), and developed greatly as \"wasan,\" Japanese mathematics. The calculation of pi also advanced to finer and finer digits. And if you follow the bud back, you reach Archimedes in the 3rd century BC. The mathematics of \"dividing small and gathering\" sprouted in ancient times, and in the 17th century it flowered at the same time in many places around the world."]}, "quiz": {"ja": ["Q1 微分・積分を1684年に先に発表したのは誰で、今の教科書の ∫ という記号を作ったのは誰ですか。　答え：どちらもライプニッツです。ニュートンは1665〜66年に方法を編み出しましたが、発表が遅れました。∫ は「和」を意味するラテン語の頭文字 S を伸ばした形です。", "Q2 ニュートンとライプニッツの「どちらが先か」の争いは、どうなりましたか。　答え：国を巻き込む大論争になり、ライプニッツが亡くなる1716年まで続きました。今の教科書は、2人が独立に創始したと並べて伝えています。", "Q3 関孝和は、円周率をどこまで正確に求めましたか。　答え：3.14159265359…と、小数第10位まで正確に求めました。「円理」という、細かく分けて足し合わせる方法による成果です。"], "en": ["Q1 Who published calculus first, in 1684, and who invented the symbol ∫ used in today's textbooks?　Answer: Both were Leibniz. Newton worked out his method in 1665–66, but his publication was late. The ∫ is the letter S, first letter of the Latin word for \"sum,\" drawn out long.", "Q2 What happened to the \"who was first\" dispute between Newton and Leibniz?　Answer: It grew into a great controversy involving whole countries, and continued until Leibniz died in 1716. Today's textbooks present the two as independent founders, side by side.", "Q3 How accurately did Seki Takakazu find the value of pi?　Answer: As 3.14159265359..., correct to the tenth decimal place. It was the fruit of \"enri,\" his method of dividing into tiny pieces and adding them together."]}, "corner": {"ja": ["積分の考え方を、工作で体験しましょう。紙に円を描いて切り抜き、中心から細長い短冊のように切り分け、それを交互に上下を逆にして横に並べると、だんだん長方形に近づきます。「円の面積＝半径×半径×円周率」の理由が、この「小さく分けて集める」で見えてきます。分ける数を増やすほど、正確になることも確かめてください。", "微分の考え方は、ボールで体験できます。坂でボールを転がし、1秒ごとの位置に印をつけてください。1秒間に進む長さが、だんだん長くなっていくはずです。この「変化の割合」の増え方こそ、速さの変化であり、微分が追いかけているものです。表にまとめると、変化の様子が見えてきます。", "ライプニッツの記号を観察してみましょう。∫ は、もとの字を伸ばした形をしています。何の字を伸ばしたのか、考えてみてください（答えは本文にあります）。「使いやすい記号は、考える道具になる」という言葉の意味を、自分の書く文字と比べて考えてみるのも面白いですよ。", "「同時発見」を、他にも探してみましょう。電話の発明では、ベルとグレイという2人が、同じ日に特許の申請をしたと言われます。進化論のダーウィンとウォレスも有名です。時代が実を結ぶと、真理は複数の人のもとに同時に届く。その例を、図書館や本で探してみてください。"], "en": ["Let's experience the idea of integration with paper work. Draw a circle on paper, cut it out, and slice it from the center into thin strips. Lay the strips side by side, flipping every other one upside down, and the shape comes closer and closer to a rectangle. This \"divide small and gather\" is how you can see why \"the area of a circle = radius × radius × pi.\" Check, too, that the more pieces you make, the more exact it becomes.", "The idea of differentiation can be experienced with a ball. Roll a ball down a slope, and mark its position every second. The distance it travels in each second should grow longer and longer. This growth of the \"rate of change\" is the change of speed — exactly what differentiation follows. Make a table, and the pattern of change will come into view.", "Look closely at Leibniz's symbols. ∫ is a certain letter drawn out long. Which letter is it? (The answer is in the story.) Think about what \"easy-to-use symbols are tools for thinking\" means, comparing with your own handwriting.", "Look for other \"simultaneous discoveries.\" For the telephone, it is said that two men, Bell and Gray, applied for a patent on the very same day. Darwin and Wallace, with the theory of evolution, are also famous. When an age ripens, truth arrives at several people's doors at once. Search for examples in the library or in books."]}}, {"id": "genjiko", "title": {"ja": "五つの香りと五十二の型 ― 源氏香のおはなし", "en": "Five Scents and Fifty-Two Patterns ― The Story of Genji Incense"}, "sub": {"ja": "小学校高学年〜中学生向け・ものの分け方を数えると、52通り", "en": "For upper elementary to junior high school students — counting the ways things can be grouped gives 52"}, "cover": "gen1.jpg", "images": ["gen1.jpg", "gen2.jpg", "gen3.jpg", "gen4.jpg", "gen5.jpg", "gen5.jpg"], "pages": [{"ja": ["ある日、ユイとおじいちゃんは、博物館の「源氏物語」の展示を見に行きました。着物の絵や、きらきらした蒔絵の箱が並ぶ中に、ふしぎな図が描かれた紙がありました。縦に5本の線が立ち、その上のほうが、ところどころ横の線で結ばれている図です。", "「おじいちゃん、この図、なあに。何かの暗号みたい。」ユイが聞くと、おじいちゃんは目を細めました。「これは『源氏香（げんじこう）の図』だよ。平安時代の貴族たちが楽しんだ、『御香合わせ（おこうあわせ）』という遊びの答えを書き表したものなんだ。」", "御香合わせは、香りを聞き分ける遊びです。「聞く」というのは、耳ではなく鼻のことで、香木の香りを静かにかいで味わうことを、当時の人は「香りを聞く」と言いました。", "「格調高い貴族の遊びだったんだろうね。でもねユイ、この優雅な遊びの中には、きちんとした数学が隠れているんだよ。」おじいちゃんの目が、いたずらっぽく光りました。"], "en": ["One day, Yui and her grandfather went to see an exhibition about The Tale of Genji at a museum. Among the pictures of kimono and the shining lacquered boxes, there was a sheet of paper with a strange diagram: five vertical lines standing in a row, their tops joined here and there by horizontal lines.", "\"Grandpa, what is this diagram? It looks like some kind of secret code.\" When Yui asked, her grandfather smiled. \"This is a Genji-kō diagram. It records the answers in a game called o-kō-awase — the incense-matching game — that nobles enjoyed in the Heian period, more than a thousand years ago.\"", "O-kō-awase is a game of telling scents apart. In those days, quietly breathing in the fragrance of incense wood and savouring it was called \"listening to the scent\" — with the nose, not the ears.", "\"It was an elegant pastime of the court, wasn't it? But listen, Yui — hidden inside this graceful game is some very proper mathematics.\" Her grandfather's eyes sparkled with mischief."]}, {"ja": ["今から千年ほど前の、平安時代の宮廷に思いをはせてみましょう。若い姫君さよが、友だちを招いて御香合わせの会を開いていました。部屋には、かすかな香りが漂っています。", "まず、5種類の香木を用意します。香木は、香りのよい特別な木で、種類ごとに香りが違います。それぞれの香木を小さく包んだ「香包（こうづつみ）」を5包ずつ、全部で25包作ります。", "やがて、香りのもとになる香包を、よく取り混ぜてから5包だけ選びます。選ばれた5包は、どれがどの香木なのか、だれにも分かりません。", "香炉で1包ずつ順番にたき、香りを1つずつ聞いていきます。1番目、2番目、3番目、4番目、5番目。さよは目を閉じて、静かに香りを聞きました。"], "en": ["Let us travel back, in our minds, to the imperial court of the Heian period, about a thousand years ago. A young princess named Sayo had invited her friends to an incense gathering. A faint fragrance drifted through the room.", "First, five kinds of incense wood are prepared. Incense wood is a special, fragrant wood, and each kind has a different scent. Each kind is wrapped into five small paper packets, making twenty-five packets in all.", "Then the packets are thoroughly shuffled, and just five are chosen. Nobody knows which of the five chosen packets holds which kind of wood.", "The five packets are burned one at a time in an incense burner, in order, and everyone listens to each scent in turn — first, second, third, fourth, fifth. Sayo closed her eyes and listened quietly to the fragrances."]}, {"ja": ["5包ぜんぶを聞き終わったら、当てるのは「どれとどれが、同じ香りだったか」です。たとえば「1番目と3番目が同じで、ほかは全部ちがう」というように、香りの分かれ方を答えます。", "答えは、言葉ではなく「型」で表します。縦線を5本引いて、同じ香りだったものの上のほうを、横の線で結ぶのです。これが、展示でユイが見た、あのふしぎな図でした。", "さよの組では、2番目と5番目が同じ香りでした。「当たったわ！」という歓声とともに、型が紙に書き写されます。", "聞く力だけの遊びかと思いきや、ここからが数学の出番です。「型は、いったい何通りあるのかな。」おじいちゃんがユイに聞きました。"], "en": ["When all five have been smelled, the players must guess which ones had the same scent. For example: \"The first and the third were the same, and all the others were different.\" You answer with the pattern of how the scents are grouped.", "The answer is written not in words but as a diagram: draw five vertical lines, and join the tops of the lines that had the same scent with a horizontal line. This was the strange diagram Yui had seen at the exhibition.", "In Sayo's group, the second and the fifth packets had the same scent. With a cheer of \"We guessed it!\", the pattern was copied onto paper.", "You might think this is only a game of noses — but here is where mathematics steps in. \"How many patterns do you suppose there are?\" her grandfather asked Yui."]}, {"ja": ["「香りの分かれ方って、何通りあると思う。」帰りの電車の中で、ユイは指を折って考え始めました。まずは、香りが2つの場合からです。", "2つなら、同じ香りか、ちがう香りかで、2通り。簡単です。では3つならどうでしょう。全部同じ、というのが1通り。2つだけ同じ、というのは、はぐれる1つがどれかで3通り。全部ちがうのが1通り。合わせて5通りです。", "「2つのときは2通り、3つのときは5通り。じゃあ4つなら……。」ユイが数え始めると、おじいちゃんが言いました。「15通りだよ。急に増えるだろう。」", "「5つになったら、もっとすごい数になるはずだ。」ユイの目が輝きました。「だって、源氏香の型は、物語の帖（じょう）の数と結びついているんでしょう。」"], "en": ["\"In how many ways can the scents be grouped, I wonder?\" On the train home, Yui began to count on her fingers. She started with just two scents.", "With two, there are only two ways: the same, or different. Easy. Now with three? All the same is one way. Exactly two the same — the odd one out can be any of the three — gives three ways. All different is one way. That makes five ways in all.", "\"Two scents give two ways, three scents give five ways. Then with four…\" As Yui began counting, her grandfather said, \"Fifteen. It grows quickly, doesn't it?\"", "\"Then with five, it must be an amazing number.\" Yui's eyes shone. \"Because the Genji incense patterns are tied to the chapters of the Tale of Genji, aren't they?\""]}, {"ja": ["家に帰って、ユイはノートに5つの場合を数え始めました。作戦は、「分かれ方の形ごとに、場合分けどおりに数える」ことです。", "全部が同じ香りなら、1通り。4つ同じで1つだけちがう形は、はぐれる1つの選び方が5つあるので5通り。3つと2つに分かれる形は、3つの組の選び方が10通りあるので10通りです。", "3つ同じで残りがばらばらの形も10通り。2つと2つと1つに分かれる形は、いちばん数えにくくて15通り。2つ同じで残りがばらばらの形は10通り。そして、全部がばらばらなら1通りです。", "「1＋5＋10＋10＋15＋10＋1……。」ユイは声に出して足しました。「52！　52通りになった！」5つの香りの分かれ方は、ちょうど52通りだったのです。"], "en": ["Back home, Yui opened her notebook and began counting the case of five. Her strategy: count pattern by pattern, according to the shape of the grouping.", "If all five are the same, that is one way. The shape \"four the same and one different\" gives five ways, because the odd one out can be chosen in five ways. The shape \"a group of three and a group of two\" gives ten ways, because there are ten ways to choose the group of three.", "The shape \"three the same and the other two each alone\" also gives ten ways. The shape \"two and two and one\" is the hardest to count, and gives fifteen ways. The shape \"two the same and the rest alone\" gives ten ways. And if all five are different, that is one way.", "\"One plus five plus ten plus ten plus fifteen plus ten plus one…\" Yui added them aloud. \"Fifty-two! It's fifty-two!\" The groupings of five scents come to exactly fifty-two."]}, {"ja": ["「そう、52通り。ここで源氏物語の出番だ。」おじいちゃんが言いました。源氏物語は全54帖の長い物語です。ところが、そのうち「桐壺（きりつぼ）」と「夢浮橋（ゆめのうきはし）」の2帖を除くと、ちょうど52帖になります。", "源氏香では、52通りの型の1つ1つに、その52帖の名前が1つずつ結びつけられています。出た型によって、「今日の型は『夕顔』の型です」というように、帖の名前で呼ぶのです。", "香りの優雅な遊びと、物語の世界と、52という数が、ぴたりと重なりました。ユイは言いました。「香りを聞く力と、数を数える力。どっちも大事なんだね。」", "「千年も残る遊びには、美しさと一緒に、確かな仕組みがあるものなんだよ。」おじいちゃんは、展示で見たあの図を思い出しながら、うなずきました。"], "en": ["\"That's right — fifty-two. And now the Tale of Genji enters the story.\" Her grandfather explained that the Tale of Genji is a long story of fifty-four chapters. But if you set aside two of them — \"Kiritsubo\" and \"Yume no Ukihashi\" — exactly fifty-two chapters remain.", "In Genji incense, each of the fifty-two patterns is paired with one of those fifty-two chapters. Depending on which pattern appears, people would say, \"Today's pattern is the pattern of 'Yūgao',\" naming it after a chapter.", "The elegant game of scents, the world of the great tale, and the number fifty-two all fitted together perfectly. Yui said, \"So you need both — the power to listen to scents, and the power to count.\"", "\"A game that lasts a thousand years has a sound design behind its beauty,\" her grandfather said, nodding, as he remembered the diagram they had seen."]}], "column": {"ja": ["（1）香りを聞く文化は古くからありましたが、「組香（くみこう）」と呼ばれる、香りを聞いて型を当てる遊びの形は、室町時代から江戸時代にかけて整えられていきました。その代表が源氏香で、源氏物語を愛する人々のあいだで広まりました。", "（2）型が52通りになることは、数学の計算でも確かめられます。そして源氏物語の54帖から2帖を除いた52帖と数が一致することに、人々は優雅な趣向を見出したのでしょう。偶然の一致を、文化として楽しむ心の豊かさが感じられます。", "（3）ものの「分け方の数」は、数学では「ベル数」と呼ばれています。1つのとき1、2つのとき2、3つのとき5、4つのとき15、5つのとき52、6つのとき203と、どんどん大きくなります。名前は、20世紀の数学者エリック・テンプル・ベルにちなみます。", "（4）この源氏香の話は、吉田武さんの『虚数の情緒』でも紹介されている題材です。香りの優雅さの奥に、組み合わせの数学が静かに息づいている好例と言えるでしょう。"], "en": ["（1）The culture of listening to incense is very old, but games called kumikō — where you smell incenses and guess the pattern — took shape from the Muromachi period into the Edo period. Genji incense is the most famous of them, and it spread among people who loved the Tale of Genji.", "（2）That the patterns number fifty-two can be confirmed by mathematics. And people found an elegant delight in the fact that it matched the fifty-two chapters left after removing two from the Tale of Genji's fifty-four. There is a richness in enjoying such a coincidence as part of one's culture.", "（3）In mathematics, the number of ways to split things into groups is called a Bell number. For one thing it is 1, for two it is 2, for three it is 5, for four 15, for five 52, and for six it is already 203. The name honours the twentieth-century mathematician Eric Temple Bell.", "（4）This story of Genji incense is also introduced in Takeshi Yoshida's book \"Kyosū no Jōcho\" (The Emotion of Imaginary Numbers). Behind the elegance of fragrance, the mathematics of combinations breathes quietly — a fine example of it."]}, "quiz": {"ja": ["Q1. 香りが3つのとき、香りの分かれ方は何通りありますか。　答え：5通り（全部同じ1通り、2つ同じが3通り、全部ちがう1通り）", "Q2. 5つの香りが全部ちがうとき、型は何通りありますか。　答え：1通り（分かれ方の形が1つだけだからです。全部同じときも1通りです）", "Q3. 源氏香の型は52通りですが、源氏物語は全何帖で、除かれる2帖は何と何ですか。　答え：全54帖で、除かれるのは「桐壺」と「夢浮橋」です"], "en": ["Q1. When there are three scents, in how many ways can they be grouped?　Answer: 5 ways (all the same: 1 way; exactly two the same: 3 ways; all different: 1 way)", "Q2. When all five scents are different from one another, how many patterns are there?　Answer: 1 pattern (there is only one shape of grouping. All five the same is also just 1 pattern)", "Q3. The Genji incense patterns number 52, but how many chapters does the Tale of Genji have in all, and which two chapters are set aside?　Answer: It has 54 chapters in all; the two set aside are \"Kiritsubo\" and \"Yume no Ukihashi\""]}, "corner": {"ja": ["（1）おうち源氏香をやってみましょう。用意するのは、みかんの皮、コーヒー豆、お茶の葉、シナモンなど、香りのちがう安全なものです。同じものを2つ混ぜて家族に当ててもらうと、「どれとどれが同じ香りか」の聞き分けゲームになります。全部で何通りの型ができるか、遊びながら考えてみましょう。", "（2）分け方探しに挑戦しましょう。5枚の色紙や5つのコップを使って、「同じ・ちがう」の型を紙に描き出します。まず3つで5通り、次に4つで15通りを見つけてから、5つの52通りに挑むと、数え方の工夫が見えてきます。同じ型を2回数えないように、形ごとに整理するのがコツです。", "（3）源氏香の図を自分で描いてみましょう。縦線を5本引いて、同じグループの線の上を横線で結ぶだけです。自分の考えた型に、好きな物語の名前をつけてみるのも楽しいでしょう。", "（4）本物の香木や線香など、火を使うものは、必ず家の大人と一緒に扱ってください。香りの聞き分けだけなら、食べものや果物の皮でも十分に楽しめます。"], "en": ["（1）Try Genji incense at home. Use safe, fragrant things such as mandarin orange peel, coffee beans, tea leaves, and cinnamon. Mix in two samples of the same scent and let your family guess which ones match — a listening-to-scents game. While you play, think about how many patterns there could be.", "（2）Take the grouping challenge. Using five coloured papers or five cups, draw out all the \"same / different\" patterns on paper. First find all five patterns for three things, then all fifteen for four things, and then take on the fifty-two for five. The trick is to sort by shape, so you never count the same pattern twice.", "（3）Draw a Genji incense diagram yourself. Draw five vertical lines, and join the tops of each group with a horizontal line. It is fun to give your own pattern the name of a favourite story, too.", "（4）Real incense wood and incense sticks involve fire, so always handle them together with an adult at home. For the smelling game itself, foods and fruit peels are quite enough to enjoy."]}}, {"id": "mahoujin", "title": {"ja": "たてよこななめ、みんな15 ― 洛書と魔方陣のおはなし", "en": "Every Way You Add, It's 15 ― The Story of the Lo Shu and Magic Squares"}, "sub": {"ja": "小学校中学年〜高学年向け・1から9をならべる不思議な四角", "en": "For elementary school, middle to upper grades: a mysterious square of the numbers 1 to 9"}, "cover": "mah1.jpg", "images": ["mah1.jpg", "mah2.jpg", "mah3.jpg", "mah4.jpg", "mah5.jpg", "mah5.jpg"], "pages": [{"ja": ["夏休み、ミオはおばあちゃんの家の近くの川で、平べったい石を見つけました。石には、点が並んだ模様が彫ってあります。3つずつ3段に並んだ点の集まりが、9つの場所に置かれていました。", "「あら、それは亀の甲らの模様にそっくりだね。」おばあちゃんが言いました。「大昔の中国に、川から現れた亀の甲らに、不思議な点の模様があったという言い伝えがあるんだよ。」", "ミオが点の数を数えると、場所ごとに1個から9個まで、全部違う数でした。「この点の並びには、秘密があるの。」おばあちゃんは目を細めました。", "家に帰ると、おばあちゃんは木の板と、点が彫られた9枚の石の札を持ってきました。「今日は、この点の札で遊ぼう。数の魔法の四角を作るんだ。」"], "en": ["One summer day, Mio found a flat stone by the river near her grandmother's house. Carved into the stone was a pattern of dots: groups of dots arranged in three rows of three, in nine places.", "\"Oh, that looks just like the pattern on a turtle's shell,\" said her grandmother. \"Long, long ago in China, people told of a turtle that came out of a river with a mysterious pattern of dots on its shell.\"", "When Mio counted the dots, each place had a different number, from 1 to 9. \"This pattern of dots holds a secret,\" her grandmother said, smiling.", "Back home, her grandmother brought out a wooden board and nine stone tiles carved with dots. \"Today we will play with these dot tiles. We are going to make a magic square of numbers.\""]}, {"ja": ["木の板には、たて3マス、よこ3マスの線が引いてありました。「1から9までの札を1枚ずつ置いてごらん。ただし、約束がある。」", "約束はこうでした。たての列、よこの列、そしてななめの列、どの列を足しても、合計が同じになるように置くこと。列は全部で8本あります。", "ミオは札を置いては足し、置いては足しました。たては合うのに、よこが合いません。よこを直すと、ななめがずれてしまいます。「うーん、なかなかできない。」", "「あきらめるのは、まだ早いよ。」おばあちゃんが言いました。「まず、合計がいくつになればいいのかを、考えるんだ。魔法の数字は、先に計算で分かるんだよ。」"], "en": ["The wooden board had lines dividing it into three columns and three rows. \"Place the tiles from 1 to 9, one in each square. But there is a rule.\"", "The rule was this: arrange the tiles so that every column, every row, and both diagonals add up to exactly the same total. There are eight lines in all.", "Mio placed tiles and added, placed and added. The columns matched, but the rows would not. When she fixed the rows, a diagonal went wrong. \"Hmm, this is harder than it looks.\"", "\"Don't give up yet,\" said her grandmother. \"First, let's work out what the total has to be. The magic number can be found by calculation before we even start.\""]}, {"ja": ["「1から9までを全部足すと、いくつ。」おばあちゃんに聞かれて、ミオは計算しました。1＋9で10、2＋8で10、3＋7で10、4＋6で10、残りは5。合わせて45です。", "四角の数を3つのよこの列に分けると、45を3つに分けたものが、1列の合計になります。45÷3＝15。「じゃあ、どの列も15になればいいんだ。」", "目標が15と分かったら、目当てができました。15になる3つの数の組み合わせを探すのです。9と大きい数で作るには1と5、8なら3と4、というように、組み合わせは限られています。", "「大きな数の相方を探すのがコツだね。」ミオは組み合わせをノートに書き出しました。9の相手は1と5、8の相手は3と4、7の相手は2と6か、3と5。札を置く前の作戦会議です。"], "en": ["\"What do the numbers from 1 to 9 add up to?\" Mio worked it out. 1+9 makes 10, 2+8 makes 10, 3+7 makes 10, 4+6 makes 10, and 5 is left over. The total is 45.", "The nine numbers are split among the three rows, so one row must be 45 shared by 3, which is 45÷3 = 15. \"So every line has to make 15.\"", "Once she knew the target was 15, she had something to aim at. She needed triples of numbers that make 15. With 9 you need 1 and 5; with 8, you need 3 and 4 — the choices are limited.", "\"Making 15 is about finding partners for the big numbers.\" Mio wrote the combinations in her notebook. 9 pairs with 1 and 5; 8 with 3 and 4; 7 with 2 and 6, or 3 and 5. A strategy meeting before placing a single tile."]}, {"ja": ["「もう一つ、大事なことが計算で分かる。」おばあちゃんが、四角の真ん中を指さしました。「真ん中のマスは、特別な場所なんだ。」", "真ん中を通る列は、たて、よこ、ななめ2本の、全部で4本あります。この4本を全部足すと、15×4＝60になります。", "ところが、この4本には、四角の9つの数が全部出てきます。その上、真ん中の数だけが4回も数えられます。全部の合計45に、真ん中の数が余分に3回分入って、60になるのです。", "「60−45＝15。その15は、真ん中の数の3回分。だから真ん中は15÷3＝5。」ミオは目を丸くしました。「置く前から、真ん中が5だって決まっていたんだ。」"], "en": ["\"There is one more important thing we can find by calculation,\" said her grandmother, pointing at the middle square. \"The center is a very special place.\"", "Four lines pass through the center: one row, one column, and the two diagonals. Adding all four lines gives 15×4 = 60.", "But those four lines together contain every one of the nine numbers — and the center number is counted four times. So 60 is the total of everything, 45, plus the center counted three extra times.", "\"60−45 = 15. And that 15 is the center times three. So the center is 15÷3 = 5.\" Mio's eyes went wide. \"The center was decided before we placed anything at all.\""]}, {"ja": ["真ん中に5の札を置くと、残りの場所にも決まりが見えてきました。ななめの列は、5をはさんで向かい合う2つの数の合計が10になれば、15になります。9の向かいは1、8の向かいは2、という約束です。", "次にミオは、角のマスに奇数の札を置いてみました。すると、どう並べても、どこかの列が15になりません。「角に奇数を置くと、必ず失敗するみたい。」", "角は、たて・よこ・ななめの3本の列が集まる場所です。試行錯誤の末に分かった決まりは、「角には偶数（2、4、6、8）、辺の真ん中には奇数（1、3、7、9）」でした。", "決まりを全部使うと、札はすんなり収まりました。4・9・2、3・5・7、8・1・6。たても、よこも、ななめも、全部15です。「できた。魔法の四角だ。」"], "en": ["With the 5 placed in the center, other rules came into view. On each diagonal, the two numbers facing each other across the 5 must add to 10, so that the line makes 15. The partner of 9 is 1; the partner of 8 is 2.", "Next, Mio tried putting an odd number in a corner. However she arranged the rest, some line always refused to make 15. \"An odd number in a corner always seems to fail.\"", "A corner is where three lines meet: a row, a column, and a diagonal. After many tries, the rule became clear: even numbers (2, 4, 6, 8) go in the corners, and odd numbers (1, 3, 7, 9) go in the middle of the edges.", "Using all the rules, the tiles fell into place: 4, 9, 2 across the top; 3, 5, 7 in the middle; 8, 1, 6 at the bottom. Rows, columns, diagonals — all 15. \"I did it! A magic square!\""]}, {"ja": ["完成した四角を見て、おばあちゃんが言いました。「その並びは、川の亀の甲らの模様と、ぴったり同じだよ。」", "札の点の数を数え直すと、石に彫られていた模様と本当に同じでした。何千年も前の人が見つけた並びに、ミオは自分の手でたどり着いたのです。", "「ほかの並びはないの。」と聞くと、「回したり、裏返したりしたものを除くと、並び方はたった1通りだけなんだ。」8通りの置き方はありますが、回転と裏返しを同じものと見ると、本質は1つだけでした。", "魔方陣と呼ばれるこの四角は、大きくなったものもあります。4×4の魔方陣では、1から16を使って、どの列も34になります。「いつか、そちらにも挑戦してごらん。」夕方の光の中で、9枚の札が静かに光っていました。"], "en": ["Looking at the finished square, her grandmother said, \"That arrangement is exactly the same as the pattern on the river turtle's shell.\"", "Mio counted the dots on the tiles again. It really was the same pattern as the carving on the stone. She had reached, with her own hands, the arrangement that people found thousands of years ago.", "\"Is there any other arrangement?\" she asked. \"If you don't count turning it around or flipping it over, there is only one way.\" There are eight placements, but counting rotations and flips as the same, there is really only one.", "Squares like this are called magic squares, and bigger ones exist too. In a 4×4 magic square, the numbers 1 to 16 are arranged so that every line adds to 34. \"Someday, try that one too.\" In the evening light, the nine tiles gleamed quietly on the table."]}], "column": {"ja": ["中国には「洛書（らくしょ）」という古い言い伝えがあります。洛水という川から現れた亀の甲らに、点の模様があったというお話で、禹（う）という王様がそれを見て、治水や政治の心得を得たとも伝えられます。あくまで伝説ですが、点の並びは後の時代に数で書き表され、3×3の魔方陣として知られるようになりました。", "洛書の点の数は、このおはなしの並び（4・9・2、3・5・7、8・1・6）と同じです。点を数に直したものが、人類の知っている最古の魔方陣だと言われています。", "魔方陣はその後、インドやイスラーム世界、ヨーロッパへも伝わりました。ドイツの画家デューラーの版画『メランコリアI』（1514年）には、4×4の魔方陣が彫られています。その魔方陣の下の段には、制作年の1514の「15」と「14」が並ぶ工夫まであります。", "3×3の魔方陣の並び方は、回転と裏返しを除けば1通りだけです。コンピューターで全部の並び（9つの数の並べ方は362,880通り）を調べても、条件を満たすのは8通りしかありません。「1つしかない」ということも、数学で確かめられるのです。", "「やってみよう」で紹介した、外側に階段のマスを書き足す作り方は、日本では「バシェーの方法」という名前で伝えられることが多い作り方です。フランスの数学者クロード・バシェー（1581〜1638年）が、娯楽数学の本『プロブレム・プレザン』の1624年の版で紹介した方法として知られています。ただし、バシェーが発明したというわけではなく、イタリアのカルダーノが1539年の本ですでに同じ作り方を説明していたとも言われます。誰が最初に思いついたのかは、今もはっきりしていません。", "もう一つ、世界でいちばん有名になった作り方があります。フランスの外交官ド・ラ・ルベールが、シャム（今のタイ）への使いの旅（1687年）で現地の作り方を学び、1691年の本『シャム王国記』で紹介した「シャム法」です。1を上段の真ん中に置き、右上へ進んでいく方法で、もとはインドで考えられた方法だと言われています。中国では13世紀に、楊輝（ようき）という数学者が、3×3から10×10までの魔方陣の作り方を本にまとめました。そして日本では、江戸時代の和算家・関孝和が1683年に『方陣之法・円攅之法』を著し、魔方陣の作り方を理論的にまとめています。ルベールがシャムへ渡る、少し前のことです。", "この作り方を知っていると、魔方陣の問題はあっという間に解けます。実際、数年前に新潟県の公立高校の入試問題で3×3の魔方陣が出題されたことがありました。知っている人にとっては、すぐに完成させられる問題だったはずです。昔の人の知恵が、現代の試験でも生きているのですね。"], "en": ["In China there is an old legend called the Lo Shu. A turtle is said to have come out of the Luo River with a pattern of dots on its shell, and King Yu is said to have learned from it how to govern and control the floods. It is only a legend, but the dot pattern was later written down in numbers and became known as the 3×3 magic square.", "The numbers of dots in the Lo Shu are the same as the arrangement in this story: 4, 9, 2; 3, 5, 7; 8, 1, 6. Written in numbers, it is said to be the oldest magic square known to humanity.", "Magic squares later traveled to India, the Islamic world, and Europe. The German artist Dürer carved a 4×4 magic square into his engraving Melencolia I in 1514. In the bottom row of that square, the numbers 15 and 14 sit side by side to mark the year it was made.", "The 3×3 magic square has only one arrangement, not counting rotations and flips. Even checking all 362,880 ways to place nine numbers by computer, only eight of them work. \"There is only one\" is something mathematics itself can prove.", "The terrace method in the Try It section is often taught in Japan under the name \"Bachet's method.\" It is known as the method introduced by the French mathematician Claude Bachet (1581–1638) in the 1624 edition of his book of mathematical recreations, Problèmes plaisants. But Bachet did not invent it himself: the Italian mathematician Cardano is said to have described the same construction in a book of 1539. Who thought of it very first is still not known.", "There is another method that became the most famous in the world. The French diplomat Simon de la Loubère learned it during his mission to Siam (now Thailand) in 1687, and introduced it in his book Du Royaume de Siam in 1691. Called the Siamese method, it starts with 1 in the middle of the top row and climbs up and to the right; it is said to have been thought up long before in India. In thirteenth-century China, the mathematician Yang Hui collected ways of building magic squares from 3×3 up to 10×10 in his book. And in Japan, the Edo-period mathematician Seki Takakazu wrote his Hōjin no Hō in 1683, setting out the theory of how magic squares are made — just a few years before de la Loubère even sailed to Siam.", "If you know this method, a magic square problem can be solved in no time. A few years ago, a 3×3 magic square actually appeared in the entrance examination for public high schools in Niigata Prefecture. For anyone who knew the method, it must have been a problem they could complete at once. The wisdom of long ago is still alive in a modern examination hall."]}, "quiz": {"ja": ["Q1　1から9までの数を全部足すと、いくつになりますか。また、3×3の魔方陣で、1列の合計はいくつですか。　答え：全部で45。45÷3＝15で、1列の合計は15です。", "Q2　魔方陣の真ん中の数が5になるのは、なぜですか。　答え：真ん中を通る4本の列の合計は15×4＝60。その中には全部の数（合計45）と、真ん中の数が余分に3回分入っているので、60−45＝15が真ん中の3回分、つまり真ん中は5です。", "Q3　3×3の魔方陣で、角のマスに入るのは、偶数と奇数のどちらですか。　答え：偶数（2、4、6、8）です。奇数（1、3、7、9）は、辺の真ん中と中央（5）に入ります。"], "en": ["Q1　What do the numbers from 1 to 9 add up to? And in a 3×3 magic square, what is the total of one line?　Answer: The total is 45. Since 45÷3 = 15, every line adds to 15.", "Q2　Why must the number in the center of the magic square be 5?　Answer: The four lines through the center add to 15×4 = 60. Inside that 60 are all the numbers (total 45) plus the center counted three extra times, so 60−45 = 15 is three times the center, and the center is 5.", "Q3　In a 3×3 magic square, do even or odd numbers go in the corners?　Answer: Even numbers (2, 4, 6, 8). The odd numbers (1, 3, 7, 9) go in the middle of the edges and in the center (5)."]}, "corner": {"ja": ["3×3のマスを用意して、1から9までの数を1回ずつ入れて、たて・よこ・ななめの合計が全部15になるようにしてみましょう。紙に書いても、9枚のカードを作ってもできます。", "ヒントは3つです。①どの列も15、②真ん中は5、③角には偶数、辺の真ん中には奇数を置きます。ヒントを使わずに見つけるのも、使って確かめるのも、どちらも楽しいですよ。", "できた四角を90度回してみましょう。それも魔方陣になっていますか。裏返した形はどうでしょう。回転と裏返しで作れる形は、全部でいくつあるか数えてみましょう。", "できあがったら、列の合計を全部確かめてください。8本の列が全部15になったら完成です。家族や友だちと、どちらが早く完成できるか競争するのもおすすめです。", "実は、魔方陣には「必ずできる作り方」もあります。四角の外側、四辺のまわりに、階段（テラス）のようなマスを書き足してから始める方法です。①書き足したマスも使って、1から順に、ななめの列に沿って数を置いていきます。②全部置き終わったら、外側にはみ出した数を、同じ行・同じ列の反対側にある空きマスへ、そのまままっすぐ移します。すると、四角の中に数がそろって、2・7・6、9・5・1、4・3・8という魔方陣ができあがります。", "この作り方は、5×5の魔方陣にも使えます。外側に階段のマスを書き足して、1から25までをななめに置き、はみ出した数を反対側へ移すと、たて・よこ・ななめの合計が全部65になる四角が完成します。大きな紙を用意して、ぜひ挑戦してみてください。奇数×奇数の四角なら、何×何でも作れる方法なのです。"], "en": ["Take a 3×3 grid and place the numbers 1 to 9, each exactly once, so that every row, column, and diagonal adds to 15. You can draw it on paper, or make nine cards.", "Here are three hints. First, every line makes 15. Second, the center is 5. Third, even numbers go in the corners, and odd numbers go in the middle of the edges. Finding it without the hints is fun, and so is using the hints to check.", "Turn your finished square by 90 degrees. Is it still a magic square? What about flipped over? Count how many squares you can make just by rotating and flipping.", "When you finish, check all eight lines. If every one of them makes 15, your magic square is complete. Racing a friend or a family member to finish first is fun too.", "There is also a way of building a magic square that always works. Before you start, draw extra cells like steps — a terrace — outside all four sides of the square. First, using the terrace cells too, place the numbers from 1 in order along diagonal lines. Then, when all the numbers are placed, take each number that landed outside the square and move it straight across, along its row or column, into the empty cell on the opposite side. The numbers come together inside the square, and you have a magic square: 2, 7, 6 on top; 9, 5, 1 in the middle; 4, 3, 8 at the bottom.", "The same method builds a 5×5 magic square. Draw terrace cells outside, place the numbers from 1 to 25 along the diagonals, and move the outside numbers straight across to the other side: every row, column, and diagonal will add to 65. Take a big sheet of paper and try it. The method works for any odd-sized square."]}}, {"id": "reuleaux", "title": {"ja": "まるいふたはなぜ落ちない？ ― 定幅図形のおはなし", "en": "Why Doesn't the Round Lid Fall In? ― The Story of Constant-Width Shapes"}, "sub": {"ja": "小学校中学年〜高学年向け・どの方向でも幅が同じ不思議な形", "en": "For elementary school, middle to upper grades — the surprising shapes that are just as wide in every direction"}, "cover": "reu1.jpg", "images": ["reu1.jpg", "reu2.jpg", "reu3.jpg", "reu4.jpg", "reu5.jpg", "reu5.jpg"], "pages": [{"ja": ["ある日の帰り道、ミオは道ばたのマンホールのふたを指さしました。「ねえおばあちゃん、どうしてふたは、みんな丸いの。四角いふたは見たことがないよ。」", "おばあちゃんは足を止めて、ほほえみました。「いいところに気がついたね。形が丸いのには、ちゃんと理由があるんだよ。」", "「転がして運べるから。」ミオが言うと、おばあちゃんは首をふりました。「それもあるけれど、いちばんの理由は別にある。ヒントは『落ちる』と『落ちない』だよ。」", "ミオは丸いふたを見つめました。ふたの下は、深い穴です。「もし四角いふただと、穴に落ちちゃうってこと。」おばあちゃんはうなずきました。「家に帰ったら、実験してみよう。」"], "en": ["One day on the way home, Mio pointed at a manhole cover by the road. \"Grandma, why are the lids always round? I have never seen a square one.\"", "Her grandmother stopped and smiled. \"You noticed something good. There is a real reason the lid is round.\"", "\"So it can roll when people carry it?\" said Mio. Her grandmother shook her head. \"That is true too, but the biggest reason is something else. Here is a hint: falling in, and not falling in.\"", "Mio looked at the round lid. Under it was a deep hole. \"You mean, if the lid were square, it could fall into the hole?\" Her grandmother nodded. \"Let's try an experiment when we get home.\""]}, {"ja": ["家に帰ると、おばあちゃんは四角い木の板と、四角い穴の開いた木わくを持ってきました。「これが四角いふたと、四角い穴だよ。」", "まっすぐに置くと、ふたは穴に乗り、落ちません。ところがミオがふたをななめに傾けると、すきまができて、ふたは穴の中にするりと落ちてしまいました。", "「四角は、一辺の長さよりも、ななめの対角線の方が長いんだ。」おばあちゃんが言いました。「だから、ななめの向きになると、穴より細くなって落ちてしまう。」", "その点、丸は安心です。丸は、どの方向から測っても、幅がいつも同じ。つまり直径はいつも等しいので、どの向きになっても穴より細くなることがありません。「幅がいつも同じ、というのが大事なんだね。」"], "en": ["Back home, her grandmother brought a square wooden board and a wooden frame with a square hole. \"This is a square lid, and this is a square hole.\"", "Placed straight, the lid sat on the hole and did not fall. But when Mio tilted the lid diagonally, a gap opened, and the lid slipped right down into the hole.", "\"A square's diagonal is longer than its side,\" said her grandmother. \"So when it turns diagonally, it becomes narrower than the hole, and down it goes.\"", "A circle is safe. Whichever way you measure it, its width is always the same. The diameter never changes, so it can never become narrower than the hole. \"So the secret is: the width is always the same.\""]}, {"ja": ["「でもね、ミオ。」おばあちゃんが目を輝かせました。「どの方向でも幅が同じ形は、丸だけじゃないんだ。」", "おばあちゃんは紙に正三角形を描きました。そして、1つの頂点にコンパスの針を置き、ほかの2つの頂点を結ぶ大きな弧を描きました。同じことを3つの頂点すべてでくり返すと、3つの弧に囲まれた、ふっくらとふくらんだ三角形ができました。", "「これは『ルーローの三角形』という形だよ。」ミオが2冊の本ではさんで幅を測ると、向きを変えても、幅はいつも正三角形の一辺とぴったり同じでした。", "「三角なのに、幅がいつも同じ。」どの弧も、向かい側の頂点を中心に、一辺の長さを半径にして描かれています。だから、はさむ向きをどう変えても、幅は一辺の長さから変わらないのです。"], "en": ["\"But listen, Mio,\" said her grandmother, her eyes shining. \"The circle is not the only shape whose width is always the same.\"", "She drew an equilateral triangle on paper. Then she put the compass point on one corner and drew a big arc joining the other two corners. When she did the same from all three corners, a plump, bulging triangle appeared, fenced in by three arcs.", "\"This shape is called the Reuleaux triangle.\" Mio measured its width by holding it between two books, and whichever way she turned it, the width was always exactly the side of the triangle.", "\"A triangle, and yet its width never changes.\" Each arc is drawn around the opposite corner, with the side of the triangle as its radius. That is why the width stays equal to the side, no matter how you turn the shape."]}, {"ja": ["次の日、ミオはルーローの三角形を厚紙で切り取りました。丸い板と並べて、上に平らな板を載せて、そっと転がしてみます。", "丸い板の上の板は、水平のまま進みました。では、三角形の方はというと――なんと、こちらも板は傾かず、水平のまま進んだのです。「幅がいつも同じだから、高さが変わらないんだ。」", "けれども、よく見ると違いもありました。ルーローの三角形の真ん中の点は、転がるたびに上下にふらふらと動きます。「だから、自転車の車輪には向かないんだね。真ん中がぶれてしまうから。」", "ミオは、ルーローの三角形のまわりに糸を巻いて、長さを測りました。そして直径が同じ丸のまわりと比べると、ぴったり同じ長さでした。「形は違うのに、まわりの長さは丸と同じなんだ。」"], "en": ["The next day, Mio cut a Reuleaux triangle out of thick paper. She set it beside a round disk, laid a flat board on top of each, and rolled them gently.", "The board on the round disk moved along, perfectly level. Then she tried the triangle — and its board also moved along, level and steady, without tilting at all. \"Because the width is always the same, the height never changes.\"", "But looking closely, there was a difference. The center point of the Reuleaux triangle wobbled up and down as it rolled. \"So it would not make a good bicycle wheel. Its middle keeps wandering.\"", "Mio wrapped a string around her Reuleaux triangle and measured its length. Then she compared it with the distance around a circle of the same width. They were exactly the same. \"Different shape, but the same distance around as a circle.\""]}, {"ja": ["「この形のふたを作ったら、どうなるかな。」おばあちゃんに言われて、ミオはルーローの三角形の形の穴とふたを、紙で作りました。", "ふたを穴の上で、好きな向きに回してみます。どの向きにしても、ふたの幅は穴の幅と同じか、それより細くなることはありません。何度回しても、ふたは落ちませんでした。", "「丸じゃないのに、落ちないふたができた。」ミオはうれしくなりました。実はこの形、本物の街でも使われています。アメリカのサンフランシスコでは、水道のバルブのふたに、ルーローの三角形の形が使われているのです。", "「幅がいつも同じ形のことを『定幅図形（ていふくずけい）』と言うんだよ。」おばあちゃんが言いました。「丸は、その中でいちばん有名な形というわけだ。」"], "en": ["\"What if we made a lid in this shape?\" said her grandmother, and Mio cut a hole and a lid, both shaped like a Reuleaux triangle, out of paper.", "She turned the lid over the hole in every direction she liked. In every direction, the lid was just as wide as the hole, and never narrower. However many times she turned it, the lid never fell in.", "\"A lid that is not round, and still cannot fall in.\" Mio was delighted. And this shape is truly used in a real city. In San Francisco, in America, some water-valve covers are made in the shape of a Reuleaux triangle.", "\"Shapes that are just as wide in every direction are called shapes of constant width,\" said her grandmother. \"The circle is simply the most famous one of them all.\""]}, {"ja": ["「定幅図形は、ほかにも作れるの。」ミオが聞くと、おばあちゃんは正五角形を描きました。頂点から向かい側の辺に弧を描いていくと、5つの弧を持つ、丸みのある五角形ができました。", "正七角形からも作れます。角の数が奇数なら、同じ作り方で定幅図形ができるのです。イギリスの50ペンス硬貨は、丸みのある七角形で、どの方向でも幅が同じだから、自動販売機でもきちんと使えます。", "「丸いふたの秘密は、『どの方向でも幅が同じ』ということだったんだね。」ミオは、最初に見たマンホールのふたを思い出しました。", "夕方の光の中で、ルーローの三角形の厚紙が、机の上で静かに光っていました。ただの三角形に見えた形の中に、こんなに深い秘密が隠れていたのです。"], "en": ["\"Can we make other constant-width shapes?\" asked Mio. Her grandmother drew a regular pentagon. Drawing arcs from each corner across to the opposite side, she made a rounded pentagon with five arcs.", "A regular heptagon works too. Whenever the number of corners is odd, the same construction gives a shape of constant width. The British 50-pence coin is a rounded heptagon, just as wide in every direction, so vending machines can read it however it turns.", "\"So the secret of the round lid was: the same width in every direction.\" Mio remembered the first manhole cover she had seen.", "In the evening light, the thick-paper Reuleaux triangle lay quietly shining on the desk. Inside a shape that looked like a plain triangle, such a deep secret had been hiding all along."]}], "column": {"ja": ["ルーローの三角形の名前は、19世紀のドイツの技術者、フランツ・ルーロー（1829〜1905年）に由来します。ルーローは、機械の動きの仕組みを研究した人で、この形を機械の設計に役立てました。形そのものは、それよりずっと前、ルネサンスの画家レオナルド・ダ・ヴィンチも描いていたと言われます。", "この形の面白い応用に、「四角い穴をあけるドリル」があります。ルーローの三角形は、四角の中で回すと、その角が四角の四隅をなぞるように動きます。この性質を使ったドリルを、アメリカのワッツという人が1914年に特許を取りました。丸いドリルで四角い穴があくのですから、不思議ですね（角はほんの少し丸くなります）。", "また、このおはなしで出てきた「まわりの長さ」の秘密は、もっと一般的な決まりになっています。円でも、ルーローの三角形でも、どんな定幅図形でも、まわりの長さは「円周率π×幅」と等しくなります。これは19世紀に、フランスの数学者バルビエが証明した定理です。幅が同じなら、形がどうであっても、まわりの長さは同じなのです。", "身の回りにも定幅図形はあります。イギリスの50ペンス硬貨や20ペンス硬貨は丸みのある七角形で、自動販売機の中で向きが変わっても幅が変わらないよう工夫されています。アメリカのサンフランシスコでは、水道のバルブのふたにルーローの三角形の形のものが使われています。丸いふたの秘密は、街の中のあちこちに隠れているのですね。"], "en": ["The Reuleaux triangle is named after Franz Reuleaux (1829–1905), a German engineer of the 19th century. Reuleaux studied how machines move, and he put this shape to work in machine design. The shape itself is much older; the Renaissance artist Leonardo da Vinci is said to have drawn it long before.", "One delightful use of this shape is a drill that bores square holes. When a Reuleaux triangle turns inside a square, its corners trace their way around the square's four corners. In 1914, an American named Watts took out a patent for a drill that used this idea. A round-turning drill that makes a square hole — wonderful, isn't it? (The corners come out very slightly rounded.)", "The secret of the string measurement in this story is part of a more general rule. For a circle, for a Reuleaux triangle, for every shape of constant width, the distance around equals pi times the width. This was proved in the 19th century by the French mathematician Barbier. If the width is the same, the distance around is the same, whatever the shape.", "Constant-width shapes live all around us. The British 50-pence and 20-pence coins are rounded heptagons, designed so that their width never changes inside vending machines. In San Francisco, some water-valve covers are shaped like Reuleaux triangles. The secret of the round lid is hiding in many corners of our cities."]}, "quiz": {"ja": ["Q1　四角いふたが、穴に落ちてしまうことがあるのは、なぜですか。　答え：四角をななめにすると、一辺より長い対角線の向きにすきまができて、穴より細くなってしまうからです。", "Q2　ルーローの三角形は、どの向きではさんで測っても幅が同じになるのは、なぜですか。　答え：3つの弧が、それぞれ向かい側の頂点を中心にして、正三角形の一辺の長さを半径として描かれているので、どの方向でも幅が一辺の長さに等しくなるからです。", "Q3　幅が6cmのルーローの三角形のまわりの長さは、直径6cmの円のまわりの長さと比べて、どうですか。　答え：同じです。定幅図形のまわりの長さは、いつも円周率π×幅（この場合は約18.8cm）になります。"], "en": ["Q1 Why can a square lid sometimes fall into its hole?　Answer: Because when a square turns diagonally, a gap opens along its longer diagonal, and it becomes narrower than the hole.", "Q2 Why does a Reuleaux triangle measure the same width, whichever way you hold and measure it?　Answer: Because each of its three arcs is drawn around the opposite corner, with the side of the equilateral triangle as its radius, so in every direction the width equals the side.", "Q3 How does the distance around a Reuleaux triangle 6 cm wide compare with the distance around a circle 6 cm across?　Answer: They are the same. The distance around any constant-width shape is always pi times its width (here, about 18.8 cm)."]}, "corner": {"ja": ["コンパスと定規を用意しましょう。まず、半径6cmの円を描き、コンパスで円のまわりを6つに区切って、正三角形の頂点になる3つの点を取ります。その3点を結ぶと、一辺が6cmの正三角形ができます。", "次に、1つの頂点にコンパスの針を置き、半径6cmのまま、ほかの2つの頂点を結ぶ弧を描きます。これを3つの頂点すべてで行うと、3つの弧に囲まれたルーローの三角形の完成です。", "できたら、幅を確かめてみましょう。2本の定規や2冊の本でルーローの三角形をはさみ、向きを変えながら何回も測ってください。いつ測っても6cmになれば大成功です。", "厚紙に写して切り取り、上に平らな板を載せて転がす実験もおすすめです。板の高さが変わらないことを確かめてください。また、まわりの長さを糸で測り、直径6cmの円のまわりの長さ（約18.8cm）と比べてみましょう。ぴったり重なれば、定幅図形の不思議が実感できますよ。"], "en": ["You will need a compass and a ruler. First, draw a circle with radius 6 cm, and use the compass to mark six equal points around it. Join every second point, and you will have an equilateral triangle with sides of 6 cm.", "Next, put the compass point on one corner, keep the radius at 6 cm, and draw the arc joining the other two corners. Do this from all three corners, and your Reuleaux triangle, fenced in by three arcs, is complete.", "Now test its width. Hold the Reuleaux triangle between two rulers or two books, and measure it again and again, turning it a little each time. If it measures 6 cm every time, you have succeeded.", "You can also copy it onto thick paper, cut it out, lay a flat board on top, and roll it, to check that the height of the board never changes. And measure the distance around it with a string, and compare it with the distance around a circle 6 cm across (about 18.8 cm). If they match, you have felt the wonder of constant-width shapes for yourself."]}}, {"id": "penrose", "title": {"ja": "くり返さない模様 ― ペンローズ・タイリングのおはなし", "en": "The Pattern That Never Repeats ― The Story of Penrose Tiling"}, "sub": {"ja": "小学校高学年〜中学生向け・2種類のタイルが作る無限の模様", "en": "For upper elementary to middle school — an endless pattern made from only two kinds of tiles"}, "cover": "pen1.jpg", "images": ["pen1.jpg", "pen2.jpg", "pen3.jpg", "pen4.jpg", "pen5.jpg", "pen5.jpg"], "pages": [{"ja": ["おばあちゃんの家の玄関には、正方形のタイルがきれいに並んでいます。ある日、ミオはタイルを指でたどりながら、ふと思いました。「この模様、どこも同じだね。」", "ためしに、タイル4枚分の模様を紙に写して、床の別の場所に重ねてみると、ぴったり重なります。1マスずらせば、どこでも同じ。床も、壁紙も、お風呂のタイルも、世の中の模様は「くり返し」でできていることが多いのです。", "「じゃあ、決してくり返さない模様は、作れないのかな。」ミオがつぶやくと、おばあちゃんがにやりとしました。", "「作れるんだよ。しかも、使うタイルはたった2種類だけ。今日は、その不思議な敷きつめで遊んでみよう。」"], "en": ["The floor inside the front door of Grandma's house is covered with neat square tiles. One day, tracing the tiles with her finger, Mio had a thought. \"This pattern is the same everywhere, isn't it?\"", "She copied a patch of four tiles onto paper and held it over other parts of the floor — it matched perfectly. Shift by one tile, and it is the same anywhere. Floors, wallpaper, bath tiles: most patterns in our world are made of repeats.", "\"Then could nobody make a pattern that never repeats?\" murmured Mio. Her grandmother grinned.", "\"Somebody could. And what's more, it uses only two kinds of tiles. Today, let's play with that curious tiling.\""]}, {"ja": ["おばあちゃんが持ってきたのは、色紙で作ったたくさんのタイルでした。形は2種類だけです。1つは、凧（たこ）のような四角形。もう1つは、矢じりのように1か所がへこんだ四角形です。", "「名前も、そのまんま『凧』と『矢』と言うんだよ。」タイルには、色の弧の印が描いてあります。「並べるときの約束は1つだけ。この印が、隣のタイルと続くように置くこと。」", "ミオは約束を守りながら、机の上でタイルを並べ始めました。凧と矢は、思ったよりすんなりと組み合わさり、すきまなく並んでいきます。", "「あ、ここ、花みたいな形になってきた。」並べるほどに、思いがけない模様が次々と現れてきました。"], "en": ["Her grandmother brought out many tiles made of colored paper. There were only two shapes. One was a four-sided shape like a kite. The other was a four-sided shape with one corner pushed in, like an arrowhead.", "\"Their names are just what they look like: the Kite and the Dart.\" Each tile had a colored arc drawn on it as a mark. \"There is only one rule for laying them: the marks must continue from each tile to the next.\"", "Keeping the rule, Mio began to lay the tiles on the table. Kites and darts fitted together more smoothly than she expected, covering the space with no gaps.", "\"Oh — here, it's making a shape like a flower!\" The more she laid, the more unexpected patterns appeared, one after another."]}, {"ja": ["タイルは大きな紙の上いっぱいに広がりました。出てくる模様は、場所ごとに少しずつ違います。ミオは「くり返し探し」を始めました。「同じ並びが、どこかにあるはず。」", "けれども、探しても、探しても、同じ並びは見つかりません。写し取った模様をずらして重ねようとしても、どこかで必ずずれてしまいます。", "「この敷きつめはね、どこまで広げても、すきまなく敷きつめられるのに、模様全体がくり返すことは決してないんだ。」おばあちゃんが言いました。", "「ええっ、すきまだらけじゃないのに、くり返さないの。」ミオは目を丸くしました。これが「ペンローズ・タイリング」と呼ばれる、不思議な敷きつめなのです。"], "en": ["The tiles spread over a whole big sheet of paper. The pattern was a little different from place to place. Mio began a \"hunt for the repeat.\" \"The same arrangement must be hiding somewhere.\"", "But however long she searched, she could not find the same arrangement anywhere. She copied a patch and tried to lay it over other places, shifting it this way and that — it always failed to match.", "\"This tiling,\" said her grandmother, \"can cover the plane forever with no gaps, and yet the whole pattern never, ever repeats.\"", "\"What? No gaps anywhere, and still no repeats?\" Mio's eyes went round. This was the curious tiling called Penrose tiling."]}, {"ja": ["くり返さないのに、この模様はバラバラではありません。よく見ると、あちこちに5つのとがりを持つ星の形や、花のような形が、きちんと整って現れています。", "「秩序はある。でも、くり返しはない。それがこの模様の不思議なところだね。」おばあちゃんが言いました。", "ミオが凧と矢の数を数えてみると、不思議なことに気づきました。広い範囲で比べると、凧と矢の数の割合は、いつも同じ数（約1.618）に近づいていくのです。この数は「黄金数」と呼ばれ、美しい形に現れる数として知られています。", "「タイルを並べただけなのに、数まで決まっているなんて。」ミオは、敷きつめたタイルを、改めて眺め直しました。"], "en": ["And yet, for all its never repeating, the pattern is not a jumble. Look carefully, and here and there you find neat stars with five points, and flower-like shapes, arranged in perfect order.", "\"There is order, but no repetition. That is the wonder of this pattern,\" said her grandmother.", "Mio counted the kites and the darts, and noticed something strange. Over a wide area, the ratio of kites to darts always came close to one special number, about 1.618. This is the golden number, known for appearing in beautiful shapes.", "\"Just by laying tiles, even the numbers are decided.\" Mio looked at her tiled sheet with new eyes."]}, {"ja": ["「この敷きつめを考えたのは、イギリスのロジャー・ペンローズという学者だよ。」おばあちゃんが言いました。「1970年代のことだ。」", "ペンローズは、宇宙や時間の研究で知られる物理学者であり、数学者でもあります。たった2種類のタイルで、くり返さない模様が無限に広がることを見つけ、世界中の人を驚かせました。", "この模様は、数学の世界の外にも広がりました。イギリスのオックスフォード大学の数学研究所の建物の前には、ペンローズ・タイリングの模様で舗装された広場があります。", "「数学の遊びが、本物の街の床になるなんて、すてきだね。」ミオは、自分たちの敷きつめた大きな紙を、誇らしげに眺めました。"], "en": ["\"The man who invented this tiling was a British scholar named Roger Penrose,\" said her grandmother. \"It was in the 1970s.\"", "Penrose is a physicist, famous for studying the universe and time, and a mathematician too. He found that with only two kinds of tiles, a pattern that never repeats could spread out forever, and he amazed people all over the world.", "The pattern spread beyond the world of mathematics as well. In front of the Mathematics Institute at Oxford University in England, there is a plaza paved with a Penrose tiling pattern.", "\"A game from mathematics became the floor of a real city. Isn't that lovely?\" Mio looked proudly at the great sheet they had tiled together."]}, {"ja": ["「ところがね、ミオ。もっと驚く話があるんだよ。」おばあちゃんが声をひそめました。", "1982年、シェヒトマンという科学者が、金属のかけらを調べていて、「くり返さないのに、整った並び」を原子の世界に見つけました。結晶の中の原子はくり返す並びだと、みんなが信じていた時代のことです。", "最初は、多くの科学者が信じてくれませんでした。しかし調べが進むうちに、その並びは本物だと分かり、シェヒトマンは2011年にノーベル化学賞を受けました。", "紙の上の模様の不思議が、金属の中の本物の世界とつながっていたのです。夕方の光の中で、敷きつめたタイルの星たちが、小さくきらめいて見えました。"], "en": ["\"And now, Mio, comes the most surprising part of all.\" Her grandmother lowered her voice.", "In 1982, a scientist named Shechtman, studying tiny pieces of metal, found \"an orderly arrangement that never repeats\" in the world of atoms. In those days, everyone believed that the atoms inside a crystal always arranged themselves in repeating rows.", "At first, many scientists would not believe him. But as the studies went on, the arrangement proved to be real, and in 2011 Shechtman received the Nobel Prize in Chemistry.", "The wonder of a pattern on paper was connected to something real inside metal. In the evening light, the little stars in the tiled sheet seemed to twinkle."]}], "column": {"ja": ["ペンローズ・タイリングは、イギリスの数理物理学者ロジャー・ペンローズが1974年に発表した、2種類のタイルによる敷きつめです。タイルには「印を合わせる」という約束があり、それを守って並べると、すきまなく敷きつめられるのに、全体が決してくり返さない模様になります。このような性質は「非周期」と呼ばれます。1977年には、アメリカの雑誌『サイエンティフィック・アメリカン』の表紙を飾り、世界中の人々に知られるようになりました。", "ペンローズ自身は、のちにブラックホールの研究でノーベル物理学賞（2020年）も受けています。タイリングは、彼のもっと若い頃の「数学の遊び」から生まれたものでした。", "物語は思わぬところで続きます。1982年、イスラエルの科学者ダン・シェヒトマンが、アルミニウムとマンガンの合金を電子顕微鏡で調べ、結晶ではありえないはずの「5つの方向に整った、くり返さない原子の並び」を見つけました。長年、「結晶とは、くり返す並びのこと」と決まっていたため、シェヒトマンの発見は大論争を巻き起こしました。しかし、やがてその並びは「準結晶」という名前で認められ、シェヒトマンは2011年にノーベル化学賞を受賞しました。", "準結晶の原子の並びには、ペンローズ・タイリングと同じ数学が現れます。紙の上で生まれた「くり返さない模様」が、物質の世界にも実在したのです。ペンローズ・タイリングの模様は、オックスフォード大学の数学研究所の前の広場の舗装にも使われています。数学の模様が、街と、金属と、そして宇宙の研究と、静かにつながっているのですね。"], "en": ["Penrose tiling is a tiling with two kinds of tiles, published in 1974 by the British mathematical physicist Roger Penrose. The tiles carry marks that must match, and as long as you keep that rule, the tiles cover the plane with no gaps, yet the whole never repeats. Such a property is called aperiodic. In 1977, the tiling appeared on the cover of the American magazine Scientific American, and became known to people all over the world.", "Penrose himself later received the Nobel Prize in Physics (in 2020) for his work on black holes. The tiling was born from a \"mathematical game\" of his younger days.", "The story continues in an unexpected place. In 1982, the Israeli scientist Dan Shechtman examined an alloy of aluminum and manganese under an electron microscope, and found an arrangement of atoms that was orderly in five directions and never repeated — something a crystal was not supposed to have. For many years, \"crystal\" had been defined as a repeating arrangement, so Shechtman's discovery caused a great argument. But in time the arrangement was accepted under the name quasicrystal, and in 2011 Shechtman received the Nobel Prize in Chemistry.", "The same mathematics as Penrose tiling appears in the atomic arrangement of quasicrystals. A \"pattern that never repeats,\" born on paper, truly exists in the world of matter. And a Penrose pattern paves the plaza in front of the Mathematics Institute at Oxford University. Mathematical patterns are quietly connected to our cities, to metals, and even to the study of the universe."]}, "quiz": {"ja": ["Q1　ペンローズ・タイリングで使うタイルは、何種類で、何と何ですか。　答え：2種類で、「凧」と「矢」です。", "Q2　ペンローズ・タイリングの「くり返さない」とは、どういうことですか。　答え：すきまなく敷きつめられるのに、模様全体をずらして自分自身にぴったり重ねることができず、同じ模様が周期的にくり返さないことです。", "Q3　シェヒトマンが1982年に見つけたものは、何ですか。　答え：金属（合金）の中の、くり返さないのに整った原子の並び（準結晶）です。この発見で、2011年にノーベル化学賞を受けました。"], "en": ["Q1 How many kinds of tiles does Penrose tiling use, and what are they called?　Answer: Two kinds: the Kite and the Dart.", "Q2 What does it mean that Penrose tiling \"never repeats\"?　Answer: The tiles cover the plane with no gaps, yet the whole pattern can never be shifted to match itself exactly — the same pattern never comes back in a regular cycle.", "Q3 What did Shechtman discover in 1982?　Answer: An orderly arrangement of atoms that never repeats, inside a metal alloy — a quasicrystal. For this discovery he received the Nobel Prize in Chemistry in 2011."]}, "corner": {"ja": ["ペンローズ・タイリングに現れる星の模様の秘密は、五角形と星形に隠れています。まず、コンパスで円を描き、分度器で72度ずつ印をつけて、円のまわりに5つの点を取ってください。その5つの点を一筆で結ぶと、星形が描けます。", "星形の線が作る小さな形を、よく見てください。凧のような形と、矢のような形が隠れているはずです。見つけたら、凧は赤、矢は青というように、色を塗り分けてみましょう。", "次に挑戦したい人は、凧と矢のタイルを厚紙でたくさん作ってみてください。おはなしの絵を参考に形を写して切り取り、弧の印を合わせる約束を守りながら並べていきます。", "どこまで広げても、同じ模様はくり返しません。友だちや家族と協力して、できるだけ大きな1枚に挑戦してみましょう。星の模様がいくつ現れるか数えるのも楽しいですよ。"], "en": ["The secret of the star patterns in Penrose tiling hides in pentagons and star shapes. First, draw a circle with a compass, and use a protractor to mark five points around it, 72 degrees apart. Join the five points in one stroke, and you will draw a star.", "Now look carefully at the small shapes the star's lines make. Shapes like the Kite, and shapes like the Dart, are hiding there. When you find them, color them in — kites in red, darts in blue, for example.", "If you want a bigger challenge, make many Kite and Dart tiles out of thick paper. Copy the shapes from the pictures in this story, cut them out, and lay them down while keeping the rule that the arc marks must match.", "However far you spread them, the same pattern will never repeat. Try making the biggest sheet you can, together with friends or family. Counting how many star patterns appear is fun, too."]}}, {"id": "sakaya", "title": {"ja": "さかやさんのふしぎなます ― かたむけてはかる おはなし", "en": "The Sake Seller's Wonderful Measure ― The Story of Measuring by Tilting"}, "sub": {"ja": "小学校中学年〜高学年向け・目盛りのない升で量る知恵と体積のおはなし", "en": "For elementary school, middle to upper grades — the wisdom of measuring with an unmarked box, and the mathematics of volume"}, "cover": "sak1.jpg", "images": ["sak1.jpg", "sak2.jpg", "sak3.jpg", "sak4.jpg", "sak5.jpg", "sak5.jpg"], "pages": [{"ja": ["おばあちゃんの家の台所の棚に、古い木の箱が置いてありました。四角くて、深さのある、しっかりした箱です。「それは『升（ます）』だよ。」おばあちゃんが言いました。「昔は、これでお米やお酒を量ったんだ。」", "ミオが中をのぞくと、目盛りはどこにもありません。「目盛りがないのに、どうやって量るの。」", "「いい質問だね。」おばあちゃんは目を細めました。「むかしむかし、ある町に、この目盛りのない六合升（ろくごうます）ひとつで、1合から6合まで、なんでもぴったり量ってしまう酒屋さんがいたんだよ。」", "「六合升というのは、いっぱいに入れると6合入る升のことだね。さて、その酒屋さんの知恵を聞いてごらん。」"], "en": ["On a shelf in Grandma's kitchen sat an old wooden box. It was square, deep, and sturdily made. \"That is a masu, a measuring box,\" said her grandmother. \"Long ago, people measured rice and sake with it.\"", "Mio peeped inside, but there were no markings anywhere. \"If there are no markings, how can it measure anything?\"", "\"A good question.\" Her grandmother's eyes twinkled. \"Once upon a time, in a certain town, there was a sake seller who could measure every amount from one gō to six gō, perfectly, with a single unmarked six-gō masu.\"", "\"A six-gō masu holds six gō when it is full. Now, listen to the story of his wisdom.\""]}, {"ja": ["むかしむかし、ある町に小さな酒屋さんがありました。店主は、明るくて働き者のおじさんです。店の升は、目盛りのない六合升がひとつだけでした。", "お客さんが来て「3合ください」と言えば3合を、「5合ください」と言えば5合を、店主はぴったり量って渡します。「1合だけ」という日も、「4合」という日も、量が狂うことは決してありませんでした。", "「升には目盛りがないのに、なぜ分かるんだろう。」町の人たちは不思議がりました。店主に聞いても、店主はにっこり笑うだけです。", "その秘密は、「傾け方」にありました。店主は、升を傾けたときに中に残るお酒の「形」に注目していたのです。"], "en": ["Once upon a time, in a certain town, there was a small sake shop. The keeper was a cheerful, hard-working man. His shop had just one measure: an unmarked six-gō masu.", "When a customer said \"Three gō, please,\" he measured three. When they said \"Five gō, please,\" he measured five. Whether it was one gō or four gō, his measures were never wrong.", "\"There are no markings on the masu, so how does he know?\" The townspeople wondered. When they asked him, the keeper only smiled.", "His secret was in the way he tilted. The keeper paid attention to the shape of the sake left inside the tilted masu."]}, {"ja": ["まず「3合ください」のときです。店主は、6合をいっぱいに入れた升を、そっと斜めに傾けます。お酒の水面が、升の向かい合う辺と底の辺を結ぶまで傾けると、中のお酒は三角柱の形になりました。", "三角柱は、もとの立方体のちょうど半分です。「6合の半分で、3合。」これが、目盛りのない量り方の第一歩でした。", "次は「1合ください」です。店主は今度は、升の角を下にして傾け、お酒が角に集まって三角錐（さんかくすい）の形になるまで、ゆっくり注ぎ出しました。", "「三角錐は、三角柱の3分の1の体積なんだ。」3合の3分の1で、1合です。立方体全体から見ると、三角錐は6分の1。だから6合の6分の1で、ちょうど1合になるのです。"], "en": ["First, when someone asked for three gō. The keeper filled the masu with six gō and tilted it gently. When the surface of the sake joined two opposite edges of the box, the sake inside formed a triangular prism.", "A triangular prism is exactly half of the cube. \"Half of six gō is three gō.\" This was the first step of measuring without markings.", "Next, when someone asked for one gō. This time the keeper tilted the masu onto its corner, and poured slowly until the sake gathered in the corner in the shape of a triangular pyramid.", "\"A triangular pyramid has one third the volume of the prism.\" One third of three gō is one gō. Seen from the whole cube, the pyramid is one sixth of it, so it holds exactly one sixth of six gō — one gō."]}, {"ja": ["「5合ください」のときは、引き算の知恵です。店主は六合升をいっぱいにしてから、お客さんの器に注ぎます。升の中に三角錐の形で1合だけが残るまで注ぐと、器に入ったのは「6合−1合＝5合」です。", "「2合ください」も同じ考え方です。まず三角柱で3合を升の中に作り、そこから1合だけが残るまで器に注ぎます。器に入ったのは「3合−1合＝2合」です。", "残った形を見ることで、注いだ量が分かる。引き算が、そのまま量り方になっていたのです。", "「すごい。目盛りの代わりに、形と計算を使っているんだね。」町の人たちは感心しました。"], "en": ["When someone asked for five gō, he used the wisdom of subtraction. He filled the masu, then poured into the customer's vessel. He poured until only one gō, in the shape of the corner pyramid, was left inside — so the vessel had received \"six gō minus one gō, five gō.\"", "Two gō worked the same way. First he made three gō as a prism inside the masu, then poured into the vessel until only one gō remained. The vessel had received \"three gō minus one gō, two gō.\"", "By watching the shape that remained, he knew the amount he had poured. Subtraction itself became his measuring tool.", "\"Wonderful. Instead of markings, he uses shapes and arithmetic.\" The townspeople were full of admiration."]}, {"ja": ["いちばん手間がかかるのは「4合ください」です。店主は、まず六合升いっぱいのお酒を器に注ぎ、升の中に三角柱の3合が残るようにします。ここまでで、器には3合が入りました。", "次に店主は、升に残ったお酒を樽に戻します。角の三角錐で1合だけが残るまで戻すと、その1合を器に加えます。「3合＋1合＝4合」です。", "二つの量り方を組み合わせる足し算で、4合もぴったり量れました。これで、1合、2合、3合、4合、5合、6合と、全部の量が量れるようになったのです。", "「升はひとつで十分さ。」店主は笑いました。知恵と数学があれば、道具はひとつで足りるのでした。"], "en": ["The most troublesome order was four gō. First, the keeper poured from the full masu into the vessel, until three gō, in the shape of a prism, remained in the masu. Now the vessel held three gō.", "Next, he poured the remaining sake in the masu back into the barrel, until only one gō, in the shape of the corner pyramid, was left. That one gō he added to the vessel. \"Three gō plus one gō makes four gō.\"", "By adding two measuring methods together, four gō could be measured exactly. And now he could measure every amount: one, two, three, four, five, and six gō.", "\"One masu is quite enough.\" The keeper laughed. With wisdom and mathematics, a single tool is all you need."]}, {"ja": ["お話を聞き終えて、ミオは升を手に取り、そっと傾けてみま
