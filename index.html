した。「形で量るなんて、まるで魔法みたい。」", "「魔法じゃなくて、数学だよ。」おばあちゃんが言いました。「立方体を半分に分ける三角柱と、その3分の1になる三角錐。この体積の決まりが、目盛りの代わりをしていたんだ。」", "三角柱が立方体の半分になること、三角錐が同じ底と高さの柱の3分の1になることは、学校の算数や数学でも習う、大事な体積の決まりです。酒屋さんは、それを仕事の中で使いこなしていたのでした。", "夕方の光の中で、古い升が静かに光っていました。目盛りのない箱の中に、こんなに深い知恵と数学が隠れていたのです。"], "en": ["When the story was over, Mio picked up the masu and tilted it gently herself. \"Measuring with shapes — it seems almost like magic.\"", "\"It isn't magic, Mio. It's mathematics,\" said her grandmother. \"The triangular prism that halves the cube, and the pyramid that is one third of the prism — these rules of volume did the work of the markings.\"", "That a triangular prism is half of a box, and that a pyramid is one third of a pillar with the same base and height, are important rules of volume that you will meet again in school mathematics. The sake seller was using them every day in his work.", "In the evening light, the old masu lay quietly shining. Inside an unmarked box, such deep wisdom and mathematics had been hiding all along."]}], "column": {"ja": ["このおはなしの量り方の考え方は、数学者の秋山仁さんが紹介した「酒屋さんの知恵」（NHKテキスト『3か月でマスターする数学』2024年7-9月号）をもとにしています。文章と絵は、この絵本のために新しく作りました。秋山仁さんは、楽しみながら学ぶ数学を、長年にわたって多くの人に伝えてきた方です。", "升は、日本で昔から使われてきた、量をはかる木の箱です。お米やお酒、油などを量るのに使われ、1升は10合と決まっていました。江戸時代には、年貢のお米を量る大切な道具だったため、升の大きさは厳しく決められていました。今でも、一升瓶や、神社のお神酒、豆まきの升などに、その姿が残っています。", "この知恵の土台にあるのは、体積の決まりです。直方体を斜めに分けた三角柱は、もとの体積の半分。そして三角錐（や三角柱をさらに分けた角の三角錐）は、同じ底面と高さを持つ柱の体積の3分の1になります。「柱の体積の3分の1」という決まりは、中学校の数学で習う錐体の公式につながっています。", "目盛りがなくても、形と計算で量ることができる。酒屋さんの知恵は、数学が暮らしの中で生きていることを教えてくれる、すてきな例なのです。"], "en": ["The measuring idea in this story is based on \"The Sake Seller's Wisdom,\" introduced by the mathematician Jin Akiyama (NHK Text, Mastering Mathematics in Three Months, July–September 2024). The words and pictures of this picture book were made newly for this book. Professor Akiyama has spent many years sharing the joy of mathematics with a wide audience.", "The masu is a wooden measuring box used in Japan since long ago. It measured rice, sake, oil, and more, and one shō was fixed at ten gō. In the Edo period it was an important tool for measuring the rice paid as tax, so the size of the masu was strictly controlled. You can still see it today in the big bottles of sake called isshōbin, in shrine offerings, and in the masu used for scattering beans at setsubun.", "Underneath this wisdom lie the rules of volume. A triangular prism, cut diagonally from a box, has half of the box's volume. And a pyramid has one third of the volume of a pillar with the same base and the same height. This \"one third\" rule leads on to the formula for cones and pyramids that you will learn in junior-high mathematics.", "Even without markings, shapes and arithmetic can measure. The sake seller's wisdom is a lovely example of mathematics alive in everyday life."]}, "quiz": {"ja": ["Q1　六合升いっぱいのお酒を傾けて、三角柱の形にすると、何合になりますか。　答え：3合です。三角柱は立方体の半分なので、6合の半分で3合になります。", "Q2　角の三角錐は、六合升全体の何分の1ですか。また、それは何合ですか。　答え：6分の1で、1合です。三角錐は三角柱（半分）の3分の1なので、2分の1×3分の1＝6分の1になります。", "Q3　4合を量るには、どうしますか。　答え：まず3合を量ってお客さんの器に入れ、次に1合を量って加えます（3合＋1合＝4合）。"], "en": ["Q1 If you tilt a full six-gō masu so that the sake forms a triangular prism, how many gō is that?　Answer: Three gō. The prism is half of the cube, and half of six gō is three gō.", "Q2 What fraction of the whole six-gō masu is the corner pyramid, and how many gō is it?　Answer: One sixth, which is one gō. The pyramid is one third of the prism (one half), and one half times one third is one sixth.", "Q3 How do you measure four gō?　Answer: First measure out three gō into the customer's vessel, then measure one more gō and add it (three gō plus one gō makes four gō)."]}, "corner": {"ja": ["透明な四角い容器（立方体に近い形のタッパーや、口の広い四角い容器）を用意して、水で実験してみましょう。台所で、こぼさないように気をつけてください。まず容器に水をいっぱいに入れ、その量を計量カップで測っておきます。", "次に、容器をそっと斜めに傾け、水面が向かい合う辺を結ぶところまで水を捨てます。残った水は三角柱で、全体の半分になっているはずです。計量カップで確かめてみましょう。", "今度は、容器の角を下にして傾け、水面が3つの角を通るまで水を捨てます。残った水は角の三角錐で、全体の6分の1です。これを繰り返して、三角錐の形の水が何回で容器いっぱい分になるか数えると、6回になるはずです。", "最後に、酒屋さんの知恵で「6分の5」や「6分の2（3分の1）」の量を作ってみましょう。引き算と足し算の組み合わせを、自分の手で確かめることができますよ。"], "en": ["Find a clear, square container (a box-shaped tub with a wide mouth will do), and experiment with water in the kitchen, taking care not to spill. First, fill the container to the brim, and measure that amount with a measuring cup.", "Next, tilt the container gently and pour water out until the surface joins two opposite edges. The water left behind is a triangular prism, and it should be half of the whole. Check it with the measuring cup.", "Now tilt the container onto its corner, and pour until the surface passes through three corners. The water left behind is the corner pyramid, one sixth of the whole. Repeat this, and count how many pyramid-fulls make one whole container — it should be six.", "Finally, try using the sake seller's wisdom to make five sixths, and two sixths (one third), of the container. With subtraction and addition, you can test his methods with your own hands."]}}, {"id": "archimedes", "title": {"ja": "王冠を水に沈めて ― アルキメデスと体積のおはなし", "en": "Dipping the Crown in Water ― Archimedes and the Story of Volume"}, "sub": {"ja": "小学校中学年〜中学生向け・あふれた水で体積をはかる知恵のおはなし", "en": "For elementary school, middle grades to junior high — the wisdom of measuring volume with overflowed water"}, "cover": "arc1.jpg", "images": ["arc1.jpg", "arc2.jpg", "arc3.jpg", "arc4.jpg", "arc5.jpg", "arc5.jpg"], "pages": [{"ja": ["第38話の酒屋さんの話を聞いてから、ミオは「はかる」ことに興味を持ちました。ある日、庭でごつごつした石ころを拾って、おばあちゃんに聞きました。「この石の体積は、どうやってはかるの。升にも入らないし、定規でもはかれないよ。」", "たしかに、石には縦も横も高さもありません。立方体の箱なら計算できますが、形の決まっていないものの体積は、そのままでは分かりません。", "「そういうときの方法を、2200年以上も前に見つけた人がいるんだよ。」おばあちゃんが言いました。「古代ギリシャの、大数学者アルキメデスだ。」", "「きっかけは、金の王冠のなぞだった。さあ、シラクサという海辺の町へ行ってみよう。」"], "en": ["After hearing the tale of the sake seller in Episode 38, Mio became interested in measuring. One day, picking up a rough stone in the garden, she asked, \"How do you measure the volume of this stone? It won't fit in a masu, and a ruler can't measure it.\"", "True, a stone has no length, width, or height. A box shape can be calculated, but the volume of an irregular object cannot be found directly.", "\"Someone found a way to do that, more than 2,200 years ago,\" said her grandmother. \"Archimedes, the great mathematician of ancient Greece.\"", "\"It all began with the puzzle of a golden crown. Come, let's visit the seaside town of Syracuse.\""]}, {"ja": ["むかしむかし、地中海のシラクサという町に、ヒエロン2世という王様がいました。王様は、神様に捧げる金の冠を作らせることにしました。金細工師に、材料の純金を渡して、です。", "でき上がった冠は見事なものでした。ところが、こんな噂が流れたのです。「金細工師は、金の一部を盗んで、安い銀を混ぜたのではないか。」", "重さは、渡した金とぴったり同じです。でも、銀が混ざっていても、重さをごまかすことはできます。冠を壊して調べるわけにはいきません。", "困った王様は、町一番の学者アルキメデスを呼んで言いました。「冠を傷つけずに、銀が混ざっているかどうか、調べてほしい。」アルキメデスは、深く考え込みました。"], "en": ["Once upon a time, in the city of Syracuse by the Mediterranean Sea, there lived a king called Hiero II. The king decided to have a golden crown made as an offering to the gods, and he gave the goldsmith the pure gold for it.", "The finished crown was magnificent. But then a rumor spread. \"Perhaps the goldsmith stole some of the gold, and mixed in cheaper silver instead.\"", "The weight was exactly the same as the gold he had been given. Yet even with silver mixed in, the weight could be made to match. And the crown could not be broken open to check.", "The troubled king called Archimedes, the finest scholar in the city, and said, \"Find out whether silver is mixed in, without damaging the crown.\" Archimedes fell into deep thought."]}, {"ja": ["何日考えても、答えは出ませんでした。ある日、アルキメデスが湯船につかると、縁から水がざあっとあふれました。自分の体が入った分だけ、水が押し出されたのです。", "「そうか。水に沈んだものは、自分の体積とちょうど同じ量の水を押しのけるんだ。」アルキメデスは、思わず叫んだと言われます。「ユリイカ！（分かったぞ！）」", "言い伝えでは、アルキメデスはうれしさのあまり、裸のまま道へ飛び出して走ったのだそうです。本当かどうかは分かりませんが、それほど大きな発見だったのでしょう。", "形が決まっていなくても、水に沈めれば体積が分かる。王冠のなぞを解く鍵が、ついに見つかりました。"], "en": ["He thought for days, but no answer came. Then one day, as Archimedes lowered himself into a bath, water sloshed over the rim. His own body had pushed out exactly that much water.", "\"Of course! A thing sunk in water pushes aside exactly its own volume of water.\" Archimedes, so the story goes, cried out, \"Eureka! (I have found it!)\"", "Legend says he was so delighted that he ran out into the street naked. Whether that part is true, nobody knows — but it must have felt like a tremendous discovery.", "Even an object with no regular shape reveals its volume when you sink it in water. The key to the crown's puzzle had been found at last."]}, {"ja": ["アルキメデスは、まず大きな器に、水を縁までいっぱいに入れました。そして王冠を、そっと水の中に沈めました。", "あふれ出た水を集めて量ると、それがちょうど王冠の体積です。水は、王冠に押しのけられた分だけあふれるからです。", "次に、王冠とまったく同じ重さの、純金の塊を用意しました。それも同じように水に沈めて、あふれた水を量りました。", "「同じ重さなら、あふれる水も同じはずだ。もし違っていたら、その違いが答えになる。」見守る人々も、息をのんで見つめていました。"], "en": ["First, Archimedes filled a large vessel with water, right up to the brim. Then he gently lowered the crown into the water.", "He collected the water that overflowed and measured it — and that was exactly the volume of the crown. The water overflows by just the amount the crown pushes aside.", "Next, he prepared a lump of pure gold with exactly the same weight as the crown. He sank that in the same way, and measured the overflow.", "\"If the weights are the same, the overflow should be the same too. If it differs, that difference will give us the answer.\" The watching people held their breath."]}, {"ja": ["比べてみると、違いははっきりしていました。王冠を沈めたときの方が、あふれた水が多かったのです。", "同じ重さなのに、王冠の方が体積が大きかった。つまり王冠の中には、金より軽い金属、銀が混ざっていたのです。同じ重さで体積が大きいということは、中身がすかすかだという証拠でした。", "こうしてアルキメデスは、王冠を少しも傷つけずに、銀が混ざっていることを確かめたと言われます。金細工師のごまかしは、水に暴かれたのでした。", "「すごい。壊さないで、中身まで分かっちゃうんだ。」ミオは目を輝かせました。"], "en": ["When he compared them, the difference was clear. The crown made more water overflow.", "The crown had the same weight, but a larger volume. That meant a metal lighter than gold — silver — was mixed inside it. Same weight but bigger volume meant its contents were less dense, more hollow.", "And so, it is said, Archimedes proved that silver was mixed into the crown, without damaging it at all. The goldsmith's trick was exposed by water.", "\"Amazing. He could see inside it, without breaking it.\" Mio's eyes shone."]}, {"ja": ["家に帰って、ミオはさっそく実験しました。計量カップに水を入れて目盛りを読み、庭の石ころをそっと沈めます。水位が上がった分が、石の体積です。", "「本当だ。形がどんなものでも、水が体積を教えてくれる。」ごつごつした石でも、丸い実でも、水に沈めれば、その体積が目盛りで読めました。", "おばあちゃんが言いました。「第38話の酒屋さんは、形の決まった箱を傾けて量った。アルキメデスは、形の決まっていないものを、水で量った。はかり方は、ひとつじゃないんだね。」", "水に沈めて体積をはかる方法は、今でも理科の実験で使われています。2200年前のお風呂のひらめきが、現代まで生きているのです。"], "en": ["Back home, Mio tried the experiment herself. She poured water into a measuring cup, read the mark, and gently sank her garden stone. The amount the water rose was the stone's volume.", "\"It's true! Whatever the shape, the water tells you the volume.\" Rough stones and round fruits alike — sink them, and their volume can be read on the scale.", "Her grandmother said, \"The sake seller of Episode 38 tilted a box of a fixed shape to measure. Archimedes measured things of no fixed shape, with water. There is more than one way to measure.\"", "Measuring volume by sinking things in water is still used in science classes today. A flash of insight in a bath, 2,200 years ago, is alive in our own time."]}], "column": {"ja": ["王冠とユリイカのお話は、実はアルキメデスの時代の記録には残っていません。この逸話が見られるのは、約200年後に書かれた、古代ローマの建築家ウィトルウィウスの『建築書』です。つまり、この物語は「伝説・伝承」として伝わったもので、本当に湯船で叫んだかどうかは、確かめようがないのです。", "アルキメデス（紀元前287年ごろ〜紀元前212年）は、シラクサに生まれた古代ギリシャの数学者・技術者です。円や球の面積・体積の研究で知られ、てこの原理の解明や、戦争の道具の発明の伝説も残っています。ローマ軍に町が攻められたとき、学問に没頭していて命を落としたという話も伝わります。", "後世には、この逸話の測り方に疑問を持つ人もいました。16世紀のガリレオ・ガリレイは若い頃、湯船のあふれ水で量る方法は誤差が大きいと考え、もっと精密に比べられる「小さな天秤」の仕組みを工夫した文章を残しています。伝説をきっかけに、測り方がさらに進歩したのですね。", "それでも、「水に沈めたものは、自分の体積と同じ量の水を押しのける」という考え方そのものは確かで、今も理科の基本として使われています。体積のはかり方をめぐる物語は、伝説と本当の数学が、仲良く手をつないだ例なのです。"], "en": ["The story of the crown and \"Eureka!\" does not survive in any record from Archimedes' own time. The tale appears in the book On Architecture by Vitruvius, a Roman architect, written about 200 years later. In other words, the story reached us as a legend, and whether Archimedes really shouted in the bath can never be verified.", "Archimedes (about 287–212 BCE) was a mathematician and engineer of ancient Greece, born in Syracuse. He is famous for his work on the areas and volumes of circles and spheres; legends also credit him with explaining the lever and inventing war machines. Another tale says he was killed, absorbed in his studies, when Roman soldiers took the city.", "Later, some people doubted the measuring method in the legend. As a young man in the 16th century, Galileo Galilei thought that measuring by bath overflow would be too rough, and he wrote about a finely balanced \"little balance\" that could compare the two far more precisely. The legend became a starting point for better measuring.", "Even so, the idea itself — that a thing sunk in water pushes aside exactly its own volume of water — is perfectly true, and is a basic tool of science today. The story of how to measure volume is a friendly meeting place of legend and real mathematics."]}, "quiz": {"ja": ["Q1　形の決まっていないものの体積は、どうやって量ることができますか。　答え：水に沈めて、あふれた水（押しのけた水）の量を量ります。その量が、そのものの体積と等しくなります。", "Q2　同じ重さの純金の塊と王冠を水に沈めたら、王冠の方があふれる水が多かったです。王冠について、何が分かりますか。　答え：王冠の方が体積が大きいことが分かります。同じ重さで体積が大きいので、金より軽い金属（銀）が混ぜられていると判断できます。", "Q3　王冠とユリイカのお話は、どこに書かれた話ですか。　答え：アルキメデスの時代から約200年後に書かれた、ウィトルウィウスの『建築書』です。伝説として伝わるお話で、本当にあったことかどうかは確かめられていません。"], "en": ["Q1 How can you measure the volume of an object with no regular shape?　Answer: Sink it in water and measure the water it overflows or pushes aside. That amount is equal to the object's volume.", "Q2 A lump of pure gold and the crown have exactly the same weight, but the crown makes more water overflow. What does that tell you about the crown?　Answer: The crown has a larger volume. With the same weight but a bigger volume, it must contain a metal lighter than gold — silver — mixed inside.", "Q3 In what book does the story of the crown and \"Eureka!\" appear?　Answer: In On Architecture by Vitruvius, written about 200 years after Archimedes' time. It is a story handed down as legend, and whether it truly happened cannot be verified."]}, "corner": {"ja": ["計量カップや、水位の目盛りが読める透明な容器を用意しましょう。まず水を入れて、目盛りを読んでおきます。次に、石ころやジャガイモなどのものを、そっと水に沈めます。水位が上がった分が、そのものの体積です。", "いくつか違うものを沈めて、体積の大きい順に並べてみましょう。見た目の大きさと、実際の体積の順番は、同じになりましたか。", "次に、同じ重さ比べをしてみましょう。粘土で、同じ重さの大きな球と小さな球（中を空洞にするなど）を作り、それぞれ水に沈めると、あふれる水や水位の上がり方がどう違うか確かめてください。王冠のなぞの実験を、自分の手で再現できます。", "最後に、王冠みたいに複雑な形のもの（おもちゃの冠や、でこぼこの置き物など）の体積も、同じ方法ではかってみましょう。升にも定規にも乗らない形でも、水が答えを教えてくれますよ。"], "en": ["You will need a measuring cup, or a clear container whose water level you can read. First pour in water and read the level. Then gently sink something — a stone, a potato — and read the new level. The rise in the water is the volume of the object.", "Sink several different things, and line them up in order of volume. Does the order by volume match the order by how big they look?", "Next, try the same-weight comparison. Make two balls of clay with exactly the same weight, one big and one small (you can make one hollow). Sink each and see how the overflow, or the rise in the water, differs. You can repeat the experiment of the crown with your own hands.", "Finally, try something with a complicated shape, like the crown — a toy crown, or a bumpy ornament. Neither a box measure nor a ruler can handle it, but the water will give you the answer."]}}, {"id": "induction", "title": {"ja": "ドミノがぜんぶ倒れるわけ ― 数学的帰納法のおはなし", "en": "Why All the Dominoes Fall ― The Story of Mathematical Induction"}, "sub": {"ja": "小学校高学年〜中学生向け・2つの約束で無限に届く証明のおはなし", "en": "For upper elementary to junior high — a proof that reaches to infinity with just two promises"}, "cover": "dom1.jpg", "images": ["dom1.jpg", "dom2.jpg", "dom3.jpg", "dom4.jpg", "dom5.jpg", "dom5.jpg"], "pages": [{"ja": ["ある雨の日、ミオはおばあちゃんの家でドミノ倒しに夢中になっていました。床の上に、長い列ができていきます。「あと少しで完成……。」", "ところが、最後のあたりで1枚が倒れ、途中まで倒れたところで止まってしまいました。「あーあ、ここだけ間が空きすぎてた。」", "悔しがるミオに、おばあちゃんが言いました。「ドミノが全部倒れるためには、大事なことが2つあるんだよ。それが分かると、100枚でも、1000枚でも、全部倒れるかどうかが、倒す前に分かるようになる。」", "「倒す前に分かるの。」ミオは新しいドミノを並べ直し始めました。「それって、数学の証明みたいだね。」"], "en": ["One rainy day, Mio was busy with a game of dominoes at her grandmother's house. A long line was growing across the floor. \"Just a little more…\"", "But near the end, one domino fell, and the wave stopped halfway along the line. \"Oh no — the gap was too wide, right there.\"", "Watching Mio's disappointment, her grandmother said, \"For every domino to fall, two important things must hold. Once you know them, you can tell in advance whether a hundred dominoes — or a thousand — will all fall.\"", "\"You can know before you tip them?\" Mio began to line the dominoes up again. \"That sounds just like a proof in mathematics.\""]}, {"ja": ["「約束の1つ目は、『最初の1枚が、ちゃんと倒れること』。」おばあちゃんは、列の先頭を指さしました。「誰かが倒してあげれば、列は始まる。」", "「2つ目は、『どのドミノも、倒れたら必ず次の1枚を倒すこと』。つまり、間隔がちょうどよく並んでいることだね。」", "さっき失敗したのは、2つ目の約束が、途中の1か所で破れていたからです。間が空きすぎた場所では、倒れたドミノが次に届かなかったのです。", "「この2つの約束さえ守られていれば、1枚目が2枚目を倒し、2枚目が3枚目を倒し……と、最後の1枚まで必ず全部倒れる。1枚ずつ確かめなくても、理屈で分かるんだ。」ミオはうなずきました。「これなら、1000枚あっても大丈夫だ。」"], "en": ["\"The first promise is: the first domino really falls,\" said her grandmother, pointing at the head of the line. \"Someone tips it, and the line begins.\"", "\"The second promise is: every domino, when it falls, always knocks down the next one. In other words, the gaps must be just right.\"", "The earlier failure happened because the second promise broke at one place. Where the gap was too wide, a falling domino could not reach the next.", "\"If these two promises hold, then the first knocks down the second, the second knocks down the third, and so on, surely, to the very last one. You don't have to check each domino — the reasoning tells you.\" Mio nodded. \"Then even a thousand would be all right.\""]}, {"ja": ["「実はこの考え方、数学の証明の世界で、大切な方法になっているんだよ。」おばあちゃんが言いました。「名前は『数学的帰納法（すうがくてききのうほう）』と言う。」", "数の決まりは、ドミノとそっくりです。まず「1のときに、その決まりが成り立つこと」を確かめます。これが、最初の1枚が倒れることに当たります。", "次に「ある数で成り立つなら、その次の数でも成り立つこと」を示します。これが、どのドミノも次を倒すことに当たります。", "この2つが示せれば、決まりは1、2、3、4……と、どこまでも成り立つことが証明できます。全部の数を1つずつ確かめることはできないけれど、ドミノの理屈が無限の先まで届くのです。"], "en": ["\"This way of thinking, you know, is an important method in the world of mathematical proof,\" said her grandmother. \"Its name is mathematical induction.\"", "A rule about numbers is exactly like the dominoes. First, you check that the rule holds for the number 1. That is the first domino falling.", "Next, you show that if the rule holds for some number, then it holds for the next number too. That is every domino knocking down the next.", "Once these two are shown, the rule is proved for 1, 2, 3, 4, and on forever. You could never check every number one by one — but the domino reasoning reaches all the way to infinity."]}, {"ja": ["たとえば、奇数の和を考えてみましょう。1＝1、1＋3＝4、1＋3＋5＝9、1＋3＋5＋7＝16。答えは、1、4、9、16と、平方数になっています。", "タイルで描くと、理由が見えてきます。1個の正方形に、3個のL字を足すと2×2の正方形になり、5個を足すと3×3に、7個を足すと4×4になります。奇数は、正方形を一回り大きくするL字の形をしているのです。", "ここで、ドミノの考え方です。「奇数をn個足すとn×nになる」と置くと、次に足す奇数は、その正方形を一回り大きくするL字にぴったりなります。", "だから、どこまで足していっても、いつも平方数になる。1枚目（1個のとき）が倒れ、次への橋渡し（L字）がいつも成り立つので、全部のドミノが倒れるのと同じです。"], "en": ["For example, think of sums of odd numbers. 1 = 1. 1 + 3 = 4. 1 + 3 + 5 = 9. 1 + 3 + 5 + 7 = 16. The answers are 1, 4, 9, 16 — square numbers.", "If you draw them with tiles, the reason appears. Add an L-shape of 3 tiles to a single tile, and you get a 2×2 square. Add 5, and you get 3×3. Add 7, and you get 4×4. Each odd number is exactly the L-shape that grows a square by one size.", "Now use the domino idea. Say \"adding n odd numbers gives n×n.\" The next odd number you add is exactly the L-shape that grows that square to the next size.", "So however far you keep adding, you always land on a square number. The first domino (the case of one) falls, and the bridge to the next (the L-shape) always works — all the dominoes fall."]}, {"ja": ["もう1つ、第17話でガウス少年が出した公式「1からnまでの和は、n×（n＋1）÷2」も、ドミノの考え方で証明できます。", "最初のドミノは、n＝1のときです。1×（1＋1）÷2＝1で、確かに成り立ちます。", "次の橋渡しです。nまでの和がこの公式どおりだとすると、そこへ（n＋1）を足したものは、計算すると（n＋1）×（n＋2）÷2、つまり「n＋1までの和の公式」と同じ形になります。ドミノが次の1枚を、きちんと倒したのです。", "ガウス少年は計算の工夫で公式を見つけました。そして数学的帰納法は、その公式が「いつでも、どんな大きな数でも正しい」ことを保証してくれます。発見と証明は、数学の両輪なのですね。"], "en": ["Another example: the formula young Gauss found in Episode 17 — \"the sum from 1 to n is n×(n+1)÷2\" — can also be proved with the domino idea.", "The first domino is the case n = 1. 1×(1+1)÷2 = 1, and indeed the sum is 1. It holds.", "Now the bridge. Suppose the sum up to n really is given by the formula. Add (n+1) to it, and a little arithmetic turns it into (n+1)×(n+2)÷2 — exactly the formula for the sum up to n+1. The domino has properly knocked down the next one.", "Young Gauss discovered the formula with a clever trick of calculation. Mathematical induction guarantees that the formula is right always, for numbers as large as you like. Discovery and proof are the two wheels of mathematics."]}, {"ja": ["ミオは今度は慎重に、長い長いドミノの列を並べました。最初の1枚に触れ、間隔を1つずつ目で確かめながら、部屋いっぱいに列を伸ばします。", "「最初の1枚が倒れること。どの1枚も、次を倒すこと。この2つがあれば、絶対に全部倒れる。」ミオは先頭に戻って、そっと1枚目を倒しました。", "パチ、パチ、パチ……。波のように倒れていくドミノは、今度は最後の1枚まで止まりませんでした。全部が倒れた瞬間、ミオは両手を上げました。", "「数学的帰納法も、同じ気持ちなんだね。無限に続く数の列も、2つの約束で最後まで見通せる。」ドミノの列の向こうに、数の世界の果てが見えた気がしました。"], "en": ["This time, Mio laid out her long, long line of dominoes with great care. She touched the first one, checked each gap with her eyes, and stretched the line across the whole room.", "\"The first one falls. Every one knocks down the next. With those two, absolutely all of them will fall.\" Mio went back to the start, and gently tipped the first domino.", "Click, click, click… The falling wave of dominoes did not stop this time, until the very last one. When all of them lay flat, Mio threw up both hands.", "\"Mathematical induction feels just like this. Even a line of numbers that goes on forever can be seen through, with just two promises.\" Beyond the fallen dominoes, she felt she could glimpse the far edge of the world of numbers."]}], "column": {"ja": ["この証明の考え方自体は、名前よりずっと前から使われていました。16世紀のイタリアの数学者マウロリコが数の決まりの証明に使ったのが、早い例として知られます。17世紀には、フランスのパスカルが「算術三角形」の本（1654年）の中で、この考え方をはっきりした形で使っています。", "一方、「数学的帰納法（mathematical induction）」という名前を最初に使ったのは、イギリスの数学者オーガスタス・ド・モルガンで、1838年に百科事典の記事の中で用いたとされます。考え方が生まれてから、名前がつくまでには、長い時間がかかったのですね。", "ド・モルガンは、論理学の研究でも知られる数学者です。集合の計算で習う「ド・モルガンの法則」にも、その名前が残っています。", "なぜ「帰納法」という言葉が選ばれたのかには諸説ありますが、大切なのは名前よりも中身です。「最初が成り立つ」と「次へ橋渡しできる」という2つの確認で、無限に続く全部の場合を証明してしまう。この発想は、高校の数学で正式に学ぶ、証明の世界の主役の1つです。"], "en": ["The idea of this proof was used long before it had a name. An early known example is the 16th-century Italian mathematician Maurolico, who used it to prove facts about numbers. In the 17th century, the French mathematician Pascal used the idea in a clear form in his book on the arithmetical triangle (1654).", "The name \"mathematical induction,\" on the other hand, is said to have been used first by the British mathematician Augustus De Morgan, in an encyclopedia article in 1838. A long time passed between the birth of the idea and the giving of its name.", "De Morgan is also known for his work in logic. His name remains in \"De Morgan's laws,\" which you meet when you calculate with sets.", "Why the word \"induction\" was chosen is debated, but the content matters more than the name. With just two checks — \"it holds at the start\" and \"it bridges to the next\" — you can prove something for infinitely many cases. This idea is one of the stars of proof, and you will meet it properly in high-school mathematics."]}, "quiz": {"ja": ["Q1　ドミノが全部倒れるために必要な、2つの約束は何ですか。　答え：①最初の1枚が倒れること、②どの1枚も、倒れたら必ず次の1枚を倒すこと（間隔がちょうどよく並んでいること）です。", "Q2　1＋3＋5＋7＋9はいくつですか。それは、どんな数になっていますか。　答え：25です。奇数を1から5個足すと、5×5＝25の平方数になります（奇数をn個足すと、いつもnの平方数になります）。", "Q3　「数学的帰納法」という名前を最初に使ったのは、誰で、いつですか。　答え：イギリスの数学者ド・モルガンが、1838年に百科事典の記事で使いました。"], "en": ["Q1 What are the two promises needed for all the dominoes to fall?　Answer: First, the first domino really falls. Second, every domino, when it falls, always knocks down the next one (the gaps are just right).", "Q2 What is 1 + 3 + 5 + 7 + 9, and what kind of number is it?　Answer: 25. Adding the first five odd numbers gives the square number 5×5 = 25 (adding n odd numbers always gives the square of n).", "Q3 Who first used the name \"mathematical induction,\" and when?　Answer: The British mathematician De Morgan, in an encyclopedia article in 1838."]}, "corner": {"ja": ["ドミノや将棋の駒、トランプなど、立てられるものを用意しましょう。まず、間隔をそろえて10枚ほど並べ、最初の1枚を倒します。全部倒れたら、2つの約束が守られた証拠です。", "次に、わざと1か所だけ間隔を広げて並べてみましょう。倒れる波は、そこで止まるはずです。「どの1枚も次を倒す」という約束が、1か所でも破れると、全体の証明が成り立たなくなることが体験できます。", "今度は、タイルやおはじきで、奇数の和を確かめましょう。1個、そこへ3個をL字に足して2×2、5個を足して3×3、というように、正方形を大きくしていってください。次の奇数が、いつもL字になることが見えてきます。", "最後に、「1からnまでの和の公式」が、n＝1、2、3、4のときに成り立つことを、実際に計算して確かめてみましょう。そのうえで、「nのときに成り立てば、n＋1でも成り立つ」橋渡しの計算にも挑戦してみてください。ドミノの証明が、自分の手で再現できますよ。"], "en": ["You will need dominoes, shogi pieces, playing cards — anything that stands up. First, line up about ten with even gaps, and tip the first. If they all fall, the two promises were kept.", "Next, deliberately make one gap wider than the others. The falling wave should stop right there. You can feel how, if the promise \"every one knocks down the next\" breaks at a single place, the whole proof fails.", "Then test the sums of odd numbers with tiles or counters. Start with 1 tile. Add 3 in an L-shape to make 2×2. Add 5 to make 3×3. Keep growing the square, and watch how each next odd number always forms the L-shape.", "Finally, check by direct calculation that the formula for the sum from 1 to n works for n = 1, 2, 3, 4. Then try the bridge calculation: \"if it holds for n, it holds for n+1.\" You can rebuild the domino proof with your own hands."]}}, {"id": "buffon", "title": {"ja": "針を落として円周率をはかる ― ビュフォンの針のおはなし", "en": "Dropping a Needle to Measure Pi ― The Story of Buffon's Needle"}, "sub": {"ja": "小学校高学年〜中学生向け・確率と円周率が出会うおはなし", "en": "For upper elementary to junior high — where probability meets pi"}, "cover": "buf1.jpg", "images": ["buf1.jpg", "buf2.jpg", "buf3.jpg", "buf4.jpg", "buf5.jpg", "buf5.jpg"], "pages": [{"ja": ["ある日の放課後、教室ではサワダ先生が大きな紙を机いっぱいに広げていました。紙には、等しい間隔で平行線が何本も引かれています。その横には、つまようじが山盛りの箱。", "「ミオ、今日は面白い実験をしよう。針を落として、円周率をはかるんだ。」", "「えっ、落とすだけで円周率が分かるの。」ミオは目を丸くしました。「円周率は、円のまわりの長さをはかって出すものじゃないの。」", "「本物の針は危ないから、つまようじで落とすよ。」先生は笑って言いました。「偶然に頼る実験なのに、円の数が顔を出す。不思議だろう。」"], "en": ["One day after school, in the classroom, Mr. Sawada was spreading a large sheet of paper across a desk. On the paper were many parallel lines, all the same distance apart. Beside it sat a box heaped with toothpicks.", "\"Mio, let's try an interesting experiment today. We are going to drop a needle — and measure pi.\"", "\"What? You can find pi just by dropping something?\" Mio's eyes went round. \"Isn't pi something you get by measuring the way around a circle?\"", "\"A real needle would be dangerous, so we will drop toothpicks instead,\" the teacher said with a smile. \"It is an experiment that relies on chance — and yet the number from circles shows its face. Strange, isn't it?\""]}, {"ja": ["ルールは簡単です。線と線の間隔をdとして、つまようじの長さも、ちょうどdと同じにしてあります。少し上から、ねらいを付けずに、そっと落とします。", "落ちたつまようじが線をまたいでいたら「またいだ」、またいでいなかったら「またがない」。これを何度もくり返して、数を数えるのです。", "「でも先生、落ち方は偶然だよ。そのたびに結果が違うのに、円周率なんて出てくるの。」", "「1回1回は偶然でも、たくさん落とすと、割合に決まりが見えてくるんだ。」先生は言いました。「つまようじの長さと間隔が同じとき、線をまたぐ確率は、2/πになることが分かっている。πが、確率の中に隠れているんだよ。」"], "en": ["The rules are simple. Call the distance between the lines d, and the toothpicks are made to be exactly d long as well. You drop one gently from a little height, without aiming.", "If the fallen toothpick lies across a line, it \"crosses.\" If not, it \"does not cross.\" You repeat this many times, and count.", "\"But teacher, how it falls is pure chance. The result is different every time. How could pi possibly come out of that?\"", "\"Each single drop is chance, but when you drop many, a pattern appears in the proportion,\" said the teacher. \"When the toothpick's length and the spacing are equal, the probability of crossing turns out to be 2/π. Pi is hiding inside probability.\""]}, {"ja": ["さっそく実験開始です。ミオがつまようじを落とし、先生が黒板に「正」の字を書いて数えます。「またいだ。……今度は、またがない。またいだ。」", "はじめのうち、またいだ割合は上がったり下がったりして、落ち着きません。10回で4回、30回で22回、50回では33回……。", "「なんだか、3分の2くらいに近づいていく気がする。」ミオが首をかしげました。2/πは、計算すると約0.64。3分の2に近い数です。", "2人は交代しながら落とし続け、正の字がどんどん増えていきました。やがて、落とした回数はちょうど100回になりました。"], "en": ["The experiment began at once. Mio dropped the toothpicks, and the teacher counted with tally marks on the blackboard. \"Crossed… This time, no. Crossed.\"", "At first, the proportion of crossings jumped up and down and would not settle: 4 out of 10, then 22 out of 30, then 33 out of 50…", "\"It feels as if it's getting close to about two thirds,\" Mio said, tilting her head. And indeed, 2/π works out to about 0.64, a number close to two thirds.", "Taking turns, the two of them kept dropping, and the tally marks grew and grew. At last, the number of drops reached exactly 100."]}, {"ja": ["結果を数えてみると、100回落として、線をまたいだのは64回でした。", "「またいだ割合は、100分の64で0.64。この割合が、2/πに近いはずだよね。」ミオはノートに書きながら言いました。", "「そう。じゃあ、πを逆に計算してみよう。π ≈ 2×100÷64。計算すると3.125、約3.13になる。」先生が黒板に大きく書きました。", "「本当の円周率は3.14159……。3.13って、かなり近い。」ミオは驚きました。一般には、針の長さをl、線の間隔をdとすると、線をまたぐ確率は2l/(πd)になります。長さと間隔を同じにしたから、式が2/πと簡単になったのです。"], "en": ["They counted the results: out of 100 drops, the toothpick had crossed a line 64 times.", "\"The proportion of crossings is 64 out of 100, that is 0.64. And that proportion should be close to 2/π,\" Mio said, writing in her notebook.", "\"Right. So let's calculate pi backwards. π ≈ 2×100÷64. That gives 3.125 — about 3.13.\" The teacher wrote it large on the blackboard.", "\"The real pi is 3.14159… 3.13 is really quite close!\" Mio was amazed. In general, if the needle's length is l and the spacing is d, the probability of crossing is 2l/(πd). Because they had made the length and the spacing the same, the formula became the simple 2/π."]}, {"ja": ["「100回でここまで近づくなら、もっとたくさん落としたら、もっと正確になるのかな。」", "「その通り。1000回、10000回と回数を増やせば増やすほど、πの近似はよくなっていく。偶然まかせの実験なのに、回数が味方してくれるんだ。」", "今では、コンピュータの中で何百万回、何億回もの「落とす真似」をさせて計算する方法が、科学や工学で広く使われています。偶然の試行をくり返して答えに近づくこの方法は、「モンテカルロ法」と呼ばれます。", "「つまようじ落としは、その先駆けというわけだね。」ミオは、正の字でいっぱいになった黒板を見上げました。"], "en": ["\"If 100 drops get us this close, then dropping many more would make it more accurate, wouldn't it?\"", "\"Exactly. The more trials — a thousand, ten thousand — the better the approximation of pi becomes. The experiment relies on chance, yet the number of trials works in your favour.\"", "Today, computers are made to imitate the dropping millions, even billions of times, and this way of calculating is used widely in science and engineering. The method of repeating random trials to approach an answer is called the Monte Carlo method.", "\"So dropping toothpicks was a forerunner of all that.\" Mio looked up at the blackboard, covered in tally marks."]}, {"ja": ["夕方の光が差し込む教室で、ミオは黒板の「3.13」という数字を眺めていました。", "「先生も昔、教室で簡単な方法でこの実験を試したことがあります。」サワダ先生が、遠くを見るように言いました。「あのときも、みんなで『本当に3.14に近づくんだ』と驚いたものです。」", "円の長さを一度もはからずに、ただ落として、数えただけで、円周率が見えてきた。偶然の中に、数学の決まりが静かに隠れていたのです。", "「確率と円周率は、こんなところでつながっていたんだね。」ミオはつまようじを1本手に取り、もう一度、そっと落としてみました。"], "en": ["In the evening light falling across the classroom, Mio gazed at the number \"3.13\" on the blackboard.", "\"I once tried this experiment in my own classroom, in a simple way,\" said Mr. Sawada, looking into the distance. \"Back then, too, everyone was amazed — 'It really does get close to 3.14!'\"", "Without ever measuring the way around a circle, just by dropping and counting, pi had come into view. Inside pure chance, a rule of mathematics had been quietly hiding.", "\"So probability and pi were connected in a place like this.\" Mio picked up a single toothpick, and gently dropped it one more time."]}], "column": {"ja": ["「針の問題」を発表したのは、フランスの博物学者ジョルジュ＝ルイ・ルクレール・ド・ビュフォンです。1777年の本『Essai d'Arithmétique morale（道徳算術試論）』の中で、平行線の上に針を落としたとき、線をまたぐ確率を求める問題として紹介しました。確率の問題にπが現れることに、当時の人々も驚いたことでしょう。", "その後、多くの人が実際に針を落として確かめました。1850年ごろには、スイスの天文学者ヴォルフが5000回も落として、π≈3.159という値を得たと伝えられます。地道な実験が、理論の正しさを裏付けていきました。", "一方、1901年のイタリアの数学者ラッツァリーニの実験は、少し事情が違います。3408回落として、小数6桁まで本当の円周率と一致したと発表したのですが、それは「出来すぎていて、疑いも残る話」とされています。偶然だけでは、そこまでぴたりと一致する可能性はとても低いのです。", "ビュフォンの針は、偶然の試行をたくさんくり返して答えに近づく「モンテカルロ法」の先駆けと言えます。針を落とすという素朴な実験が、のちのコンピュータ計算の考え方につながっていたのですね。"], "en": ["The \"needle problem\" was presented by the French naturalist Georges-Louis Leclerc, Comte de Buffon. In his 1777 book Essai d'Arithmétique morale, he introduced it as the problem of finding the probability that a needle dropped onto parallel lines will cross one of them. People of the time must have been surprised to see π appear in a problem about probability.", "Afterwards, many people actually dropped needles to test it. Around 1850, the Swiss astronomer Wolf is said to have dropped a needle 5000 times and obtained π ≈ 3.159. Patient experiments like his supported the truth of the theory.", "The 1901 experiment of the Italian mathematician Lazzarini, however, is a different story. He announced that with 3408 drops, his value agreed with the true pi to six decimal places — but this is regarded as too good to be true, and doubts remain. With chance alone, the possibility of agreeing so exactly is very small.", "Buffon's needle can be called a forerunner of the Monte Carlo method, which approaches an answer by repeating random trials many times. The simple experiment of dropping a needle led, in later years, to a way of thinking used in computer calculation."]}, "quiz": {"ja": ["Q1　つまようじの長さと線の間隔が同じとき、落としたつまようじが線をまたぐ確率は、およそ何ですか。　答え：2/π（約0.64）です。円周率πが、確率の中に隠れています。", "Q2　つまようじを100回落として、64回線をまたぎました。円周率πは、およそいくつと計算できますか。　答え：π ≈ 2×100÷64 ＝ 3.125、約3.13です。", "Q3　「針の問題」を最初に発表したのは誰で、いつですか。また、1901年のラッツァリーニの結果は、どう受け止められていますか。　答え：フランスのビュフォンが1777年に発表しました。ラッツァリーニの結果は、出来すぎていて、疑いも残る話とされています。"], "en": ["Q1 When a toothpick's length is the same as the spacing of the lines, about what is the probability that a dropped toothpick crosses a line?　Answer: 2/π (about 0.64). The number pi is hiding inside probability.", "Q2 A toothpick was dropped 100 times and crossed a line 64 times. About what value of pi can you calculate?　Answer: π ≈ 2×100÷64 = 3.125, about 3.13.", "Q3 Who first presented the \"needle problem,\" and when? And how is Lazzarini's 1901 result regarded?　Answer: Buffon of France presented it in 1777. Lazzarini's result is regarded as too good to be true, and doubts remain about it."]}, "corner": {"ja": ["用意するものは、つまようじ（マッチ棒でもよい）と、等しい間隔で平行線を引いた紙です。線の間隔は、つまようじの長さとぴったり同じにしてください。安全のため、本物の針は使わず、つまようじやマッチ棒を使いましょう。", "少し上から、ねらいを付けずにそっと落とします。線をまたいだかどうかを確かめ、「正」の字で記録していきましょう。10回、50回、100回と、まとまった回数ごとに割合を計算してみるのがコツです。", "円周率は、π ≈ 2×（落とした回数）÷（またいだ回数）で計算できます。たとえば100回落として64回またいだら、π ≈ 2×100÷64 ＝ 3.125、約3.13になります。", "回数を増やすほど、本当の円周率3.14159……に近づいていきます。家族や友達と分担して落とし、結果を合計すれば、大きな回数の実験ができます。割合がどう変わっていくか、表にまとめて眺めてみましょう。"], "en": ["You will need toothpicks (matchsticks will do) and a sheet of paper with parallel lines drawn at equal spacing. Make the spacing exactly the same as the length of a toothpick. For safety, do not use a real needle — use toothpicks or matchsticks.", "Drop a toothpick gently from a little height, without aiming. Check whether it crosses a line, and record the result with tally marks. It helps to calculate the proportion after each block of trials — 10, 50, then 100.", "You can calculate pi as π ≈ 2 × (number of drops) ÷ (number of crossings). For example, if a toothpick crosses 64 times in 100 drops, then π ≈ 2×100÷64 = 3.125, about 3.13.", "The more trials you make, the closer you come to the true pi, 3.14159… If family or friends each drop toothpicks and you add all the results together, you can make an experiment with a large number of trials. Try putting the proportions in a table and watch how they change."]}}, {"id": "cavalieri", "title": {"ja": "うすく切って、ならべれば体積が分かる ― カヴァリエリの原理のおはなし", "en": "Slice It Thin and Line It Up ― The Story of Cavalieri's Principle"}, "sub": {"ja": "中学生向け・切り口の面積で体積を比べるおはなし", "en": "For junior high school students — a story of comparing volumes by the areas of slices"}, "cover": "cav1.jpg", "images": ["cav1.jpg", "cav2.jpg", "cav3.jpg", "cav4.jpg", "cav5.jpg", "cav5.jpg"], "pages": [{"ja": ["ある日の台所で、おじいちゃんがようかんを薄く切っていました。包丁がすっと入るたびに、つやつやした切り口が現れます。となりでは、おばあちゃんがキャベツを千切りにしていて、食卓にはロールケーキも待っていました。", "「おじいちゃん、ようかんって、薄く切ると形が変わって見えるね。」ユイがのぞき込みました。「でも、量は同じなの。」", "「そうだよ。切っても、並べ替えても、ようかんそのものの量は増えも減りもしない。」おじいちゃんは、切り分けた一切れをつまんで見せました。「この『量』が、数学でいう体積だ。」", "「体積は、箱みたいな形なら計算できるけど、丸いものやごつごつしたものは難しいんだよね。」ユイが言うと、おじいちゃんはにっこりしました。「ところがね、うすく切って切り口を比べると、計算が難しい形の体積まで分かってしまう方法があるんだよ。今日はそのお話をしよう。」"], "en": ["One day in the kitchen, Yui's grandfather was slicing a loaf of yokan — sweet bean jelly — into thin pieces. Each time the knife slid through, a glossy new face appeared. Nearby, Grandmother was shredding cabbage into fine strips, and a roll cake was waiting on the table.", "\"Grandpa, when you slice yokan thin, it looks like it changes shape,\" said Yui, peering in. \"But the amount stays the same, doesn't it?\"", "\"That's right. Cut it, rearrange it — the amount of yokan itself neither grows nor shrinks.\" Her grandfather picked up one slice and showed it to her. \"This 'amount' is what mathematics calls volume.\"", "\"We can calculate volume for box shapes, but round things and lumpy things are hard,\" said Yui. Her grandfather smiled. \"And yet — if you slice a solid thin and compare the faces of the slices, there is a way to find even the volumes of shapes that are hard to calculate. That is today's story.\""]}, {"ja": ["おじいちゃんは、薄く切ったようかんを、少しずつずらして階段のように並べ直しました。まっすぐだったようかんが、斜めの形に変わります。「形は変わったけれど、体積はどうかな。」", "「切ったものを全部使っているんだから、同じだと思う。」ユイが答えました。「その通り。」おじいちゃんは、今度はポケットから10円玉を10枚取り出して、まっすぐ積み上げました。次に、1枚ずつ少しずつずらして、斜めに傾いた塔にしました。", "紙の束でも同じです。まっすぐそろえて置いても、本棚に斜めに立てかけても、紙全体の量は変わりません。高さが同じで、どの高さでも切り口の広さが同じなら、形が斜めでも体積は同じなのです。", "「大事なのは、『どの高さで切っても、切り口の面積が等しいか』なんだ。」おじいちゃんは、斜めの塔とまっすぐな塔を、指で上下になぞりました。「この考え方が、今日の主役だよ。」"], "en": ["Her grandfather took the thin slices of yokan and laid them out again, shifted a little at a time, like a staircase. The straight loaf turned into a slanted shape. \"The shape has changed. But what about the volume?\"", "\"You used all the pieces you cut, so I think it's the same,\" answered Yui. \"Exactly.\" This time her grandfather took ten 10-yen coins from his pocket and stacked them straight up. Then he shifted each coin a little, making a tower that leaned.", "A stack of paper is the same. Whether you set it down neatly squared, or lean it at a slant against a shelf, the total amount of paper does not change. If the height is the same, and the width of every slice is the same at every height, the volume is the same even if the shape leans.", "\"What matters is whether the area of the cut face is equal at every height,\" said her grandfather, tracing a finger up and down the leaning tower and the straight one. \"This idea is the hero of today's story.\""]}, {"ja": ["「2つの立体を、底から同じ高さのところで横に切ってみる。どの高さで切っても、切り口の面積がぴったり等しい。そういう2つの立体は、体積も等しい。これを『カヴァリエリの原理』と言うんだ。」", "体積というのは、考えようによっては、薄い切り口を下から上まで積み重ねたものです。切り口の面積がどの高さでも同じなら、積み上げた量も同じになるのは、ようかんの並べ替えで見たとおりです。", "「じゃあ、片方の体積が分かれば、もう片方の体積も分かるんだね。」ユイの目が輝きました。「形が全然違っても、だよ。」", "第33話で出てきた「細かく分けて集める」考えと、この原理は親戚どうしです。そして実は、この原理を使うと、あの難しい「球の体積」まで求めることができるのです。「うそ、球が。」ユイは思わず身を乗り出しました。"], "en": ["\"Take two solids, and cut both of them sideways at the same height above the base. If, at every height, the areas of the two cut faces are exactly equal, then the two volumes are equal, too. This is called Cavalieri's principle.\"", "A volume, if you think about it in one way, is a stack of thin cut faces piled from bottom to top. If the area of the face is the same at every height, then the piled-up amount must be the same — just as we saw with the rearranged yokan.", "\"So if we know the volume of one of them, we know the volume of the other!\" Yui's eyes sparkled. \"Even if the shapes are completely different?\"", "This principle is a relative of the idea from Episode 33, \"divide into small pieces and gather them.\" And in fact, using this principle, we can even find that most difficult of volumes — the volume of a sphere. \"No way — a sphere?\" Yui leaned forward without thinking."]}, {"ja": ["おじいちゃんは、粘土で作った半径 r の半球の模型と、もう1つの立体を取り出しました。もう1つは、半径 r・高さ r の円柱から、底面と高さが同じ円錐をくり抜いた形の立体です。「この2つを比べてみよう。」", "まず、底から高さ h のところで、両方を横に切ってみます。h は、0から r までの、どの高さでもよいことにします。", "半球の切り口は円です。球の中心からの関係を考えると、その円の面積は π(r²−h²) になります。高く切るほど、切り口の円は小さくなっていきます。", "円柱から円錐をくり抜いた立体の切り口は、ドーナツのような輪の形です。外側の円柱の切り口は πr²、くり抜かれた円錐の切り口は、その高さでは半径 h の円になるので πh²。差を取ると πr²−πh² で、整理すると π(r²−h²) になります。", "「あっ。」ユイが声を上げました。「半球の切り口と、まったく同じ式だ。どの高さ h で切っても、切り口の面積がぴったり等しいんだね。」"], "en": ["Her grandfather brought out a clay model of a hemisphere of radius r, and one more solid. The second was the shape you get from a cylinder of radius r and height r, with a cone of the same base and the same height hollowed out of it. \"Let's compare these two.\"", "First, cut both of them sideways at a height h above the base. The height h can be any height at all, from 0 up to r.", "The cut face of the hemisphere is a circle. Thinking about its distance from the center of the sphere, the area of that circle is π(r²−h²). The higher you cut, the smaller the circle becomes.", "The cut face of the cylinder-with-the-cone-removed is a ring, like a doughnut. The cylinder's cut face is πr², and the hollowed-out cone's cut face, at that height, is a circle of radius h, so it is πh². Subtracting gives πr²−πh², which tidies up into π(r²−h²).", "\"Oh!\" cried Yui. \"It's exactly the same formula as the hemisphere's cut face. At every height h, the areas of the cut faces match perfectly.\""]}, {"ja": ["切り口の面積がどの高さでも等しいのですから、カヴァリエリの原理により、半球の体積は、円柱から円錐を取り除いた立体の体積と等しくなります。あとは、計算できる方の体積を出すだけです。", "円柱の体積は、底面積 πr² に高さ r をかけて、πr³。円錐の体積は、同じ底面・同じ高さの円柱の 1/3 なので、(1/3)πr³ です。", "したがって、半球の体積は πr³ − (1/3)πr³ ＝ (2/3)πr³。球は半球を2つ合わせたものだから、その2倍で、4/3πr³ になります。", "「第33話で、アルキメデスが細かい錐体の集まりとして求めた式と、同じ答えになった。」ユイが言いました。「第39話みたいに水に沈めなくても、切り口を比べるだけで、球の体積が出ちゃうんだね。」おじいちゃんはうなずきました。「しかも、アルキメデス自身が、よく似た『切り分けて比べる』考えを使っていたんだよ。その話は、コラムでしよう。」"], "en": ["Since the areas of the cut faces are equal at every height, Cavalieri's principle tells us that the volume of the hemisphere equals the volume of the cylinder with the cone removed. Now we only have to compute the volume of the side we can calculate.", "The volume of the cylinder is its base area πr² times its height r, which is πr³. The volume of the cone is 1/3 of a cylinder with the same base and the same height, so it is (1/3)πr³.", "Therefore, the volume of the hemisphere is πr³ − (1/3)πr³ = (2/3)πr³. And since a sphere is two hemispheres joined together, its volume is twice that: 4/3πr³.", "\"It's the same answer Archimedes reached in Episode 33, thinking of the sphere as a gathering of thin pyramids,\" said Yui. \"And we didn't even have to sink anything in water, like in Episode 39 — just comparing cut faces gives the volume of a sphere!\" Her grandfather nodded. \"What's more, Archimedes himself used a very similar idea of cutting and comparing. That story is in the column.\""]}, {"ja": ["食卓では、切ったようかんがお皿に並びました。ユイは一切れを手に取り、じっと見つめました。「この一切れの切り口と、同じ高さのあの切り口が同じなら、体積も同じ。台所の包丁が、そのまま数学の道具なんだね。」", "「うすく切って、ならべれば体積が分かる。形が違っても、切り口が教えてくれる。」ユイは、ロールケーキの丸い切り口や、山盛りのキャベツの千切りを見渡しました。台所のあちこちに、切り口の数学が隠れていました。", "「カヴァリエリさんは、包丁みたいに立体を切って考えたんだね。」ユイが言うと、おじいちゃんは笑いました。「そうだね。難しい形も、薄く切れば怖くない。それがこの原理の気持ちだよ。」", "ユイは決めました。今度はジャガイモを同じ厚さに切って、2つの形に並べ替えて、切り口を確かめてみること。食後の台所で、新しい実験の相談が始まりました。"], "en": ["At the table, the sliced yokan was served on plates. Yui picked up one slice and looked at it closely. \"If this slice's face matches the other solid's face at the same height, the volumes match too. The kitchen knife itself is a tool of mathematics.\"", "\"Slice it thin and line it up, and the volume reveals itself. Even when shapes differ, the cut faces tell the truth.\" Yui looked around at the round face of the roll cake and the mound of shredded cabbage. The mathematics of cut faces was hiding all over the kitchen.", "\"So Cavalieri thought about solids by cutting them, like with a knife,\" said Yui. Her grandfather laughed. \"That's right. No shape is frightening if you slice it thin enough. That is the spirit of this principle.\"", "Yui made up her mind. Next time, she would cut a potato into slices of the same thickness, arrange them into two different shapes, and compare the cut faces herself. Over the washing-up, a plan for a new experiment began."]}], "column": {"ja": ["カヴァリエリ（1598年〜1647年）は、イタリアの数学者です。1635年の著書『Geometria indivisibilibus continuorum nova quadam ratione promota』（不可分者による連続体の幾何学）の中で、この原理を発表しました。立体を、厚みのない切り口の集まりと考える発想を、彼は「不可分者（indivisibles）」と呼びました。", "厚みのない切り口を限りなく集めれば体積になる、という考えは、のちの積分の生まれる一歩手前の発想でした。第33話の「細かく分けて集める」考えが、ここにも流れています。カヴァリエリの仕事は、微分・積分が作られる前の大切な橋渡しになったのです。", "実は、よく似た考えは、はるか昔に使われていました。古代ギリシャのアルキメデスは、『方法』という本の中で、球などを薄く切り分けて、別の形と比べながら体積を求める方法を明かしています。第39話の王冠のお話の主役が、約1900年も前に「切り分けて比べる」ことをしていたのですね。この『方法』は長く失われていて、写本が再発見されたのは20世紀になってからでした。", "同じ考えは、中国でも知られていました。5世紀から6世紀ごろの数学者、祖暅（そげん。円周率で有名な祖沖之の子です）の原理として伝えられ、「どの高さでも切り口が等しければ、体積も等しい」という内容は、カヴァリエリの原理とまったく同じものです。時代も場所も違う人々が、切り口という同じ真理にたどり着いていたのです。"], "en": ["Cavalieri (1598–1647) was an Italian mathematician. He presented this principle in his book of 1635, \"Geometria indivisibilibus continuorum nova quadam ratione promota\" — \"Geometry, developed by a new method, of the indivisibles of continua.\" His idea of thinking of a solid as a gathering of cut faces with no thickness at all, he called the \"indivisibles.\"", "The thought that gathering cut faces of no thickness, without limit, makes a volume was one step short of the birth of integration. The idea of \"divide into small pieces and gather them,\" from Episode 33, flows through this work as well. Cavalieri's work became an important bridge before differentiation and integration were created.", "In fact, a very similar idea had been used long, long before. Archimedes of ancient Greece, in his book \"The Method,\" revealed how he found volumes by slicing solids thin — spheres among them — and comparing them with other shapes. The hero of the crown story in Episode 39 was \"cutting and comparing\" some 1900 years earlier. \"The Method\" was lost for a long time, and its manuscript was rediscovered only in the 20th century.", "The same idea was known in China, too. It has been handed down as the principle of Zu Geng (around the 5th to 6th century, the son of Zu Chongzhi, famous for the value of pi): \"if the cut faces are equal at every height, the volumes are equal\" — exactly the same content as Cavalieri's principle. People in different ages and different lands had arrived at the same truth of the cut face."]}, "quiz": {"ja": ["Q1　カヴァリエリの原理とは、どんな原理ですか。　答え：2つの立体を、どの高さで切っても切り口の面積が等しければ、その2つの体積も等しい、という原理です。", "Q2　半径 r の半球の体積は、どんな立体の体積と等しくなりますか。また、半球と球の体積はいくつですか。　答え：半径 r・高さ r の円柱から、同じ底面・同じ高さの円錐を取り除いた立体の体積と等しくなります。円柱 πr³ から円錐 (1/3)πr³ を引いて、半球は (2/3)πr³、球はその2倍で 4/3πr³ です。", "Q3　カヴァリエリがこの原理を発表した著書と年を答えなさい。また、中国で同じ考えは何の原理として知られていますか。　答え：1635年の著書『Geometria indivisibilibus continuorum nova quadam ratione promota』です。中国では、祖暅（そげん）の原理として知られています。"], "en": ["Q1 What is Cavalieri's principle?　Answer: It is the principle that if two solids have equal areas of cut faces at every height, then the two solids have equal volumes as well.", "Q2 The volume of a hemisphere of radius r is equal to the volume of what solid? And what are the volumes of the hemisphere and of the sphere?　Answer: It equals the volume of a cylinder of radius r and height r with a cone of the same base and the same height removed. Subtracting the cone, (1/3)πr³, from the cylinder, πr³, the hemisphere is (2/3)πr³, and the sphere is twice that: 4/3πr³.", "Q3 In what book and year did Cavalieri present this principle? And by what name is the same idea known in China?　Answer: In his book of 1635, \"Geometria indivisibilibus continuorum nova quadam ratione promota.\" In China it is known as the principle of Zu Geng."]}, "corner": {"ja": ["コインやトランプ、プリント紙の束を用意しましょう。まず、まっすぐきれいに積み上げます。次に、1枚ずつ少しずつずらして、斜めの塔にしてみましょう。高さも、材料の量（体積）も変わっていないことを、目と手で確かめてください。これが、カヴァリエリの原理の入口です。", "ジャガイモやようかんを、できるだけ同じ厚さに切ってみましょう。切ったものを、もとの形と、ずらした形の2通りに並べ替えて、切り口の大きさを比べてください。包丁を使うときは、大人の人と一緒に、安全に気をつけてくださいね。", "計算でも確かめてみましょう。半径 r の半球と、円柱から円錐をくり抜いた立体について、h＝0 のとき、h が r の半分のとき、h＝r のときの切り口の面積を、それぞれ計算してみてください。半球側は π(r²−h²)、円柱−円錐側は πr²−πh²。3つの高さとも、同じ値になるはずです。", "粘土で、半球と円柱と円錐の模型を作ることにも挑戦してみましょう。同じ高さのところに竹串で印をつけて切ってみると、切り口の大きさがそろう様子が、目で見て確かめられますよ。"], "en": ["You will need coins, playing cards, or a stack of printed paper. First, pile them up straight and neat. Next, shift each piece a little at a time to build a leaning tower. Check with your eyes and hands that neither the height nor the amount of material — the volume — has changed. This is the entrance to Cavalieri's principle.", "Try cutting a potato or a loaf of yokan into slices as equal in thickness as you can. Arrange the slices in two ways — the original shape, and a shifted shape — and compare the sizes of the cut faces. When you use a knife, do it together with an adult, and take care to be safe.", "Check with calculation, too. For a hemisphere of radius r and for the solid made by removing a cone from a cylinder, work out the area of the cut face at h = 0, at h equal to half of r, and at h = r. The hemisphere's side is π(r²−h²); the cylinder-minus-cone side is πr²−πh². All three heights should give the same value on both sides.", "You can also try making clay models of a hemisphere, a cylinder, and a cone. Mark the same height on each with a bamboo skewer, cut, and see with your own eyes how the cut faces line up in size."]}}, {"id": "balance", "title": {"ja": "平均はバランスの点 ― ヒストグラムと重心のおはなし", "en": "The Mean Is the Balance Point ― The Story of Histograms and the Center of Mass"}, "sub": {"ja": "中学生向け・データの活用／平均と重心のおはなし", "en": "For junior high — using data: the mean and the center of mass"}, "cover": "bal1.jpg", "images": ["bal1.jpg", "bal2.jpg", "bal3.jpg", "bal4.jpg", "bal5.jpg", "bal5.jpg"], "pages": [{"ja": ["数学の時間、サワダ先生が黒板に、先週とったアンケートの結果を書き出しました。「先月、みんなが読んだ本の冊数」です。", "結果は、こうでした。1冊読んだ人が1人、2冊が3人、3冊が4人、4冊が1人、5冊が1人。クラスの一部の10人の結果です。", "ミオはノートに計算しました。本の合計は、1×1＋2×3＋3×4＋4×1＋5×1＝28冊。10人で割ると、平均は2.8冊です。", "「よくできました。」先生はうなずいて、こう聞きました。「では、その平均2.8冊は、この結果の図の上で言うと、どこにあると思いますか。」"], "en": ["In maths class, Mr. Sawada wrote the results of last week's survey on the blackboard: \"How many books did you read last month?\"", "The results were like this: 1 person read 1 book, 3 people read 2 books, 4 people read 3 books, 1 person read 4 books, and 1 person read 5 books — the answers of 10 classmates in all.", "Mio calculated in her notebook. The total number of books was 1×1 + 2×3 + 3×4 + 4×1 + 5×1 = 28 books. Dividing by 10 people, the mean was 2.8 books.", "\"Well done,\" said the teacher, nodding. Then he asked, \"Now — if you look at the chart of these results, where do you think that mean of 2.8 books is hiding?\""]}, {"ja": ["先生は、アンケートの結果をヒストグラムに描きました。横軸は読んだ冊数、縦軸は人数です。棒の高さは、1、3、4、1、1と並びました。", "「いちばん多いのは3冊だし、並んだ棒の真ん中も3冊のところだよね。」ミオが言いました。「平均は、3冊の近くにあるんじゃないかな。」", "すると先生は、棚から大きな厚紙を取り出しました。「このヒストグラムを、厚紙にそっくり写して、輪郭を切り抜いてみよう。そして、糸でつるして、ぴたりと釣り合う場所を探すんだ。」", "「平均が、つるす場所と関係あるの。」ミオは首をかしげました。「あるとも。平均は、データの『重さ』が釣り合う点かもしれないんだよ。」"], "en": ["The teacher drew the survey results as a histogram. Along the bottom went the number of books, and up the side went the number of people. The bars stood with heights 1, 3, 4, 1, 1.", "\"The most common answer is 3 books, and the middle bar is also at 3 books,\" said Mio. \"So the mean is probably somewhere near 3 books, isn't it?\"", "Then the teacher took a large sheet of thick paper from the shelf. \"Let's copy this histogram onto the thick paper, exactly as it is, and cut out its outline. Then we will hang it from a thread and look for the point where it balances perfectly.\"", "\"The mean has something to do with where we hang it?\" Mio tilted her head. \"It does. The mean might just be the point where the 'weight' of the data balances.\""]}, {"ja": ["2人は、厚紙にヒストグラムを描いて、はさみで輪郭を切り抜きました。山のような形の、紙の図形ができあがります。", "「釣り合いと言えば、シーソーを思い出すだろう。」先生が言いました。「重い人と軽い人がシーソーに乗るとき、重い人が支点の近くに座り、軽い人が遠くに座ると、つり合うことがある。」", "釣り合いを決めるのは、重さだけではありません。支点からの距離も、同じくらい大切なのです。重さと距離のかけ算が、左右で等しくなるときに釣り合います。", "ヒストグラムも、同じように考えられます。棒の1本1本が『重さ』で、その棒の位置が『支点からの距離』です。「さあ、まず一番高い棒、3冊の真下でつるしてみよう。」"], "en": ["The two of them drew the histogram on the thick paper and cut out its outline with scissors. A paper shape like a little mountain range was ready.", "\"Speaking of balance, think of a seesaw,\" said the teacher. \"When a heavy person and a light person ride a seesaw, if the heavy person sits close to the middle — the fulcrum — and the light person sits far away, they can balance.\"", "Balance is not decided by weight alone. The distance from the fulcrum matters just as much. A seesaw balances when weight times distance comes out equal on the left and on the right.", "A histogram can be thought of in the same way. Each bar is a \"weight,\" and the bar's position is its \"distance from the fulcrum.\" \"Now, let's first try hanging it right under the tallest bar — the 3-books bar.\""]}, {"ja": ["ミオが、3冊の棒の真下の点に穴をあけ、糸を通してそっとつるしました。すると厚紙は、左側、つまり1冊と2冊のある側へ、ずしんと傾きました。", "「やっぱり釣り合わない。」先生は言いました。「支点が3のとき、左側の『重さ×距離』は、1×2＋3×1＝5。右側は、1×1＋1×2＝3。左のほうが大きいから、左へ傾くんだ。」", "次に、図形の幅のちょうど真ん中でつるしても、やはり釣り合いません。真ん中は、釣り合いの点ではなかったのです。", "「では、平均の2.8の真下はどうだろう。」ミオが2.8の真下に新しい穴をあけ、糸でつるしました。すると厚紙は、ぴたりと水平になって、静かに止まったのです。「釣り合った！」"], "en": ["Mio made a hole at the point right under the 3-books bar, passed a thread through, and gently lifted it. The paper tilted heavily toward the left side — the side of 1 book and 2 books.", "\"It doesn't balance after all,\" said the teacher. \"With the fulcrum at 3, the left side's 'weight × distance' is 1×2 + 3×1 = 5. The right side is 1×1 + 1×2 = 3. The left is bigger, so it tips to the left.\"", "Next they tried hanging it from the exact middle of the shape's width — but it still would not balance. The middle was not the balance point either.", "\"Then what about right under the mean, 2.8?\" Mio made a new hole under 2.8 and hung the paper from the thread. This time the paper stopped, perfectly level and still. \"It balances!\""]}, {"ja": ["「なぜ、2.8で釣り合うのか、計算で確かめてみよう。」先生が黒板に書きました。「棒の中心に、その棒の高さをかけたものを全部足すと、1×1＋2×3＋3×4＋4×1＋5×1＝28。高さの合計10で割ると、28÷10＝2.8。」", "「あれ、それって平均の計算そのものだ。」ミオが気づきました。平均を求める計算は、実は、図形の重さの中心、つまり重心を求める計算と、まったく同じだったのです。", "支点を2.8にすると、左側の『重さ×距離』の合計と、右側の合計がちょうど等しくなります。だから厚紙は傾かず、水平に釣り合うのです。", "「平均というのは、データ全部を平らにならした高さでもあるけれど、こうして図形として見ると、『分布全体の重心』なんだよ。」先生は、釣り合った厚紙を指しました。"], "en": ["\"Let's check with a calculation why it balances at 2.8,\" said the teacher, writing on the blackboard. \"Multiply each bar's centre by its height and add them all: 1×1 + 2×3 + 3×4 + 4×1 + 5×1 = 28. Divide by the total height, 10, and you get 28÷10 = 2.8.\"", "\"Wait — that's exactly the calculation for the mean!\" Mio realised. The calculation that finds the mean was, all along, the very same calculation that finds the centre of weight of a shape — its centre of mass.", "With the fulcrum at 2.8, the total of \"weight × distance\" on the left side and the total on the right side come out exactly equal. That is why the paper does not tilt, and hangs level.", "\"The mean can be seen as the height you get when you level all the data flat — but seen as a shape like this, it is the centre of mass of the whole distribution,\" said the teacher, pointing at the balanced paper."]}, {"ja": ["夕方の光が差し込む教室で、厚紙のヒストグラムは、糸の先で静かに水平を保っていました。", "ミオは思いました。平均は、計算して終わりの数ではありませんでした。データの形の中に、釣り合いの点として、目に見える場所にあったのです。", "「データが変われば、釣り合いの点も動きます。」先生が言いました。「たとえば、とてもたくさん読む人が1人増えれば、点はその側へ引っぱられます。平均が動く理由も、図で見るとよく分かります。」", "「平均はバランスの点なんだね。」ミオは、水平に止まった厚紙を、もう一度じっと見つめました。"], "en": ["In the evening light falling across the classroom, the paper histogram hung from its thread, quietly keeping its level.", "Mio thought about it. The mean was not just a number that ends with a calculation. Inside the shape of the data, it had been there all along, in a place you could see — the balance point.", "\"If the data changes, the balance point moves too,\" said the teacher. \"For example, if one person who reads a great many books joins the group, the point is pulled toward that side. When you see it as a picture, you understand why the mean moves.\"", "\"So the mean is the balance point.\" Mio gazed once more at the paper, hanging perfectly still and level."]}], "column": {"ja": ["「釣り合い」を測る道具、天秤は、古代から使われてきました。物の重さを比べることは、左右の釣り合いを見ることでした。数学の中でも、釣り合いは古くから大切な考え方だったのです。", "紀元前3世紀のギリシャの学者アルキメデスは、てこの原理を研究し、「重心」の数学を築きました。支点と重さと距離の関係を明らかにし、「支点さえあれば、地球でも動かしてみせよう」と言ったという話が伝わっています。分布の重心を求める計算が、平均の計算と同じ形をしているのは、この釣り合いの数学の流れの先にあることなのです。", "サワダ先生にも、忘れられない思い出があります。「先生が新卒のころ、数学係の女の子2人と一緒に、このヒストグラムの演示模型を、大きな板で作ったことがあります。教室の前に糸でつるして、平均の位置でぴたりと水平に止まったとき、教室中がどよめいたものです。」", "平均は、テストの点数の計算だけのものではありません。手で触って、目で見て確かめられる「釣り合いの点」でもあるのです。何千年も前からの釣り合いの知恵が、今のデータの授業の中にも、静かに生きています。"], "en": ["The balance scale — a tool that measures by \"balance\" — has been used since ancient times. Comparing the weight of things meant watching the left and right sides come into balance. In mathematics, too, balance has been an important idea for a very long time.", "In the third century BC, the Greek scholar Archimedes studied the principle of the lever and built the mathematics of the \"centre of mass.\" He worked out the relation between the fulcrum, weights, and distances, and a saying attributed to him tells us: \"Give me a place to stand, and I shall move the Earth.\" That the calculation for the centre of mass of a distribution has the same shape as the calculation for the mean lies at the end of this long stream of balance mathematics.", "Mr. Sawada has a memory he cannot forget. \"When I was a brand-new teacher, I built a big demonstration model of this histogram out of a large board, together with two girls who were the class maths representatives. We hung it by a thread at the front of the classroom, and when it stopped, perfectly level, right at the position of the mean, the whole class let out a murmur of amazement.\"", "The mean is not only for calculating test scores. It is also a \"balance point\" that you can touch with your hands and check with your eyes. The wisdom of balance, thousands of years old, is quietly alive in today's lessons about data, too."]}, "quiz": {"ja": ["Q1　読書冊数のアンケート（1冊が1人、2冊が3人、3冊が4人、4冊が1人、5冊が1人）の平均は、何冊ですか。　答え：本の合計は1×1＋2×3＋3×4＋4×1＋5×1＝28冊で、10人で割って28÷10＝2.8冊です。", "Q2　ヒストグラムを厚紙に描いて切り抜き、糸でつるしたとき、ぴたりと水平に釣り合うのは、どの点でつるしたときですか。　答え：平均2.8の真下の点です。いちばん高い3冊の棒の真下でも、図形の幅の真ん中でもありません。", "Q3　3冊の棒の真下でつるすと、厚紙はどうなりますか。そのわけも答えましょう。　答え：左側（1冊と2冊のある側）へ傾きます。支点3から見ると、左側の「重さ×距離」は1×2＋3×1＝5、右側は1×1＋1×2＝3で、左のほうが大きいからです。"], "en": ["Q1 In the reading survey (1 person read 1 book, 3 people read 2 books, 4 people read 3 books, 1 person read 4 books, 1 person read 5 books), what is the mean number of books?　Answer: The total is 1×1 + 2×3 + 3×4 + 4×1 + 5×1 = 28 books, and dividing by 10 people gives 28÷10 = 2.8 books.", "Q2 A histogram is drawn on thick paper, cut out, and hung from a thread. At which point does it hang perfectly level?　Answer: At the point right under the mean, 2.8. Not under the tallest bar (3 books), and not at the middle of the shape's width.", "Q3 What happens if you hang the paper right under the 3-books bar? Explain why, too.　Answer: It tilts toward the left side (the side of 1 and 2 books). Seen from the fulcrum at 3, the left side's \"weight × distance\" is 1×2 + 3×1 = 5, while the right side's is 1×1 + 1×2 = 3, so the left side is bigger."]}, "corner": {"ja": ["まず、自分のまわりのデータで度数の表を作ってみましょう。家族が先月読んだ本の冊数、クラスの好きな給食への投票数、1週間の歩数など、何でもかまいません。人数や回数を数えて、ヒストグラムに描きます。", "次に、そのヒストグラムを厚紙に写して、輪郭を切り抜きます。平均を計算して、その数の真下の点に穴をあけ、糸でつるしてみましょう。ぴたりと水平に釣り合えば成功です。指先や鉛筆の先で下から支えて、釣り合う点を探しても確かめられます。", "シーソーでも実験できます。重い人と軽い人が乗って、座る位置を少しずつ変えながら、釣り合う場所を探してみましょう。支点からの距離を変えると、釣り合いがどう変わるかに注目してください。", "発展として、とても大きな値が1つ混ざったデータも考えてみましょう。たとえば、1人だけ50冊読んだ人が加わったら、釣り合いの点はどちらへ、どれくらい動くでしょうか。予想してから、計算と実験で確かめてみましょう。"], "en": ["First, make a frequency table from data around you. How many books your family read last month, votes for a favourite school lunch, the number of steps you walked in a week — anything will do. Count them up and draw a histogram.", "Next, copy the histogram onto thick paper and cut out its outline. Calculate the mean, make a hole at the point right under that number, and hang the shape from a thread. If it hangs perfectly level, you have succeeded. You can also look for the balance point by supporting the shape from below on a fingertip or the tip of a pencil.", "You can experiment on a seesaw, too. Let a heavy person and a light person ride, and move your sitting positions little by little to find where you balance. Pay attention to how the balance changes when the distance from the fulcrum changes.", "As a further challenge, think about data with one very large value mixed in. For example, if one person who read 50 books were added, which way would the balance point move, and by how much? Make a guess first, then check with a calculation and an experiment."]}}, {"id": "notprime", "title": {"ja": "なぜ1は素数じゃないの？ ― 素数の定義のおはなし", "en": "Why Isn't 1 a Prime Number? ― The Story of the Definition of Primes"}, "sub": {"ja": "小学校高学年〜中学生向け・素数の約束と素因数分解のおはなし", "en": "For upper elementary to junior high — the agreement about prime numbers and factorization"}, "cover": "pri1.jpg", "images": ["pri1.jpg", "pri2.jpg", "pri3.jpg", "pri4.jpg", "pri5.jpg", "pri5.jpg"], "pages": [{"ja": ["ある日の夕方、ユイは学校の宿題のプリントを広げて、首をかしげていました。プリントの問題は「素数を見つけよう」。2、3、5、7と丸をつけていくうちに、手が止まりました。", "「おじいちゃん、1は素数なの。」ユイが聞きました。「素数は、1とその数自身でしか割り切れない数って習ったよ。1は、1でしか割り切れないよね。」", "「いい質問だ。」おじいちゃんは眼鏡を上げて、にっこりしました。「答えを言うと、1は素数じゃないんだ。でも、なぜだと思う。」", "「えー、割り切れるのは1だけなのに。」ユイはプリントとにらめっこしました。1という数は、いちばん小さいのに、いちばん不思議な顔をして座っているように見えました。"], "en": ["One evening, Yui spread out her homework sheet and tilted her head. The problem on the sheet was \"Find the prime numbers.\" She circled 2, 3, 5, 7… and then her hand stopped.", "\"Grandpa, is 1 a prime number?\" Yui asked. \"We learned that a prime is a number that can only be divided by 1 and itself. And 1 can only be divided by 1, right?\"", "\"That is a very good question.\" Grandpa pushed up his glasses and smiled. \"The answer is: 1 is not a prime number. But why do you think that is?\"", "\"What? Even though 1 is the only thing that divides it…\" Yui glared at her worksheet. The number 1, the smallest of all, seemed to sit there wearing the most mysterious face."]}, {"ja": ["「まず、素数の約束（定義）をはっきりさせよう。」おじいちゃんはノートを取り出しました。「素数というのは、『1と、その数自身の、2つだけを約数にもつ自然数』のことなんだ。」", "「約数っていうのは、その数を割り切る数のことだよね。」ユイは指を折りました。「2の約数は1と2で、2つ。3の約数は1と3で、2つ。だから2も3も素数。」", "「その通り。じゃあ4は。」おじいちゃんが聞きました。「4の約数は1と2と4で、3つある。だから4は素数じゃない。」", "「じゃあ1は……約数は1だけ。あれ、1つしかない。」ユイは目を丸くしました。「2つ」ないといけないのに、1の約数は「1つ」だけ。だから1は、素数の約束に当てはまらないのです。"], "en": ["\"First, let's make the agreement — the definition — of a prime number clear,\" said Grandpa, taking out a notebook. \"A prime number is a natural number whose only divisors are 1 and the number itself — exactly two divisors.\"", "\"A divisor is a number that divides it exactly, right?\" Yui counted on her fingers. \"The divisors of 2 are 1 and 2 — that's two. The divisors of 3 are 1 and 3 — two again. So 2 and 3 are primes.\"", "\"Exactly. Then what about 4?\" asked Grandpa. \"The divisors of 4 are 1, 2 and 4 — that's three. So 4 is not a prime.\"", "\"Then 1… its only divisor is 1. Oh — there's just one!\" Yui's eyes went round. A prime needs \"two\" divisors, but 1 has only \"one.\" So 1 does not fit the agreement for prime numbers."]}, {"ja": ["「でもおじいちゃん、どうして『2つ』なんて約束にしたの。1つだけの1も、仲間に入れてあげればいいのに。」", "「そこが大事なところなんだ。」おじいちゃんは、積み木を並べ始めました。「数には、素数を掛け合わせて作る、という性質がある。たとえば6は2×3、12は2×2×3、30は2×3×5と表せる。」", "「しかも、この表し方は、順番を変えることを別にすれば、いつも一通りだけなんだ。これを素因数分解という。」", "第8話で出てきた暗号も、この素因数分解が土台になっています。大きな数を素数に分解するのが難しいからこそ、暗号は守られるのです。素因数分解が「一通り」に決まることは、数学の大きな約束事なのでした。"], "en": ["\"But Grandpa, why did they make the agreement 'two'? Couldn't they let 1 join the group, since it has just one?\"", "\"That is the important point,\" said Grandpa, beginning to line up building blocks. \"Numbers have a special property: every number can be built by multiplying primes. For example, 6 is 2×3, 12 is 2×2×3, and 30 is 2×3×5.\"", "\"And what's more, apart from changing the order, there is always exactly one way to write it. This is called prime factorization.\"", "The codes in Episode 8 also stand on this prime factorization. Because it is hard to break a large number down into primes, codes can be kept secret. That prime factorization is settled in \"exactly one way\" is one of the great agreements of mathematics."]}, {"ja": ["「試しに、1を素数だとしてみようか。」おじいちゃんは目を細めました。「6の素因数分解は2×3だね。でも1が素数なら、6＝1×2×3とも書ける。さらに、6＝1×1×2×3とも、6＝1×1×1×2×3とも書けてしまう。」", "ユイは大笑いして、ノートに1をずらりと書き並べました。「1×1×1×1×1×1×1×1×2×3。何個1を書いても、答えは6のまま。きりがないよ。」", "「そう。1を素数に入れたとたん、『一通り』という約束が崩れてしまうんだ。素因数分解は、数の『設計図』のようなもの。設計図が何通りもあったら、困るだろう。」", "「だから数学者たちは、話し合って決めたんだ。1は素数には入れない、とね。」おじいちゃんは、ノートの1にそっと×印をつけました。"], "en": ["\"Let's try supposing that 1 is a prime,\" said Grandpa, narrowing his eyes. \"The prime factorization of 6 is 2×3. But if 1 were a prime, we could also write 6 = 1×2×3. And 6 = 1×1×2×3, and 6 = 1×1×1×2×3, too.\"", "Yui burst out laughing and wrote a whole row of 1s in her notebook. \"1×1×1×1×1×1×1×1×2×3. However many 1s I write, the answer stays 6. It never ends!\"", "\"That's right. The moment we let 1 into the primes, the agreement of 'exactly one way' falls apart. Prime factorization is like a blueprint of a number. It would be trouble if a number had many different blueprints, wouldn't it?\"", "\"So the mathematicians talked it over and decided: 1 will not be counted as a prime,\" said Grandpa, gently marking an × beside the 1 in the notebook."]}, {"ja": ["「定義って、誰かが勝手に決めていいの。」ユイが聞きました。", "「勝手に、ではないんだ。」おじいちゃんは首を振りました。「定義は、『いちばん便利で、話がきれいに通るように』選ぶ約束なんだ。ゲームのルールと同じで、ルールがうまくできていると、ゲームは面白くなる。」", "1を素数から外すと、素因数分解は一通りに決まり、たくさんの定理がすっきりと述べられるようになります。逆に1を入れると、あちこちで「ただし1を除く」と書かなければならず、話がごちゃごちゃしてしまうのです。", "「1は、仲間はずれなんかじゃないんだね。」ユイが言うと、おじいちゃんはうなずきました。「ああ。1は、素数でも、素数でない普通の数（合成数）でもない、特別な数なんだ。」"], "en": ["\"Can anyone just decide a definition however they like?\" asked Yui.", "\"Not however they like,\" said Grandpa, shaking his head. \"A definition is an agreement chosen so that things are most convenient and the story runs most smoothly. It is like the rules of a game — when the rules are well made, the game becomes interesting.\"", "When 1 is left out of the primes, prime factorization is settled in exactly one way, and many theorems can be stated cleanly. If 1 were put in, you would have to write \"except for 1\" here and there, and the story would become messy.", "\"So 1 isn't being left out of the group at all,\" said Yui. Grandpa nodded. \"No. 1 is a special number — neither a prime, nor an ordinary non-prime (a composite number).\""]}, {"ja": ["夕食のあと、ユイはプリントを見直しました。1のところには、小さく「特別な数」と書き添えてあります。", "「1は、掛け算の出発点だものね。何に掛けても、その数自身になる。」ユイは、1×2×3と書いたノートを眺めました。「だからこそ、設計図には入らないんだ。」", "「その通り。」おじいちゃんは本棚から数学の本を1冊取り出し、ユイに渡しました。「約束の決め方一つで、数学の景色は変わる。1は、そのことを教えてくれる数なんだ。」", "ユイはプリントを丁寧に折りたたみました。いちばん小さな数が、いちばん大きな約束を守っていたのです。"], "en": ["After dinner, Yui looked over her worksheet again. Beside the 1, she had written in small letters, \"a special number.\"", "\"1 is the starting point of multiplication, isn't it? Whatever you multiply by it, you get that number itself.\" Yui gazed at the 1×2×3 she had written in her notebook. \"That's exactly why it doesn't appear in the blueprint.\"", "\"Exactly right.\" Grandpa took a mathematics book from the bookshelf and handed it to Yui. \"A single choice of agreement can change the whole landscape of mathematics. The number 1 is the number that teaches us that.\"", "Yui folded her worksheet neatly. The smallest number of all had been guarding the greatest agreement of all."]}], "column": {"ja": ["素数の研究は古く、今から約2300年前の古代ギリシャ、ユークリッドの『原論』には、素数が無限にたくさんあることの証明が、すでに書かれていました。", "素因数分解が「一通り」であることをはっきり示したのは、ドイツの数学者ガウスです。1801年に出した本『整数論（Disquisitiones Arithmeticae）』の中で、どの数も素数の積として一通りに表せることを、きちんと証明しました。", "実は、昔の素数の表には、1が素数として載っているものもありました。19世紀ごろまでは、1を素数に数える人も少なくなかったのです。しかし、一意性の大切さが分かるにつれて、1を素数から外す決め方が、世界中の数学者の共通の約束になっていきました。", "第8話で紹介した暗号は、大きな数の素因数分解が難しいことを利用しています。その土台には、「分解の仕方は一通り」というガウスの示した約束があります。1を外すという小さな決め事が、現代の暗号を支える大きな数学につながっているのです。"], "en": ["The study of prime numbers is old: about 2300 years ago, in ancient Greece, Euclid's Elements already contained a proof that there are infinitely many primes.", "It was the German mathematician Gauss who clearly showed that prime factorization happens in \"exactly one way.\" In his 1801 book Disquisitiones Arithmeticae, he proved properly that every number can be written as a product of primes in exactly one way.", "In fact, some old tables of prime numbers listed 1 as a prime. Even into the 19th century, quite a few people counted 1 as a prime. But as the importance of uniqueness became clear, leaving 1 out of the primes became the shared agreement of mathematicians all over the world.", "The codes introduced in Episode 8 use the fact that factorizing large numbers is difficult. Beneath them lies the agreement Gauss showed: \"there is exactly one way to factorize.\" The small decision to leave out 1 leads to the great mathematics that supports today's codes."]}, "quiz": {"ja": ["Q1　なぜ1は素数ではないのですか。　答え：1の約数は1だけで、1つしかないからです。素数は「1とその数自身の、2つの約数」をもつ数と決められているので、1は当てはまりません。", "Q2　12を素因数分解してください。また、もし1が素数だったら、12の表し方はどうなってしまいますか。　答え：12＝2×2×3と、一通りに決まります。もし1が素数だと、12＝1×2×2×3、12＝1×1×2×2×3のように何通りにも書けてしまい、一通りに決まらなくなります。", "Q3　1、9、13、21のうち、素数はどれですか。　答え：13です。9＝3×3、21＝3×7と分解でき、1は素数ではありません。"], "en": ["Q1 Why is 1 not a prime number?　Answer: Because the only divisor of 1 is 1 itself — there is just one. A prime number is defined as a number with exactly two divisors, 1 and itself, so 1 does not fit.", "Q2 Factorize 12 into primes. And if 1 were a prime number, what would happen to the ways of writing 12?　Answer: 12 = 2×2×3, settled in exactly one way. If 1 were a prime, we could also write 12 = 1×2×2×3, 12 = 1×1×2×2×3, and so on — many ways — and it would no longer be settled in one way.", "Q3 Among 1, 9, 13 and 21, which one is a prime number?　Answer: 13. We can factorize 9 = 3×3 and 21 = 3×7, and 1 is not a prime number."]}, "corner": {"ja": ["ふるいの実験をしてみましょう。1から50までの数をノートに書き、まず1に×をつけます。1は素数ではないので、最初に外すのです（第32話で出てきた「エラトステネスのふるい」の始まりです）。", "次に、2に丸をつけて、2の倍数を全部消します。3に丸をつけて、3の倍数を消します。5、7と続けていくと、残った数が素数です。なぜ1を最初に外すのか、考えてみてください。もし1の倍数を消していくと、全部の数が消えてしまいますね。", "素因数分解にも挑戦しましょう。36＝2×2×3×3、60＝2×2×3×5、100＝2×2×5×5。友達と別々に分解しても、同じ答えになるはずです。これが「一通り」という約束の力です。", "おまけの実験です。「6＝1×1×……×2×3」と、1を10個書いてみてください。答えはやっぱり6です。1を素数に入れると困る理由が、身をもって分かります。"], "en": ["Try the sieve experiment. Write the numbers from 1 to 50 in a notebook, and first put an × on 1. Since 1 is not a prime, it is removed at the very start (this is the beginning of the \"Sieve of Eratosthenes,\" which appeared in Episode 32).", "Next, circle 2, and cross out all the multiples of 2. Circle 3, and cross out the multiples of 3. Continue with 5 and 7, and the numbers that remain are the primes. Think about why 1 is removed first: if you crossed out the multiples of 1, every single number would disappear!", "Try prime factorization, too. 36 = 2×2×3×3, 60 = 2×2×3×5, 100 = 2×2×5×5. Even if you and a friend factorize separately, you should reach the same answer. That is the power of the \"exactly one way\" agreement.", "Here is a bonus experiment. Write \"6 = 1×1×…×2×3\" with ten 1s. The answer is still 6. You can feel for yourself why putting 1 among the primes would cause trouble."]}}, {"id": "triangle", "title": {"ja": "なぜ三角形は強い？ ― 橋と鉄塔の三角形のおはなし", "en": "Why Are Triangles Strong? ― The Story of Triangles in Bridges and Towers"}, "sub": {"ja": "小学校高学年〜中学生向け・図形の合同と構造のおはなし", "en": "For upper elementary to junior high — congruence of figures and the strength of structures"}, "cover": "tri1.jpg", "images": ["tri1.jpg", "tri2.jpg", "tri3.jpg", "tri4.jpg", "tri5.jpg", "tri5.jpg"], "pages": [{"ja": ["ある日曜日、ミオはおじいちゃんと川沿いの道を散歩していました。川の上には、赤い鉄の橋がかかっています。電車が近づいてきて、ごとんごとんと音を立てて橋を渡っていきました。", "「おじいちゃん、あの橋、なんだか網みたいだね。」ミオは橋を見上げて言いました。「鉄の棒が、斜めにいっぱい組んである。」", "おじいちゃんは足を止めて、橋を指さしました。「よく見てごらん。斜めの棒と横の棒で、どんな形ができているかな。」", "「あ、三角形だ。」ミオは目を輝かせました。「大きな三角形も、小さな三角形も、数えきれないくらいある。」"], "en": ["One Sunday, Mio was walking with her grandfather along a path by the river. Across the river stood a red steel bridge. A train came along and crossed the bridge with a clatter.", "\"Grandpa, that bridge looks like a net,\" Mio said, gazing up at it. \"There are iron bars joined together diagonally, so many of them.\"", "Her grandfather stopped and pointed at the bridge. \"Look carefully. What shapes do the diagonal bars and the horizontal bars make?\"", "\"Oh — triangles!\" Mio's eyes sparkled. \"Big triangles and small triangles — too many to count.\""]}, {"ja": ["「そう。この橋は、三角形の組み合わせでできているんだ。」おじいちゃんは言いました。「こんなふうに棒を三角形に組んで作る仕組みを、『トラス』と言うんだよ。」", "ちょうどそのとき、重い貨物列車が橋を渡り始めました。橋はびくともしません。ミオは首をかしげました。「鉄の棒は細いのに、どうしてあんなに重い列車を支えられるの。」", "「秘密は、三角形の形そのものにあるんだ。」おじいちゃんはにっこりしました。「家に帰ったら、割り箸で試してみよう。」", "ミオは帰り道のあいだも、橋の三角形のことを考えていました。三角形は、いちばん単純な形なのに、どうしてそんなに強いのでしょう。"], "en": ["\"That's right. This bridge is made of triangles joined together,\" said her grandfather. \"A framework built by joining bars into triangles like this is called a 'truss.'\"", "Just then, a heavy freight train began to cross the bridge. The bridge did not tremble at all. Mio tilted her head. \"The iron bars are so thin. How can they hold up such a heavy train?\"", "\"The secret is in the shape of the triangle itself,\" her grandfather said with a smile. \"When we get home, let's try it with disposable chopsticks.\"", "All the way home, Mio kept thinking about the triangles in the bridge. The triangle is the simplest shape of all — so why is it so strong?"]}, {"ja": ["家に帰ると、2人は割り箸とクリップを用意しました。まず割り箸を3本、クリップで止めて三角形を作ります。次に、割り箸を4本止めて四角形を作りました。", "「じゃあ、角をそっと押してみて。」おじいちゃんに言われて、ミオは三角形の角を押しました。三角形は、形を変えずに、かちっとしています。", "ところが四角形は違いました。角を押すと、ぐにゃりと斜めにゆがんで、平行四辺形になってしまったのです。「あれ、辺の長さは同じなのに、形が変わっちゃった。」", "「その違いが、大事なところだよ。」おじいちゃんはうなずきました。「四角形は、辺の長さが決まっても、角の大きさが自由に変わってしまうんだ。」"], "en": ["When they got home, the two of them prepared disposable chopsticks and clips. First they joined three chopsticks with clips to make a triangle. Then they joined four chopsticks to make a square.", "\"Now, push a corner gently.\" Mio pushed a corner of the triangle, as her grandfather said. The triangle did not change its shape at all; it stayed firm and solid.", "The square was different. When she pushed a corner, it bent diagonally with a wobble and turned into a slanted parallelogram. \"Wait — the sides are the same length, but the shape changed!\"", "\"That difference is the important point,\" her grandfather nodded. \"With a square, even when the lengths of the sides are fixed, the angles are free to change.\""]}, {"ja": ["「三角形は、3本の辺の長さが決まると、形がたった1つに決まる。」おじいちゃんは、三角形をもう一度押して見せました。「角の大きさまで、全部決まってしまうから、ゆがみようがないんだ。」", "数学では、3つの辺の長さが等しい三角形どうしは、ぴったり重なる（合同になる）と習います。辺の長ささえ決まれば、三角形は他の形になりようがないのです。", "「じゃあ、四角形を固くするにはどうするの。」ミオが聞くと、おじいちゃんは四角形に割り箸を1本、斜めに入れました。対角線です。四角形が、2つの三角形に分かれました。", "今度は、押してもゆがみません。「わあ、固くなった。三角形に分けたら、急にしっかりした。」ミオは、四角形と三角形の境目を指でなぞりました。"], "en": ["\"With a triangle, once the lengths of its three sides are fixed, its shape is decided — there is only one possible shape.\" Her grandfather pushed the triangle once more to show her. \"Even the sizes of the angles are all decided, so there is no way for it to warp.\"", "In mathematics, we learn that two triangles whose three sides are equal in length fit exactly on top of each other (they are congruent). Once the side lengths are fixed, a triangle cannot become any other shape.", "\"Then how do you make a square rigid?\" asked Mio. Her grandfather placed one chopstick diagonally across the square — a diagonal line. The square was divided into two triangles.", "This time, pushing it did not warp it at all. \"Wow, it became stiff! When you divide it into triangles, it suddenly becomes solid.\" Mio traced the border between the square and the triangles with her finger."]}, {"ja": ["「橋も鉄塔も、この対角線の知恵でできている。」おじいちゃんは言いました。「四角い枠だけではぐらぐらするから、斜めの棒を入れて、全部を三角形に分けてあるんだ。」", "「他にも三角形って、どこにあるの。」ミオが聞きました。「送電線の鉄塔、工事のクレーン、建物の屋根の骨組み。どれも三角形の組み合わせだよ。」", "「自転車のフレームも見てごらん。」おじいちゃんは玄関の自転車を指さしました。ペダルのあたりから、サドルと前の車輪へ、たしかに大きな三角形ができています。", "「本当だ。」ミオは笑いました。「三角形って、毎日の暮らしを支えていたんだね。」"], "en": ["\"Bridges and steel towers are built with this same wisdom of the diagonal,\" said her grandfather. \"A square frame alone would wobble, so diagonal bars are put in to divide everything into triangles.\"", "\"Where else can we find triangles?\" asked Mio. \"Electricity pylons, construction cranes, the framework of a building's roof — all of them are combinations of triangles.\"", "\"Look at the frame of a bicycle, too.\" Her grandfather pointed at the bicycle by the front door. From around the pedals to the saddle and the front wheel, there was indeed one big triangle.", "\"It's true!\" Mio laughed. \"Triangles have been supporting our everyday lives all along.\""]}, {"ja": ["夕方、帰り道で見た送電鉄塔が、オレンジ色の空に浮かび上がっていました。鉄塔も、近づいて見ると、鉄の棒で作った三角形の集まりです。", "「三角形は、辺が3本しかない、いちばん単純な形だ。」おじいちゃんは言いました。「それなのに、いちばん頼りになる。それが、三角形の不思議なところだね。」", "ミオは鉄塔を見上げながら、橋のことを思い出しました。重い列車を支える橋も、空高く立つ鉄塔も、出発点は「3辺が決まれば形が決まる」という、小さな決まりでした。", "「また三角形を探しに行こうね。」ミオはおじいちゃんの手を引いて、夕日の道を歩き始めました。"], "en": ["In the evening, the electricity pylon they had seen on the way home stood out against the orange sky. Up close, a pylon, too, is a gathering of triangles made of steel bars.", "\"A triangle has only three sides — it is the simplest shape of all,\" said her grandfather. \"And yet it is the most reliable. That is the wonder of the triangle.\"", "Looking up at the pylon, Mio remembered the bridge. Both the bridge that carries heavy trains and the tower that stands high in the sky begin from one small rule: once the three sides are fixed, the shape is fixed.", "\"Let's go looking for triangles again,\" said Mio, and taking her grandfather's hand, she began to walk along the road in the evening sun."]}], "column": {"ja": ["フランスのパリにあるエッフェル塔は、1889年、パリ万国博覧会のために建てられました。高さは約300メートル。当時、世界でいちばん高い建物でした。", "エッフェル塔は、鉄の棒を三角形に組み合わせる「トラス構造」でできています。数えきれないほどの小さな三角形が集まって、あの大きな塔を支えているのです。三角形は形が崩れないので、強い風が吹いても、塔はしっかり立っていられます。", "設計したギュスターヴ・エッフェルは、もともと橋を作る技術者でした。フランスのガラビ峡谷にかかる高い鉄道橋など、鉄の橋をいくつも手がけています。橋づくりで育てた三角形の知恵が、そのまま塔の設計に生かされたのです。", "日本でも、川にかかる鉄橋や、送電線の鉄塔は、同じトラス構造で作られています。町で鉄塔を見かけたら、三角形がいくつあるか、数えてみてください。"], "en": ["The Eiffel Tower in Paris, France, was built in 1889 for the Paris World's Fair. It is about 300 metres tall. At the time, it was the tallest building in the world.", "The Eiffel Tower is made with a \"truss structure,\" in which iron bars are joined together into triangles. Countless small triangles gather together to support that enormous tower. Because triangles do not lose their shape, the tower can stand firm even when strong winds blow.", "Gustave Eiffel, who designed it, was originally an engineer who built bridges. He worked on many iron bridges, including a tall railway bridge over the Garabit valley in France. The wisdom of triangles that he developed in bridge building was applied just as it was to the design of the tower.", "In Japan, too, steel bridges over rivers and pylons for power lines are built with the same truss structure. When you see a steel tower in your town, try counting how many triangles it has."]}, "quiz": {"ja": ["Q1　三角形は、押しても形が崩れません。それはなぜですか。　答え：3つの辺の長さが決まると、三角形の形は1つに決まる（合同になる）からです。角の大きさまで決まってしまうので、ゆがみようがありません。", "Q2　辺の長さが決まっていてもぐらぐらする四角形を、固くするにはどうしますか。　答え：対角線を1本入れて、2つの三角形に分けます。三角形の集まりになると、形が崩れなくなります。", "Q3　三角形の組み合わせ（トラス構造）でできているものを、身近な例で挙げてください。　答え：鉄橋、送電線の鉄塔、工事のクレーン、建物の屋根の骨組み、自転車のフレームなどです。"], "en": ["Q1 A triangle does not lose its shape even when pushed. Why is that?　Answer: Because once the lengths of its three sides are fixed, the shape of the triangle is decided — there is only one possible shape (any two such triangles are congruent). Even the angles are fixed, so there is no way for it to warp.", "Q2 A square wobbles even when the lengths of its sides are fixed. How can you make it rigid?　Answer: Put in one diagonal line, dividing it into two triangles. Once it becomes a gathering of triangles, its shape no longer collapses.", "Q3 Give some familiar examples of t
